const fillSurfs=(t,pred)=>SURF.split('').filter(s=>t.fill&&t.fill[s]&&pred(t.fill[s])).join('');

function fillGroups(t){const g={};SURF.split('').forEach(s=>{const m=t.fill&&t.fill[s];if(m&&m!=='caries')(g[m]=g[m]||[]).push(s)});return Object.entries(g).map(([mat,ss])=>({mat,surf:ss.join('')}))}
function describe(t,lg){

    case 'lostpm':return de?'postmortal verloren (offene Alveole)':'Lost post-mortem (open socket)';
    case 'implant':return (de?'Implantat':'Implant')+(t.cmat?(de?` mit Krone (${dm(t.cmat,lg)})`:` with ${t.cmat} crown`):'')+ab;
    case 'pontic':return de?'Brückenglied (Zahn fehlt)':'Bridge pontic (tooth missing)';
    case 'denture':return de?'fehlend, durch herausnehmbaren Zahnersatz ersetzt':'Missing, replaced by removable denture';
    case 'root':return (de?'Wurzelrest':'Root remnant')+(t.rct?(de?', wurzelgefüllt':', root filled'):'');

  }
  const p=[],g=fillGroups(t);
  if(g.length)p.push((de?'Füllung ':'Filling ')+g.map(x=>`${x.surf} (${dm(x.mat,lg)})`).join(', '));
  const cs=cariesSurfs(t);if(cs)p.push((de?'Karies ':'Caries ')+cs);

  if(t.veneer)p.push('Veneer');
  if(t.rct)p.push(de?'Wurzelfüllung':'Root filling');

const isSound=t=>{t=get(t);return t.s==='present'&&!restSurfs(t)&&!cariesSurfs(t)&&!t.crown&&!t.rct&&!t.post&&!t.veneer&&!t.fracture};
const distinctive=t=>{t=get(t);return ['missing','implant','pontic','denture','root'].includes(t.s)||(t.s==='present'&&!!(restSurfs(t)||t.crown||t.rct||t.post||t.veneer))};
function code(t){
  t=get(t);const st=STATES.find(x=>x[0]===t.s);

function compare(a,p){
  a=get(a);p=get(p);

  const af=a.fill||{},pf=p.fill||{};
  if(a.s==='unk'||p.s==='unk')return a.s==='unk'?R('nodata','Not recorded in AM records','In den AM-Unterlagen nicht erhoben'):R('nodata','Not recorded post-mortem','Postmortal nicht erhoben');
  if(p.s==='lostpm'){
    if([...MISSINGLIKE,'implant'].includes(a.s))return R('incon','Open socket PM means a tooth was present at death, but AM shows it missing or replaced','Offene Alveole postmortal, laut AM-Unterlagen jedoch fehlend oder ersetzt');

  if(MISSINGLIKE.includes(a.s)){

    return R('incon','Missing AM but tooth or root present PM; teeth do not grow back','AM fehlend, postmortal Zahn oder Wurzel vorhanden');
  }
  if(a.s==='implant'){
    if(p.s==='implant')return R('match','Implant in both','Implantat in beiden');
    if(p.s==='present'||p.s==='root')return R('incon','Implant AM, natural tooth PM','Implantat AM, postmortal natürlicher Zahn');
    return R('expl','Implant lost or replaced after the AM records','Implantat nach den AM-Unterlagen verloren oder ersetzt');
  }
  if(a.s==='root'){
    if(p.s==='root')return R('match','Root remnant in both','Wurzelrest in beiden');
    if(MISSINGLIKE.includes(p.s)||p.s==='implant')return R('expl','Root removed after the AM records','Wurzelrest nach den AM-Unterlagen entfernt');
    if(p.crown||p.post)return R('expl','Root restored with post and crown after the AM records','Wurzelrest nach den AM-Unterlagen mit Stift und Krone versorgt');
    return R('incon','Root remnant AM, intact tooth PM','Wurzelrest AM, postmortal intakter Zahn');
  }
  if(MISSINGLIKE.includes(p.s))return R('expl','Extracted after the AM records','Nach den AM-Unterlagen extrahiert');
  if(p.s==='implant')return R('expl','Extracted and replaced by an implant after the AM records','Nach den AM-Unterlagen extrahiert und durch Implantat ersetzt');
  if(p.s==='root')return R('expl','Destroyed to a root remnant after the AM records','Nach den AM-Unterlagen bis auf Wurzelrest zerstört');
  const iE=[],iD=[],cE=[],cD=[];
  const I=(e,d)=>{iE.push(e);iD.push(d)},C=(e,d)=>{cE.push(e);cD.push(d)};
  if(a.rct&&!p.rct)I('root filling AM not present PM','Wurzelfüllung AM, postmortal nicht vorhanden');
  if(a.post&&!p.post)I('post AM not present PM','Stift AM, postmortal nicht vorhanden');
  if(a.crown&&!p.crown)I('crown AM not present PM','Krone AM, postmortal nicht vorhanden');
  if(a.veneer&&!p.veneer&&!p.crown)I('veneer AM not present PM','Veneer AM, postmortal nicht vorhanden');
  if(!p.crown&&!a.crown){
    const lost=[],fLost=[],cGone=[],cFilled=[],newC=[],newF={},repl=[];
    SURF.split('').forEach(s=>{const am=af[s],pm=pf[s];
      if(am&&am!=='caries'){if(!pm)lost.push(s);else if(pm==='caries')fLost.push(s);else if(pm!==am)repl.push([s,am,pm])}
      else if(am==='caries'){if(!pm)cGone.push(s);else if(pm!=='caries')cFilled.push(s)}
      else if(pm){if(pm==='caries')newC.push(s);else(newF[pm]=newF[pm]||[]).push(s)}

    const j=x=>x.join('');
    if(lost.length)I(`AM filling ${j(lost)} not present PM`,`AM-Füllung ${j(lost)} postmortal nicht vorhanden`);
    if(cGone.length)I(`caries ${j(cGone)} AM, sound PM`,`Karies ${j(cGone)} AM, postmortal ohne Befund`);
    if(fLost.length)C(`filling ${j(fLost)} lost, now caries`,`Füllung ${j(fLost)} verloren, jetzt Karies`);
    if(cFilled.length)C(`caries ${j(cFilled)} now filled`,`Karies ${j(cFilled)} inzwischen gefüllt`);
    Object.entries(newF).forEach(([m,ss])=>C(`new filling ${j(ss)} (${m})`,`neue Füllung ${j(ss)} (${dm(m,'de')})`));
    if(newC.length)C(`new caries ${j(newC)}`,`neue Karies ${j(newC)}`);
    if(repl.length)C(`material changed ${repl.map(([s,x,y])=>`${s} ${x}→${y}`).join(', ')}`,`Material geändert ${repl.map(([s,x,y])=>`${s} ${dm(x,'de')}→${dm(y,'de')}`).join(', ')}`);
  }

  if(p.post&&!a.post)C('post added','Stift hinzugekommen');
  if(p.crown&&!a.crown)C('crown added','Krone hinzugekommen');
  if(p.veneer&&!a.veneer&&!p.crown)C('veneer added','Veneer hinzugekommen');
  if(a.crown&&p.crown&&a.cmat&&p.cmat&&a.cmat!==p.cmat)C(`crown material ${a.cmat} → ${p.cmat}`,`Kronenmaterial ${dm(a.cmat,'de')} → ${dm(p.cmat,'de')}`);

}
function analyse(c){

  let v;
  if(k.incon>0)v={cls:'incon',en:'Exclusion suggested',de:'Ausschluss naheliegend',ten:`${k.incon} unexplainable discrepanc${k.incon>1?'ies':'y'}. Check these teeth and the radiographs before excluding.`,tde:`${k.incon} nicht erklärbare Abweichung${k.incon>1?'en':''}. Vor einem Ausschluss Zähne und Röntgenbilder prüfen.`};
  else if(compared<6)v={cls:'nodata',en:'Insufficient data',de:'Unzureichende Daten',ten:`Only ${compared} teeth can be compared. Add more AM or PM findings.`,tde:`Nur ${compared} Zähne vergleichbar. Weitere AM- oder PM-Befunde ergänzen.`};
  else if(dist>=1)v={cls:'match',en:'Consistent',de:'Übereinstimmend',ten:`No unexplainable discrepancies and ${dist} distinctive concordant feature${dist>1?'s':''}. Identification possible; confirm with AM/PM radiographs.`,tde:`Keine nicht erklärbaren Abweichungen; ${dist} charakteristische übereinstimmende Merkmale. Identifizierung möglich; mit AM/PM-Röntgenbildern zu bestätigen.`};
  else v={cls:'expl',en:'Consistent, low specificity',de:'Übereinstimmend, geringe Spezifität',ten:'No discrepancies, but no restorations or missing teeth match. Not enough for a dental identification on its own.',tde:'Keine Abweichungen, jedoch keine charakteristischen Merkmale (Restaurationen, fehlende Zähne). Allein für eine zahnärztliche Identifizierung nicht ausreichend.'};

}

function ageResult(c){
  ensureRefs();
  const sex=c.age.sex,rows=[];let missingRefs=0;
  M3.forEach(n=>{
    const t=c.age.teeth[n]||{};if(t.absent)return;
    for(const m in METHODS){
      const s=t[m];if(!s)continue;
      const ref=store.refs[m][s]||{};
      const min=num(sex==='f'?ref.fmin:ref.mmin),mean=num(sex==='f'?ref.fmean:ref.mmean);
      if(min==null)missingRefs++;
      rows.push({n,m,s,min,mean});
    }
  });
  const withMin=rows.filter(r=>r.min!=null);
  const top=withMin.length?withMin.reduce((a,b)=>b.min>a.min?b:a):null;
  return {rows,top,missingRefs};
}

  const label=(s,c,size)=>`<text x="18" y="${cy+4}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="${size}" font-weight="600" fill="${c}">${s}</text>`;
  const root=`<path d="M10 33 L13 44 L23 44 L26 33" fill="none" stroke="var(--tline)" stroke-width="1"/>`;
  const rct=`<line x1="18" y1="33" x2="18" y2="44" stroke="var(--rct)" stroke-width="3" stroke-linecap="round"/>`;
  const ab=`<path d="M0 18 H3 M33 18 H36" stroke="var(--crown)" stroke-width="3"/>`;
  if(t.s==='present'){
    ['B','L','M','D'].forEach(s=>g+=`<polygon points="${reg[pos[s]]}" fill="${col(s)}" stroke="var(--tline)" stroke-width="1"/>`);
    g+=`<rect x="13" y="13" width="10" height="10" fill="${col('O')}" stroke="var(--tline)" stroke-width="1"/>`+root;
    if(t.rct)g+=rct;
    if(t.post)g+=`<rect x="15.8" y="32.5" width="4.4" height="6.5" fill="var(--ink)"/>`;
    if(t.veneer&&!t.crown)g+=`<line x1="5" y1="2" x2="31" y2="2" stroke="var(--crown)" stroke-width="2.4" stroke-dasharray="3 1.6"/>`;
    if(t.crown)g+=`<rect x="1.8" y="1.8" width="32.4" height="32.4" rx="3" fill="none" stroke="var(--crown)" stroke-width="2.6"/>`+(t.abut?ab:'');
    if(t.fracture)g+=`<path d="M5 22 L12 15 L17 21 L24 13 L31 19" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`;
  }else if(t.s==='root'){g+=outline(true)+root+(t.rct?rct:'');txt=label('R','var(--muted)',11)}
  else if(t.s==='missing'){g+=outline(false)+`<path d="M7 7 L29 29 M29 7 L7 29" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/>`}
  else if(t.s==='implant'){g+=`<rect x="4" y="4" width="28" height="28" rx="2" fill="var(--enamel)" stroke="var(--crown)" stroke-width="2.2"/><path d="M14 34 H22 M13.5 37.5 H22.5 M14 41 H22 M15 44 H21 M18 33 V44" stroke="var(--amalgam)" stroke-width="1.8" stroke-linecap="round"/>`+(t.abut?ab:'')}
  else if(t.s==='pontic'){g+=`<rect x="4" y="4" width="28" height="28" rx="2" fill="var(--enamel)" stroke="var(--crown)" stroke-width="2.2"/><line x1="0" y1="18" x2="36" y2="18" stroke="var(--crown)" stroke-width="3"/>`}
  else if(t.s==='denture'){g+=`<rect x="4" y="4" width="28" height="28" rx="2" fill="none" stroke="var(--crown)" stroke-width="1.6" stroke-dasharray="3 2.5"/>`;txt=label('e','var(--crown)',14)}
  else if(t.s==='lostpm'){g+=outline(true);txt=label('PM','var(--pm)',11)}
  else if(t.s==='unerupted'){g+=`<circle cx="18" cy="18" r="12" fill="none" stroke="var(--line2)" stroke-width="1.4" stroke-dasharray="3 2.5"/>`;txt=label('NE','var(--muted)',10)}
  else{g+=outline(true);txt=label('?','var(--nodata)',13)}

}

function copyText(text,ta,st){

}

  twoTap(document.getElementById('allSound'),L('Tap again to confirm','Zum Bestätigen erneut tippen'),()=>{ALL.forEach(n=>{if(get(c[chart][n]).s==='unk')c[chart][n]=TT({note:(c[chart][n]&&c[chart][n].note)||''})});save();rerenderKeep()});
}}
function applyQuick(chart,n,k){
  const c=cur(),x=migrate(Object.assign(TT({s:'unk'}),c[chart][n]||{}));x.fill=Object.assign({},x.fill);
  if(k==='sound'){if(isSound(x))x.s='unk';else Object.assign(x,TT({note:x.note}))}
  else if(k==='crown'){x.s='present';x.crown=!x.crown;if(!x.crown){x.cmat='';x.abut=false}}
  else if(k==='rct'){if(x.s!=='root')x.s='present';x.rct=!x.rct}
  else x.s=x.s===k?'unk':k;
  c[chart][n]=x;save();
}

/* report */
function defaultQuestion(c,lg){
  const m=c.meta,de=lg==='de';
  const id=de?`Kann der unbekannte Leichnam${m.pmNo?' ('+m.pmNo+')':''} anhand des Zahnbefundes als ${m.amRef||'die vermisste Person'} identifiziert werden?`:`Can the unknown body${m.pmNo?' ('+m.pmNo+')':''} be identified by dental comparison as ${m.amRef||'the missing person'}?`;
  const age=de?'Welches Mindestalter ergibt sich aus den zahnärztlichen Befunden? Hat die Person das 18. Lebensjahr vollendet?':'What minimum age follows from the dental findings? Has the person reached the age of 18?';
  return c.rep.type==='id'?id:c.rep.type==='age'?age:id+'\n'+age;
}
function chartLines(chart,lg){
  const out=[];let sound=0,unk=0;
  ORDER.forEach(n=>{const t=chart[n];if(get(t).s==='unk'){unk++;return}if(isSound(t)){sound++;return}out.push(`  ${n}: ${describe(t,lg)}${t.note?' – '+t.note:''}`)});
  const de=lg==='de';
  if(!out.length)out.push(de?'  keine Restaurationen oder fehlenden Zähne erfasst':'  no restorations or missing teeth recorded');
  out.push(de?`  Übrige Zähne: ${sound} ohne Befund, ${unk} nicht erhoben.`:`  Other teeth: ${sound} sound, ${unk} not recorded.`);
  return out;
}
function genReport(c){
  const lg=c.rep.lang,de=lg==='de',m=c.meta,r=c.rep,O=[];let sec=0;
  const H=(d,e)=>{sec++;O.push('');O.push(`${sec}. ${(de?d:e).toUpperCase()}`)};
  const D=s=>dDate(s,lg);
  O.push(de?'ZAHNÄRZTLICH-FORENSISCHES GUTACHTEN':'FORENSIC ODONTOLOGY REPORT');
  O.push('='.repeat(40));
  const kv=(d,e,v)=>O.push(`${(de?d:e).padEnd(20)}${v||'—'}`);
  kv('Auftraggeber:','Requested by:',r.authority);kv('Aktenzeichen:','File number:',r.fileNo);kv('Auftrag vom:','Request date:',r.orderDate?D(r.orderDate):'');
  kv('Fallnummer:','Case number:',m.caseNo);if(r.type!=='age')kv('PM-Nummer:','PM body number:',m.pmNo);
  kv('Gutachter/in:','Examiner:',m.examiner);kv('Untersuchung am:','Examined on:',m.date?D(m.date):'');
  H('Fragestellung','Question');O.push(r.question||defaultQuestion(c,lg));
  H('Untersuchungsgut und Unterlagen','Material examined');
  const rc=c.log.receipt||{};
  if(rc.time||rc.from)O.push(de?`Eingang am ${D((rc.time||'').slice(0,10))} ${(rc.time||'').slice(11)} von ${rc.from||'—'}; Zustand: ${deOf(CONDS,rc.cond,lg)||'—'}; Siegel-Nr.: ${rc.seal||'—'}; Lagerung: ${rc.store||'—'}.`:`Received ${D((rc.time||'').slice(0,10))} ${(rc.time||'').slice(11)} from ${rc.from||'—'}; condition: ${rc.cond||'—'}; seal no.: ${rc.seal||'—'}; storage: ${rc.store||'—'}.`);
  if(r.type!=='age')O.push(de?`Antemortale Unterlagen: ${m.amSource||'—'}.`:`Ante-mortem records: ${m.amSource||'—'}.`);
  const done=CHECKS.flatMap(g=>g[1]).filter(([k])=>c.log.checks[k]).map(([,l])=>trl(l,lg));
  if(done.length){O.push(de?'Durchgeführte Dokumentation:':'Documentation completed:');done.forEach(x=>O.push('  – '+x))}
  if(c.log.events.length){O.push(de?'Asservatenkette:':'Chain of custody:');[...c.log.events].sort((a,b)=>a.t.localeCompare(b.t)).forEach(e=>O.push(`  ${D(e.t.slice(0,10))} ${e.t.slice(11)}  ${deOf(LOG_ACTIONS,e.a,lg)}${e.item?' – '+e.item:''}${e.by?(de?' durch ':' by ')+e.by:''}${e.to?(de?' an ':' to ')+e.to:''}${e.note?' ('+e.note+')':''}`))}
  if(r.type!=='age'){
    H('Befunde','Findings');
    O.push(de?'Antemortaler Zahnbefund (FDI):':'Ante-mortem dental record (FDI):');O.push(...chartLines(c.am,lg));
    O.push(de?'Postmortaler Zahnbefund (FDI):':'Post-mortem dental findings (FDI):');O.push(...chartLines(c.pm,lg));
    const a=analyse(c);
    H('Vergleich AM/PM','AM/PM comparison');
    O.push(de?`Verglichen: ${a.compared} von 32 Zähnen. Übereinstimmend: ${a.k.match} (davon charakteristisch: ${a.dist}). Erklärbare Abweichungen: ${a.k.expl}. Nicht erklärbare Abweichungen: ${a.k.incon}. Nicht vergleichbar: ${a.k.nodata}.`:`Compared: ${a.compared} of 32 teeth. Concordant: ${a.k.match} (distinctive: ${a.dist}). Explainable differences: ${a.k.expl}. Unexplainable discrepancies: ${a.k.incon}. Not comparable: ${a.k.nodata}.`);
    const NM=de?{match:'übereinstimmend',expl:'erklärbar',incon:'NICHT ERKLÄRBAR'}:{match:'concordant',expl:'explainable',incon:'UNEXPLAINABLE'};
    a.rows.filter(x=>x.r==='incon'||x.r==='expl'||(x.r==='match'&&x.dist)).forEach(x=>O.push(`  ${x.n}: ${NM[x.r]} – ${x[lg]}`));
    O.push(de?`Rechnerische Einschätzung: ${a.v.de}. ${a.v.tde}`:`Computed assessment: ${a.v.en}. ${a.v.ten}`);
  }
  if(r.type!=='id'){
    const ar=ageResult(c),ag=c.age;
    H('Altersschätzung','Age estimation');
    O.push(de?`Person: ${ag.status==='living'?'lebend':'verstorben'}, ${ag.sex==='f'?'weiblich':'männlich'}. Angegebenes Alter/Geburtsdatum: ${ag.stated||'—'}.`:`Person: ${ag.status}, ${ag.sex==='f'?'female':'male'}. Stated age/date of birth: ${ag.stated||'—'}.`);
    const list=ag.status==='deceased'?AGFAD_DEAD:AGFAD_LIVING;
    O.push(de?'Durchgeführte Untersuchungsschritte:':'Examination steps completed:');
    list.forEach(([k,l])=>O.push(`  [${ag.check[k]?'x':' '}] ${trl(l,lg)}`));
    M3.forEach(n=>{const t=ag.teeth[n]||{};if(t.absent){O.push(`  ${n}: ${de?'nicht angelegt bzw. nicht beurteilbar':'absent or not assessable'}`);return}
      const p=Object.keys(METHODS).filter(k=>t[k]).map(k=>`${trl(METHODS[k],lg)} ${t[k]}`);if(p.length)O.push(`  ${n}: ${p.join('; ')}`)});
    if(ag.notes)O.push((de?'Weitere Befunde: ':'Other findings: ')+ag.notes);
    O.push((de?'Referenzstudie: ':'Reference study: ')+(store.refs.source||'—'));
    if(ar.top){
      O.push(de?`Höchstes Mindestalter: ${fmt(ar.top.min,'de')} Jahre (Zahn ${ar.top.n}, ${METHODS[ar.top.m].de}, Stadium ${ar.top.s}).`:`Highest minimum age: ${fmt(ar.top.min,'en')} years (tooth ${ar.top.n}, ${METHODS[ar.top.m].en}, stage ${ar.top.s}).`);
      [14,18,21].forEach(x=>O.push(de?`  Vollendung des ${x}. Lebensjahres: ${ar.top.min>=x?'nach den zahnärztlichen Befunden nachgewiesen':'nicht nachgewiesen'}`:`  Age ${x} reached: ${ar.top.min>=x?'proven by the dental findings':'not proven'}`));
    }else O.push(de?'Ein Mindestalter konnte nicht berechnet werden (fehlende Stadien oder Referenzwerte).':'No minimum age could be calculated (missing stages or reference values).');
  }
  H('Beurteilung','Conclusion');
  const cat=ID_CATS.find(x=>x[0]===r.idCat);
  if(r.type!=='age'&&cat)O.push((de?'Ergebnis der Identifizierung: ':'Identification result: ')+(de?cat[2]:cat[1])+'.');
  O.push(r.conclusion||(de?'[Hier Ihre Beurteilung eintragen]':'[Write your conclusion here]'));
  O.push('');O.push(`${r.place||(de?'Ort':'Place')}, ${D(today())}`);O.push('');O.push('______________________________');O.push(m.examiner||(de?'Unterschrift':'Signature'));
  O.push('');O.push(de?'Hinweis: Entwurf erstellt mit ForensiDent (Entscheidungshilfe, keine validierte forensische Software). Alle Befunde sind anhand der Original-Röntgenbilder und Fotos zu prüfen.':'Note: Draft created with ForensiDent (decision-support aid, not validated forensic software). All findings must be checked against the original radiographs and photographs.');
  return O.join('\n');
}

/* ---------- tooth examination sheet ---------- */
const sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim');let ed=null;
function openSheet(chart,n){ed={chart,n};drawSheet();sheet.hidden=false;scrim.hidden=false;sheet.scrollTop=0}
function closeSheet(){sheet.hidden=true;scrim.hidden=true;ed=null;rerenderKeep()}
scrim.onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ed)closeSheet()});
function surfInfo(n){
  const ant=n%10<=3,up=Math.floor(n/10)<=2;
  return {M:['M','mesial','mesial'],O:ant?['I','incisal','inzisal']:['O','occlusal','okklusal'],D:['D','distal','distal'],B:ant?['V','labial','labial']:['B','buccal','bukkal'],L:up?['P','palatal','palatinal']:['L','lingual','lingual']};
}
function bigTooth(t,n){
  const q=Math.floor(n/10),lower=q>=3,mesRight=(q===1||q===4);
  const R={top:'10,10 190,10 135,65 65,65',right:'190,10 190,190 135,135 135,65',bottom:'10,190 190,190 135,135 65,135',left:'10,10 10,190 65,135 65,65'};
  const C={top:[100,38],right:[163,100],bottom:[100,162],left:[37,100]};
  const pos={B:lower?'bottom':'top',L:lower?'top':'bottom',M:mesRight?'right':'left',D:mesRight?'left':'right'};
  const si=surfInfo(n),f=t.fill||{};
  const fc=s=>f[s]?MCOL[f[s]]:'var(--enamel)';
  const mat=s=>f[s]?L(...FMATS.find(x=>x[0]===f[s]).slice(1,3)):'';
  const lab=(s,x,y)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="24" font-weight="600" fill="var(--ink)" stroke="var(--surface)" stroke-width="4" paint-order="stroke">${si[s][0]}</text><text x="${x}" y="${y+16}" text-anchor="middle" font-size="11" fill="var(--ink)" stroke="var(--surface)" stroke-width="3" paint-order="stroke">${esc(mat(s)||L(si[s][1],si[s][2]))}</text>`;
  let g='',tx='';
  ['B','L','M','D'].forEach(s=>{const p=pos[s];g+=`<polygon class="surf" data-bs="${s}" tabindex="0" role="button" aria-label="${L(si[s][1],si[s][2])}${f[s]?': '+mat(s):''}" points="${R[p]}" fill="${fc(s)}" stroke="var(--tline)" stroke-width="2"/>`;tx+=lab(s,C[p][0],C[p][1])});
  g+=`<rect class="surf" data-bs="O" tabindex="0" role="button" aria-label="${L(si.O[1],si.O[2])}${f.O?': '+mat('O'):''}" x="65" y="65" width="70" height="70" fill="${fc('O')}" stroke="var(--tline)" stroke-width="2"/>`;tx+=lab('O',100,98);
  return `<svg viewBox="0 0 200 200" class="bigtooth" role="group" aria-label="${L('Tooth surfaces','Zahnflächen')}">${g}${tx}</svg>`;
}
function drawSheet(){
  const c=cur(),{chart,n}=ed,t=migrate(Object.assign(TT({s:'unk'}),c[chart][n]||{}));
  const idx=ORDER.indexOf(n),q=Math.floor(n/10),d=n%10,lg=lang();
  const states=STATES.filter(([k])=>chart==='pm'||k!=='lostpm');
  const sel=(id,v)=>`<select id="${id}">${CMATS.map(x=>`<option value="${x}" ${v===x?'selected':''}>${x?esc(dm(x,lg)):L('unknown','unbekannt')}</option>`).join('')}</select>`;
  const tg=(id,en,de,on)=>`<label class="toggle"><input type="checkbox" id="${id}" ${on?'checked':''}><span>${L(en,de)}</span></label>`;
  const second=L('German','English');
  sheet.innerHTML=`<div class="sheet-head"><span class="tag ${chart==='am'?'chip-am':'chip-pm'}">${chart.toUpperCase()}</span><h2 id="sheetTitle">${L('Tooth','Zahn')} <span>${n}</span><small>${esc(TN[lg][d])}, ${esc(QN[lg][q])} · ${idx+1}/32</small></h2><button class="btn small primary" id="doneT">${L('Done','Fertig')}</button></div>
  <div class="seg" role="group" aria-label="${L('Tooth status','Zahnstatus')}">${states.map(([k,en,de,cd])=>`<button data-s="${k}" aria-pressed="${t.s===k}">${cd&&cd!=='?'?`<b>${cd}</b> `:''}${L(en,de)}</button>`).join('')}</div>
  ${(t.s==='present'||t.s==='unk')?`
   <span class="label">${L('1 · Choose filling material or caries','1 · Füllungsmaterial oder Karies wählen')}</span>
   <div class="mats">${FMATS.map(([k,en,de])=>`<button data-mat="${k}" aria-pressed="${curMat===k}"><i style="background:${MCOL[k]}"></i>${L(en,de)}</button>`).join('')}<button data-mat="erase" aria-pressed="${curMat==='erase'}"><i style="background:var(--enamel)"></i>${L('Clear','Löschen')}</button></div>
   <span class="label">${L('2 · Tap the surfaces','2 · Flächen antippen')}</span>
   <div class="bt-wrap">${bigTooth(t,n)}<span class="fine">${L('Mesial faces the midline. View as on the chart.','Mesial zeigt zur Mitte. Ansicht wie im Zahnschema.')}</span></div>
   <span class="label">${L('Other findings','Weitere Befunde')}</span>
   <div class="opt-grid">${tg('crownT','Crown','Krone',t.crown)}${t.crown?`<label class="field"><span class="label">${L('Crown material','Kronenmaterial')}</span>${sel('cmatT',t.cmat)}</label>`+tg('abutT','Bridge abutment','Brückenpfeiler',t.abut):''}${tg('venT','Veneer','Veneer',t.veneer)}${tg('rctT','Root filling','Wurzelfüllung',t.rct)}${tg('postT','Post','Stiftaufbau',t.post)}${tg('fracT','Fracture','Fraktur',t.fracture)}</div>`:''}
  ${t.s==='implant'?`<div class="opt-grid"><label class="field"><span class="label">${L('Implant crown material','Material der Implantatkrone')}</span>${sel('cmatT',t.cmat)}</label>${tg('abutT','Bridge abutment','Brückenpfeiler',t.abut)}</div>`:''}
  ${t.s==='root'?`<div class="opt-grid">${tg('rctT','Root filling','Wurzelfüllung',t.rct)}</div>`:''}
  <div class="verdict v-nodata" style="padding:10px 12px"><span class="label">${L('Finding','Befund')}</span><span>${esc(describe(t,lg))}</span>${lg==='en'?'':''}</div>
  <label class="field"><span class="label">${L('Note (shape, rotation, position, wear…)','Bemerkung (Form, Drehung, Stellung, Abrasion …)')}</span><textarea id="noteT" rows="2">${esc(t.note||'')}</textarea></label>
  <div class="sheet-foot"><button class="btn" id="prevT" ${idx===0?'disabled':''} aria-label="${L('Previous tooth','Vorheriger Zahn')}">‹</button><button class="btn" id="soundNext">${L('Sound','o. B.')}${idx<31?L(', next',', weiter'):''}</button><button class="btn primary" id="nextT">${idx<31?`${L('Next','Weiter')}: ${ORDER[idx+1]} ›`:L('Finish','Abschließen')}</button></div>`;
  const upd=(fn,mk)=>{const x=migrate(Object.assign(TT({s:'unk'}),c[chart][n]||{}));x.fill=Object.assign({},x.fill);if(mk&&x.s==='unk')x.s='present';fn(x);c[chart][n]=x;save()};
  const on=(id,ev,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener(ev,fn)};
  sheet.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{upd(x=>x.s=b.dataset.s);drawSheet()});
  sheet.querySelectorAll('[data-mat]').forEach(b=>b.onclick=()=>{curMat=b.dataset.mat;drawSheet()});
  sheet.querySelectorAll('[data-bs]').forEach(p=>{
    const act=()=>{const s=p.dataset.bs;upd(x=>{if(curMat==='erase'||x.fill[s]===curMat)delete x.fill[s];else x.fill[s]=curMat},1);drawSheet();const f=sheet.querySelector(`[data-bs="${s}"]`);if(f&&document.activeElement===document.body)f.focus({preventScroll:true})};
    p.addEventListener('click',act);p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}});
  });
  on('cmatT','change',e=>{upd(x=>x.cmat=e.target.value);drawSheet()});
  on('crownT','change',e=>{upd(x=>{x.crown=e.target.checked;if(!x.crown){x.cmat='';x.abut=false}},1);drawSheet()});
  on('abutT','change',e=>{upd(x=>x.abut=e.target.checked,1);drawSheet()});
  on('venT','change',e=>{upd(x=>x.veneer=e.target.checked,1);drawSheet()});
  on('rctT','change',e=>{upd(x=>x.rct=e.target.checked,1);drawSheet()});
  on('postT','change',e=>{upd(x=>x.post=e.target.checked,1);drawSheet()});
  on('fracT','change',e=>{upd(x=>x.fracture=e.target.checked,1);drawSheet()});
  on('noteT','input',e=>upd(x=>x.note=e.target.value));
  on('doneT','click',closeSheet);
  const goTo=i=>{ed.n=ORDER[i];drawSheet();sheet.scrollTop=0};
  on('prevT','click',()=>goTo(idx-1));
  const next=()=>{if(idx<31)goTo(idx+1);else closeSheet()};
  on('nextT','click',next);
  on('soundNext','click',()=>{upd(x=>{const note=x.note;Object.assign(x,TT({note}))});next()});
}
