istica individuale","Altri reperti (intera bocca)","Come nei moduli DVI INTERPOL","Tipo di dentatura","Occlusione","Stato parodontale","Denti soprannumerari","Pigmentazioni / colore","Protesi rimovibili","Condizione delle mascelle","Secondo odontologo","Dentatura decidua","Dentatura mista","Dentatura permanente","Mascelle con denti","Mascelle senza denti","Solo denti","Frammenti","ad es. II classe, morso profondo, morso aperto","ad es. perdita ossea, recessioni, tartaro","ad es. tabacco, tetraciclina, colore A3","Abbreviazioni e codici","Significato delle abbreviazioni","Nell’app","Inglese","Significato","Superfici: mesiale, occlusale (incisale I nei denti anteriori), distale, vestibolare, linguale / palatale","Denti decidui (FDI): quadranti 5–8","I moduli DVI INTERPOL (2023) usano la numerazione FDI e termini inglesi; non prescrivono codici a lettere. Nei moduli DVI ufficiali scriva i reperti per esteso in inglese. I codici dell’app si cambiano in Impostazioni → Codici dello schema.","Ponte adesivo (ala)","Ponte adesivo (elemento intermedio)","Dente sostituito (protesi rimovibile)","Dente assente","Corona (integra)","Cappetta radicolare con dente sostituito","Elemento intermedio su impianti","Dente sostituito su protesi implantoportata","Corona su impianto","Attacco su impianto (sfera, barra) con dente sostituito","Corona telescopica su impianto","Ritenzione insufficiente","Dente conservabile, ampiamente distrutto","Dente conservabile, difetti parziali","Dente non conservabile (da estrarre)","Chiusura dello spazio","Suffisso w: da rinnovare (ad es. kw, bw)","Codici dello schema","Automatico","Codici tedeschi se l’app è in tedesco, altrimenti inglesi","Abbreviazioni mostrate sui denti, nella legenda e nella perizia.","Altri reperti (AM)","Altri reperti (PM)","Codici","superfici m o d b l · punto = caratteristica individuale (rotazione, diastema …) · 55–85 = denti decidui","superfici M O D B L · punto = caratteristica individuale (rotazione, diastema …) · 55–85 = denti decidui","Colori: blu composito, grigio amalgama, turchese vetroionomero, viola ceramica, giallo oro, arancione provvisorio, rosso carie.","Dente presente in entrambi; dettagli non registrati in uno dei dati","Impianto AM; dettagli PM non registrati","Residuo radicolare AM, dente presente PM (ad es. radice restaurata)","tipo di corona modificato","dente deciduo AM, successore permanente PM","dente permanente AM, dente deciduo PM","apparecchio ortodontico rimosso","apparecchio ortodontico aggiunto","gioiello dentale rimosso","gioiello dentale aggiunto","sigillatura persa","{1} registrato solo AM","{1} registrato solo PM","rotazione","malposizione","diastema","anomalia di forma","Reperti identici (incl. {1})","ruotato","malposizione / inclinato","diastema (spazio)","bracket / contenzione ortodontica","gioiello dentale","Presente (dettagli non registrati)","sano","Fonte: elenco KZBV dei codici di reperto ammessi (piano di trattamento elettronico, 2022). * Codici d’uso comune non presenti nell’elenco KZBV. Gli studi possono usare varianti proprie; in caso di dubbio chieda al dentista curante.","Leggere i dati AM tedeschi (codici di reperto)","Impianto (dati più vecchi; oggi sk, sb, st …)","Dente presente in entrambi","dettagli non registrati in uno dei dati","Impianto AM","dettagli PM non registrati","Rotazione","Malposizione","Diastema","Modifica","stato PM; tocchi un dente per vedere o modificare AM e PM","In base alle raccomandazioni del Gruppo di lavoro per la diagnostica forense dell’età (AGFAD). Verificare la versione attuale sul sito AGFAD.","Nel procedimento penale tedesco serve un’ordinanza del giudice ai sensi dell’articolo 81a del codice di procedura penale tedesco, perché le radiografie non hanno indicazione medica.","Austria: nel procedimento penale l’esame è disposto dal pubblico ministero su autorizzazione del giudice (articolo 123 del codice di procedura penale austriaco). Verificare che l’ordinanza copra le radiografie senza indicazione medica.","Svizzera: nel procedimento penale l’esame è disposto dal pubblico ministero o dal tribunale dei minorenni (art. 251 del codice di procedura penale svizzero); i casi di asilo seguono la legge sull’asilo. Assicurarsi che l’ordine scritto copra le radiografie.","Verificare quale base giuridica richiede il suo paese prima di radiografie senza indicazione medica (ad esempio un’ordinanza del giudice o un consenso informato scritto) e inserirla in Impostazioni → Paese del tribunale.","Paese del tribunale","Germania","Austria","Svizzera","Altro paese","La sua base giuridica (facoltativa, sostituisce il testo sopra)","ad es. ordinanza del giudice ai sensi di … del …","Usato nella checklist della stima dell’età e nella perizia. Le leggi cambiano: verificare sempre la situazione giuridica attuale.","Pakistan","Pakistan: secondo la sezione 8 del Juvenile Justice System Act 2018, l’età si ricava da certificati di nascita o scolastici; in mancanza, può essere determinata dal referto di visita di un medico. Il tribunale registra la propria conclusione sull’età. Verificare che l’ordine copra le radiografie.","India","India: secondo la sezione 94 del Juvenile Justice (Care and Protection of Children) Act 2015, prevalgono il certificato scolastico o di nascita; solo se mancano si può eseguire un test di ossificazione o un altro esame medico dell’età, su ordine del Juvenile Justice Board o del Child Welfare Committee. Visita medica dell’imputato: sezione 51 della Bharatiya Nagarik Suraksha Sanhita 2023.","Stati Uniti","Stati Uniti: le regole variano da stato a stato. Un esame corporale coattivo richiede in genere un mandato o un ordine del giudice, oppure un consenso informato (Quarto emendamento). Per i minori non accompagnati in custodia migratoria l’età si determina secondo 8 U.S.C. § 1232(b)(4) e 45 CFR § 410.1702: si considerano tutte le prove e le radiografie non possono essere l’unica base.","Australia","Australia (reati federali): secondo la parte IAA del Crimes Act 1914 (s 3ZQA e seguenti), una procedura di determinazione dell’età (attualmente una radiografia di mano e polso) richiede i consensi previsti o l’ordine di un magistrato. Stati e territori hanno regole proprie.","Arabia Saudita","Arabia Saudita: secondo l’articolo 3 della legge sui minori (decreto reale M/113, 1439 H), l’età si calcola da un documento ufficiale; il tribunale può inviare il minore all’autorità medica competente per stimarne l’età.","Emirati Arabi Uniti","Emirati Arabi Uniti: i casi di minori seguono la legge federale sui minori delinquenti (legge federale n. 6 del 2022). In assenza di documento ufficiale, il tribunale o la procura possono nominare un perito medico per stimare l’età. Verificare l’articolo esatto per il caso.","Qatar","Qatar: le visite mediche nei procedimenti penali sono disposte dalla procura o dal tribunale (codice di procedura penale, legge n. 23 del 2004); i casi di minori seguono la legge sui minori (legge n. 1 del 1994). Verificare l’articolo esatto per il caso.","Cina","Cina: secondo l’articolo 132 della legge di procedura penale (2018), l’ispezione corporale di un indagato può essere imposta se necessario; l’articolo 146 disciplina la perizia. La procura deve verificare l’età degli indagati minorenni (norme 2026 della Procura suprema del popolo e del Ministero della pubblica sicurezza).","Giappone","Giappone: l’esame corporale di un indagato richiede un mandato di ispezione corporale emesso da un giudice (articolo 218 del codice di procedura penale); una perizia che coinvolga il corpo richiede l’autorizzazione del giudice per misure peritali (articolo 225 con l’articolo 168).","London Atlas (AlQahtani et al. 2010): categoria più simile {1} anni, cioè un’età stimata di {2}–{3} anni. I metodi ad atlante forniscono una stima, non un’età minima.","London Atlas (intera dentatura)","Confronti tutti i denti in sviluppo nell’OPG con il London Atlas of Human Tooth Development and Eruption (AlQahtani et al. 2010) e scelga la categoria d’età più simile. È più utile finché i denti sono in sviluppo (bambini e adolescenti). Fornisce un’età stimata, non un’età minima: per la soglia dei 18 anni usi i metodi dei terzi molari sopra.","Categoria dell’atlante più simile (anni)","non usato","Sotto 1 anno: l’atlante ha anche categorie da 30 settimane in utero a 10,5 mesi; le annoti in «Altri reperti». Atlante: atlas.dentistry.qmul.ac.uk","14, 18 e 21 anni sono limiti d’età giuridici comuni (in Germania: imputabilità, maggiore età, giovane adulto); verificare i limiti validi nel proprio paese. «Non dimostrato» non significa che la persona sia più giovane.","Apri il London Atlas (PDF gratuito)","Software interattivo dell’atlante","Apra l’atlante accanto all’OPG (schermo diviso o atlante su un secondo dispositivo).","Per ogni dente in sviluppo, osservi quanto sono formate corona e radice e dove si trova il dente rispetto all’osso alveolare.","Inizi dal diagramma più vicino all’età attesa, poi controlli un anno in meno e un anno in più.","Scelga il diagramma in cui coincide il maggior numero di denti e lo selezioni qui sotto.","Sotto 1 anno: l’atlante ha anche categorie da 30 settimane in utero a 10,5 mesi; le annoti in «Altri reperti». L’atlante è gratuito per la didattica e l’uso individuale (© AlQahtani, Queen Mary University of London); le sue immagini non sono copiate in questa app.","Licenze e crediti","Software di terze parti, font e metodi","Tutti i diritti riservati.","Software usato in questa app","Visualizzatore 3D dei denti, con loader STL, OBJ, PLY e glTF e OrbitControls","Accesso e account","Mostra il testo della licenza MIT","Font","Metodi e riferimenti (citati, non copiati)","et al.","stadi di mineralizzazione dentale","stadi di eruzione dei terzi molari e visibilità del legamento parodontale","raccomandazioni per la stima forense dell’età","solo link esterno; © Queen Mary University of London","dimensioni dentali medie per i modelli 3D schematici","moduli e guida (2023)","codici di reperto (2022)","I valori di riferimento per la stima dell’età provengono dallo studio che inserisce lei stesso. I metodi sono descritti con parole proprie dell’app.","Sottoinsiemi di IBM Plex Sans e IBM Plex Mono, rinominati come richiede la licenza","nome di font riservato","I font sono salvati con l’app; nessuna richiesta di font va a Google. Licenza completa: fonts-OFL.txt accanto all’app.","Valori tipici da manuale per i denti permanenti. Le misure sono valori medi secondo Wheeler’s Dental Anatomy. Le variazioni individuali e di popolazione sono frequenti.","Sblocca confronto, stima dell’età, registro, perizia PDF e anatomia dentale.","Le mie immagini e illustrazioni","Anatomia dentale: caratteristiche superiore/inferiore e destra/sinistra","dimensioni dentali medie","Caso","Confronto","Inserire i dati del caso","Registrare i dati AM","Registrare i reperti PM","Confrontare AM e PM","Redigere la perizia","Creare la perizia PDF","Odontologia forense","Cadavere","Ancora nessun dato del caso","Apri lo schema dentale","denti registrati","Confronto","distintivi","Non iniziato","voci di custodia","Conclusione scritta","Ancora nessuna conclusione","Guide e checklist","Superiore o inferiore, destra o sinistra: caratteristiche di identificazione di ogni dente","Elimina questo caso","Confronto DVI: ogni cadavere con ogni persona scomparsa","Confronto radiografico: sovrapporre radiografie AM e PM","Documentazione dentale estera: sistemi di numerazione e termini","Strumenti","Confronto DVI","Ordinare le persone scomparse per ogni cadavere","Confronto radiografico","Sovrapporre radiografie AM e PM","Documentazione dentale estera","Numeri dei denti e termini","Esaminatore 1","Esaminatore 2","INTERPOL raccomanda due odontologi. L’esaminatore 2 registra gli stessi denti in modo indipendente; le differenze sono elencate sotto.","Impronta del documento (SHA-256): ","Confronto","Identificazione delle vittime di disastri","Inserisca ogni cadavere (PM) e ogni persona scomparsa (AM) come record separato e lo registri. Il passo successivo confronta ogni cadavere con tutte le persone scomparse e ordina i candidati.","Aggiungi cadavere (PM)","Aggiungi persona scomparsa (AM)","Cadaveri","Ancora nessun cadavere.","Persone scomparse","Ancora nessuna persona scomparsa.","Registri prima almeno un cadavere (PM) e una persona scomparsa (AM).","Scegli immagini","Sovrapposizione","Scegli le due immagini","Scelga la radiografia post mortem come base e quella ante mortem da sovrapporre. Le immagini provengono da Registro del caso → Foto e radiografie.","Ancora nessuna immagine in questo caso.","Aggiungi foto e radiografie","Scelga prima un’immagine PM e una AM al passo 1.","Numeri dei denti","Termini dentali","Convertire i numeri dei denti","La documentazione estera usa spesso un altro sistema di numerazione. Digiti il numero come scritto per trovare il numero FDI.","Sistema della documentazione","Universale (USA, 1–32 / A–T)","Palmer (Regno Unito, Commonwealth)","Haderup (Scandinavia, documentazione più vecchia)","Dente come scritto","ad es. 3, 6┘, 6+, 46","Denti decidui","Simboli Palmer: ┘ superiore destro, └ superiore sinistro, ┐ inferiore destro, ┌ inferiore sinistro. Haderup: + superiore, − inferiore.","Termini dentali in altre lingue","Scelga la lingua della documentazione AM per vedere il significato dei termini comuni.","Lingua della documentazione","Le superfici sono di solito abbreviate con le iniziali (M, O, D, B/V, L/P, I); le lettere cambiano con la lingua, ad esempio V per vestibolare in francese e spagnolo.","Segnali d’allarme","Frenulo labiale superiore lacerato in un lattante che non cammina ancora.","Lividi su tronco, orecchie o collo, frenulo, angolo mandibolare, guance, palpebre o sottocongiuntivali nei bambini sotto i 4 anni, qualsiasi livido nei lattanti sotto i 4,99 mesi, o lividi a forma di oggetto (TEN-4-FACESp).","Lesioni di età diverse, spiegazioni che non corrispondono alla lesione o allo sviluppo del bambino, ritardo nel cercare cure.","Trascuratezza dentale: carie, dolore o infezione non trattati nonostante conoscenza e accesso alle cure.","Segnalazione in Germania","Documenti accuratamente i reperti con foto e la spiegazione data (con le parole di chi accudisce).","§ 4 KKG: i dentisti possono discutere la situazione con i genitori e chiedere consiglio a un professionista esperto di tutela dei minori (insoweit erfahrene Fachkraft) con dati pseudonimizzati.","Se il rischio per il bambino persiste, possono informare l’ufficio per la tutela dei minori (Jugendamt); in caso di pericolo acuto, contattare la polizia.","Linea medica di tutela dei minori per professionisti: 0800 19 210 00 (gratuita, 24/7).","Non deve dimostrare il maltrattamento. Riconosca, documenti e trasmetta i sospetti attraverso i canali appropriati.","Bambini (dentatura in sviluppo)","Periodo più preciso: molti denti si sviluppano contemporaneamente.","Metodi: London Atlas, Demirjian, Willems (Demirjian modificato), apici aperti di Cameriere, Ubelaker.","Errore tipico di circa ±1 anno, maggiore nella tarda infanzia.","Adolescenti e giovani adulti","I terzi molari sono spesso gli unici denti in sviluppo: mineralizzazione (Demirjian), eruzione e visibilità del legamento parodontale (Olze).","Combinare con radiografia della mano e, se necessario, TC delle clavicole (AGFAD). Indicare un’età minima per le soglie legali.","Adulti","Alterazioni regressive: dentina secondaria (rapporto polpa/dente, Kvaal; canino di Cameriere), traslucenza radicolare (Lamendin), recessione parodontale, attrito.","Metodi di laboratorio: racemizzazione dell’acido aspartico, anelli del cemento.","Errori spesso di ±5–10 anni; indicare un intervallo d’età, non un numero unico.","Ogni metodo ha una dispersione; indicare lo studio di riferimento, la sua popolazione, il sesso e l’intervallo statistico usato.","I dati di riferimento di una popolazione possono sovra- o sottostimare l’età in un’altra (origine, alimentazione, condizione socioeconomica).","I terzi molari variano molto e possono mancare o essere inclusi; l’inclusione può ritardare lo sviluppo.","Mimetismo dell’età: le stime puntuali tendono verso l’età media del campione di riferimento.","Per le soglie d’età legali usi il concetto di età minima (l’età più giovane in cui lo stadio è stato osservato) per non dichiarare maggiorenne un minore.","Combini sempre reperti dentali, scheletrici e fisici (AGFAD).","Un risultato dentale sostiene una stima dell’età; non prova una data di nascita.","I morsi cambiano rapidamente sulla pelle di vivi e defunti. Documenti presto e ripetutamente, prima che tamponi o pulizia alterino l’area.","Localizzazione sul corpo, posizione del corpo e curvatura della superficie descritte","Foto d’insieme con la localizzazione anatomica","Primi piani con scala ABFO n. 2 nello stesso piano della lesione","Fotocamera perpendicolare al segno; nessuna distorsione grandangolare","Foto seriali per più giorni (vivi: ogni giorno per alcuni giorni; defunti: in 24–48 h)","Luce alternativa: fotografia UV e infrarossa considerata","Misure: larghezza dell’arcata, dimensioni del segno, distanze tra i segni","Descrizione scritta: forma, colore, abrasioni, contusioni, lacerazioni, possibili impronte dentali","Tampone di saliva prima della pulizia: tecnica del doppio tampone (umido poi asciutto)","Tampone di controllo da un’area di pelle non morsa","Tamponi asciugati all’aria, confezionati in carta, etichettati, catena di custodia avviata","Impronta della pelle lesa (se presenti indentazioni) con materiale a bassa viscosità","Escissione di tessuto solo dal medico legale con autorizzazione, fissata su un anello di supporto","Dentatura del sospettato solo con autorizzazione/consenso: foto, impronte, registrazione del morso","Confronti eseguiti all’oscuro delle informazioni del caso quando possibile","Il DNA della saliva è il legame più affidabile tra un morso e una persona. Prima il tampone, poi l’esame.","Limiti scientifici","La revisione dei fondamenti scientifici del NIST (2023) ha concluso che le tre premesse chiave dell’analisi dei morsi non sono supportate dai dati:","La dentatura anteriore umana è unica a livello individuale.","Questa unicità viene trasferita con precisione sulla pelle umana.","Le caratteristiche possono essere rilevate e interpretate con precisione dalle tecniche di analisi.","La pelle è elastica e curva; i lividi si estendono e cambiano; la postura al momento del morso è sconosciuta.","Gli esaminatori spesso non concordano nemmeno sul fatto che una lesione sia un morso umano (PCAST 2016).","Diverse condanne ingiuste sono state collegate a testimonianze sui morsi.","Usi i morsi per la documentazione, per riconoscere un possibile morso e per il campionamento del DNA. Non identifichi chi ha morso dal solo motivo.","Relazione peritale","Scrivere","Che cosa è stato esaminato, quando, da chi e con quale metodo.","Se la lesione è compatibile con un morso umano, un morso animale, o non è un morso / indeterminata.","Limiti: distorsione della pelle, qualità dell’immagine, tempo dalla lesione, fondamento scientifico.","Rimandare ai risultati del DNA per qualsiasi associazione con una persona.","Evitare","«Corrispondenza», «autore del morso identificato», «ragionevole certezza dentale» o qualsiasi probabilità non basata su dati.","Confrontare con un solo sospettato senza una serie di altre dentature.","Leggere informazioni del caso non necessarie per il quesito dentale.","Affermazione più forte accettabile su una persona: «non può essere esclusa» o «esclusa», e solo con ragionamento chiaro e limiti dichiarati.","I denti proteggono il DNA nella polpa e nella dentina, anche dopo incendio, sepoltura o lunghi intervalli post mortem.","Preferisca molari o premolari integri e non restaurati; eviti denti con grandi otturazioni o otturazioni canalari.","Registrare, fotografare e radiografare il dente prima del prelievo: l’estrazione è distruttiva.","Indossi guanti e mascherina, usi strumenti puliti, eviti di toccare la radice, confezioni asciutto in carta o provetta sterile.","Tamponi di saliva da pelle, morsi o oggetti: tecnica del doppio tampone, asciugatura all’aria, confezione in carta.","Etichetti con numero del caso, numero del dente, data e persona; avvii la catena di custodia.","La DVI segue lo standard INTERPOL affinché squadre di paesi diversi lavorino con gli stessi moduli e regole di qualità.","Quattro fasi","Scena: recupero di cadaveri e frammenti, numerazione e documentazione del luogo.","Post mortem: esame in obitorio (moduli PM rosa; sezione dentale F1/F2).","Ante mortem: raccolta della documentazione delle persone scomparse (moduli AM gialli).","Riconciliazione: confronto e conferma da parte di una commissione di identificazione.","Compiti del team dentale","Lavorare in coppia: un esaminatore e un verbalizzante; un secondo team controlla ogni schema.","Schema con numerazione FDI e codici INTERPOL; radiografie e foto di ogni caso.","Inserire i dati nel software DVI (ad es. DVI System International / Plass Data) per la ricerca.","Non modificare mai uno schema PM dopo che i dati AM sono noti; registrare le correzioni come nuove voci.","Il software suggerisce candidati; l’identificazione è decisa dagli esperti, di solito con un secondo identificatore primario se disponibile.","Denti decidui – eruzione (mesi)","Superiore","Inferiore","Denti permanenti – eruzione (anni)","La formazione radicolare si completa circa 2–3 anni dopo l’eruzione (di più per canini e molari).","Le ragazze sono di solito un po’ in anticipo rispetto ai ragazzi; le popolazioni differiscono.","L’eruzione è più variabile della mineralizzazione; per la stima dell’età preferire gli stadi di sviluppo radiografici.","Extraorale: viso, labbra, lesioni periorali fotografati","Accesso alla bocca (rigidità, decomposizione); resezione mandibolare solo con autorizzazione","Tessuti molli: mucosa, frenuli, lingua, palato, piercing, tatuaggi","Mascelle: fratture, zone edentule, guarigione degli alveoli, patologie","Ogni dente registrato (FDI), con superfici, materiali e anomalie","Occlusione, usura, pigmentazioni, rotazioni, diastemi","Protesi rimosse, fotografate e controllate per nomi o numeri","Radiografie e foto eseguite; un secondo esaminatore ha controllato lo schema","L’identificazione dentale confronta i reperti post mortem (PM) con la documentazione ante mortem (AM) di una persona scomparsa. È uno degli identificatori primari riconosciuti da INTERPOL, insieme a impronte digitali e DNA.","Fonti AM","Schema dentale e note di trattamento, incluse le fatture (che mostrano date e denti trattati).","Radiografie: OPG, endorali, bitewing, CBCT. Chiedere sempre l’originale o un’esportazione digitale a piena risoluzione.","Fotografie, scansioni intraorali, modelli studio, documentazione ortodontica.","Foto sorridenti dalla famiglia o dai social media (utili per i denti anteriori).","Procedura","Registrare completamente la dentatura PM prima del confronto (evitare bias).","Eseguire radiografie PM corrispondenti alle proiezioni AM (angolo, zona, tipo di pellicola).","Confrontare restauri, otturazioni canalari, morfologia radicolare, contorno dei seni, trabecolatura e anomalie.","Classificare ogni differenza come spiegabile (trattamento dopo la documentazione AM) o non spiegabile.","Scala delle conclusioni (INTERPOL/ABFO): accertata/positiva · probabile · possibile · insufficiente · esclusa. Una sola discrepanza non spiegabile può escludere; non esiste un numero minimo fisso di punti concordanti.","Documentare ogni lesione con sede, dimensioni, forma, colore e una scala ABFO n. 2.","Labbra e frenuli: lacerazioni dovute ai denti sottostanti indicano un trauma contusivo alla bocca.","Fratture dei mascellari: mandibola (condilo, angolo, sinfisi) e terzo medio (Le Fort I–III, zigomo).","Regola della tesa del cappello: lesioni sopra questa linea suggeriscono colpi più che una semplice caduta.","Annotare separatamente lesioni vecchie e recenti; chiedere la documentazione dentale precedente.","Una relazione forense deve far vedere al lettore cosa è stato trovato e, separatamente, cosa ne conclude il perito.","Osservazione","Interpretazione","Dente 21 assente, alveolo aperto con margini netti, nessuna guarigione ossea.","Compatibile con perdita dentale post mortem.","Terzo molare 38 allo stadio H di Demirjian.","Età minima 18,2 anni (studio di riferimento X).","Disegno curvo di lividi, largo 35 mm, sull’avambraccio.","Compatibile con un morso umano; non idoneo a identificare una persona.","Usi parole neutre e misurabili per i reperti (dimensioni, colore, sede).","Usi termini graduati per le interpretazioni: «compatibile con», «tipico di», «esclude».","Indichi spiegazioni alternative e i limiti del metodo.","Resti nel suo campo; lasci ad altri la causa di morte e il giudizio giuridico.","Stadi di decomposizione: fresco, enfisematoso, decomposizione attiva, avanzata, scheletrizzazione; la velocità dipende da temperatura, umidità, insetti e sepoltura.","I denti monoradicolati si perdono spesso post mortem; cercare alveoli vuoti con margini netti (senza guarigione).","I «denti rosa» sono un fenomeno post mortem (emoglobina nella dentina) e non indicano la causa di morte.","Resti combusti: i denti diventano fragili e cambiano colore; fotografare in situ, stabilizzare prima di spostare, tenere insieme i frammenti.","Verificare se i denti sono umani e separare resti commisti in base a occlusione, usura e sviluppo.","Descrivere con precisione la lesione: frattura coronale o radicolare, lussazione, avulsione, frattura alveolare, lesione dei tessuti molli.","Una reazione vitale (sanguinamento, gonfiore, infiammazione) suggerisce una lesione in vita.","Le fratture perimortali in osso fresco hanno margini netti e dello stesso colore; le rotture post mortem in osso secco sono più chiare e irregolari.","Un trauma contusivo al viso causa spesso fratture degli incisivi superiori insieme a lacerazioni delle labbra.","Considerare cadute, aggressioni, incidenti, crisi convulsive e pro ء لقانون اللجوء. تأكد من أن الأمر الكتابي يشمل صور الأشعة.","تحقق من الأساس القانوني الذي يشترطه بلدك قبل التصوير الشعاعي دون دواعٍ طبية (مثل أمر قضائي أو موافقة خطية مستنيرة)، وأدخله في الإعدادات ← بلد المحكمة.","بلد المحكمة","ألمانيا","النمسا","سويسرا","بلد آخر","الأساس القانوني الخاص بك (اختياري، يحل محل النص أعلاه)","مثل أمر قضائي وفق … من …","يُستخدم في قائمة تقدير العمر وفي التقرير. القوانين تتغير: تحقق دائمًا من الوضع القانوني الحالي.","باكستان","باكستان: وفق المادة 8 من قانون نظام قضاء الأحداث لعام 2018 يُؤخذ العمر من شهادات الميلاد أو الشهادات المدرسية؛ وإن لم توجد يجوز تحديده بتقرير فحص طبي من طبيب. وتسجّل المحكمة ما تنتهي إليه بشأن العمر. تحقق من أن الأمر يشمل صور الأشعة.","الهند","الهند: وفق المادة 94 من قانون قضاء الأحداث (رعاية الأطفال وحمايتهم) لعام 2015 تُقدَّم الشهادة المدرسية أو شهادة الميلاد؛ ولا يجوز إجراء اختبار التعظّم أو فحص طبي آخر للعمر إلا عند عدم وجودهما، وبأمر من مجلس قضاء الأحداث أو لجنة رعاية الطفل. الفحص الطبي للمتهم: المادة 51 من قانون بهارتيا ناغاريك سوراكشا سانهيتا لعام 2023.","الولايات المتحدة","الولايات المتحدة: تختلف القواعد من ولاية إلى أخرى. يتطلب الفحص الجسدي الإلزامي عادةً أمر تفتيش أو أمرًا قضائيًا أو موافقة مستنيرة (التعديل الرابع). وبالنسبة للقاصرين غير المصحوبين في احتجاز الهجرة يُحدَّد العمر وفق 8 U.S.C. § 1232(b)(4) و45 CFR § 410.1702: تُراعى جميع الأدلة ولا يجوز أن تكون صور الأشعة الأساس الوحيد.","أستراليا","أستراليا (الجرائم الاتحادية): وفق الجزء IAA من قانون الجرائم لعام 1914 (المادة 3ZQA وما بعدها) يتطلب إجراء تحديد العمر (حاليًا أشعة اليد والمعصم) الموافقات اللازمة أو أمرًا من قاضي الصلح. وللولايات والأقاليم قواعدها الخاصة.","السعودية","السعودية: وفق المادة الثالثة من نظام الأحداث (المرسوم الملكي م/113 لعام 1439هـ) يُحسب السن استنادًا إلى ما هو مدون في أي وثيقة رسمية، وللمحكمة إحالة الحدث إلى الجهة الطبية المختصة لتقدير سنه.","الإمارات","الإمارات: تخضع قضايا الأحداث للقانون الاتحادي بشأن الأحداث الجانحين (القانون الاتحادي رقم 6 لسنة 2022). وعند عدم وجود وثيقة رسمية يجوز للمحكمة أو النيابة العامة ندب خبير طبي لتقدير ,"Determinação do lado: sinais de Mühlreiter","Sinal do ângulo: o ângulo mesial incisal ou oclusal é mais agudo que o distal.","Sinal da curvatura da coroa: vista por incisal ou oclusal, a parte mesial da face vestibular é mais convexa.","Sinal da raiz: o eixo da raiz inclina-se para distal em relação ao eixo da coroa.","Os três sinais são mais claros em incisivos e caninos e menos confiáveis em molares e dentes desgastados. Combine sempre várias características.",null,"Adicionar imagem","Envie capturas de modelos dentais 3D, desenhos ou fotos próprias. Elas aparecem para o dente {1} e {2} (o mesmo dente do outro lado) e ficam salvas neste aparelho para todos os casos.","Ainda sem imagens para este dente.","Vista, ex.: mesial, vestibular, 3D","Comparar com o caso atual","As imagens do caso aparecem aqui quando você indica o dente {1} em “Dentes visíveis” em Registro do caso › Fotos e radiografias.","Borda incisal com 3 mamelões quando jovem","1, cônica","Incisivo mais largo. Ângulo mésio-incisal agudo (cerca de 90°), ângulo disto-incisal arredondado. Cíngulo ligeiramente distal.","Coroa larga (cerca de 8,5 mm), cíngulo e cristas marginais nítidos; raiz de secção arredondada. Um incisivo central inferior tem cerca de 5 mm de largura e é achatado.","Ângulo mésio-incisal agudo, disto-incisal arredondado; contorno distal da coroa mais convexo; ápice inclinado para distal.","Borda incisal, ângulos mais arredondados que no central","1, ápice frequentemente curvado para distal","Menor e mais arredondado que o incisivo central. Variações frequentes: conoide ou agenesia.","Ângulos incisais arredondados, fosseta palatina possível; raiz arredondada. Os laterais inferiores são estreitos com raízes achatadas.","Ângulo distal claramente mais arredondado que o mesial; ápice geralmente curvado para distal.","1 cúspide pontiaguda; vertente mesial mais curta que a distal","1, a raiz mais longa da dentição","Dente mais longo. Forte crista vestibular. Contorno distal mais convexo.","Coroa larga com ponta da cúspide próxima ao centro; contornos mesial e distal ultrapassam a raiz. Os caninos inferiores são mais estreitos e seu contorno mesial continua reto na raiz.","Vertente mesial mais curta que a distal; área de contato distal mais cervical; ápice curvado para distal.","2: vestibular maior que a palatina","Geralmente 2 (vestibular e palatina)","Concavidade mesial na coroa e na raiz. Ponta da cúspide vestibular ligeiramente distal.","Duas cúspides bem desenvolvidas e geralmente duas raízes. Um primeiro pré-molar inferior tem uma cúspide vestibular dominante, uma lingual mínima e uma raiz.","Concavidade mesial da coroa e da raiz (lado da fossa canina); ponta da cúspide vestibular ligeiramente distal.","2 de tamanho quase igual","Geralmente 1","1 ou 2","Mais simétrico que o primeiro pré-molar; sem concavidade mesial marcada.","Duas cúspides de altura quase igual, contorno oclusal oval. Os segundos pré-molares inferiores são mais redondos ou quadrados e a coroa inclina-se para lingual.","Ponta da cúspide vestibular ligeiramente mesial; ponta da cúspide palatina deslocada para mesial.","4 (mésio-palatina a maior), frequentemente tubérculo de Carabelli","3 (mésio-vestibular, disto-vestibular, palatina)","3–4 (segundo canal mésio-vestibular é comum)","Maior dente superior. Crista oblíqua da cúspide mésio-palatina à disto-vestibular. Contorno oclusal romboide.","Três raízes (duas vestibulares, uma palatina), coroa romboide, crista oblíqua. Os primeiros molares inferiores têm duas raízes (mesial e distal) e coroa retangular.","A cúspide mésio-palatina é a maior; o tubérculo de Carabelli fica mésio-palatino; raiz mésio-vestibular mais larga que a disto-vestibular.","4, cúspide disto-palatina menor ou ausente","3, frequentemente mais próximas ou fusionadas","Menor e mais em forma de coração que o primeiro molar; sem tubérculo de Carabelli.","Três raízes (frequentemente próximas), coroa em forma de coração. Os segundos molares inferiores têm duas raízes e sulcos em cruz.","Cúspide disto-palatina reduzida; raízes inclinadas para distal.","Variável, frequentemente 3","Variável, frequentemente fusionadas","Variável","17–21 (frequentemente incluso)","Forma e posição muito variáveis. Os estágios de desenvolvimento são usados na estimativa de idade.","Coroa pequena, frequentemente triangular; raízes geralmente fusionadas num cone.","Frequentemente pouco confiável; use as características palatinas e mesiais restantes e a inclinação da raiz (distal).","Borda incisal, coroa simétrica","1, achatada no sentido mésio-distal","1, às vezes 2 (vestibular e lingual)","Menor dente da dentição. Metades mesial e distal quase espelhadas.","Coroa estreita e simétrica (cerca de 5 mm); raiz muito achatada no sentido mésio-distal com sulcos dos dois lados.","Difícil. O sulco radicular distal costuma ser mais profundo; a borda incisal pode desgastar para distal. O lado frequentemente não pode ser determinado com segurança.","Borda incisal, ângulo distal mais arredondado","1, às vezes 2","Ligeiramente maior que o central; coroa parece torcida para distal.","Coroa estreita, raiz achatada; ligeiramente maior que o central inferior.","A coroa parece torcida para distal: o ângulo disto-incisal é mais redondo e fica mais lingual.","1 cúspide, ponta frequentemente ligeiramente mesial","1, ocasionalmente bifurcada","Mais estreito que o canino superior; contorno mesial da coroa quase reto com a raiz.","Coroa mais estreita, contorno mesial contínuo e reto até a raiz, face lingual lisa.","A ponta da cúspide fica mesial; vertente mesial mais curta; contorno mesial reto, distal convexo.","Cúspide vestibular grande, lingual pequena","Parece um canino visto por vestibular. Cúspide lingual muito pequena.","Cúspide vestibular dominante, lingual mínima, coroa inclinada para lingual, uma raiz.","Sulco mésio-lingual frequentemente presente; crista marginal mesial mais baixa que a distal; vertente mesial da cúspide vestibular mais curta.","2 ou 3 (sulcos em forma de Y, H ou U)","Cúspides linguais mais desenvolvidas que no primeiro pré-molar.","Duas ou três cúspides, contorno oclusal redondo ou quadrado, uma raiz, coroa inclinada para lingual.","Na forma tricuspídea, a cúspide mésio-lingual é maior que a disto-lingual.","5 (3 vestibulares, 2 linguais)","2 (mesial e distal)","3 (2 mesiais, 1 distal), às vezes 4","Maior dente inferior. Sulcos em forma de Y. Cúspide distal do lado vestibular.","Duas raízes (mesial e distal), cinco cúspides, coroa retangular mais larga no sentido mésio-distal.","A pequena cúspide distal fica disto-vestibular; raiz mesial mais larga e curvada para distal; dois sulcos vestibulares.","4, sulcos em cruz (+)","2, mais próximas","3; canal em C possível","Coroa retangular com 4 cúspides quase iguais.","Duas raízes próximas, quatro cúspides com sulco em cruz (+).","Raízes inclinadas para distal; cúspides mesiais ligeiramente maiores que as distais.","Variável, 4–5","2, frequentemente fusionadas","Muito variável; frequentemente incluso. Os estágios de desenvolvimento são usados na estimativa de idade.","Duas raízes (frequentemente fusionadas e curvadas para distal), coroa com quatro ou cinco cúspides.","Use a inclinação da raiz (distal) e as cúspides mesiais maiores.",null,null,null,null,null,null,"Frente","Esquerda","Direita","Topo","Base","Apical",null,null,null,null,null,null,null,null,"Altura da coroa / comprimento da raiz (mm)","Largura da coroa mésio-distal / vestíbulo-lingual (mm)",null,null,"Gratuito","Odontograma: AM e PM, cada face e material, registro rápido","Comparação AM/PM com resultado sugerido","Estimativa de idade com checklist AGFAD e idade mínima","Registro do caso: fotos, radiografias e cadeia de custódia","Laudo em PDF com conclusão sugerida",null,"Ferramentas de odontologia forense para identificação odontológica, estimativa de idade e laudos periciais.","Desenvolvido por","Odontolegista","Entrar","Criar conta gratuita","E-mail","Senha","Pelo menos 8 caracteres. Você receberá um e- onômero, violeta cerâmica, amarelo ouro, laranja provisório, vermelho cárie.","Dente presente em ambos; detalhes não registrados num dos registros","Implante AM; detalhes PM não registrados","Resto radicular AM, dente presente PM (ex.: raiz restaurada)","tipo de coroa alterado","dente decíduo AM, sucessor permanente PM","dente permanente AM, dente decíduo PM","aparelho ortodôntico removido","aparelho ortodôntico acrescentado","joia dental removida","joia dental acrescentada","selante perdido","{1} registrado só no AM","{1} registrado só no PM","rotação","mau posicionamento","diastema","anomalia de forma","Achados idênticos (incl. {1})","girovertido","mau posicionamento / inclinado","diastema (espaço)","bráquete / contenção ortodôntica","joia dental","Presente (detalhes não registrados)","hígido","Fonte: lista KZBV de códigos de achados permitidos (plano de tratamento eletrônico, 2022). * Códigos usuais de consultório que não estão na lista KZBV. Consultórios podem usar variantes próprias; em caso de dúvida, pergunte ao dentista responsável.","Leitura de registros AM alemães (códigos de achados)","Implante (registros antigos; hoje sk, sb, st …)","Dente presente em ambos","detalhes não registrados num dos registros","Implante AM","detalhes PM não registrados","Rotação","Mau posicionamento","Diastema","Editar","Estado PM; toque num dente para ver ou editar AM e PM","Baseado nas recomendações do Grupo de Estudo de Diagnóstico Forense da Idade (AGFAD). Verifique a versão atual no site da AGFAD.","Em processos penais é necessária uma ordem judicial nos termos do artigo 81a do Código de Processo Penal alemão, pois as radiografias não têm indicação médica.","Áustria: em processos penais, o exame é ordenado pelo Ministério Público com autorização judicial (artigo 123 do Código de Processo Penal austríaco). Verifique se a ordem abrange radiografias sem indicação médica.","Suíça: em processos penais, o exame é ordenado pelo Ministério Público ou pelo tribunal de menores (art. 251 do Código de Processo Penal suíço); casos de asilo seguem a Lei de Asilo. Garanta que a ordem escrita abranja as radiografias.","Verifique qual base legal seu país exige antes de radiografias sem indicação médica (por exemplo, ordem judicial ou consentimento informado por escrito) e informe-a em Configurações → País do tribunal.","País do tribunal","Alemanha","Áustria","Suíça","Outro país","Sua própria base legal (opcional, substitui o texto acima)","ex.: ordem judicial nos termos do … da …","Usado no checklist de estimativa de idade e no laudo. As leis mudam: verifique sempre a situação jurídica atual.","Paquistão","Paquistão: segundo a seção 8 do Juvenile Justice System Act 2018, a idade é obtida de certidões de nascimento ou escolares; na falta delas, pode ser determinada por laudo de exame médico de um médico oficial. O tribunal registra sua conclusão sobre a idade. Verifique se a ordem abrange radiografias.","Índia","Índia: segundo a seção 94 do Juvenile Justice (Care and Protection of Children) Act 2015, prevalecem o certificado escolar ou a certidão de nascimento; só na falta deles pode ser feito teste de ossificação ou outro exame médico de idade, por ordem do Juvenile Justice Board ou do Child Welfare Committee. Exame médico do acusado: seção 51 do Bharatiya Nagarik Suraksha Sanhita 2023.","EUA","EUA: as regras variam por estado. Um exame corporal compulsório geralmente exige mandado ou ordem judicial, ou consentimento informado (Quarta Emenda). Para menores desacompanhados sob custódia migratória, a idade é decidida segundo 8 U.S.C. § 1232(b)(4) e 45 CFR § 410.1702: todas as provas são consideradas e as radiografias não podem ser a única base.","Austrália","Austrália (crimes federais): segundo a Parte IAA do Crimes Act 1914 (s 3ZQA e seguintes), um procedimento de determinação de idade (atualmente radiografia de mão e punho) exige os consentimentos necessários ou ordem de um magistrado. Estados e territórios têm regras próprias.","Arábia Saudita","Arábia Saudita: segundo o artigo 3 da Lei dos Menores (Decreto Real M/113, 1439 H), a idade é calculada a partir de documento oficial; o tribunal pode encaminhar o menor à autoridade médica competente para estimar a idade.","Emirados Árabes Unidos","Emirados Árabes Unidos: casos de menores seguem a lei federal sobre menores infratores (Lei Federal n.º 6 de 2022). Sem documento oficial, o tribunal ou o Ministério Público pode nomear um perito médico para estimar a idade. Verifique o artigo exato para o seu caso.","Catar","Catar: exames médicos em processos penais são ordenados pelo Ministério Público ou pelo tribunal (Código de Processo Penal, Lei n.º 23 de 2004); casos de menores seguem a Lei dos Menores (Lei n.º 1 de 1994). Verifique o artigo exato para o seu caso.","China","China: segundo o artigo 132 da Lei de Processo Penal (2018), a inspeção corporal de um suspeito pode ser compulsória se necessário; o artigo 146 prevê a perícia. O Ministério Público deve verificar a idade de suspeitos menores (normas de 2026 da Procuradoria Popular Suprema e do Ministério da Segurança Pública).","Japão","Japão: o exame corporal de um suspeito exige mandado de exame corporal emitido por um juiz (artigo 218 do Código de Processo Penal); uma perícia que envolva o corpo exige autorização judicial para medidas periciais (artigo 225 com o artigo 168).","London Atlas (AlQahtani et al. 2010): categoria mais semelhante {1} anos, ou seja, idade estimada de {2}–{3} anos. Métodos de atlas fornecem uma estimativa, não uma idade mínima.","London Atlas (dentição completa)","Compare todos os dentes em desenvolvimento na OPG com o London Atlas of Human Tooth Development and Eruption (AlQahtani et al. 2010) e escolha a categoria de idade mais semelhante. É mais útil enquanto os dentes ainda se desenvolvem (crianças e adolescentes). Fornece uma idade estimada, não uma idade mínima; para o limiar de 18 anos use os métodos dos terceiros molares acima.","Categoria do atlas mais semelhante (anos)","não m para colocar por cima. As imagens vêm de Registro do caso → Fotos e radiografias.","Ainda não há imagens neste caso.","Adicionar fotos e radiografias","Escolha primeiro uma imagem PM e uma AM na etapa 1.","Números dos dentes","Termos odontológicos","Converter números dos dentes","Registros estrangeiros usam muitas vezes outro sistema de numeração. Digite o número como está escrito no registro para obter o número FDI.","Sistema no registro","Universal (EUA, 1–32 / A–T)","Palmer (Reino Unido, Commonwealth)","Haderup (Escandinávia, registros antigos)","Dente como escrito","ex.: 3, 6┘, 6+, 46","Dentes decíduos","Símbolos Palmer: ┘ superior direito, └ superior esquerdo, ┐ inferior direito, ┌ inferior esquerdo. Haderup: + superior, − inferior.","Termos odontológicos em outros idiomas","Escolha o idioma do registro AM para ver o que significam os termos comuns do odontograma.","Idioma do registro","As faces costumam ser abreviadas pelas iniciais (M, O, D, B/V, L/P, I); as letras mudam com o idioma, por exemplo V de vestibular em francês e espanhol.","Sinais de alerta","Freio labial superior rompido num bebê que ainda não anda.","Hematomas no tronco, orelhas ou pescoço, freio, ângulo da mandíbula, bochechas, pálpebras ou subconjuntivais em crianças menores de 4 anos, qualquer hematoma em bebês com menos de 4,99 meses, ou hematomas com padrão (TEN-4-FACESp).","Lesões de idades diferentes, explicações que não combinam com a lesão ou com o desenvolvimento da criança, demora em procurar atendimento.","Negligência odontológica: cáries não tratadas, dor ou infecção apesar do conhecimento e do acesso ao tratamento.","Notificação na Alemanha","Documente os achados cuidadosamente com fotos e a explicação dada (nas palavras do próprio cuidador).","§ 4 KKG: dentistas podem discutir a situação com os pais e pedir orientação a um profissional experiente em proteção infantil (insoweit erfahrene Fachkraft) usando dados pseudonimizados.","Se o risco para a criança persistir, podem informar o serviço de proteção à juventude (Jugendamt); em perigo agudo, contatar a polícia.","Linha direta médica de proteção infantil para profissionais: 0800 19 210 00 (gratuita, 24 h).","Você não precisa provar o abuso. Reconheça, documente e encaminhe as suspeitas pelos canais adequados.","Crianças (dentição em desenvolvimento)","Período mais preciso: muitos dentes se desenvolvem ao mesmo tempo.","Métodos: London Atlas, Demirjian, Willems (Demirjian modificado), ápices abertos de Cameriere, Ubelaker.","Erro típico de cerca de ±1 ano, maior no fim da infância.","Adolescentes e adultos jovens","Os terceiros molares costumam ser os únicos dentes em desenvolvimento: mineralização (Demirjian), erupção e visibilidade do ligamento periodontal (Olze).","Combine com radiografia da mão e, se necessário, TC da clavícula (AGFAD). Informe uma idade mínima para limites legais.","Adultos","Alterações regressivas: dentina secundária (relação polpa/dente, Kvaal; canino de Cameriere), translucidez radicular (Lamendin), recessão periodontal, atrição.","Métodos laboratoriais: racemização do ácido aspártico, anéis do cemento dental.","Erros frequentemente de ±5–10 anos; indique uma faixa etária, não um número único.","Todo método tem dispersão; informe o estudo de referência, sua população, o sexo e o intervalo estatístico utilizado.","Dados de referência de uma população podem super ou subestimar a idade em outra (etnia, nutrição, nível socioeconômico).","Os terceiros molares variam muito e podem estar ausentes ou impactados; a impactação pode atrasar o desenvolvimento.","Mimetismo etário: as estimativas pontuais tendem para a idade média da amostra de referência.","Para limites legais de idade, use o conceito de idade mínima (menor idade em que o estágio foi observado) para não declarar um menor como adulto.","Combine sempre achados dentais, esqueléticos e físicos (AGFAD).","Um resultado dental apoia uma avaliação de idade; não prova uma data de nascimento.","Marcas de mordida mudam rapidamente na pele de vivos e mortos. Documente cedo e repetidamente, antes que coleta de swab ou limpeza alterem a área.","Localização no corpo, posição do corpo e curvatura da superfície descritas","Foto geral mostrando a localização anatômica","Fotos aproximadas com escala ABFO n.º 2 no mesmo plano da lesão","Câmera perpendicular à marca; sem distorção de grande-angular","Fotos seriadas ao longo de dias (vivos: diariamente por vários dias; mortos: em 24–48 h)","Luz alternativa: fotografia UV e infravermelha considerada","Medidas: largura do arco, dimensões da marca, distâncias entre marcas","Descrição escrita: forma, cor, escoriações, contusões, lacerações, possíveis marcas de dentes","Swab de saliva antes da limpeza: técnica de duplo swab (úmido e depois seco)","Swab de controle de uma área de pele não mordida","Swabs secos ao ar, embalados em papel, etiquetados, cadeia de custódia iniciada","Moldagem da pele lesionada (se houver endentações) com material de baixa viscosidade","Excisão de tecido apenas por médico-legista com autorização legal, fixada num anel de suporte","Dentição do suspeito apenas com autorização legal/consentimento: fotos, moldagens, registro de mordida","Comparações feitas às cegas em relação às informações do caso, quando possível","O DNA da saliva é a ligação mais confiável entre uma mordida e uma pessoa. Primeiro o swab, depois o exame.","Limites científicos","A revisão de fundamentos científicos do NIST (2023) concluiu que as três premissas centrais da análise de marcas de mordida não são sustentadas pelos dados:","A dentição anterior humana é única em nível individual.","Essa unicidade é transferida com precisão para a pele humana.","As características podem ser captadas e interpretadas com precisão pelas técnicas de análise.","A pele é elástica e curva; os hematomas se espalham e mudam; a postura no momento da mordida é desconhecida.","Os examinadores frequentemente discordam até sobre se uma lesão é uma mordida humana (PCAST 2016).","Várias condenações injustas foram associadas a depoimentos sobre marcas de mordida.","Use marcas de mordida para documentação, para reconhecer uma possível mordida e para coleta de DNA. Não identifique o autor da mordida apenas pelo padrão.","Laudo pericial","Escreva","O que foi examinado, quando, por quem e com qual método.","Se a lesão é compatível com mordida humana, mordida animal, ou não é mordida / indeterminada.","Limitações: distorção da pele, qualidade das imagens, tempo desde a lesão, fundamento científico.","Remeta aos resultados de DNA para qualquer associação com uma pessoa.","Evite","“Correspondência”, “identificou o autor da mordida”, “certeza odontológica razoável” ou qualquer probabilidade não baseada em dados.","Comparar com um único suspeito sem uma série de outras dentições.","Ler informações do caso que não são necessárias para a questão odontológica.","Afirmação mais forte aceitável sobre uma pessoa: “não pode ser excluída” ou “excluída” – e apenas com raciocínio claro e limitações declaradas.","Os dentes protegem o DNA na polpa e na dentina, mesmo após fogo, sepultamento ou longos intervalos post mortem.","Prefira molares ou pré-molares íntegros e sem restaurações; evite dentes com grandes restaurações ou tratamento de canal.","Registre, fotografe e radiografe o dente antes da amostragem – a extração é destrutiva.","Use luvas e máscara, instrumentos limpos, evite tocar na raiz, embale seco em papel ou tubo estéril.","Swabs de saliva da pele, marcas de mordida ou objetos: técnica de duplo swab, secar ao ar, embalagem de papel.","Etiquete com número do caso, número do dente, data e pessoa; inicie a cadeia de custódia.","A DVI segue o padrão da INTERPOL para que equipes de diferentes países trabalhem com os mesmos formulários e regras de qualidade.","Quatro fases","Local: recuperação de corpos e fragmentos, numeração e documentação da localização.","Post mortem: exame no necrotério (formulários PM rosa; seção dental F1/F2).","Ante mortem: coleta de registros de pessoas desaparecidas (formulários AM amarelos).","Reconciliação: comparação e confirmação por uma comissão de identificação.","Tarefas da equipe odontológica","Trabalhe em pares: um examinador, um anotador; uma segunda equipe verifica cada odontograma.","Registre com numeração FDI e códigos INTERPOL; radiografe e fotografe cada caso.","Insira os dados no software DVI (ex.: DVI System International / Plass Data) para busca.","Nunca altere um odontograma PM depois que os dados AM forem conhecidos; registre correções como novas entradas.","O software sugere candidatos; a identificação é decidida pelos peritos, geralmente com um segundo identificador primário quando disponível.","Dentes decíduos – erupção (meses)","Superior","Inferior","Dentes permanentes – erupção (anos)","A formação completa da raiz ocorre cerca de 2–3 anos após a erupção (caninos e molares mais tempo).","Meninas costumam estar um pouco adiantadas em relação aos meninos; as populações diferem.","A erupção é mais variável que a mineralização; para estimar a idade prefira os estágios radiográficos de desenvolvimento.","Extraoral: face, lábios, lesões periorais fotografadas","Acesso à boca (rigidez, decomposição); ressecção mandibular apenas com autorização legal","Tecidos moles: mucosa, freios, língua, palato, piercings, tatuagens","Maxilares: fraturas, áreas edêntulas, cicatrização de alvéolos, patologia","Cada dente registrado (FDI), incluindo faces, materiais e anomalias","Oclusão, desgaste, manchas, rotações, diastemas","Próteses removidas, fotografadas e verificadas quanto a nomes ou números","Radiografias e fotografias feitas; segundo examinador verificou o odontograma","A identificação odontológica compara os achados post mortem (PM) com os registros ante mortem (AM) de uma pessoa desaparecida. É um dos identificadores primários reconhecidos pela INTERPOL, junto com impressões digitais e DNA.","Fontes AM","Odontograma e anotações de tratamento, incluindo registros de cobrança (que mostram datas e dentes tratados).","Radiografias: OPG, periapicais, interproximais, TCFC. Peça sempre o original ou uma exportação digital em resolução total.","Fotografias, escaneamentos intraorais, modelos de estudo, registros ortodônticos.","Fotos sorrindo da família ou das redes sociais (úteis para os dentes anteriores).","Procedimento","Registre completamente a dentição PM antes de comparar (evite viés).","Faça radiografias PM que correspondam às projeções AM (ângulo, área, tipo de filme).","Compare restaurações, tratamentos de canal, morfologia radicular, contorno do seio, padrão trabecular e anomalias.","Classifique cada diferença como explicável (tratamento após os registros AM) ou inexplicável.","Escala de conclusão (INTERPOL/ABFO): estabelecida/positiva · provável · possível · insuficiente · excluída. Uma única discrepância inexplicável pode excluir; não existe número mínimo fixo de pontos concordantes.","Documente cada lesão com localização, tamanho, forma, cor e uma escala ABFO n.º 2.","Lábios e freios: lacerações causadas pelos dentes por trás deles indicam força contundente na boca.","Fraturas dos maxilares: mandíbula (côndilo, ângulo, sínfise) e terço médio da face (Le Fort I–III, zigoma).","Regra da aba do chapéu: lesões acima da linha da aba do chapéu sugerem golpes e não uma simples queda.","Anote lesões antigas e novas separadamente; peça registros odontológicos anteriores.","Um laudo forense deve permitir ao leitor ver o que foi encontrado e, separadamente, o que o perito conclui disso.","Observação","Interpretação","Dente 21 ausente, alvéolo aberto com bordas nítidas, sem cicatrização óssea.","Compatível com perda dental post mortem.","Terceiro molar 38 no estágio H de Demirjian.","Idade mínima 18,2 anos (estudo de referência X).","Padrão curvo de hematomas, 35 mm de largura, no antebraço.","Compatível com mordida humana; não adequado para identificar uma pessoa.","Use palavras neutras e mensuráveis para os achados (tamanho, cor, localização).","Use termos graduados para interpretações: “compatível com”, “típico de”, “exclui”.","Cite explicações alternativas e os limites do método.","Fique dentro da sua área; deixe a causa da morte e o julgamento jurídico para outros.","Estágios da decomposição: fresco, enfisematoso, decomposição ativa, decomposição avançada, esqueletização; a velocidade depende de temperatura, umidade, insetos e sepultamento.","Dentes unirradiculares costumam se perder post mortem; procure alvéolos vazios com bordas nítidas (sem cicatrização).","“Dentes rosados” são um fenômeno post mortem (hemoglobina na dentina) e não indicam a causa da morte.","Restos queimados: os dentes ficam frágeis e mudam de cor; fotografe in situ, estabilize antes de mover, mantenha os fragmentos juntos.","Verifique se os dentes são humanos e separe restos misturados pela oclusão, desgaste e desenvolvimento.","Descreva a lesão com precisão: fratura de coroa ou raiz, luxação, avulsão, fratura alveolar, lesão de tecidos moles.","Reação vital (sangramento, edema, inflamação) sugere lesão em vida.","Fraturas perimortem em osso fresco têm bordas nítidas e da mesma cor; quebras post mortem em osso seco são mais claras e irregulares.","Força contundente na face causa muitas vezes fraturas dos incisivos superiores junto com lacerações labiais.","Considere quedas, agressão, acidentes, convulsões e procedimentos médicos (ex.: intubação) como causas.","Relate o que é visto; diga se os achados são compatíveis com um mecanismo proposto e cite outras causas possíveis.","Verificação por dois examinadores","Nome do examinador 2","Concordância","{1} dentes diferem. Verifiquem juntos e escolham o achado correto.","Manter examinador 1","Usar examinador 2","P(≥18) é a probabilidade de que uma pessoa com este estágio tenha pelo menos 18 anos, a partir da média e do desvio padrão (DP) do seu estudo de referência, supondo distribuição normal. Informe os valores de DP na etapa 4 para vê-la.","Sobreposição radiográfica AM/PM","Verificação de adulteração","Cadeia de custódia: {1} registros, cada um selado com uma impressão digital SHA-256; nenhum registro foi alterado.","Verificado de forma independente por {1}: concordância em {2} de {3} dentes; diferenças em aberto: {4}.","Probabilidade de ter pelo menos 18 anos (a partir da média e do DP de referência): ","Pessoa desaparecida sem nome","Melhor candidato para cada cadáver","Melhor candidato","Candidatos para","Classificação: primeiro sem discrepâncias inexplicáveis, depois as características concordantes mais distintivas. Uma classificação é uma pista, não uma identificação: confirme com radiografias.","Comparar em detalhe","Toque novamente: copiar este registro AM para o caso do cadáver","Arraste a imagem para mover a radiografia AM. Use os controles deslizantes para ajustar tamanho e ângulo.","Transparência AM","Tamanho AM","Rotação AM","Espelhar AM","Visão de diferença","Adicionar marcadores","Limpar marcadores","Redefinir","Visão de diferença: áreas que coincidem ficam escuras, diferenças permanecem claras.","Salvar sobreposição no caso","A impressão digital muda se qualquer conteúdo do laudo mudar.","Verificado de forma independente por {1}: concordância em todos os {2} dentes registrados por ambos.","Atenção: o registro {1} da cadeia de custódia foi alterado depois de ser gravado.","Transparência","Tamanho","AM espelhado","Marcadores","Salvando…","Salvo. Está em Registro do caso → Fotos e radiografias e aparecerá no laudo em PDF.","Não foi possível salvar a sobreposição. Tente novamente.","Toque na imagem para colocar um marcador numerado num ponto correspondente.","segundo examinador","Cadáver sem nome","primário","Aviso legal","Política de privacidade","Termos de uso","Informações legais","Este texto está disponível em alemão e inglês. Prevalece a versão alemã.","Ao criar uma conta, você aceita os termos de uso. A política de privacidade explica como seus dados são tratados."],"tr":["Adli odontoloji araç seti","Ayarlar","Mevcut vaka","Yen kül; mezial tüberkül sırtı distalden kısa","1, dişlenmenin en uzun kökü","En uzun diş. Belirgin labial sırt. Distal kontur daha konveks.","Tüberkül ucu ortaya yakın geniş kron; mezial ve distal konturlar kökün ötesine taşar. Alt kaninler daha dardır ve mezial konturları düz bir şekilde köke devam eder.","Mezial tüberkül sırtı distalden kısa; distal temas alanı daha servikalde; kök ucu distale kavisli.","2: bukkal palatinalden büyük","Genellikle 2 (bukkal ve palatinal)","Kron ve kökte mezial konkavite. Bukkal tüberkül ucu hafif distalde.","İki iyi gelişmiş tüberkül ve genellikle iki kök. Alt birinci premolarda bir baskın bukkal tüberkül, çok küçük bir lingual tüberkül ve bir kök vardır.","Kron ve kökün mezial konkavitesi (kanin fossası tarafı); bukkal tüberkül ucu hafif distalde.","Neredeyse eşit büyüklükte 2","Genellikle 1","1 veya 2","Birinci premolardan daha simetrik; belirgin mezial konkavite yok.","Neredeyse eşit yükseklikte iki tüberkül, oval okluzal kontur. Alt ikinci premolarlar daha yuvarlak veya kare olup kron linguale eğimlidir.","Bukkal tüberkül ucu hafif mezialde; palatinal tüberkül ucu meziale kaymış.","4 (meziopalatinal en büyük), sıklıkla Carabelli tüberkülü","3 (meziobukkal, distobukkal, palatinal)","3–4 (ikinci meziobukkal kanal sık görülür)","En büyük üst diş. Meziopalatinal tüberkülden distobukkal tüberküle oblik sırt. Eşkenar dörtgen okluzal kontur.","Üç kök (iki bukkal, bir palatinal), eşkenar dörtgen kron, oblik sırt. Alt birinci molarların iki kökü (mezial ve distal) ve dikdörtgen kronu vardır.","Meziopalatinal tüberkül en büyüğüdür; Carabelli tüberkülü meziopalatinaldedir; meziobukkal kök distobukkalden geniştir.","4, distopalatinal tüberkül küçük veya yok","3, sıklıkla birbirine yakın veya kaynaşmış","Birinci molardan küçük ve daha kalp şeklinde; Carabelli tüberkülü yok.","Üç kök (sıklıkla birbirine yakın), kalp şeklinde kron. Alt ikinci molarların iki kökü ve haç şeklinde fissür düzeni vardır.","Distopalatinal tüberkül küçülmüş; kökler distale eğimli.","Değişken, sıklıkla 3","Değişken, sıklıkla kaynaşmış","Değişken","17–21 (sıklıkla gömülü)","Şekli ve konumu çok değişkendir. Gelişim evreleri yaş tahmininde kullanılır.","Küçük, sıklıkla üçgen kron; kökler genellikle tek bir koni hâlinde kaynaşmış.","Sıklıkla güvenilmez; kalan palatinal ve mezial özellikleri ve kök eğimini (distal) kullanın.","İnsizal kenar, kron simetrik","1, meziodistal yönde yassı","1, bazen 2 (labial ve lingual)","Dişlenmenin en küçük dişi. Mezial ve distal yarılar neredeyse ayna görüntüsü.","Dar, simetrik kron (yaklaşık 5 mm); kök meziodistal yönde belirgin yassı ve iki yanında oluklar var.","Zor. Distal kök oluğu sıklıkla daha derindir; insizal kenar distale doğru aşınabilir. Taraf çoğu zaman güvenilir şekilde belirlenemez.","İnsizal kenar, distal açı daha yuvarlak","1, bazen 2","Santralden biraz büyük; kron distale dönmüş görünür.","Dar kron, yassı kök; alt santralden biraz büyük.","Kron distale dönmüş görünür: disto-insizal açı daha yuvarlak ve daha lingualdedir.","1 tüberkül, ucu sıklıkla hafif mezialde","1, ara sıra çatallı","Üst kaninden dar; mezial kron konturu kökle neredeyse düz.","Daha dar kron, mezial kontur düz şekilde köke devam eder, düz lingual yüzey.","Tüberkül ucu mezialde; mezial tüberkül sırtı kısa; mezial kontur düz, distal kontur konveks.","Büyük bukkal tüberkül, küçük lingual tüberkül","Bukkalden bakıldığında kanine benzer. Lingual tüberkül çok küçük.","Baskın bukkal tüberkül, çok küçük lingual tüberkül, kron linguale eğimli, bir kök.","Meziolingual oluk sıklıkla vardır; mezial marjinal sırt distalden alçak; mezial bukkal tüberkül sırtı kısa.","2 veya 3 (Y, H veya U şeklinde fissür düzeni)","Lingual tüberküller birinci premolardan daha gelişmiş.","İki veya üç tüberkül, yuvarlak veya kare okluzal kontur, bir kök, kron linguale eğimli.","Üç tüberküllü formda meziolingual tüberkül distolingualden büyüktür.","5 (3 bukkal, 2 lingual)","2 (mezial ve distal)","3 (2 mezial, 1 distal), bazen 4","En büyük alt diş. Y şek arında Alman Ceza Muhakemesi Kanunu’nun 81a maddesine göre mahkeme kararı gerekir, çünkü röntgenlerin tıbbi endikasyonu yoktur.","Avusturya: ceza davalarında inceleme, mahkeme onayına dayanarak savcılık tarafından istenir (Avusturya Ceza Muhakemesi Kanunu madde 123). Tıbbi endikasyonu olmayan röntgenlerin karara dahil olduğunu kontrol edin.","İsviçre: ceza yargılamasında inceleme savcılık veya çocuk mahkemesi tarafından istenir (İsviçre Ceza Muhakemesi Kanunu md. 251); iltica vakaları İltica Kanunu’na tabidir. Yazılı kararın röntgenleri kapsadığından emin olun.","Tıbbi endikasyonu olmayan röntgenlerden önce ülkenizin hangi hukuki dayanağı gerektirdiğini kontrol edin (örneğin mahkeme kararı veya yazılı aydınlatılmış onam) ve bunu Ayarlar → Mahkemenin ülkesi altına girin.","Mahkemenin ülkesi","Almanya","Avusturya","İsviçre","Diğer ülke","Kendi hukuki dayanağınız (isteğe bağlı, yukarıdaki metnin yerine geçer)","örn. … sayılı … maddesine göre mahkeme kararı","Yaş tahmini kontrol listesinde ve raporda kullanılır. Kanunlar değişir: her zaman güncel hukuki durumu kontrol edin.","Pakistan","Pakistan: 2018 Çocuk Adalet Sistemi Kanunu’nun 8. bölümüne göre yaş, doğum veya okul belgelerinden alınır; bunlar yoksa bir sağlık görevlisinin tıbbi muayene raporuyla belirlenebilir. Mahkeme yaş hakkındaki kararını kaydeder. Kararın röntgenleri kapsayıp kapsamadığını kontrol edin.","Hindistan","Hindistan: 2015 Çocuk Adaleti (Çocukların Bakımı ve Korunması) Kanunu’nun 94. bölümüne göre okul belgesi veya doğum belgesi önceliklidir; ikisi de yoksa ancak Juvenile Justice Board veya Child Welfare Committee kararıyla kemikleşme testi veya başka tıbbi yaş testi yapılabilir. Sanığın tıbbi muayenesi: Bharatiya Nagarik Suraksha Sanhita 2023, bölüm 51.","ABD","ABD: kurallar eyaletten eyalete değişir. Zorunlu beden muayenesi genellikle arama emri veya mahkeme kararı ya da aydınlatılmış onam gerektirir (Dördüncü Değişiklik). Göçmenlik gözetimindeki refakatsiz küçükler için yaş 8 U.S.C. § 1232(b)(4) ve 45 CFR § 410.1702’ye göre belirlenir: tüm deliller değerlendirilir ve röntgenler tek dayanak olamaz.","Avustralya","Avustralya (federal suçlar): 1914 Suçlar Kanunu Kısım IAA’ya göre (s 3ZQA ve devamı) yaş belirleme işlemi (şu anda el-bilek röntgeni) gerekli onayları veya bir sulh hâkiminin kararını gerektirir. Eyalet ve bölgelerin kendi kuralları vardır.","Suudi Arabistan","Suudi Arabistan: Çocuklar Kanunu’nun 3. maddesine göre (Kraliyet Kararnamesi M/113, 1439 H) yaş resmî bir belgeden hesaplanır; mahkeme yaşın tahmini için çocuğu yetkili sağlık kurumuna sevk edebilir.","BAE","BAE: çocuk vakaları suça sürüklenen çocuklara ilişkin federal kanuna tabidir (2022 tarihli 6 sayılı Federal Kanun). Resmî belge yoksa mahkeme veya savcılık yaşı tahmin etmesi için bir tıbbi bilirkişi atayabilir. Vakanız için tam maddeyi kontrol edin.","Katar","Katar: ceza davalarında tıbbi muayeneler savcılık veya mahkeme tarafından istenir (Ceza Muhakemesi Kanunu, 2004 tarihli 23 sayılı Kanun); çocuk vakaları Çocuklar Kanunu’na tabidir (1994 tarihli 1 sayılı Kanun). Vakanız için tam maddeyi kontrol edin.","Çin","Çin: Ceza Muhakemesi Kanunu’nun (2018) 132. maddesine göre şüphelinin beden muayenesi gerekirse zorla yapılabilir; 146. madde bilirkişi incelemesini düzenler. Savcılar küçük şüphelilerin yaşını doğrulamalıdır (Yüksek Halk Savcılığı ve Kamu Güvenliği Bakanlığı’nın 2026 kuralları).","Japonya","Japonya: şüphelinin beden muayenesi bir hâkim tarafından verilen beden muayenesi emrini gerektirir (Ceza Muhakemesi Kanunu md. 218); bedeni içeren bilirkişi incelemesi, bilirkişi işlemleri için hâkim iznini gerektirir (md. 225 ile md. 168).","London Atlas (AlQahtani ve ark. 2010): en uygun kategori {1} yaş, yani tahmini yaş {2}–{3} yıl. Atlas yöntemleri minimum yaş değil, tahmin verir.","London Atlas (tüm dişlenme)","OPG’deki tüm gelişmekte olan dişleri London Atlas of Human Tooth Development and Eruption (AlQahtani ve ark. 2010) ile karşılaştırın ve en uygun yaş kategorisini seçin. Dişler hâlâ gelişirken (çocuklar ve ergenler) en yararlıdır. Minimum yaş değil, tahmini yaş verir; 18 yaş eşiği için yukarıdaki üçüncü molar yöntemlerini kullanın.","En uygun atlas kategorisi (yıl)","kullanılmadı",null,"14, 18 ve 21 yaygın yasal yaş sınırlarıdır (Almanya’da: cezai sorumluluk, yetişkin, genç yetişkin); ülkenizde geçerli sınırları kontrol edin. “Kanıtlanmadı”, kişinin daha genç olduğu anlamına gelmez.","London Atlas’ı aç (ücretsiz PDF)","Etkileşimli atlas yazılımı","Atlası OPG’nin yanında açın (bölünmüş ekran veya ikinci cihazda atlas).","Her gelişmekte olan diş için kron ve kökün ne kadar oluştuğuna ve dişin alveol kemiğine göre nerede durduğuna bakın.","Beklenen yaşa en yakın çizimden başlayın, sonra bir yaş küçüğünü ve bir yaş büyüğünü kontrol edin.","En çok dişin uyduğu çizimi seçin ve aşağıdan işaretleyin.","1 yaş altı: atlasta ayrıca rahim içi 30. haftadan 10,5 aya kadar kategoriler vardır; bunları “Diğer bulgular” altına yazın. Atlas eğitim ve bireysel kullanım için ücretsizdir (© AlQahtani, Queen Mary University of London); görselleri bu uygulamaya kopyalanmamıştır.","Lisanslar ve emeği geçenler","Üçüncü taraf yazılım, yazı tipleri ve yöntemler","Tüm hakları saklıdır.","Bu uygulamada kullanılan yazılım",null,"Giriş ve hesap","MIT Lisansı metnini göster","Yazı tipleri","Yöntemler ve kaynaklar (alıntılanmış, kopyalanmamış)","ve ark.","diş mineralizasyon evreleri","üçüncü molar sürme evreleri ve periodontal ligament görünürlüğü","adli yaş tahmini önerileri","yalnızca dış bağlantı; © Queen Mary University of London",null,"formlar ve kılavuz (2023)","bulgu kodları (2022)","Yaş tahmini için referans değerler sizin girdiğiniz çalışmadan gelir. Yöntemler bu uygulamanın kendi sözleriyle anlatılmıştır.","IBM Plex Sans ve IBM Plex Mono alt kümeleri, lisansın gerektirdiği şekilde yeniden adlandırılmış","Saklı Yazı Tipi Adı","Yazı tipleri uygulamayla birlikte saklanır; Google’a yazı tipi isteği gitmez. Tam lisans: uygulamanın yanındaki fonts-OFL.txt.","Daimi dişler için tipik ders kitabı değerleri. Ölçüler Wheeler’s Dental Anatomy’ye göre ortalama değerlerdir. Bireysel ve popülasyon farklılıkları yaygındır.","Karşılaştırma, yaş tahmini, vaka kaydı, PDF rapor ve diş anatomisinin kilidini açın.","Resimlerim ve görsellerim","Diş anatomisi: üst/alt ve sağ/sol özellikleri","ortalama diş boyutları","Vaka","Karşılaştır","Vaka bilgilerini girin","AM kaydını işaretleyin","PM bulgularını işaretleyin","AM ve PM’yi karşılaştırın","Raporu yazın","PDF raporu oluşturun","Adli odontoloji","Ceset","Henüz vaka bilgisi yok","Diş şemasını aç","diş işaretlendi","Karşılaştırma","ayırt edici","Başlanmadı","delil zinciri kaydı","Sonuç yazıldı","Henüz sonuç yok","Kılavuzlar ve kontrol listeleri","Üst mü alt mı, sağ mı sol mu: her diş için tanımlama özellikleri","Bu vakayı sil","DVI eşleştirme: her ceset her kayıp kişiyle","Röntgen karşılaştırması: AM ve PM röntgenlerini üst üste koyma","Yabancı diş kayıtları: numaralandırma sistemleri ve terimler","Araçlar","DVI eşleştirme","Her ceset için kayıp kişileri sırala","Röntgen karşılaştırması","AM ve PM röntgenlerini üst üste koy","Yabancı diş kayıtları","Diş numaraları ve terimler","Bilirkişi 1","Bilirkişi 2","INTERPOL iki odontolog önerir. Bilirkişi 2 aynı dişleri bağımsız olarak işaretler; farklar aşağıda listelenir.","Belge parmak izi (SHA-256): ","Eşleştirme","Afet kurbanlarının kimlik tespiti","Her cesedi (PM) ve her kayıp kişiyi (AM) ayrı kayıt olarak ekleyip şemasını doldurun. Sonraki adım her cesedi tüm kayıp kişilerle karşılaştırır ve adayları sıralar.","Ceset ekle (PM)","Kayıp kişi ekle (AM)","Cesetler","Henüz ceset yok.","Kayıp kişiler","Henüz kayıp kişi yok.","Önce en az bir ceset (PM) ve bir kayıp kişi (AM) işaretleyin.","Resimleri seç","Üst üste koyma","İki resmi seçin","Temel olarak post mortem röntgeni, üstüne konacak olarak ante mortem röntgeni seçin. Resimler Vaka kaydı → Fotoğraflar ve röntgenler’den gelir.","Bu vakada henüz resim yok.","Fotoğraf ve röntgen ekle","Önce 1. adımda bir PM ve bir AM resmi seçin.","Diş numaraları","Diş hekimliği terimleri","Diş numaralarını dönüştür","Yabancı kayıtlar sıklıkla başka bir numaralandırma sistemi kullanır. FDI numarasını bulmak için numarayı kayıtta yazıldığı gibi girin.","Kayıttaki sistem","Universal (ABD, 1–32 / A–T)","Palmer (Birleşik Krallık, Commonwealth)","Haderup (İskandinavya, eski kayıtlar)","Yazıldığı gibi diş","örn. 3, 6┘, 6+, 46","Süt dişleri","Palmer simgeleri: ┘ sağ üst, └ sol üst, ┐ sağ alt, ┌ sol alt. Haderup: + üst, − alt.","Diğer dillerde diş hekimliği terimleri","Yaygın şema terimlerinin anlamını görmek için AM kaydının dilini seçin.","Kaydın dili","Yüzeyler genellikle baş harfleriyle kısaltılır (M, O, D, B/V, L/P, I); harfler dile göre değişir, örneğin Fransızca ve İspanyolcada vestibüler için V.","Uyarı işaretleri","Henüz yürümeyen bir bebekte yırtık üst dudak frenulumu.","4 yaş altı çocuklarda gövde, kulak veya boyun, frenulum, çene açısı, yanaklar, göz kapakları veya subkonjonktivada morluklar; 4,99 aydan küçük bebeklerde herhangi bir morluk; veya desenli morluklar (TEN-4-FACESp).","Farklı yaşlarda yaralanmalar, yaralanmaya veya çocuğun gelişimine uymayan açıklamalar, tedaviye başvurmada gecikme.","Dental ihmal: bilgi ve tedaviye erişim olmasına rağmen tedavi edilmemiş çürükler, ağrı veya enfeksiyon.","Almanya’da bildirim","Bulguları fotoğraflarla ve verilen açıklamayla (bakım verenin kendi sözleriyle) dikkatle belgeleyin.","§ 4 KKG: diş hekimleri durumu ebeveynlerle konuşabilir ve takma adlandırılmış verilerle deneyimli bir çocuk koruma uzmanından (insoweit erfahrene Fachkraft) danışmanlık alabilir.","Çocuk için risk sürerse gençlik refahı dairesini (Jugendamt) bilgilendirebilirler; akut tehlikede polise başvurun.","Profesyoneller için tıbbi çocuk koruma yardım hattı: 0800 19 210 00 (ücretsiz, 7/24).","İstismarı kanıtlamanız gerekmez. Şüpheleri tanıyın, belgeleyin ve uygun kanallarla iletin.","Çocuklar (gelişmekte olan dişlenme)","En doğru dönem: birçok diş aynı anda gelişir.","Yöntemler: London Atlas, Demirjian, Willems (modifiye Demirjian), Cameriere açık apeksler, Ubelaker.","Tipik hata yaklaşık ±1 yıl, geç çocuklukta daha büyük.","Ergenler ve genç yetişkinler","Üçüncü molarlar sıklıkla gelişmekte olan tek dişlerdir: mineralizasyon (Demirjian), sürme ve PDL görünürlüğü (Olze).","El röntgeni ve gerekirse klavikula BT ile birleştirin (AGFAD). Yasal eşikler için minimum yaş bildirin.","Yetişkinler","Gerileyici değişiklikler: sekonder dentin (pulpa/diş oranı, Kvaal; Cameriere kanin), kök translüsensisi (Lamendin), periodontal çekilme, atrizyon.","Laboratuvar yöntemleri: aspartik asit rasemizasyonu, diş semento halkaları.","Hatalar sıklıkla ±5–10 yıl; tek bir sayı değil, yaş aralığı verin.","Her yöntemin bir dağılımı vardır; referans çalışmayı, popülasyonunu, cinsiyeti ve kullanılan istatistiksel aralığı bildirin.","Bir popülasyonun referans verileri başka bir popülasyonda yaşı fazla veya az tahmin edebilir (etnik köken, beslenme, sosyoekonomik durum).","Üçüncü molarlar çok değişkendir, eksik veya gömülü olabilir; gömülülük gelişimi geciktirebilir.","Yaş taklidi: nokta tahminleri referans örneklemin ortalama yaşına doğru kayar.","Yasal yaş eşikleri için, bir küçüğü yetişkin ilan etmemek adına minimum yaş kavramını (evrenin görüldüğü en küçük yaş) kullanın.","Diş, iskelet ve fizik bulgularını her zaman birleştirin (AGFAD).","Diş sonucu yaş değerlendirmesini destekler; bir doğum tarihini kanıtlamaz.","Isırık izleri canlı ve ölü deride hızla değişir. Sürüntü almak veya temizlemek bölgeyi bozmadan önce erken ve tekrar tekrar belgeleyin.","Vücuttaki konum, vücut pozisyonu ve yüzey eğriliği tanımlandı","Anatomik konumu gösteren genel fotoğraf","Yaralanmayla aynı düzlemde ABFO No. 2 ölçekli yakın çekimler","Kamera ize dik; geniş açı distorsiyonu yok","Günler boyunca seri fotoğraflar (canlı: birkaç gün boyunca her gün; ölü: 24–48 saat içinde)","Alternatif ışık: UV ve kızılötesi fotoğraf değerlendirildi","Ölçüler: ark genişliği, iz boyutları, izler arası mesafeler","Yazılı tanım: şekil, renk, sıyrıklar, kontüzyonlar, laserasyonlar, olası diş izleri","Temizlemeden önce tükürük sürüntüsü: çift sürüntü tekniği (önce nemli, sonra kuru)","Isırılmamış bir deri bölgesinden kontrol sürüntüsü","Sürüntüler havada kurutuldu, kâğıda paketlendi, etiketlendi, delil zinciri başlatıldı","Yaralı derinin ölçüsü (girintiler varsa) düşük viskoziteli materyalle","Doku eksizyonu yalnızca yasal yetkiye sahip adli tıp uzmanınca, destek halkasına sabitlenerek","Şüphelinin dişleri yalnızca yasal yetki/onamla: fotoğraflar, ölçüler, kapanış kaydı","Mümkünse karşılaştırmalar vaka bilgilerine kör olarak yapıldı","Tükürükten DNA, bir ısırık ile kişi arasındaki en güvenilir bağdır. Önce sürüntü, sonra inceleme.","Bilimsel sınırlar","NIST bilimsel temel incelemesi (2023), ısırık izi analizinin üç temel öncülünün verilerle desteklenmediğini buldu:","İnsan ön dişleri bireysel düzeyde benzersizdir.","Bu benzersizlik insan derisine doğru şekilde aktarılır.","Özellikler analiz teknikleriyle doğru şekilde yakalanıp yorumlanabilir.","Deri elastik ve kavislidir; morluklar yayılır ve değişir; ısırma anındaki duruş bilinmez.","Bilirkişiler bir yaralanmanın insan ısırığı olup olmadığı konusunda bile sıklıkla anlaşamaz (PCAST 2016).","Birçok haksız mahkûmiyet ısırık izi tanıklığıyla ilişkilendirilmiştir.","Isırık izlerini belgeleme, olası bir ısırığı tanıma ve DNA örneklemesi için kullanın. Isıranı yalnızca desene bakarak tanımlamayın.","Bilirkişi raporu","Yazın","Neyin, ne zaman, kim tarafından ve hangi yöntemle incelendiği.","Yaralanmanın insan ısırığı, hayvan ısırığı ile uyumlu olup olmadığı veya ısırık olmadığı / belirsiz olduğu.","Sınırlamalar: deri distorsiyonu, görüntü kalitesi, yaralanmadan bu yana geçen süre, bilimsel temel.","Bir kişiyle herhangi bir ilişki için DNA sonuçlarına atıf yapın.","Kaçının","“Eşleşme”, “ısıranı tanımladı”, “makul dental kesinlik” veya verilere dayanmayan herhangi bir olasılık.","Başka dişlenmelerden oluşan bir dizi olmadan tek bir şüpheliyle karşılaştırma.","Dental soru için gerekmeyen vaka bilgilerini okumak.","Bir kişi hakkında kabul edilebilir en güçlü ifade: “dışlanamaz” veya “dışlandı” – ve yalnızca açık gerekçe ve belirtilen sınırlamalarla.","Dişler yangın, gömülme veya uzun post mortem sürelerden sonra bile pulpa ve dentindeki DNA’yı korur.","Sağlam, restorasyonsuz molar veya premolarları tercih edin; büyük dolgulu veya kanal tedavili dişlerden kaçının.","Örneklemeden önce dişi işaretleyin, fotoğraflayın ve röntgenini çekin – çekim yıkıcıdır.","Eldiven ve maske takın, temiz alet kullanın, köke dokunmayın, kuru olarak kâğıda veya steril tüpe paketleyin.","Deriden, ısırık izlerinden veya nesnelerden tükürük sürüntüleri: çift sürüntü tekniği, havada kurutma, kâğıt ambalaj.","Vaka numarası, diş numarası, tarih ve kişiyle etiketleyin; delil zincirini başlatın.","DVI, farklı ülkelerden ekiplerin aynı formlar ve kalite kurallarıyla çalışması için INTERPOL standardını izler.","Dört aşama","Olay yeri: cesetlerin ve parçaların çıkarılması, numaralandırılması ve konumun belgelenmesi.","Post mortem: morgda inceleme (pembe PM formları; dental bölüm F1/F2).","Ante mortem: kayıp kişilerin kayıtlarının toplanması (sarı AM formları).","Uzlaştırma: bir kimlik tespit kurulu tarafından karşılaştırma ve onay.","Dental ekibin görevleri","Çift çalışın: bir inceleyen, bir kaydeden; ikinci bir ekip her şemayı kontrol eder.","FDI numaralandırma ve INTERPOL kodlarıyla işaretleyin; her vakanın röntgenini ve fotoğrafını çekin.","Arama için verileri DVI yazılımına girin (örn. DVI System International / Plass Data).","AM verileri öğrenildikten sonra PM şemasını asla değiştirmeyin; düzeltmeleri yeni kayıt olarak girin.","Yazılım aday önerir; kimlik tespitine bilirkişiler karar verir, mümkünse genellikle ikinci bir birincil tanımlayıcıyla.","Süt dişleri – sürme (ay)","Üst","Alt","Daimi dişler – sürme (yıl)","Kök tamamlanması sürmeden yaklaşık 2–3 yıl sonradır (kaninler ve molarlar daha uzun).","Kızlar genellikle erkeklerden biraz öndedir; popülasyonlar farklıdır.","Sürme mineralizasyondan daha değişkendir; yaş tahmini için radyografik gelişim evrelerini tercih edin.","Ağız dışı: yüz, dudaklar, perioral yaralanmalar fotoğraflandı","Ağza erişim (rigor, çürüme); çene rezeksiyonu yalnızca yasal yetkiyle","Yumuşak dokular: mukoza, frenulumlar, dil, damak, piercingler, dövmeler","Çeneler: kırıklar, dişsiz alanlar, soket iyileşmesi, patoloji","Her diş işaretlendi (FDI), yüzeyler, materyaller ve anomaliler dahil","Okluzyon, aşınma, renklenme, rotasyonlar, diastemalar","Protezler çıkarıldı, fotoğraflandı ve isim veya numara açısından kontrol edildi","Röntgen ve fotoğraflar çekildi; ikinci bilirkişi şemayı kontrol etti","Diş ile kimlik tespiti, post mortem (PM) bulguları kayıp bir kişinin ante mortem (AM) kayıtlarıyla karşılaştırır. Parmak izi ve DNA ile birlikte INTERPOL tarafından tanınan birincil tanımlayıcılardan biridir.","AM kaynakları","Diş şeması ve tedavi notları, fatura kayıtları dahil (tarihleri ve tedavi edilen dişleri gösterir).","Röntgenler: OPG, periapikal, bitewing, KIBT. Her zaman orijinali veya tam çözünürlüklü dijital dışa aktarımı isteyin.","Fotoğraflar, ağız içi taramalar, çalışma modelleri, ortodonti kayıtları.","Aileden veya sosyal medyadan gülümseme fotoğrafları (ön dişler için yararlı).","İşlem","Karşılaştırmadan önce PM dişlenmeyi eksiksiz işaretleyin (yanlılıktan kaçının).","AM projeksiyonlarına uyan PM röntgenleri çekin (açı, bölge, film tipi).","Restorasyonları, kanal dolgularını, kök morfolojisini, sinüs konturunu, trabeküler deseni ve anomalileri karşılaştırın.","Her farkı açıklanabilir (AM kayıtlarından sonra tedavi) veya açıklanamaz olarak sınıflandırın.","Sonuç ölçeği (INTERPOL/ABFO): kesin/pozitif · olası · mümkün · yetersiz · dışlandı. Tek bir açıklanamayan uyumsuzluk dışlayabilir; sabit bir minimum uyumlu nokta sayısı yoktur.","Her yaralanmayı konum, boyut, şekil, renk ve ABFO No. 2 ölçeğiyle belgeleyin.","Dudaklar ve frenulumlar: arkalarındaki
