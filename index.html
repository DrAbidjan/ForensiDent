ste","Denture temporaire","Denture mixte","Denture permanente","Mâchoires avec dents","Mâchoires sans dents","Dents seules","Fragments","p. ex. classe II, supraclusion, béance","p. ex. perte osseuse, récessions, tartre","p. ex. tabac, tétracycline, teinte A3","Abréviations et codes","Signification des abréviations","Dans l’app","Anglais","Signification","Faces : mésiale, occlusale (incisive I sur les dents antérieures), distale, vestibulaire, linguale / palatine","Dents temporaires (FDI) : quadrants 5–8","Les formulaires DVI d’INTERPOL (2023) utilisent la numérotation FDI et des termes anglais ; ils n’imposent pas de codes en lettres. Sur les formulaires DVI officiels, écrivez les constatations en toutes lettres en anglais. Les codes de l’app se changent dans Réglages → Codes du schéma.","Bridge collé (ailette)","Bridge collé (intermédiaire)","Dent remplacée (prothèse amovible)","Dent absente","Couronne (intacte)","Coiffe radiculaire avec dent remplacée","Intermédiaire sur implants","Dent remplacée sur prothèse implanto-portée","Couronne sur implant","Attache sur implant (boule, barre) avec dent remplacée","Couronne télescope sur implant","Rétention insuffisante","Dent conservable, largement détruite","Dent conservable, défauts partiels","Dent non conservable (à extraire)","Fermeture d’espace","Suffixe w : à renouveler (p. ex. kw, bw)","Codes du schéma","Automatique","Codes allemands si l’app est en allemand, sinon anglais","Abréviations affichées sur les dents, dans la légende et dans le rapport.","Autres constatations (AM)","Autres constatations (PM)","Codes","faces m o d b l · point = caractéristique individuelle (rotation, diastème …) · 55–85 = dents temporaires","faces M O D B L · point = caractéristique individuelle (rotation, diastème …) · 55–85 = dents temporaires","Couleurs : bleu composite, gris amalgame, turquoise CVI, violet céramique, jaune or, orange provisoire, rouge carie.","Dent présente dans les deux ; détails non renseignés dans un des dossiers","Implant AM ; détails PM non renseignés","Reste radiculaire AM, dent présente PM (p. ex. racine restaurée)","type de couronne modifié","dent temporaire AM, dent permanente successive PM","dent permanente AM, dent temporaire PM","appareil orthodontique retiré","appareil orthodontique ajouté","bijou dentaire retiré","bijou dentaire ajouté","scellement perdu","{1} renseigné(e) seulement AM","{1} renseigné(e) seulement PM","rotation","malposition","diastème","anomalie de forme","Constatations identiques (dont {1})","en rotation","malposition / versée","diastème (espace)","bracket / contention orthodontique","bijou dentaire","Présente (détails non renseignés)","saine","Source : liste KZBV des codes de constatation autorisés (plan de traitement électronique, 2022). * Codes courants en cabinet qui ne figurent pas dans la liste KZBV. Les cabinets peuvent utiliser leurs propres variantes ; en cas de doute, demandez au dentiste traitant.","Lire les dossiers AM allemands (codes de constatation)","Implant (dossiers anciens ; aujourd’hui sk, sb, st …)","Dent présente dans les deux","détails non renseignés dans un des dossiers","Implant AM","détails PM non renseignés","Rotation","Malposition","Diastème","Modifier","état PM ; touchez une dent pour voir ou modifier AM et PM","D’après les recommandations du Groupe de travail sur le diagnostic forensique de l’âge (AGFAD). Vérifiez la version actuelle sur le site de l’AGFAD.","En procédure pénale allemande, une ordonnance judiciaire selon l’article 81a du code de procédure pénale allemand est nécessaire, car les radiographies n’ont pas d’indication médicale.","Autriche : en procédure pénale, l’examen est ordonné par le parquet sur autorisation du tribunal (article 123 du code de procédure pénale autrichien). Vérifiez que l’ordonnance couvre les radiographies sans indication médicale.","Suisse : en procédure pénale, l’examen est ordonné par le ministère public ou le tribunal des mineurs (art. 251 du code de procédure pénale suisse) ; les cas d’asile relèvent de la loi sur l’asile. Veillez à ce que l’ordonnance écrite couvre les radiographies.","Vérifiez quelle base légale votre pays exige avant des radiographies sans indication médicale (par exemple une ordonnance judiciaire ou un consentement éclairé écrit), et saisissez-la dans Réglages → Pays du tribunal.","Pays du tribunal","Allemagne","Autriche","Suisse","Autre pays","Votre base légale (facultatif, remplace le texte ci-dessus)","p. ex. ordonnance judiciaire selon … du …","Utilisé dans la liste de contrôle de l’estimation de l’âge et dans le rapport. Les lois changent : vérifiez toujours la situation juridique actuelle.","Pakistan","Pakistan : selon la section 8 du Juvenile Justice System Act 2018, l’âge est établi d’après les actes de naissance ou certificats scolaires ; à défaut, il peut être déterminé par le rapport d’examen d’un médecin. Le tribunal consigne sa conclusion sur l’âge. Vérifiez que l’ordonnance couvre les radiographies.","Inde","Inde : selon la section 94 du Juvenile Justice (Care and Protection of Children) Act 2015, le certificat scolaire ou l’acte de naissance priment ; seulement en leur absence, un test d’ossification ou un autre test médical d’âge peut être réalisé sur ordre du Juvenile Justice Board ou du Child Welfare Committee. Examen médical d’un accusé : section 51 de la Bharatiya Nagarik Suraksha Sanhita 2023.","États-Unis","États-Unis : les règles varient selon l’État. Un examen corporel imposé exige en général un mandat ou une ordonnance judiciaire, ou un consentement éclairé (quatrième amendement). Pour les mineurs non accompagnés en rétention, l’âge est déterminé selon 8 U.S.C. § 1232(b)(4) et 45 CFR § 410.1702 : toutes les preuves sont prises en compte et les radiographies ne peuvent pas être le seul fondement.","Australie","Australie (infractions fédérales) : selon la partie IAA du Crimes Act 1914 (s 3ZQA et suivants), une procédure de détermination de l’âge (actuellement une radiographie de la main et du poignet) exige les consentements requis ou l’ordonnance d’un magistrat. Les États et territoires ont leurs propres règles.","Arabie saoudite","Arabie saoudite : selon l’article 3 de la loi sur les mineurs (décret royal M/113, 1439 H), l’âge est calculé d’après un document officiel ; le tribunal peut adresser le mineur à l’autorité médicale compétente pour estimer son âge.","Émirats arabes unis","Émirats arabes unis : les affaires de mineurs relèvent de la loi fédérale sur les mineurs délinquants (loi fédérale n° 6 de 2022). En l’absence de document officiel, le tribunal ou le parquet peut désigner un expert médical pour estimer l’âge. Vérifiez l’article exact pour votre affaire.","Qatar","Qatar : les examens médicaux en matière pénale sont ordonnés par le parquet ou le tribunal (code de procédure pénale, loi n° 23 de 2004) ; les affaires de mineurs relèvent de la loi sur les mineurs (loi n° 1 de 1994). Vérifiez l’article exact pour votre affaire.","Chine","Chine : selon l’article 132 de la loi de procédure pénale (2018), l’examen corporel d’un suspect peut être imposé si nécessaire ; l’article 146 prévoit l’expertise. Le parquet doit vérifier l’âge des suspects mineurs (règles de 2026 du Parquet populaire suprême et du ministère de la Sécurité publique).","Japon","Japon : l’examen corporel d’un suspect nécessite un mandat d’examen corporel délivré par un juge (article 218 du code de procédure pénale) ; une expertise portant sur le corps nécessite l’autorisation d’un juge pour mesures d’expertise (article 225 avec l’article 168).","London Atlas (AlQahtani et al. 2010) : catégorie la plus proche {1} ans, soit un âge estimé de {2}–{3} ans. Les méthodes d’atlas donnent une estimation, pas un âge minimal.","London Atlas (denture entière)","Comparez toutes les dents en développement sur l’OPG avec le London Atlas of Human Tooth Development and Eruption (AlQahtani et al. 2010) et choisissez la catégorie d’âge la plus proche. Surtout utile tant que les dents se développent (enfants et adolescents). Il donne un âge estimé, pas un âge minimal : pour le seuil de 18 ans, utilisez les méthodes des troisièmes molaires ci-dessus.","Catégorie d’atlas la plus proche (ans)","non utilisé","Moins d’un an : l’atlas comporte aussi des catégories de 30 semaines in utero à 10,5 mois ; notez-les sous « Autres constatations ». Atlas : atlas.dentistry.qmul.ac.uk","14, 18 et 21 ans sont des limites d’âge juridiques courantes (en Allemagne : responsabilité pénale, majorité, jeune adulte) ; vérifiez les limites applicables dans votre pays. « Non prouvé » ne signifie pas que la personne est plus jeune.","Ouvrir le London Atlas (PDF gratuit)","Logiciel interactif de l’atlas","Ouvrez l’atlas à côté de l’OPG (écran partagé ou atlas sur un second appareil).","Pour chaque dent en développement, observez l’avancement de la couronne et de la racine et la position de la dent par rapport à l’os alvéolaire.","Commencez par le schéma le plus proche de l’âge attendu, puis vérifiez un an plus jeune et un an plus âgé.","Choisissez le schéma où le plus de dents correspondent et sélectionnez-le ci-dessous.","Moins d’un an : l’atlas comporte aussi des catégories de 30 semaines in utero à 10,5 mois ; notez-les sous « Autres constatations ». L’atlas est gratuit pour l’enseignement et l’usage individuel (© AlQahtani, Queen Mary University of London) ; ses images ne sont pas copiées dans cette app.","Licences et crédits","Logiciels tiers, polices et méthodes","Tous droits réservés.","Logiciels utilisés dans cette app","Visionneuse 3D des dents, avec chargeurs STL, OBJ, PLY et glTF et OrbitControls","Connexion et compte","Afficher le texte de la licence MIT","Polices","Méthodes et références (citées, non copiées)","et al.","stades de minéralisation dentaire","stades d’éruption des troisièmes molaires et visibilité du ligament parodontal","recommandations pour l’estimation forensique de l’âge","lien externe uniquement ; © Queen Mary University of London","dimensions dentaires moyennes pour les modèles 3D schématiques","formulaires et guide (2023)","codes de constatation (2022)","Les valeurs de référence pour l’estimation de l’âge proviennent de l’étude que vous saisissez vous-même. Les méthodes sont décrites avec les propres mots de l’app.","Sous-ensembles d’IBM Plex Sans et IBM Plex Mono, renommés comme l’exige la licence","nom de police réservé","Les polices sont stockées avec l’app ; aucune requête de police n’est envoyée à Google. Licence complète : fonts-OFL.txt à côté de l’app.","Valeurs classiques des manuels pour les dents permanentes. Les mesures sont des moyennes d’après Wheeler’s Dental Anatomy. Les variations individuelles et populationnelles sont fréquentes.","Débloquez la comparaison, l’estimation de l’âge, le journal, le rapport PDF et l’anatomie dentaire.","Mes images et illustrations","Anatomie dentaire : caractéristiques haut/bas et droite/gauche","dimensions dentaires moyennes","Dossier","Comparer","Saisir les données du dossier","Saisir le dossier AM","Saisir les constatations PM","Comparer AM et PM","Rédiger le rapport","Créer le rapport PDF","Odontologie médico-légale","Corps","Pas encore de données du dossier","Ouvrir le schéma dentaire","dents saisies","Comparaison","distinctives","Pas commencé","entrées de traçabilité","Conclusion rédigée","Pas encore de conclusion","Guides et listes de contrôle","Haut ou bas, droite ou gauche : caractéristiques d’identification de chaque dent","Supprimer ce dossier","Comparaison DVI : chaque corps avec chaque personne disparue","Comparaison radiographique : superposer les radiographies AM et PM","Dossiers dentaires étrangers : systèmes de numérotation et termes","Outils","Comparaison DVI","Classer les personnes disparues pour chaque corps","Comparaison radiographique","Superposer les radiographies AM et PM","Dossiers dentaires étrangers","Numéros des dents et termes","Examinateur 1","Examinateur 2","INTERPOL recommande deux odontologistes. L’examinateur 2 relève les mêmes dents de façon indépendante ; les différences sont listées ci-dessous.","Empreinte du document (SHA-256) : ","Comparaison","Identification des victimes de catastrophes","Ajoutez chaque corps (PM) et chaque personne disparue (AM) comme dossier séparé et saisissez-le. L’étape suivante compare chaque corps avec toutes les personnes disparues et classe les candidats.","Ajouter un corps (PM)","Ajouter une personne disparue (AM)","Corps","Aucun corps pour l’instant.","Personnes disparues","Aucune personne disparue pour l’instant.","Saisissez d’abord au moins un corps (PM) et une personne disparue (AM).","Choisir les images","Superposition","Choisir les deux images","Choisissez la radiographie post-mortem comme base et la radiographie ante-mortem à superposer. Les images proviennent de Journal du dossier → Photos et radiographies.","Aucune image dans ce dossier pour l’instant.","Ajouter des photos et radiographies","Choisissez d’abord une image PM et une image AM à l’étape 1.","Numéros des dents","Termes dentaires","Convertir les numéros des dents","Les dossiers étrangers utilisent souvent un autre système de numérotation. Saisissez le numéro tel qu’il est écrit pour trouver le numéro FDI.","Système du dossier","Universel (États-Unis, 1–32 / A–T)","Palmer (Royaume-Uni, Commonwealth)","Haderup (Scandinavie, anciens dossiers)","Dent telle qu’écrite","p. ex. 3, 6┘, 6+, 46","Dents temporaires","Symboles Palmer : ┘ haut droite, └ haut gauche, ┐ bas droite, ┌ bas gauche. Haderup : + haut, − bas.","Termes dentaires dans d’autres langues","Choisissez la langue du dossier AM pour voir la signification des termes courants.","Langue du dossier","Les faces sont généralement abrégées par leurs initiales (M, O, D, B/V, L/P, I) ; les lettres varient selon la langue, par exemple V pour vestibulaire en français et en espagnol.","Signes d’alerte","Frein de la lèvre supérieure déchiré chez un nourrisson qui ne marche pas encore.","Ecchymoses sur le tronc, les oreilles ou le cou, le frein, l’angle de la mâchoire, les joues, les paupières ou sous-conjonctivales chez l’enfant de moins de 4 ans, toute ecchymose chez le nourrisson de moins de 4,99 mois, ou ecchymoses en forme d’objet (TEN-4-FACESp).","Lésions d’âges différents, explications qui ne correspondent pas à la blessure ou au développement de l’enfant, retard dans la recherche de soins.","Négligence dentaire : caries, douleurs ou infections non traitées malgré la connaissance et l’accès aux soins.","Signalement en Allemagne","Documentez soigneusement les constatations avec des photos et l’explication donnée (dans les propres mots de l’accompagnant).","§ 4 KKG : les dentistes peuvent discuter de la situation avec les parents et demander conseil à un professionnel expérimenté de la protection de l’enfance (insoweit erfahrene Fachkraft) avec des données pseudonymisées.","Si le risque pour l’enfant persiste, ils peuvent informer l’office de protection de la jeunesse (Jugendamt) ; en cas de danger aigu, contactez la police.","Ligne d’assistance médicale de protection de l’enfance pour les professionnels : 0800 19 210 00 (gratuite, 24 h/24).","Vous n’avez pas à prouver la maltraitance. Repérez, documentez et transmettez vos inquiétudes par les voies appropriées.","Enfants (denture en développement)","Période la plus précise : de nombreuses dents se développent en même temps.","Méthodes : London Atlas, Demirjian, Willems (Demirjian modifié), apex ouverts de Cameriere, Ubelaker.","Erreur typique d’environ ±1 an, plus grande à la fin de l’enfance.","Adolescents et jeunes adultes","Les troisièmes molaires sont souvent les seules dents en développement : minéralisation (Demirjian), éruption et visibilité du ligament parodontal (Olze).","À combiner avec la radiographie de la main et, si nécessaire, le scanner des clavicules (AGFAD). Indiquer un âge minimal pour les seuils légaux.","Adultes","Modifications régressives : dentine secondaire (rapport pulpe/dent, Kvaal ; canine de Cameriere), translucidité radiculaire (Lamendin), récession parodontale, attrition.","Méthodes de laboratoire : racémisation de l’acide aspartique, annulation du cément.","Erreurs souvent de ±5–10 ans ; donner une fourchette d’âge, pas un chiffre unique.","Chaque méthode a une dispersion ; indiquez l’étude de référence, sa population, le sexe et l’intervalle statistique utilisé.","Les données de référence d’une population peuvent sur- ou sous-estimer l’âge dans une autre (origine, nutrition, statut socio-économique).","Les troisièmes molaires varient beaucoup et peuvent être absentes ou incluses ; l’inclusion peut retarder le développement.","Mimétisme de l’âge : les estimations ponctuelles tendent vers l’âge moyen de l’échantillon de référence.","Pour les seuils d’âge légaux, utilisez le concept d’âge minimal (âge le plus jeune auquel le stade a été observé) pour éviter de déclarer majeur un mineur.","Combinez toujours les constatations dentaires, squelettiques et physiques (AGFAD).","Un résultat dentaire étaye une estimation de l’âge ; il ne prouve pas une date de naissance.","Les morsures changent vite sur la peau des vivants et des défunts. Documentez tôt et à plusieurs reprises, avant tout prélèvement ou nettoyage.","Localisation sur le corps, position du corps et courbure de la surface décrites","Photo d’ensemble montrant la localisation anatomique","Gros plans avec l’échelle ABFO n° 2 dans le même plan que la lésion","Appareil perpendiculaire à la marque ; pas de distorsion grand-angle","Photos en série sur plusieurs jours (vivant : chaque jour pendant plusieurs jours ; défunt : sur 24–48 h)","Lumière alternative : photographie UV et infrarouge envisagée","Mesures : largeur d’arcade, dimensions de la marque, distances entre les marques","Description écrite : forme, couleur, abrasions, contusions, lacérations, empreintes dentaires possibles","Prélèvement de salive avant nettoyage : technique du double écouvillon (humide puis sec)","Écouvillon témoin sur une zone de peau non mordue","Écouvillons séchés à l’air, emballés dans du papier, étiquetés, chaîne de traçabilité commencée","Empreinte de la peau lésée (en cas d’indentations) avec un matériau de faible viscosité","Excision des tissus uniquement par le médecin légiste avec autorisation légale, fixée sur un anneau de support","Denture du suspect uniquement avec autorisation légale/consentement : photos, empreintes, enregistrement de l’occlusion","Comparaisons réalisées à l’aveugle des informations du dossier lorsque c’est possible","L’ADN de la salive est le lien le plus fiable entre une morsure et une personne. Prélever d’abord, examiner ensuite.","Limites scientifiques","L’examen des fondements scientifiques du NIST (2023) a conclu que les trois prémisses clés de l’analyse des morsures ne sont pas étayées par les données :","La denture antérieure humaine est unique au niveau individuel.","Cette unicité est transférée avec précision sur la peau humaine.","Les caractéristiques peuvent être saisies et interprétées avec précision par les techniques d’analyse.","La peau est élastique et courbe ; les ecchymoses s’étendent et évoluent ; la posture au moment de la morsure est inconnue.","Les experts sont souvent en désaccord même sur le fait qu’une lésion soit une morsure humaine (PCAST 2016).","Plusieurs condamnations erronées ont été liées à des témoignages sur des morsures.","Utilisez les morsures pour la documentation, pour reconnaître une morsure possible et pour le prélèvement d’ADN. N’identifiez pas un mordeur à partir du seul motif.","Rapport d’expertise","À écrire","Ce qui a été examiné, quand, par qui et avec quelle méthode.","Si la lésion est compatible avec une morsure humaine, une morsure animale, ou n’est pas une morsure / indéterminée.","Limites : distorsion de la peau, qualité d’image, délai depuis la lésion, fondement scientifique.","Renvoyer aux résultats ADN pour toute association avec une personne.","À éviter","« Correspondance », « mordeur identifié », « certitude dentaire raisonnable » ou toute probabilité non fondée sur des données.","Comparer avec un seul suspect sans série d’autres dentures.","Lire des informations du dossier non nécessaires à la question dentaire.","Énoncé le plus fort acceptable sur une personne : « ne peut être exclue » ou « exclue » – et seulement avec un raisonnement clair et des limites énoncées.","Les dents protègent l’ADN dans la pulpe et la dentine, même après un incendie, un enterrement ou un long intervalle post-mortem.","Préférez des molaires ou prémolaires intactes, non restaurées ; évitez les dents avec de grandes obturations ou obturations canalaires.","Saisir, photographier et radiographier la dent avant le prélèvement – l’extraction est destructive.","Portez gants et masque, utilisez des instruments propres, évitez de toucher la racine, emballez au sec dans du papier ou un tube stérile.","Écouvillons de salive sur la peau, les morsures ou les objets : technique du double écouvillon, séchage à l’air, emballage papier.","Étiquetez avec le numéro de dossier, le numéro de dent, la date et la personne ; commencez la chaîne de traçabilité.","La DVI suit le standard INTERPOL afin que les équipes de différents pays travaillent avec les mêmes formulaires et règles de qualité.","Quatre phases","Lieu : récupération des corps et fragments, numérotation et documentation de l’emplacement.","Post-mortem : examen à la morgue (formulaires PM roses ; section dentaire F1/F2).","Ante-mortem : collecte des dossiers des personnes disparues (formulaires AM jaunes).","Réconciliation : comparaison et confirmation par une commission d’identification.","Tâches de l’équipe dentaire","Travaillez en binôme : un examinateur, un rédacteur ; une seconde équipe vérifie chaque schéma.","Schéma avec numérotation FDI et codes INTERPOL ; radiographies et photos pour chaque cas.","Saisissez les données dans le logiciel DVI (p. ex. DVI System International / Plass Data) pour la recherche.","Ne modifiez jamais un schéma PM une fois les données AM connues ; enregistrez les corrections comme nouvelles entrées.","Le logiciel propose des candidats ; l’identification est décidée par les experts, généralement avec un second identifiant primaire lorsqu’il est disponible.","Dents temporaires – éruption (mois)","Haut","Bas","Dents permanentes – éruption (années)","L’édification radiculaire s’achève environ 2–3 ans après l’éruption (plus longtemps pour canines et molaires).","Les filles sont généralement un peu en avance sur les garçons ; les populations diffèrent.","L’éruption est plus variable que la minéralisation ; pour l’estimation de l’âge, préférez les stades de développement radiographiques.","Extra-oral : visage, lèvres, lésions péribuccales photographiés","Accès à la bouche (rigidité, décomposition) ; résection de la mâchoire uniquement avec autorisation légale","Tissus mous : muqueuse, freins, langue, palais, piercings, tatouages","Mâchoires : fractures, zones édentées, cicatrisation des alvéoles, pathologie","Chaque dent saisie (FDI), avec faces, matériaux et anomalies","Occlusion, usure, colorations, rotations, diastèmes","Prothèses retirées, photographiées et vérifiées pour des noms ou numéros","Radiographies et photos réalisées ; un second examinateur a vérifié le schéma","L’identification dentaire compare les constatations post-mortem (PM) aux dossiers ante-mortem (AM) d’une personne disparue. C’est l’un des identifiants primaires reconnus par INTERPOL, avec les empreintes digitales et l’ADN.","Sources AM","Schéma dentaire et notes de traitement, y compris les factures (qui indiquent dates et dents traitées).","Radiographies : OPG, rétro-alvéolaires, bitewings, CBCT. Demandez toujours l’original ou un export numérique en pleine résolution.","Photographies, empreintes optiques, modèles d’étude, dossiers orthodontiques.","Photos de sourire de la famille ou des réseaux sociaux (utiles pour les dents antérieures).","Procédure","Saisissez complètement la denture PM avant de comparer (éviter les biais).","Réalisez des radiographies PM correspondant aux projections AM (angle, zone, type de film).","Comparez restaurations, obturations canalaires, morphologie radiculaire, contour des sinus, trabéculation et anomalies.","Classez chaque différence comme explicable (traitement après les dossiers AM) ou inexplicable.","Échelle de conclusion (INTERPOL/ABFO) : établie/positive · probable · possible · insuffisante · exclue. Une seule divergence inexplicable peut exclure ; il n’existe pas de nombre minimal fixe de points concordants.","Documentez chaque lésion avec localisation, taille, forme, couleur et une échelle ABFO n° 2.","Lèvres et freins : des lacérations dues aux dents sous-jacentes indiquent un traumatisme contondant de la bouche.","Fractures des mâchoires : mandibule (condyle, angle, symphyse) et étage moyen (Le Fort I–III, zygoma).","Règle du bord du chapeau : les lésions au-dessus de cette ligne évoquent des coups plutôt qu’une simple chute.","Notez séparément les lésions anciennes et récentes ; demandez les dossiers dentaires antérieurs.","Un rapport médico-légal doit permettre au lecteur de voir ce qui a été constaté et, séparément, ce que l’expert en conclut.","Constatation","Interprétation","Dent 21 absente, alvéole ouverte à bords nets, sans cicatrisation osseuse.","Compatible avec une perte dentaire post-mortem.","Troisième molaire 38 au stade H de Demirjian.","Âge minimal 18,2 ans (étude de référence X).","Motif courbe d’ecchymoses, 35 mm de large, sur l’avant-bras.","Compatible avec une morsure humaine ; ne permet pas d’identifier une personne.","Utilisez des mots neutres et mesurables pour les constatations (taille, couleur, localisation).","Utilisez des termes gradués pour les interprétations : « compatible avec », « typique de », « exclut ».","Citez les explications alternatives et les limites de la méthode.","Restez dans votre domaine ; laissez la cause du décès et le jugement juridique à d’autres.","Stades de décomposition : frais, gonflement, décomposition active, décomposition avancée, squelettisation ; la vitesse dépend de la température, de l’humidité, des insectes et de l’enterrement.","Les dents monoradiculées sont souvent perdues post-mortem ; recherchez des alvéoles vides à bords nets (sans cicatrisation).","Les « dents roses » sont un phénomène post-mortem (hémoglobine dans la dentine) et n’indiquent pas une cause de décès.","Restes brûlés : les dents deviennent fragiles et changent de couleur ; photographiez in situ, stabilisez avant de déplacer, gardez les fragments ensemble.","Vérifiez si les dents sont humaines et séparez les restes mélangés par l’occlusion, l’usure et le développement.","Décrivez précisément la lésion : fracture coronaire ou radiculaire, luxation, avulsion, fracture alvéolaire, lésion des tissus mous.","Une réaction vitale (saignement, gonflement, inflammation) évoque une lésion du vivant.","Les fractures périmortem sur os frais ont des bords nets et de même couleur ; les cassures post-mortem sur os sec sont plus pâles et plus irrégulières.","Un traumatisme contondant du visage provoque souvent des fractures des incisives supérieures avec des lacérations des lèvres.","Envisagez chutes, agressions, accidents, crises convulsives et actes médicaux (p. ex. intubation) comme causes.","Rapportez ce qui est vu ; indiquez si les constatations sont compatibles avec un mécanisme proposé et citez d’autres causes possibles.","Contrôle par deux examinateurs","Nom de l’examinateur 2","Concordance","{1} dents diffèrent. Vérifiez-les ensemble et choisissez la constatation correcte.","Garder l’examinateur 1","Utiliser l’examinateur 2","P(≥18) est la probabilité qu’une personne à ce stade ait au moins 18 ans, calculée à partir de la moyenne et de l’écart-type (ET) de votre étude de référence, en supposant une distribution normale. Saisissez les valeurs ET à l’étape 4 pour la voir.","Superposition radiographique AM/PM","Contrôle d’intégrité","Chaîne de traçabilité : {1} entrées, chacune scellée par une empreinte SHA-256 enes permanecen en este dispositivo y no forman parte de la copia de seguridad de texto.","Aún no hay imágenes.","Este archivo no se pudo leer como imagen.","Elija qué muestra la imagen.","No se pudo guardar la imagen. La navegación privada o el almacenamiento lleno pueden causarlo.","No se pudo guardar la imagen.","Imagen no encontrada en este dispositivo","Cerrar","Elegir un diente","Cúspides / borde incisal","Raíces","Conductos radiculares","Erupción (años)","Raíz completa (años)","Rasgos de identificación","¿Superior o inferior?","¿Derecha o izquierda?","Valores típicos de manual para dientes permanentes. La variación individual y poblacional es frecuente.","Determinación del lado: signos de Mühlreiter","Signo del ángulo: el ángulo incisal u oclusal mesial es más agudo que el distal.","Signo de curvatura: visto desde incisal u oclusal, la parte mesial de la cara vestibular es más convexa.","Signo radicular: el eje de la raíz se inclina hacia distal respecto al eje de la corona.","Los tres signos son más claros en incisivos y caninos y menos fiables en molares y dientes desgastados. Combine siempre varios rasgos.","Mis imágenes 3D e ilustraciones","Añadir imagen","Suba capturas de modelos dentales 3D, dibujos o sus fotos. Se muestran para el diente {1} y {2} (mismo diente del otro lado) y se guardan en este dispositivo para todos los casos.","Aún no hay imágenes de este diente.","Vista, p. ej. mesial, vestibular, 3D","Comparar con el caso actual","Las imágenes del caso aparecen aquí si indica el diente {1} en «Dientes mostrados» en Registro del caso › Fotos y radiografías.","Borde incisal con 3 mamelones en jóvenes","1, cónica","Incisivo más ancho. Ángulo mesioincisal agudo (unos 90°), ángulo distoincisal redondeado. Cíngulo algo distal.","Corona ancha (unos 8,5 mm), cíngulo y crestas marginales marcados; raíz redonda en sección. Un central inferior mide unos 5 mm y es aplanado.","Ángulo mesioincisal agudo, distoincisal redondeado; contorno distal más convexo; ápice inclinado hacia distal.","Borde incisal, ángulos más redondeados que el central","1, ápice a menudo curvado hacia distal","Más pequeño y redondeado que el central. Variantes frecuentes: conoide o agenesia.","Ángulos incisales redondeados, posible fosa palatina; raíz redonda. Los laterales inferiores son estrechos con raíces aplanadas.","Ángulo distal claramente más redondeado que el mesial; ápice normalmente curvado a distal.","1 cúspide puntiaguda; vertiente mesial más corta que la distal","1, la raíz más larga de la dentición","Diente más largo. Cresta vestibular marcada. Contorno distal más convexo.","Corona ancha con la punta cerca del centro; contornos mesial y distal sobresalen de la raíz. Los caninos inferiores son más estrechos y su contorno mesial continúa recto en la raíz.","Vertiente mesial más corta que la distal; contacto distal más cervical; ápice curvado a distal.","2: vestibular mayor que palatina","Normalmente 2 (vestibular y palatina)","Concavidad mesial en corona y raíz. Punta vestibular algo distal.","Dos cúspides bien desarrolladas y normalmente dos raíces. Un primer premolar inferior tiene una cúspide vestibular dominante, una lingual diminuta y una raíz.","Concavidad mesial de corona y raíz (lado de la fosa canina); punta vestibular algo distal.","2 de tamaño casi igual","Normalmente 1","1 o 2","Más simétrico que el primer premolar; sin concavidad mesial marcada.","Dos cúspides de altura casi igual, contorno oclusal ovalado. Los segundos premolares inferiores son más redondos o cuadrados y la corona se inclina a lingual.","Punta vestibular algo mesial; punta palatina desplazada a mesial.","4 (mesiopalatina la mayor), a menudo tubérculo de Carabelli","3 (mesiovestibular, distovestibular, palatina)","3–4 (segundo conducto mesiovestibular frecuente)","Diente superior más grande. Cresta oblicua de la cúspide mesiopalatina a la distovestibular. Contorno oclusal romboidal.","Tres raíces (dos vestibulares, una palatina), corona romboidal, cresta oblicua. Los primeros molares inferiores tienen dos raíces (mesial y distal) y corona rectangular.","La cúspide mesiopalatina es la mayor; el tubérculo de Carabelli es mesiopalatino; raíz mesiovestibular más ancha que la distovestibular.","4, cúspide distopalatina menor o ausente","3, a menudo juntas o fusionadas","Más pequeño y acorazonado que el primer molar; sin tubérculo de Carabelli.","Tres raíces (a menudo juntas), corona acorazonada. Los segundos molares inferiores tienen dos raíces y surcos en cruz.","Cúspide distopalatina reducida; raíces inclinadas a distal.","Variable, a menudo 3","Variable, a menudo fusionadas","Variable","17–21 (a menudo incluido)","Forma y posición muy variables. Los estadios de desarrollo se usan para estimar la edad.","Corona pequeña, a menudo triangular; raíces normalmente fusionadas en un cono.","A menudo poco fiable; use los rasgos palatinos y mesiales restantes y la inclinación radicular (distal).","Borde incisal, corona simétrica","1, aplanada mesiodistalmente","1, a veces 2 (vestibular y lingual)","Diente más pequeño de la dentición. Mitades mesial y distal casi simétricas.","Corona estrecha y simétrica (unos 5 mm); raíz muy aplanada mesiodistalmente con surcos a ambos lados.","Difícil. El surco radicular distal suele ser más profundo; el borde incisal puede desgastarse hacia distal. El lado a menudo no puede determinarse con fiabilidad.","Borde incisal, ángulo distal más redondeado","1, a veces 2","Algo mayor que el central; la corona parece girada a distal.","Corona estrecha, raíz aplanada; algo mayor que el central inferior.","La corona parece girada a distal: el ángulo distoincisal es más redondeado y más lingual.","1 cúspide, punta a menudo algo mesial","1, ocasionalmente bífida","Más estrecho que el canino superior; contorno mesial casi recto con la raíz.","Corona más estrecha, contorno mesial que continúa recto en la raíz, cara lingual lisa.","Punta cuspídea mesial; vertiente mesial más corta; contorno mesial recto, distal convexo.","Cúspide vestibular grande, cúspide lingual pequeña","Parece un canino visto desde vestibular. Cúspide lingual muy pequeña.","Cúspide vestibular dominante, lingual diminuta, corona inclinada a lingual, una raíz.","Surco mesiolingual frecuente; cresta marginal mesial más baja que la distal; vertiente vestibular mesial más corta.","2 o 3 (surcos en Y, H o U)","Cúspides linguales más desarrolladas que en el primer premolar.","Dos o tres cúspides, contorno oclusal redondo o cuadrado, una raíz, corona inclinada a lingual.","En la forma tricuspídea, la cúspide mesiolingual es mayor que la distolingual.","5 (3 vestibulares, 2 linguales)","2 (mesial y distal)","3 (2 mesiales, 1 distal), a veces 4","Diente inferior más grande. Surcos en Y. Cúspide distal en el lado vestibular.","Dos raíces (mesial y distal), cinco cúspides, corona rectangular más ancha mesiodistalmente.","La pequeña cúspide distal es distovestibular; raíz mesial más ancha y curvada a distal; dos surcos vestibulares.","4, surcos en cruz (+)","2, más juntas","3; conducto en C posible","Corona rectangular con 4 cúspides casi iguales.","Dos raíces juntas, cuatro cúspides con surco en cruz (+).","Raíces inclinadas a distal; cúspides mesiales algo mayores que las distales.","Variable, 4–5","2, a menudo fusionadas","Muy variable; a menudo incluido. Los estadios de desarrollo se usan para estimar la edad.","Dos raíces (a menudo fusionadas y curvadas a distal), corona con cuatro o cinco cúspides.","Use la inclinación radicular (distal) y las cúspides mesiales mayores.","Modelo 3D","Subir modelo 3D","Esquema integrado","Cargando visor 3D…","Cargando modelo…","Giro automático","Frente","Izquierda","Derecha","Arriba","Abajo","Apical","Arrastre con un dedo para girar y pellizque para ampliar. El modelo integrado es un modelo didáctico simplificado: forma típica de la corona, cúspides y número y posición de las raíces. M = mesial, D = distal.","Arrastre con un dedo para girar y pellizque para ampliar. Los modelos se comparten entre los dientes {1} y {2}; el otro lado se muestra en espejo.","subido para","Formatos: STL (escáneres dentales), GLB, OBJ, PLY. Los archivos permanecen en este dispositivo. Los archivos grandes (más de 50 MB) pueden ir lentos.","No se pudo abrir este archivo 3D. Use STL, GLB, OBJ o PLY.","No se pudo cargar el visor 3D. Compruebe la conexión a Internet e inténtelo de nuevo.","Elija un archivo STL, GLB, OBJ o PLY.","No se pudo guardar el modelo. La navegación privada o el almacenamiento lleno pueden causarlo.","Altura de la corona / longitud de la raíz (mm)","Anchura coronal mesiodistal / vestibulolingual (mm)","Valores típicos de manual para dientes permanentes. Las medidas son valores medios según Wheeler’s Dental Anatomy; el modelo 3D se calcula a partir de ellas. La variación individual y poblacional es frecuente.","Arrastre con un dedo para girar y pellizque para ampliar. El modelo integrado es un modelo didáctico calculado con las dimensiones medias de Wheeler: tamaño de corona y raíz, cúspides y número, posición e inclinación de las raíces. Los dientes del lado izquierdo son la imagen especular del derecho. M = mesial, D = distal.","Gratis","Odontograma: AM y PM, cada superficie y material, registro rápido","Comparación AM/PM con resultado sugerido","Estimación de la edad con lista AGFAD y edad mínima","Registro del caso: fotos, radiografías y cadena de custodia","Informe PDF con conclusión sugerida","Anatomía dental con modelos 3D","Herramientas de odontología forense para identificación dental, estimación de la edad e informes periciales.","Desarrollado por","Odontólogo forense","Iniciar sesión","Crear cuenta gratuita","Correo electrónico","Contraseña","Al menos 8 caracteres. Recibirá un correo para confirmar su dirección.","Crear cuenta","¿Olvidó la contraseña?","Las cuentas aún no están conectadas","El propietario debe introducir primero los datos de Supabase y Lemon Squeezy (ver guía de configuración).","Abrir en modo de prueba del pro ntes son poco específicos o los registros están incompletos. Desde el punto de vista odontológico forense, la identidad es probable.","No existen discrepancias inexplicables entre los hallazgos dentales post mortem{1} y los registros ante mortem{2}, pero solo hay pocos rasgos distintivos. Desde el punto de vista odontológico forense, la identidad es posible pero no está establecida. Se recomienda confirmarla con otros métodos (p. ej. análisis de ADN).","Los registros ante mortem disponibles{1} y/o los hallazgos post mortem{2} no son suficientes para una conclusión odontológica forense sobre la identidad.","Existen discrepancias inexplicables entre los hallazgos dentales post mortem{1} y los registros ante mortem{2}. {3}Desde el punto de vista odontológico forense, la identidad queda excluida.","Dientes afectados: {1}. ","Según los hallazgos dentales (desarrollo del tercer molar), la edad mínima es de {1} años. Por tanto, los 18 años cumplidos están {2}.","No puede indicarse una edad mínima a partir de los hallazgos dentales.","¿Puede identificarse el cadáver desconocido{1} mediante comparación dental como {2}?","la persona desaparecida","¿Qué edad mínima se deduce de los hallazgos dentales? ¿Ha cumplido la persona 18 años?","INFORME DE ODONTOLOGÍA FORENSE","Informe de odontología forense","Solicitado por:","Número de expediente:","Fecha de la solicitud:","Número de caso:","Número del cadáver:","Perito:","Examinado el:","Examinado el","Material examinado","Recibido el {1} a las {2} de {3}; estado: {4}; n.º de precinto: {5}; almacenamiento: {6}.","Registros ante mortem: {1}.","Documentación realizada:","Documentación realizada","Cadena de custodia:","Hallazgos","Registro dental ante mortem (FDI):","Hallazgos dentales post mortem (FDI):","  Otros dientes: {1} sanos, {2} no registrados.","  no se registraron restauraciones ni dientes ausentes","Comparados: {1} de 32 dientes. Concordantes: {2} (distintivos: {3}). Diferencias explicables: {4}. Discrepancias inexplicables: nte presente en ambos","detalles no registrados en uno de los registros","Implante AM","detalles PM no registrados","Rotación","Malposición","Diastema","Editar","estado PM; toque un diente para ver o editar AM y PM","Según las recomendaciones del Grupo de Trabajo de Diagnóstico Forense de la Edad (AGFAD). Consulte la versión actual en el sitio web de la AGFAD.","En el proceso penal alemán se necesita una orden judicial según el artículo 81a del Código Procesal Penal alemán, porque las radiografías no tienen indicación médica.","Austria: en el proceso penal, la fiscalía ordena el examen con autorización judicial (artículo 123 del Código Procesal Penal austriaco). Compruebe que la orden cubre las radiografías sin indicación médica.","Suiza: en el proceso penal, el examen lo ordena la fiscalía o el tribunal de menores (art. 251 del Código Procesal Penal suizo); los casos de asilo se rigen por la Ley de Asilo. Asegúrese de que la orden escrita cubra las radiografías.","Compruebe qué base legal exige su país antes de radiografías sin indicación médica (por ejemplo, una orden judicial o un consentimiento informado por escrito) e introdúzcala en Ajustes → País del tribunal.","País del tribunal","Alemania","Austria","Suiza","Otro país","Su propia base legal (opcional, sustituye el texto anterior)","p. ej. orden judicial según … de …","Se usa en la lista de control de la estimación de la edad y en el informe. Las leyes cambian: compruebe siempre la situación jurídica actual.","Pakistán","Pakistán: según la sección 8 de la Juvenile Justice System Act 2018, la edad se toma de certificados de nacimiento o escolares; si no existen, puede determinarse mediante el informe de examen de un médico. El tribunal deja constancia de su conclusión sobre la edad. Compruebe que la orden cubra las radiografías.","India","India: según la sección 94 de la Juvenile Justice (Care and Protection of Children) Act 2015, prevalecen el certificado escolar o el de nacimiento; solo si no existen puede realizarse una prueba de osificación u otra prueba médica de edad, por orden del Juvenile Justice Board o del Child Welfare Committee. Examen médico de un acusado: sección 51 de la Bharatiya Nagarik Suraksha Sanhita 2023.","EE. UU.","EE. UU.: las normas varían según el estado. Un examen corporal obligatorio requiere en general una orden de registro o judicial, o un consentimiento informado (Cuarta Enmienda). Para menores no acompañados bajo custodia migratoria, la edad se determina según 8 U.S.C. § 1232(b)(4) y 45 CFR § 410.1702: se consideran todas las pruebas y las radiografías no pueden ser la única base.","Australia","Australia (delitos federales): según la parte IAA de la Crimes Act 1914 (s 3ZQA y siguientes), un procedimiento de determinación de la edad (actualmente una radiografía de mano y muñeca) requiere los consentimientos necesarios o la orden de un magistrado. Los estados y territorios tienen sus propias normas.","Arabia Saudí","Arabia Saudí: según el artículo 3 de la Ley de Menores (Real Decreto M/113, 1439 H), la edad se calcula a partir de un documento oficial; el tribunal puede remitir al menor a la autoridad médica competente para estimar su edad.","EAU","EAU: los casos de menores se rigen por la ley federal sobre menores infractores (Ley Federal n.º 6 de 2022). Si no hay documento oficial, el tribunal o la fiscalía pueden designar a un perito médico para estimar la edad. Compruebe el artículo exacto para su caso.","Catar","Catar: los exámenes médicos en causas penales los ordena la fiscalía o el tribunal (Código Procesal Penal, Ley n.º 23 de 2004); los casos de menores se rigen por la Ley de Menores (Ley n.º 1 de 1994). Compruebe el artículo exacto para su caso.","China","China: según el artículo 132 de la Ley de Procedimiento Penal (2018), la inspección física de un sospechoso puede imponerse si es necesario; el artículo 146 regula la pericia. La fiscalía debe verificar la edad de los sospechosos menores (normas de 2026 de la Fiscalía Popular Suprema y del Ministerio de Seguridad Pública).","Japón","Japón: el examen físico de un sospechoso requiere una orden de examen físico dictada por un juez (artículo 218 del Código de Procedimiento Penal); una pericia que afecte al cuerpo requiere la autorización judicial de medidas periciales (artículo 225 con el artículo 168).","London Atlas (AlQahtani et al. 2010): categoría más parecida {1} años, es decir, una edad estimada de {2}–{3} años. Los métodos de atlas dan una estimación, no una edad mínima.","London Atlas (dentición completa)","Compare todos los dientes en desarrollo de la OPG con el London Atlas of Human Tooth Development and Eruption (AlQahtani et al. 2010) y elija la categoría de edad más parecida. Es más útil mientras los dientes siguen desarrollándose (niños y adolescentes). Da una edad estimada, no una edad mínima; para el umbral de 18 años use los métodos de terceros molares de arriba.","Categoría del atlas más parecida (años)","no usado","Menos de 1 año: el atlas tiene también categorías desde 30 semanas intrauterinas hasta 10,5 meses; anótelas en «Otros hallazgos». Atlas: atlas.dentistry.qmul.ac.uk","14, 18 y 21 años son límites de edad legales habituales (en Alemania: responsabilidad penal, mayoría de edad, adulto joven); compruebe los límites aplicables en su país. «No probado» no significa que la persona sea más joven.","Abrir el London Atlas (PDF gratuito)","Software interactivo del atlas","Abra el atlas junto a la OPG (pantalla dividida o atlas en un segundo dispositivo).","En cada diente en desarrollo, observe cuánto se han formado la corona y la raíz y dónde está el diente respecto al hueso alveolar.","Empiece por el diagrama más cercano a la edad esperada y luego compruebe un año menos y un año más.","Elija el diagrama en el que coincidan más dientes y selecciónelo abajo.","Menos de 1 año: el atlas tiene también categorías desde 30 semanas intrauterinas hasta 10,5 meses; anótelas en «Otros hallazgos». El atlas es gratuito para la enseñanza y el uso individual (© AlQahtani, Queen Mary University of London); sus imágenes no se copian en esta app.","Licencias y créditos","Software de terceros, fuentes y métodos","Todos los derechos reservados.","Software usado en esta app","Visor 3D de dientes, con cargadores STL, OBJ, PLY y glTF y OrbitControls","Inicio de sesión y cuenta","Mostrar el texto de la licencia MIT","Fuentes","Métodos y referencias (citados, no copiados)","et al.","estadios de mineralización dental","estadios de erupción de terceros molares y visibilidad del ligamento periodontal","recomendaciones para la estimación forense de la edad","solo enlace externo; © Queen Mary University of London","dimensiones dentales medias para los modelos 3D esquemáticos","formularios y guía (2023)","códigos de hallazgo (2022)","Los valores de referencia para la estimación de la edad proceden del estudio que usted mismo introduce. Los métodos se describen con palabras propias de la app.","Subconjuntos de IBM Plex Sans e IBM Plex Mono, renombrados como exige la licencia","nombre de fuente reservado","Las fuentes se guardan con la app; no se envían solicitudes de fuentes a Google. Licencia completa: fonts-OFL.txt junto a la app.","Valores típicos de manual para dientes permanentes. Las medidas son valores medios según Wheeler’s Dental Anatomy. La variación individual y poblacional es frecuente.","Desbloquee la comparación, la estimación de la edad, el registro, el informe PDF y la anatomía dental.","Mis imágenes e ilustraciones","Anatomía dental: rasgos superior/inferior y derecha/izquierda","dimensiones dentales medias","Caso","Comparar","Introducir los datos del caso","Registrar el registro AM","Registrar los hallazgos PM","Comparar AM y PM","Redactar el informe","Crear el informe PDF","Odontología forense","Cadáver","Aún no hay datos del caso","Abrir el odontograma","dientes registrados","Comparación","distintivos","Sin empezar","entradas de custodia","Conclusión redactada","Aún sin conclusión","Guías y listas de control","Superior o inferior, derecha o izquierda: rasgos de identificación de cada diente","Eliminar este caso","Comparación DVI: cada cadáver con cada persona desaparecida","Comparación radiográfica: superponer radiografías AM y PM","Registros dentales extranjeros: sistemas de numeración y términos","Herramientas","Comparación DVI","Ordenar personas desaparecidas para cada cadáver","Comparación radiográfica","Superponer radiografías AM y PM","Registros dentales extranjeros","Números dentales y términos","Examinador 1","Examinador 2","INTERPOL recomienda dos odontólogos. El examinador 2 registra los mismos dientes de forma independiente; las diferencias se listan abajo.","Huella digital del documento (SHA-256): ","Cotejo","Identificación de víctimas de catástrofes","Añada cada cadáver (PM) y cada persona desaparecida (AM) como registro propio y regístrelo. El paso siguiente compara cada cadáver con todas las personas desaparecidas y ordena los candidatos.","Añadir cadáver (PM)","Añadir persona desaparecida (AM)","Cadáveres","Aún no hay cadáveres.","Personas desaparecidas","Aún no hay personas desaparecidas.","Registre primero al menos un cadáver (PM) y una persona desaparecida (AM).","Elegir imágenes","Superposición","Elegir las dos imágenes","Elija la radiografía post mortem como base y la radiografía ante mortem para superponer. Las imágenes proceden de Registro del caso → Fotos y radiografías.","Aún no hay imágenes en este caso.","Añadir fotos y radiografías","Elija primero una imagen PM y una AM en el paso 1.","Números dentales","Términos dentales","Convertir números dentales","Los registros extranjeros suelen usar otro sistema de numeración. Escriba el número tal como aparece para encontrar el número FDI.","Sistema del registro","Universal (EE. UU., 1–32 / A–T)","Palmer (Reino Unido, Commonwealth)","Haderup (Escandinavia, registros antiguos)","Diente tal como está escrito","p. ej. 3, 6┘, 6+, 46","Dientes temporales","Símbolos Palmer: ┘ superior derecho, └ superior izquierdo, ┐ inferior derecho, ┌ inferior izquierdo. Haderup: + superior, − inferior.","Términos dentales en otros idiomas","Elija el idioma del registro AM para ver el significado de los términos habituales.","Idioma del registro","Las superficies suelen abreviarse con sus iniciales (M, O, D, B/V, L/P, I); las letras cambian según el idioma, por ejemplo V de vestibular en francés y español.","Señales de alarma","Frenillo labial superior desgarrado en un lactante que aún no camina.","Hematomas en tronco, orejas o cuello, frenillo, ángulo mandibular, mejillas, párpados o subconjuntivales en niños menores de 4 años, cualquier hematoma en lactantes menores de 4,99 meses, o hematomas con forma (TEN-4-FACESp).","Lesiones de distinta antigüedad, explicaciones que no encajan con la lesión o con el desarrollo del niño, retraso en buscar atención.","Negligencia dental: caries, dolor o infección sin tratar pese a conocer el problema y tener acceso a atención.","Notificación en Alemania","Documente los hallazgos con cuidado, con fotos y la explicación dada (con las propias palabras del cuidador).","§ 4 KKG: los dentistas pueden hablar de la situación con los padres y pedir consejo a un profesional experimentado en protección infantil (insoweit erfahrene Fachkraft) con datos seudonimizados.","Si el riesgo para el niño persiste, pueden informar a la oficina de protección de menores (Jugendamt); en peligro agudo, contacte con la policía.","Línea médica de protección infantil para profesionales: 0800 19 210 00 (gratuita, 24/7).","No necesita demostrar el maltrato. Reconozca, documente y transmita sus sospechas por los cauces adecuados.","Niños (dentición en desarrollo)","Periodo más preciso: muchos dientes se desarrollan al mismo tiempo.","Métodos: London Atlas, Demirjian, Willems (Demirjian modificado), ápices abiertos de Cameriere, Ubelaker.","Error típico de aproximadamente ±1 año, mayor al final de la infancia.","Adolescentes y adultos jóvenes","Los terceros molares suelen ser los únicos dientes en desarrollo: mineralización (Demirjian), erupción y visibilidad del ligamento periodontal (Olze).","Combinar con radiografía de mano y, si es necesario, TC de clavículas (AGFAD). Informar una edad mínima para los umbrales legales.","Adultos","Cambios regresivos: dentina secundaria (relación pulpa/diente, Kvaal; canino de Cameriere), translucidez radicular (Lamendin), recesión periodontal, atrición.","Métodos de laboratorio: racemización del ácido aspártico, anillos del cemento.","Errores a menudo de ±5–10 años; dé un rango de edad, no una cifra única.","Cada método tiene dispersión; indique el estudio de referencia, su población, el sexo y el intervalo estadístico usado.","Los datos de referencia de una población pueden sobre- o subestimar la edad en otra (origen, nutrición, nivel socioeconómico).","Los terceros molares varían mucho y pueden faltar o estar incluidos; la inclusión puede retrasar el desarrollo.","Mimetismo de la edad: las estimaciones puntuales tienden hacia la edad media de la muestra de referencia.","Para los umbrales legales de edad, use el concepto de edad mínima (la edad más joven a la que se observó el estadio) para no declarar adulto a un menor.","Combine siempre los hallazgos dentales, esqueléticos y físicos (AGFAD).","Un resultado dental respalda una estimación de edad; no prueba una fecha de nacimiento.","Las mordeduras cambian rápido en la piel de vivos y fallecidos. Documente pronto y repetidamente, antes de que un hisopado o limpieza altere la zona.","Localización en el cuerpo, posición del cuerpo y curvatura de la superficie descritas","Foto general que muestra la localización anatómica","Primeros planos con escala ABFO n.º 2 en el mismo plano que la lesión","Cámara perpendicular a la marca; sin distorsión de gran angular","Fotos seriadas durante días (vivos: a diario varios días; fallecidos: durante 24–48 h)","Luz alternativa: fotografía UV e infrarroja considerada","Mediciones: anchura de arcada, dimensiones de la marca, distancias entre marcas","Descripción escrita: forma, color, abrasiones, contusiones, laceraciones, posibles marcas dentales","Hisopado de saliva antes de limpiar: técnica de doble hisopo (húmedo y luego seco)","Hisopo de control de una zona de piel no mordida","Hisopos secados al aire, embalados en papel, etiquetados, cadena de custodia iniciada","Impresión de la piel lesionada (si hay indentaciones) con material de baja viscosidad","Escisión de tejido solo por el médico forense con autorización legal, fijada en un anillo de soporte","Dentición del sospechoso solo con autorización legal/consentimiento: fotos, impresiones, registro de mordida","Comparaciones a ciegas respecto a la información del caso cuando sea posible","El ADN de la saliva es el vínculo más fiable entre una mordedura y una persona. Primero hisopar, después examinar.","Limitaciones científicas","La revisión de fundamentos científicos del NIST (2023) concluyó que las tres premisas clave del análisis de mordeduras no están respaldadas por los datos:","La dentición anterior humana es única a nivel individual.","Esta unicidad se transfiere con precisión a la piel humana.","Las características pueden captarse e interpretarse con precisión mediante técnicas de análisis.","La piel es elástica y curva; los hematomas se extienden y cambian; la postura en el momento de la mordida es desconocida.","Los examinadores a menudo discrepan incluso sobre si una lesión es una mordedura humana (PCAST 2016).","Varias condenas erróneas se han vinculado a testimonios sobre mordeduras.","Use las mordeduras para documentar, reconocer una posible mordedura y tomar muestras de ADN. No identifique al mordedor solo por el patrón.","Informe pericial","Escribir","Qué se examinó, cuándo, por quién y con qué método.","Si la lesión es compatible con una mordedura humana, una mordedura animal, o no es una mordedura / indeterminada.","Limitaciones: distorsión de la piel, calidad de imagen, tiempo desde la lesión, fundamento científico.","Remitir a los resultados de ADN para cualquier asociación con una persona.","Evitar","«Coincidencia», «mordedor identificado», «certeza dental razonable» o cualquier probabilidad no basada en datos.","Comparar con un único sospechoso sin una serie de otras denticiones.","Leer información del caso que no es necesaria para la pregunta dental.","Afirmación más fuerte aceptable sobre una persona: «no puede excluirse» o «excluida», y solo con razonamiento claro y limitaciones indicadas.","Los dientes protegen el ADN en la pulpa y la dentina, incluso tras fuego, entierro o largos intervalos post mortem.","Prefiera molares o premolares intactos y sin restaurar; evite dientes con grandes obturaciones o endodoncias.","Registre, fotografíe y radiografíe el diente antes de la toma: la extracción es destructiva.","Use guantes y mascarilla, instrumental limpio, evite tocar la raíz, embale en seco en papel o tubo estéril.","Hisopos de saliva de piel, mordeduras u objetos: técnica de doble hisopo, secado al aire, embalaje en papel.","Etiquete con número de caso, número de diente, fecha y persona; inicie la cadena de custodia.","La DVI sigue el estándar de INTERPOL para que equipos de distintos países trabajen con los mismos formularios y normas de calidad.","Cuatro fases","Escena: recuperación de cadáveres y fragmentos, numeración y documentación del lugar.","Post mortem: examen en la morgue (formularios PM rosados; sección dental F1/F2).","Ante mortem: recogida de registros de personas desaparecidas (formularios AM amarillos).","Reconciliación: comparación y confirmación por una junta de identificación.","Tareas del equipo dental","Trabaje en parejas: un examinador y un anotador; un segundo equipo revisa cada odontograma.","Odontograma con numeración FDI y códigos INTERPOL; radiografías y fotos de cada caso.","Introduzca los datos en el software DVI (p. ej. DVI System International / Plass Data) para la búsqueda.","Nunca modifique un odontograma PM una vez conocidos los datos AM; registre las correcciones como nuevas entradas.","El software sugiere candidatos; la identificación la deciden los expertos, normalmente con un segundo identificador primario si está disponible.","Dientes temporales – erupción (meses)","Superior","Inferior","Dientes permanentes – erupción (años)","La formación radicular termina unos 2–3 años después de la erupción (más en caninos y molares).","Las niñas suelen ir algo por delante de los niños; las poblaciones difieren.","La erupción es más variable que la mineralización; para estimar la edad prefiera los estadios radiográficos de desarrollo.","Extraoral: cara, labios, lesiones periorales fotografiados","Acceso a la boca (rigidez, descomposición); resección mandibular solo con autorización legal","Tejidos blandos: mucosa, frenillos, lengua, paladar, piercings, tatuajes","Maxilares: fracturas, zonas desdentadas, cicatrización de alvéolos, patología","Cada diente registrado (FDI), con superficies, materiales y anomalías","Oclusión, desgaste, tinciones, rotaciones, diastemas","Prótesis retiradas, fotografiadas y revisadas en busca de nombres o números","Radiografías y fotos tomadas; un segundo examinador revisó el odontograma","La identificación dental compara los hallazgos post mortem (PM) con los registros ante mortem (AM) de una persona desaparecida. Es uno de los identificadores primarios reconocidos por INTERPOL, junto con las huellas dactilares y el ADN.","Fuentes AM","Odontograma y notas de tratamiento, incluidas facturas (que muestran fechas y dientes tratados).","Radiografías: OPG, periapicales, aletas de mordida, CBCT. Solicite siempre el original o una exportación digital en resolución completa.","Fotografías, escaneos intraorales, modelos de estudio, registros de ortodoncia.","Fotos sonriendo de la familia o redes sociales (útiles para dientes anteriores).","Procedimiento","Registre completamente la dentición PM antes de comparar (evitar sesgos).","Tome radiografías PM que coincidan con las proyecciones AM (ángulo, zona, tipo de película).","Compare restauraciones, endodoncias, morfología radicular, contorno de senos, patrón trabecular y anomalías.","Clasifique cada diferencia como explicable (tratamiento posterior a los registros AM) o inexplicable.","Escala de conclusión (INTERPOL/ABFO): establecida/positiva · probable · posible · insuficiente · excluida. Una sola discrepancia inexplicable puede excluir; no existe un número mínimo fijo de puntos concordantes.","Documente cada lesión con localización, tamaño, forma, color y una escala ABFO n.º 2.","Labios y frenillos: las laceraciones por los dientes subyacentes indican un traumatismo contuso en la boca.","Fracturas maxilares: mandíbula (cóndilo, ángulo, sínfisis) y tercio medio (Le Fort I–III, cigoma).","Regla del ala del sombrero: las lesiones por encima de esa línea sugieren golpes más que una simple caída.","Anote por separado las lesiones antiguas y recientes; solicite registros dentales previos.","Un informe forense debe permitir al lector ver lo que se encontró y, por separado, lo que el perito concluye de ello.","Observación","Interpretación","Diente 21 ausente, alvéolo abierto con bordes nítidos, sin cicatrización ósea.","Compatible con pérdida dental post mortem.","Tercer molar 38 en estadio H de Demirjian.","Edad mínima 18,2 años (estudio de referencia X).","Patrón curvo de hematomas, 35 mm de ancho, en el antebrazo.","Compatible con una mordedura humana; no apto para identificar a una persona.","Use palabras neutras y medibles para los hallazgos (tamaño, color, localización).","Use términos graduados para las interpretaciones: «compatible con», «típico de», «excluye».","Mencione explicaciones alternativas y los límites del método.","Manténgase en su campo; deje la causa de muerte y el juicio legal a otros.","Fases de descomposición: fresca, enfisematosa, descomposición activa, avanzada, esqueletización; la velocidad depende de temperatura, humedad, insectos y enterramiento.","Los dientes unirradiculares suelen perderse post mortem; busque alvéolos vacíos con bordes nítidos (sin cicatrización).","Los «dientes rosados» son un fenómeno post mortem (hemoglobina en la dentina) y no indican la causa de muerte.","Restos quemados: los dientes se vuelven frágiles y cambian de color; fotografíe in situ, estabilice antes de mover, mantenga juntos los fragmentos.","Compruebe si los dientes son humanos y separe restos mezclados por oclusión, desgaste y desarrollo.","Describa la lesión con precisión: fractura coronaria o radicular, luxación, avulsión, fractura alveolar, lesión de tejidos blandos.","La reacción vital (sangrado, hinchazón, inflamación) sugiere lesión en vida.","Las fracturas perimortem en hueso fresco tienen bordes nítidos y del mismo color; las roturas post mortem en hueso seco son más pálidas e irregulares.","Un traumatismo contuso en la cara causa a menudo fracturas de incisivos superiores junto con laceraciones labiales.","Considere caídas, agresiones, accidentes, convulsiones y procedimientos médicos (p. ej. intubación) como causas.","Informe lo que se ve; indique si los hallazgos son compatibles con un mecanismo propuesto y mencione otras causas posibles.","Control por dos examinadores","Nombre del examinador 2","Concordancia","{1} dientes difieren. Revíselos juntos y elija el hallazgo correcto.","Mantener examinador 1","Usar examinador 2","P(≥18) es la probabilidad de que una persona en este estadio tenga al menos 18 años, a partir de la media y la desviación estándar (DE) de su estudio de referencia, suponiendo una distribución normal. Introduzca valores de DE en el paso 4 para verla.","Superposición radiográfica AM/PM","Control de integridad","Cadena de custodia: {1} entradas, cada una sellada con una huella SHA-256; ninguna entrada ha sido modificada.","Revisado de forma independiente por {1}: concordancia en {2} de {3} dientes; diferencias abiertas: {4}.","Probabilidad de tener al menos 18 años (según la media y la DE de referenci cimento","Superiore o inferiore?","Destra o sinistra?","Valori tipici da manuale per i denti permanenti. Le variazioni individuali e di popolazione sono frequenti.","Determinazione del lato: segni di Mühlreiter","Segno dell’angolo: l’angolo incisale od occlusale mesiale è più acuto di quello distale.","Segno della curvatura: vista incisale od occlusale, la parte mesiale della faccia vestibolare è più convessa.","Segno radicolare: l’asse della radice è inclinato in senso distale rispetto all’asse della corona.","I tre segni sono più evidenti su incisivi e canini e meno affidabili su molari e denti usurati. Combinare sempre più caratteri.","Le mie immagini 3D e illustrazioni","Aggiungi immagine","Caricare screenshot di modelli dentali 3D, disegni o foto proprie. Vengono mostrati per il dente {1} e {2} (stesso dente dell’altro lato) e restano su questo dispositivo per tutti i casi.","Ancora nessuna immagine per questo dente.","Vista, ad es. mesiale, vestibolare, 3D","Confronta con il caso attuale","Le immagini del caso compaiono qui se si indica il dente {1} in «Denti visibili» in Registro del caso › Foto e radiografie.","Margine incisale con 3 mammelloni nei giovani","1, conica","Incisivo più largo. Angolo mesio-incisale netto (circa 90°), angolo disto-incisale arrotondato. Cingolo leggermente distale.","Corona larga (circa 8,5 mm), cingolo e creste marginali evidenti; radice rotonda in sezione. Un centrale inferiore è largo circa 5 mm e appiattito.","Angolo mesio-incisale netto, disto-incisale arrotondato; contorno distale più convesso; apice inclinato distalmente.","Margine incisale, angoli più arrotondati del centrale","1, apice spesso curvo distalmente","Più piccolo e arrotondato del centrale. Varianti frequenti: conoide o agenesia.","Angoli incisali arrotondati, possibile fossetta palatale; radice rotonda. I laterali inferiori sono stretti con radici appiattite.","Angolo distale nettamente più arrotondato del mesiale; apice di solito curvo distalmente.","1 cuspide appuntita; cresta mesiale più corta della distale","1, la radice più lunga della dentatura","Dente più lungo. Cresta vestibolare marcata. Contorno distale più convesso.","Corona larga con punta cuspidale centrale; contorni mesiale e distale sporgenti oltre la radice. I canini inferiori sono più stretti e il contorno mesiale prosegue dritto nella radice.","Cresta mesiale più corta della distale; contatto distale più cervicale; apice curvo distalmente.","2: vestibolare più grande della palatale","Di solito 2 (vestibolare e palatale)","Concavità mesiale su corona e radice. Punta vestibolare leggermente distale.","Due cuspidi ben sviluppate e di solito due radici. Un primo premolare inferiore ha una cuspide vestibolare dominante, una linguale minima e una radice.","Concavità mesiale di corona e radice (lato fossa canina); punta vestibolare leggermente distale.","2 di dimensioni quasi uguali","Di solito 1","1 o 2","Più simmetrico del primo premolare; nessuna concavità mesiale marcata.","Due cuspidi di altezza quasi uguale, contorno occlusale ovale. I secondi premolari inferiori sono più rotondi o quadrati e la corona è inclinata lingualmente.","Punta vestibolare leggermente mesiale; punta palatale spostata mesialmente.","4 (mesio-palatale la più grande), spesso tubercolo di Carabelli","3 (mesio-vestibolare, disto-vestibolare, palatale)","3–4 (secondo canale mesio-vestibolare frequente)","Dente superiore più grande. Cresta obliqua dalla cuspide mesio-palatale alla disto-vestibolare. Contorno occlusale romboidale.","Tre radici (due vestibolari, una palatale), corona romboidale, cresta obliqua. I primi molari inferiori hanno due radici (mesiale e distale) e corona rettangolare.","La cuspide mesio-palatale è la più grande; il tubercolo di Carabelli è mesio-palatale; radice mesio-vestibolare più larga della disto-vestibolare.","4, cuspide disto-palatale più piccola o assente","3, spesso ravvicinate o fuse","Più piccolo e cuoriforme del primo molare; nessun tubercolo di Carabelli.","Tre radici (spesso ravvicinate), corona cuoriforme. I secondi molari inferiori hanno due radici e solchi a croce.","Cuspide disto-palatale ridotta; radici inclinate distalmente.","Variabile, spesso 3","Variabile, spesso fuse","Variabile","17–21 (spesso incluso)","Forma e posizione molto variabili. Gli stadi di sviluppo servono alla stima dell’età.","Corona piccola, spesso triangolare; radici di solito fuse in un cono.","Spesso poco affidabile; usare i caratteri palatali e mesiali residui e l’inclinazione radicolare (distale).","Margine incisale, corona simmetrica","1, appiattita in senso mesio-distale","1, talvolta 2 (vestibolare e linguale)","Dente più piccolo della dentatura. Metà mesiale e distale quasi speculari.","Corona stretta e simmetrica (circa 5 mm); radice molto appiattita in senso mesio-distale con solchi su entrambi i lati.","Difficile. Il solco radicolare distale è spesso più profondo; il margine incisale può usurarsi verso distale. Il lato spesso non è determinabile con certezza.","Margine incisale, angolo distale più arrotondato","1, talvolta 2","Leggermente più grande del centrale; la corona appare ruotata distalmente.","Corona stretta, radice appiattita; leggermente più grande del centrale inferiore.","La corona appare ruotata distalmente: l’angolo disto-incisale è più arrotondato e più linguale.","1 cuspide, punta spesso leggermente mesiale","1, occasionalmente biforcata","Più stretto del canino superiore; contorno mesiale quasi in linea con la radice.","Corona più stretta, contorno mesiale che prosegue dritto nella radice, faccia linguale liscia.","Punta cuspidale mesiale; cresta mesiale più corta; contorno mesiale dritto, distale convesso.","Cuspide vestibolare grande, cuspide linguale piccola","Aspetto caniniforme dal lato vestibolare. Cuspide linguale molto piccola.","Cuspide vestibolare dominante, linguale minima, corona inclinata lingualmente, una radice.","Solco mesio-linguale spesso presente; cresta marginale mesiale più bassa della distale; cresta vestibolare mesiale più corta.","2 o 3 (solchi a Y, H o U)","Cuspidi linguali più sviluppate che nel primo premolare.","Due o tre cuspidi, contorno occlusale rotondo o quadrato, una radice, corona inclinata lingualmente.","Nella forma tricuspidata la cuspide mesio-linguale è più grande della disto-linguale.","5 (3 vestibolari, 2 linguali)","2 (mesiale e distale)","3 (2 mesiali, 1 distale), talvolta 4","Dente inferiore più grande. Solchi a Y. Cuspide distale sul lato vestibolare.","Due radici (mesiale e distale), cinque cuspidi, corona rettangolare più larga in senso mesio-distale.","La piccola cuspide distale è disto-vestibolare; radice mesiale più larga e curva distalmente; due solchi vestibolari.","4, solchi a croce (+)","2, più ravvicinate","3; canale a C possibile","Corona rettangolare con 4 cuspidi quasi uguali.","Due radici ravvicinate, quattro cuspidi con solco a croce (+).","Radici inclinate distalmente; cuspidi mesiali leggermente più grandi delle distali.","Variabile, 4–5","2, spesso fuse","Molto variabile; spesso incluso. Gli stadi di sviluppo servono alla stima dell’età.","Due radici (spesso fuse e curve distalmente), corona con quattro o cinque cuspidi.","Usare l’inclinazione radicolare (distale) e le cuspidi mesiali più grandi.","Modello 3D","Carica modello 3D","Schema integrato","Caricamento del visualizzatore 3D…","Caricamento del modello…","Rotazione automatica","Davanti","Sinistra","Destra","Sopra","Sotto","Apicale","Trascinare con un dito per ruotare, pizzicare per ingrandire. Il modello integrato è un modello didattico semplificato: forma tipica della corona, cuspidi, numero e posizione delle radici. M = mesiale, D = distale.","Trascinare con un dito per ruotare, pizzicare per ingrandire. I modelli valgono per i denti {1} e {2}; il lato opposto è mostrato specchiato.","caricato per","Formati: STL (scanner dentali), GLB, OBJ, PLY. I file restano su questo dispositivo. I file grandi (oltre 50 MB) possono essere lenti.","Impossibile aprire questo file 3D. Usare STL, GLB, OBJ o PLY.","Impossibile caricare il visualizzatore 3D. Controllare la connessione Internet e riprovare.","Scegliere un file STL, GLB, OBJ o PLY.","Impossibile salvare il modello. Può dipendere dalla navigazione privata o dalla memoria piena.","Altezza della corona / lunghezza della radice (mm)","Larghezza della corona mesio-distale / vestibolo-linguale (mm)","Valori tipici da manuale per i denti permanenti. Le misure sono valori medi secondo Wheeler’s Dental Anatomy; il modello 3D è calcolato da esse. Le variazioni individuali e di popolazione sono frequenti.","Trascinare con un dito per ruotare, pizzicare per ingrandire. Il modello integrato è un modello didattico calcolato dalle dimensioni medie di Wheeler: dimensioni di corona e radice, cuspidi, numero, posizione e inclinazione delle radici. I denti del lato sinistro sono speculari a quelli del destro. M = mesiale, D = distale.","Gratis","Odontogramma: AM e PM, ogni superficie e materiale, registrazione rapida","Confronto AM/PM con risultato proposto","Stima dell’età con lista AGFAD ed età minima","Registro del caso: foto, radiografie e catena di custodia","Perizia PDF con conclusione proposta","Anatomia dentale con modelli 3D","Strumenti di odontologia forense per identificazione dentale, stima dell’età e perizie.","Sviluppato da","Odontologo forense","Accedi","Crea account gratuito","E-mail","Password","Almeno 8 caratteri. Riceverà un’e-mail per confermare l’indirizzo.","Crea account","Password dimenticata?","Gli account non sono ancora collegati","Il proprietario deve prima inserire i dati di Supabase e Lemon Squeezy (vedi guida).","Apri in modalità test del proprietario","Il servizio di accesso non è raggiungibile. Controllare la connessione Internet.","Gratis e Pro","pagamento unico, nessun abbonamento","Assistenza","Inserire un indirizzo e-mail valido.","La password deve avere almeno 8 caratteri.","Attendere…","Account creato. Aprire l’e-mail ricevuta, toccare il l  sufficienti per una conclusione odontologica forense sull’identità.","Vi sono discrepanze inspiegabili tra i reperti dentali post mortem{1} e i dati ante mortem{2}. {3}Dal punto di vista odontologico forense, l’identità è esclusa.","Denti interessati: {1}. ","In base ai reperti dentali (sviluppo dei terzi molari), l’età minima è di {1} anni. Il compimento dei 18 anni è quindi {2}.","Dai reperti dentali non è possibile indicare un’età minima.","Il cadavere sconosciuto{1} può essere identificato mediante confronto dentale come {2}?","la persona scomparsa","Quale età minima risulta dai reperti dentali? La persona ha compiuto 18 anni?","PERIZIA DI ODONTOLOGIA FORENSE","Perizia di odontologia forense","Richiesto da:","Numero di fascicolo:","Data della richiesta:","Numero del caso:","Numero del cadavere:","Perito:","Esaminato il:","Esaminato il","Materiale esaminato","Ricevuto il {1} alle {2} da {3}; condizione: {4}; n. sigillo: {5}; conservazione: {6}.","Dati ante mortem: {1}.","Documentazione eseguita:","Documentazione eseguita","Catena di custodia:","Reperti","Dati dentali ante mortem (FDI):","Reperti dentali post mortem (FDI):","  Altri denti: {1} sani, {2} non registrati.","  nessun restauro o dente assente registrato","Confrontati: {1} di 32 denti. Concordanti: {2} (distintivi: {3}). Differenze spiegabili: {4}. Discrepanze inspiegabili: {5}. Non confrontabili: {6}.","concordante","spiegabile","inspiegabile","non confrontabile","Valutazione calcolata: {1}. {2}","Valutazione calcolata","Esito dell’identificazione: ","ALLEGATI","Fig.","Luogo","Firma","Nota: bozza creata con ForensiDent (supporto decisionale, non software forense validato). Tutti i reperti vanno verificati sulle radiografie e fotografie originali.","Creato con ForensiDent (supporto decisionale, non software forense validato). Tutti i reperti vanno verificati sulle radiografie e fotografie originali.","[Scrivere qui la conclusione]","[Conclusione mancante]","Riferimento AM","N. sigillo","Conservazione",
