erfahrene Fachkraft) से सलाह ले सकते हैं।","यदि बच्चे के लिए जोखिम बना रहे तो वे युवा कल्याण कार्यालय (Jugendamt) को सूचित कर सकते हैं; तत्काल ख़तरे में पुलिस से संपर्क करें।","पेशेवरों के लिए चिकित्सा बाल-संरक्षण हेल्पलाइन: 0800 19 210 00 (निःशुल्क, 24/7)।","आपको दुर्व्यवहार साबित करने की ज़रूरत नहीं। चिंताओं को पहचानें, दर्ज करें और उचित माध्यम से आगे भेजें।","बच्चे (विकसित हो रही दंतपंक्ति)","सबसे सटीक अवधि: कई दाँत एक साथ विकसित हो रहे होते हैं।","विधियाँ: London Atlas, Demirjian, Willems (संशोधित Demirjian), Cameriere खुले शीर्ष, Ubelaker।","सामान्य त्रुटि लगभग ±1 वर्ष, बचपन के अंत में अधिक।","किशोर और युवा वयस्क","तीसरी दाढ़ प्रायः एकमात्र विकसित हो रहे दाँत होते हैं: खनिजीकरण (Demirjian), उद्भेदन और PDL दृश्यता (Olze)।","हाथ के एक्स-रे और आवश्यकता हो तो क्लैविकल CT से जोड़ें (AGFAD)। कानूनी सीमाओं के लिए न्यूनतम आयु बताएँ।","वयस्क","प्रतिगामी परिवर्तन: द्वितीयक डेंटीन (पल्प/दाँत अनुपात, Kvaal; Cameriere कैनाइन), जड़ पारदर्शिता (Lamendin), पेरियोडॉन्टल रिसेशन, घिसाव।","प्रयोगशाला विधियाँ: एस्पार्टिक एसिड रेसेमाइज़ेशन, दंत सीमेंटम एन्युलेशन।","त्रुटि प्रायः ±5–10 वर्ष; एक संख्या नहीं, आयु सीमा दें।","हर विधि में फैलाव होता है; संदर्भ अध्ययन, उसकी जनसंख्या, लिंग और उपयोग की गई सांख्यिकीय सीमा बताएँ।","एक जनसंख्या के संदर्भ डेटा दूसरी जनसंख्या में आयु को अधिक या कम आँक सकते हैं (जातीयता, पोषण, सामाजिक-आर्थिक स्थिति)।","तीसरी दाढ़ बहुत भिन्न होती है और अनुपस्थित या इम्पैक्टेड हो सकती है; इम्पैक्शन विकास को धीमा कर सकता है।","आयु अनुकरण: बिंदु अनुमान संदर्भ नमूने की औसत आयु की ओर खिसकते हैं।","कानूनी आयु सीमाओं के लिए न्यूनतम-आयु अवधारणा (सबसे कम आयु जिस पर चरण देखा गया) का उपयोग करें ताकि किसी नाबालिग को वयस्क घोषित न किया जाए।","दंत, कंकाल और शारीरिक निष्कर्षों को हमेशा जोड़ें (AGFAD)।","दंत परिणाम आयु आकलन का समर्थन करता है; यह जन्मतिथि सिद्ध नहीं करता।","काटने के निशान जीवित और मृत त्वचा पर जल्दी बदलते हैं। स्वाब लेने या सफ़ाई से क्षेत्र बिगड़ने से पहले जल्दी और बार-बार दर्ज करें।","शरीर पर स्थान, शरीर की स्थिति और सतह की वक्रता वर्णित","शारीरिक स्थान दिखाता हुआ अवलोकन फ़ोटो","चोट के समान तल में ABFO नं. 2 स्केल के साथ क्लोज़-अप","कैमरा निशान के लंबवत; वाइड-एंगल विकृति नहीं","कई दिनों तक क्रमिक फ़ोटो (जीवित: कई दिन रोज़; मृत: 24–48 घंटे में)","वैकल्पिक प्रकाश: UV और इन्फ़्रारेड फ़ोटोग्राफ़ी पर विचार","माप: आर्च की चौड़ाई, निशान के आयाम, निशानों के बीच दूरी","लिखित विवरण: आकार, रंग, खरोंच, नील, फटन, संभावित दाँत के निशान","सफ़ाई से पहले लार स्वाब: डबल-स्वाब तकनीक (पहले नम, फिर सूखा)","बिना काटी त्वचा से नियंत्रण स्वाब","स्वाब हवा में सुखाए, काग़ज़ में पैक, लेबल किए, साक्ष्य हिरासत शृंखला शुरू","घायल त्वचा का इम्प्रेशन (यदि गड्ढे हों) कम श्यानता वाली सामग्री से","ऊतक का छेदन केवल कानूनी अधिकार वाले फ़ॉरेंसिक पैथोलॉजिस्ट द्वारा, सहायक रिंग पर स्थिर","संदिग्ध के दाँत केवल कानूनी अधिकार/सहमति से: फ़ोटो, इम्प्रेशन, बाइट रजिस्ट्रेशन","जहाँ संभव हो, तुलना केस जानकारी जाने बिना","लार का DNA काटने और व्यक्ति के बीच सबसे विश्वसनीय कड़ी है। पहले स्वाब, फिर परीक्षण।","वैज्ञानिक सीमाएँ","NIST वैज्ञानिक आधार समीक्षा (2023) ने पाया कि काटने के निशान विश्लेषण की तीन मुख्य मान्यताएँ डेटा से समर्थित नहीं हैं:","मानव के आगे के दाँत व्यक्तिगत स्तर पर अद्वितीय हैं।","यह अद्वितीयता मानव त्वचा पर सटीक रूप से स्थानांतरित होती है।","विशेषताओं को विश्लेषण तकनीकों से सटीक रूप से पकड़ा और समझा जा सकता है।","त्वचा लचीली और वक्र है; नील फैलते और बदलते हैं; काटते समय की मुद्रा अज्ञात होती है।","परीक्षक प्रायः इस पर भी असहमत होते हैं कि चोट मानव का काटना है या नहीं (PCAST 2016)।","कई ग़लत दोषसिद्धियाँ काटने के निशान की गवाही से जुड़ी रही हैं।","काटने के निशान का उपयोग प्रलेखन, संभावित काटने की पहचान और DNA नमूने के लिए करें। केवल पैटर्न से काटने वाले की पहचान न करें।","विशेषज्ञ रिपोर्ट","लिखें","क्या परीक्षित हुआ, कब, किसके द्वारा और किस विधि से।","क्या चोट मानव काटने, पशु काटने से सुसंगत है, या काटना नहीं है / अनिर्धारित।","सीमाएँ: त्वचा विकृति, चित्र गुणवत्ता, चोट के बाद का समय, वैज्ञानिक आधार।","किसी व्यक्ति से किसी भी संबंध के लिए DNA परिणामों का संदर्भ दें।","बचें","“मिलान”, “काटने वाले की पहचान हुई”, “उचित दंत निश्चितता” या डेटा पर आधारित न होने वाली कोई संभावना।","अन्य दंतपंक्तियों की पंक्ति के बिना एक ही संदिग्ध से तुलना।","दंत प्रश्न के लिए अनावश्यक केस जानकारी पढ़ना।","किसी व्यक्ति पर सबसे मज़बूत स्वीकार्य कथन: “बहिष्कृत नहीं किया जा सकता” या “बहिष्कृत” – और केवल स्पष्ट तर्क और बताई गई सीमाओं के साथ।","आग, दफ़न या लंबे मृत्यु-पश्चात अंतराल के बाद भी दाँत पल्प और डेंटीन में DNA की रक्षा करते हैं।","अक्षुण्ण, बिना रेस्टोरेशन वाली दाढ़ या प्रीमोलर को प्राथमिकता दें; बड़ी फ़िलिंग या रूट फ़िलिंग वाले दाँतों से बचें।","नमूना लेने से पहले दाँत को चार्ट करें, फ़ोटो और एक्स-रे लें – निकालना विनाशकारी है।","दस्ताने और मास्क पहनें, साफ़ उपकरण लें, जड़ को छूने से बचें, सूखा काग़ज़ या जीवाणुरहित ट्यूब में पैक करें।","त्वचा, काटने के निशान या वस्तुओं से लार स्वाब: डबल-स्वाब तकनीक, हवा में सुखाना, काग़ज़ पैकिंग।","केस संख्या, दाँत संख्या, तिथि और व्यक्ति के साथ लेबल करें; साक्ष्य हिरासत शृंखला शुरू करें।","DVI इंटरपोल मानक का पालन करता है ताकि अलग-अलग देशों की टीमें समान फ़ॉर्म और गुणवत्ता नियमों से काम करें।","चार चरण","घटनास्थल: शवों और खंडों की बरामदगी, नंबरिंग और स्थान का प्रलेखन।","मृत्यु-पश्चात: शवगृह में परीक्षण (गुलाबी PM फ़ॉर्म; दंत खंड F1/F2)।","मृत्यु-पूर्व: लापता व्यक्तियों के रिकॉर्ड का संग्रह (पीले AM फ़ॉर्म)।","मिलान: पहचान बोर्ड द्वारा तुलना और पुष्टि।","दंत टीम के कार्य","जोड़ी में काम करें: एक परीक्षक, एक लेखक; दूसरी टीम हर चार्ट जाँचती है।","FDI नंबरिंग और इंटरपोल कोड से चार्ट करें; हर केस का एक्स-रे और फ़ोटो लें।","खोज के लिए डेटा DVI सॉफ़्टवेयर (उदा. DVI System International / Plass Data) में दर्ज करें।","AM डेटा ज्ञात होने के बाद कभी PM चार्ट न बदलें; सुधार नई प्रविष्टि के रूप में दर्ज करें।","सॉफ़्टवेयर उम्मीदवार सुझाता है; पहचान विशेषज्ञ तय करते हैं, उपलब्ध हो तो प्रायः दूसरे प्राथमिक पहचानकर्ता के साथ।","दूध के दाँत – उद्भेदन (महीने)","ऊपरी","निचला","स्थायी दाँत – उद्भेदन (वर्ष)","जड़ उद्भेदन के लगभग 2–3 वर्ष बाद पूरी होती है (रदनक और दाढ़ में अधिक)।","लड़कियाँ प्रायः लड़कों से थोड़ा आगे होती हैं; जनसंख्याएँ भिन्न होती हैं।","उद्भेदन खनिजीकरण से अधिक परिवर्तनशील है; आयु निर्धारण के लिए रेडियोग्राफ़िक विकास चरणों को प्राथमिकता दें।","मुख के बाहर: चेहरा, होंठ, मुख के आसपास की चोटें फ़ोटो की गईं","मुख तक पहुँच (अकड़न, विघटन); जबड़े का छेदन केवल कानूनी अधिकार से","कोमल ऊतक: म्यूकोसा, फ़्रेनुलम, जीभ, तालु, पियर्सिंग, टैटू","जबड़े: फ़्रैक्चर, दाँतविहीन क्षेत्र, सॉकेट का भरना, विकृति","हर दाँत चार्ट (FDI), सतहों, सामग्री और असामान्यताओं सहित","ऑक्लूज़न, घिसाव, दाग, घूर्णन, डायस्टेमा","प्रोस्थेसिस निकाले, फ़ोटो लिए और नाम या संख्या के लिए जाँचे","एक्स-रे और फ़ोटो लिए; दूसरे परीक्षक ने चार्ट जाँचा","दंत पहचान मृत्यु-पश्चात (PM) निष्कर्षों की तुलना लापता व्यक्ति के मृत्यु-पूर्व (AM) रिकॉर्ड से करती है। यह फ़िंगरप्रिंट और DNA के साथ इंटरपोल द्वारा मान्य प्राथमिक पहचानकर्ताओं में से एक है।","AM स्रोत","डेंटल चार्ट और उपचार नोट्स, बिलिंग रिकॉर्ड सहित (जो तिथियाँ और उपचारित दाँत दिखाते हैं)।","एक्स-रे: OPG, पेरीएपिकल, बाइटविंग, CBCT। हमेशा मूल या पूर्ण-रिज़ॉल्यूशन डिजिटल एक्सपोर्ट माँगें।","फ़ोटो, इंट्रा-ओरल स्कैन, स्टडी मॉडल, ऑर्थोडॉन्टिक रिकॉर्ड।","परिवार या सोशल मीडिया से मुस्कान वाले फ़ोटो (आगे के दाँतों के लिए उपयोगी)।","प्रक्रिया","तुलना से पहले PM दंतपंक्ति पूरी तरह चार्ट करें (पूर्वाग्रह से बचें)।","AM प्रोजेक्शन से मेल खाते PM एक्स-रे लें (कोण, क्षेत्र, फ़िल्म प्रकार)।","रेस्टोरेशन, रूट फ़िलिंग, जड़ आकृति, साइनस रूपरेखा, ट्रैबेक्युलर पैटर्न और असामान्यताओं की तुलना करें।","हर अंतर को व्याख्येय (AM रिकॉर्ड के बाद उपचार) या अस्पष्टीकृत में वर्गीकृत करें।","निष्कर्ष पैमाना (INTERPOL/ABFO): स्थापित/सकारात्मक · संभावित · संभव · अपर्याप्त · बहिष्कृत। एक अस्पष्टीकृत विसंगति भी बहिष्कृत कर सकती है; सुसंगत बिंदुओं की कोई निश्चित न्यूनतम संख्या नहीं है।","हर चोट को स्थान, आकार, आकृति, रंग और ABFO नं. 2 स्केल के साथ दर्ज करें।","होंठ और फ़्रेनुलम: पीछे के दाँतों से हुई फटन मुख पर कुंद बल दर्शाती है।","जबड़े के फ़्रैक्चर: मैंडिबल (कॉन्डाइल, कोण, सिम्फ़ाइसिस) और मध्य चेहरा (Le Fort I–III, ज़ाइगोमा)।","टोपी किनारा नियम: टोपी के किनारे की रेखा से ऊपर की चोटें साधारण गिरने के बजाय प्रहार दर्शाती हैं।","पुरानी और नई चोटें अलग दर्ज करें; पिछले दंत रिकॉर्ड माँगें।","फ़ॉरेंसिक रिपोर्ट से पाठक को दिखना चाहिए कि क्या मिला और, अलग से, विशेषज्ञ उससे क्या निष्कर्ष निकालता है।","अवलोकन","व्याख्या","दाँत 21 अनुपस्थित, सॉकेट खुला और तीखे किनारे, हड्डी का भराव नहीं।","मृत्यु-पश्चात दाँत गिरने से सुसंगत।","तीसरी दाढ़ 38 Demirjian चरण H पर।","न्यूनतम आयु 18.2 वर्ष (संदर्भ अध्ययन X)।","अग्रबाहु पर 35 मिमी चौड़ा वक्र नील पैटर्न।","मानव काटने से सुसंगत; किसी व्यक्ति की पहचान के लिए उपयुक्त नहीं।","निष्कर्षों के लिए तटस्थ, मापने योग्य शब्द उपयोग करें (आकार, रंग, स्थान)।","व्याख्याओं के लिए श्रेणीबद्ध शब्द उपयोग करें: “से सुसंगत”, “का विशिष्ट”, “बहिष्कृत करता है”।","वैकल्पिक व्याख्याएँ और विधि की सीमाएँ बताएँ।","अपने क्षेत्र में रहें; मृत्यु का कारण और कानूनी निर्णय दूसरों पर छोड़ें।","विघटन के चरण: ताज़ा, फूलना, सक्रिय विघटन, उन्नत विघटन, कंकालीकरण; गति तापमान, नमी, कीटों और दफ़न पर निर्भर।","एक जड़ वाले दाँत प्रायः मृत्यु के बाद गिर जाते हैं; तीखे किनारों वाले खाली सॉकेट देखें (भराव नहीं)।","“गुलाबी दाँत” मृत्यु-पश्चात घटना है (डेंटीन में हीमोग्लोबिन) और मृत्यु का कारण नहीं दर्शाती।","जले अवशेष: दाँत भंगुर होकर रंग बदलते हैं; उसी स्थान पर फ़ोटो लें, हिलाने से पहले स्थिर करें, खंड साथ रखें।","जाँचें कि दाँत मानव के हैं, और मिश्रित अवशेषों को ऑक्लूज़न, घिसाव और विकास के मिलान से अलग करें।","चोट का सटीक वर्णन करें: क्राउन या जड़ फ़्रैक्चर, लक्सेशन, एवल्शन, एल्वियोलर फ़्रैक्चर, कोमल ऊतक चोट।","जीवित प्रतिक्रिया (रक्तस्राव, सूजन, शोथ) जीवनकाल में चोट दर्शाती है।","ताज़ी हड्डी में मृत्यु-समीप फ़्रैक्चर के किनारे तीखे और समान रंग के होते हैं; सूखी हड्डी में मृत्यु-पश्चात टूटन हल्की और अनियमित होती है।","चेहरे पर कुंद बल प्रायः होंठ फटने के साथ ऊपरी कृंतकों का फ़्रैक्चर करता है।","कारणों में गिरना, हमला, दुर्घटना, दौरे और चिकित्सा प्रक्रियाएँ (उदा. इंट्यूबेशन) सोचें।","जो दिखा वह बताएँ; बताएँ कि निष्कर्ष प्रस्तावित तंत्र से सुसंगत हैं या नहीं, और अन्य संभावित कारण बताएँ।","दो-परीक्षक जाँच","परीक्षक 2 का नाम","सहमति","{1} दाँत भिन्न हैं। इन्हें साथ में जाँचें और सही निष्कर्ष चुनें।","परीक्षक 1 रखें","परीक्षक 2 अपनाएँ","P(≥18) वह संभावना है कि इस चरण वाला व्यक्ति क njukkan; itu menjadi judulnya di kasus dan di laporan PDF. Gambar tetap di perangkat ini dan tidak termasuk dalam cadangan teks.","Belum ada gambar.","File ini tidak dapat dibaca sebagai gambar.","Pilih apa yang ditunjukkan gambar.","Gambar tidak dapat disimpan. Penjelajahan pribadi atau penyimpanan penuh dapat menjadi penyebabnya.","Gambar tidak dapat disimpan.","Gambar tidak ditemukan di perangkat ini","Tutup","Pilih gigi","Tonjol / tepi insisal","Akar","Saluran akar","Erupsi (tahun)","Akar lengkap (tahun)","Ciri identifikasi","Atas atau bawah?","Kanan atau kiri?",null,"Menentukan sisi: tanda Mühlreiter","Tanda sudut: sudut insisal atau oklusal mesial lebih tajam daripada sudut distal.","Tanda kelengkungan mahkota: dilihat dari insisal atau oklusal, bagian mesial permukaan labial atau bukal lebih melengkung.","Tanda akar: sumbu akar miring ke distal terhadap sumbu mahkota.","Ketiga tanda paling jelas pada insisivus dan kaninus, kurang andal pada molar dan gigi aus. Selalu gabungkan beberapa ciri.",null,"Tambah gambar","Unggah tangkapan layar model gigi 3D, gambar, atau foto Anda sendiri. Gambar ditampilkan untuk gigi {1} dan {2} (gigi yang sama di sisi lain) dan disimpan di perangkat ini untuk semua kasus.","Belum ada gambar untuk gigi ini.","Tampilan, mis. mesial, bukal, 3D","Bandingkan dengan kasus saat ini","Gambar kasus muncul di sini jika Anda memasukkan gigi {1} di “Gigi yang tampak” pada Log kasus › Foto & rontgen.","Tepi insisal dengan 3 mamelon saat muda","1, kerucut","Insisivus terlebar. Sudut mesio-insisal tajam (sekitar 90°), sudut disto-insisal membulat. Singulum sedikit ke distal.","Mahkota lebar (sekitar 8,5 mm), singulum dan marginal ridge jelas; akar bulat pada penampang. Insisivus sentral bawah lebarnya sekitar 5 mm dan pipih.","Sudut mesio-insisal tajam, sudut disto-insisal membulat; kontur distal mahkota lebih cembung; apeks akar miring ke distal.","Tepi insisal, sudut lebih bulat daripada sentral","1, apeks sering melengkung ke distal","Lebih kecil dan bulat daripada insisivus sentral. Sering bervariasi: berbentuk pasak atau tidak tumbuh secara kongenital.","Sudut insisal membulat, mungkin ada pit palatal; akar bulat. Lateral bawah sempit dengan akar pipih.","Sudut distal jelas lebih bulat daripada mesial; apeks akar biasanya melengkung ke distal.","1 tonjol runcing; lereng tonjol mesial lebih pendek dari distal","1, akar terpanjang di gigi geligi","Gigi terpanjang. Labial ridge kuat. Kontur distal lebih cembung.","Mahkota lebar dengan ujung tonjol dekat tengah; kontur mesial dan distal menonjol melebihi akar. Kaninus bawah lebih sempit dan kontur mesialnya lurus menyambung ke akar.","Lereng tonjol mesial lebih pendek dari distal; area kontak distal lebih ke servikal; ujung akar melengkung ke distal.","2: bukal lebih besar dari palatal","Biasanya 2 (bukal dan palatal)","Cekungan mesial pada mahkota dan akar. Ujung tonjol bukal sedikit ke distal.","Dua tonjol berkembang baik dan biasanya dua akar. Premolar pertama bawah memiliki satu tonjol bukal dominan, tonjol lingual sangat kecil, dan satu akar.","Cekungan mesial mahkota dan akar (sisi fossa kaninus); ujung tonjol bukal sedikit ke distal.","2 hampir sama besar","Biasanya 1","1 atau 2","Lebih simetris daripada premolar pertama; tanpa cekungan mesial yang jelas.","Dua tonjol hampir sama tinggi, garis oklusal oval. Premolar kedua bawah lebih bulat atau persegi dan mahkota condong ke lingual.","Ujung tonjol bukal sedikit ke mesial; ujung tonjol palatal bergeser ke mesial.","4 (mesiopalatal terbesar), sering tonjol Carabelli","3 (mesiobukal, distobukal, palatal)","3–4 (saluran mesiobukal kedua sering ada)","Gigi atas terbesar. Oblique ridge dari tonjol mesiopalatal ke distobukal. Garis oklusal rombik.","Tiga akar (dua bukal, satu palatal), mahkota rombik, oblique ridge. Molar pertama bawah memiliki dua akar (mesial dan distal) dan mahkota persegi panjang.","Tonjol mesiopalatal terbesar; tonjol Carabelli di mesiopalatal; akar mesiobukal lebih lebar dari distobukal.","4, tonjol distopalatal lebih kecil atau tidak ada","3, sering berdekatan atau menyatu","Lebih kecil dan lebih berbentuk hati daripada molar pertama; tanpa tonjol Carabelli.","Tiga akar (sering berdekatan), mahkota berbentuk hati. Molar kedua bawah memiliki dua akar dan pola alur berbentuk silang.","Tonjol distopalatal mengecil; akar miring ke distal.","Bervariasi, sering 3","Bervariasi, sering menyatu","Bervariasi","17–21 (sering impaksi)","Bentuk dan posisi sangat bervariasi. Tahap perkembangan dipakai untuk estimasi usia.","Mahkota kecil, sering segitiga; akar biasanya menyatu menjadi satu kerucut.","Sering tidak andal; gunakan ciri palatal dan mesial yang tersisa serta kemiringan akar (distal).","Tepi insisal, mahkota simetris","1, pipih mesiodistal","1, kadang 2 (labial dan lingual)","Gigi terkecil di gigi geligi. Bagian mesial dan distal hampir seperti bayangan cermin.","Mahkota sempit dan simetris (sekitar 5 mm); akar sangat pipih mesiodistal dengan alur di kedua sisi.","Sulit. Alur akar distal sering lebih dalam; tepi insisal dapat aus ke arah distal. Sisi sering tidak dapat ditentukan dengan andal.","Tepi insisal, sudut distal lebih bulat","1, kadang 2","Sedikit lebih besar dari sentral; mahkota tampak terpuntir ke distal.","Mahkota sempit, akar pipih; sedikit lebih besar dari sentral bawah.","Mahkota tampak terpuntir ke distal: sudut disto-insisal lebih bulat dan lebih ke lingual.","1 tonjol, ujung sering sedikit ke mesial","1, kadang bercabang","Lebih sempit dari kaninus atas; kontur mesial mahkota hampir lurus dengan akar.","Mahkota lebih sempit, kontur mesial lurus menyambung ke akar, permukaan lingual halus.","Ujung tonjol di mesial; lereng tonjol mesial lebih pendek; kontur mesial lurus, kontur distal cembung.","Tonjol bukal besar, tonjol lingual kecil","Dari bukal tampak seperti kaninus. Tonjol lingual sangat kecil.","Tonjol bukal dominan, tonjol lingual sangat kecil, mahkota condong ke lingual, satu akar.","Alur mesiolingual sering ada; marginal ridge mesial lebih rendah dari distal; lereng tonjol bukal mesial lebih pendek.","2 atau 3 (pola alur Y, H atau U)","Tonjol lingual lebih berkembang daripada pada premolar pertama.","Dua atau tiga tonjol, garis oklusal bulat atau persegi, satu akar, mahkota condong ke lingual.","Pada bentuk tiga tonjol, tonjol mesiolingual lebih besar dari distolingual.","5 (3 bukal, 2 lingual)","2 (mesial dan distal)","3 (2 mesial, 1 distal), kadang 4","Gigi bawah terbesar. Pola alur berbentuk Y. Tonjol distal di sisi bukal.","Dua akar (mesial dan distal), lima tonjol, mahkota persegi panjang lebih lebar mesiodistal.","Tonjol distal kecil terletak distobukal; akar mesial lebih lebar dan melengkung ke distal; dua alur bukal.","4, pola alur berbentuk silang (+)","2, lebih berdekatan","3; mungkin saluran berbentuk C","Mahkota persegi panjang dengan 4 tonjol hampir sama.","Dua akar berdekatan, empat tonjol dengan alur berbentuk silang (+).","Akar miring ke distal; tonjol mesial sedikit lebih besar dari distal.","Bervariasi, 4–5","2, sering menyatu","Sangat bervariasi; sering impaksi. Tahap perkembangan dipakai untuk estimasi usia.","Dua akar (sering menyatu dan melengkung ke distal), mahkota dengan empat atau lima tonjol.","Gunakan kemiringan akar (distal) dan tonjol mesial yang lebih besar.",null,null,null,null,null,null,"Depan","Kiri","Kanan","Atas","Bawah","Apikal",null,null,null,null,null,null,null,null,"Tinggi mahkota / panjang akar (mm)","Lebar mahkota mesiodistal / bukolingual (mm)",null,null,"Gratis","Odontogram: AM dan PM, setiap permukaan dan bahan, pencatatan cepat","Perbandingan AM/PM dengan hasil yang disarankan","Estimasi usia dengan daftar periksa AGFAD dan usia minimum","Log kasus: foto, rontgen dan rantai bukti","Laporan PDF dengan kesimpulan yang disarankan",null,"Perangkat odontologi forensik untuk identifikasi gigi, estimasi usia dan laporan ahli.","Dikembangkan oleh","Odontolog forensik","Masuk","Buat akun gratis","Email","Kata sandi","Minimal 8 karakter. And n: berdasarkan Bagian 8 Juvenile Justice System Act 2018, usia diambil dari akta kelahiran atau ijazah sekolah; jika tidak ada, dapat ditentukan dari laporan pemeriksaan medis oleh petugas medis. Pengadilan mencatat temuannya tentang usia. Periksa apakah perintah mencakup rontgen.","India","India: berdasarkan Bagian 94 Juvenile Justice (Care and Protection of Children) Act 2015, ijazah sekolah atau akta kelahiran didahulukan; hanya jika keduanya tidak ada boleh dilakukan uji osifikasi atau uji usia medis lain, atas perintah Juvenile Justice Board atau Child Welfare Committee. Pemeriksaan medis terdakwa: Bagian 51 Bharatiya Nagarik Suraksha Sanhita 2023.","AS","AS: aturan berbeda per negara bagian. Pemeriksaan tubuh paksa umumnya memerlukan surat perintah penggeledahan atau perintah pengadilan, atau persetujuan setelah penjelasan (Amandemen Keempat). Untuk anak tanpa pendamping dalam tahanan imigrasi, usia ditetapkan berdasarkan 8 U.S.C. § 1232(b)(4) dan 45 CFR § 410.1702: semua bukti dipertimbangkan dan rontgen tidak boleh menjadi satu-satunya dasar.","Australia","Australia (tindak pidana federal): berdasarkan Bagian IAA Crimes Act 1914 (s 3ZQA dan seterusnya), prosedur penentuan usia (saat ini rontgen tangan-pergelangan) memerlukan persetujuan yang diwajibkan atau perintah hakim magistrat. Negara bagian dan teritori memiliki aturan sendiri.","Arab Saudi","Arab Saudi: berdasarkan Pasal 3 Undang-Undang Anak (Dekret Kerajaan M/113, 1439 H), usia dihitung dari dokumen resmi; pengadilan dapat merujuk anak ke otoritas medis yang berwenang untuk memperkirakan usia.","Uni Emirat Arab","Uni Emirat Arab: kasus anak mengikuti undang-undang federal tentang anak pelaku pelanggaran (Undang-Undang Federal No. 6 Tahun 2022). Jika tidak ada dokumen resmi, pengadilan atau penuntut umum dapat menunjuk ahli medis untuk memperkirakan usia. Periksa pasal yang tepat untuk kasus Anda.","Qatar","Qatar: pemeriksaan medis dalam perkara pidana diperintahkan oleh Penuntut Umum atau pengadilan (KUHAP, Undang-Undang No. 23 Tahun 2004); kasus anak mengikuti Undang-Undang Anak (Undang-Undang No. 1 Tahun 1994). Periksa pasal yang tepat untuk kasus Anda.","Tiongkok","Tiongkok: berdasarkan Pasal 132 Undang-Undang Acara Pidana (2018), pemeriksaan fisik tersangka dapat dipaksakan bila perlu; Pasal 146 mengatur pemeriksaan ahli. Jaksa wajib memverifikasi usia tersangka di bawah umur (aturan 2026 Kejaksaan Agung Rakyat Tertinggi dan Kementerian Keamanan Publik).","Jepang","Jepang: pemeriksaan fisik tersangka memerlukan surat perintah pemeriksaan fisik yang dikeluarkan hakim (Pasal 218 KUHAP); pemeriksaan ahli yang melibatkan tubuh memerlukan izin hakim untuk tindakan ahli (Pasal 225 jo. Pasal 168).","London Atlas (AlQahtani dkk. 2010): kategori paling cocok {1} tahun, yaitu perkiraan usia {2}–{3} tahun. Metode atlas memberi perkiraan, bukan usia minimum.","London Atlas (seluruh gigi geligi)","Bandingkan semua gigi yang sedang berkembang pada OPG dengan London Atlas of Human Tooth Development and Eruption (AlQahtani dkk. 2010) dan pilih kategori usia yang paling cocok. Paling berguna selama gigi masih berkembang (anak dan remaja). Memberi perkiraan usia, bukan usia minimum; untuk ambang 18 tahun gunakan metode molar ketiga di atas.","Kategori atlas paling cocok (tahun)","tidak dipakai",null,"14, 18 dan 21 adalah batas usia hukum yang umum (di Jerman: tanggung jawab pidana, dewasa, dewasa muda); periksa batas yang berlaku di negara Anda. “Tidak terbukti” tidak berarti orang tersebut lebih muda.","Buka London Atlas (PDF gratis)","Perangkat lunak atlas interaktif","Buka atlas di samping OPG (layar terbagi, atau atlas di perangkat kedua).","Untuk setiap gigi yang berkembang, lihat sejauh mana mahkota dan akar terbentuk dan di mana gigi berada terhadap tulang alveolar.","Mulai dari gambar yang paling dekat dengan usia yang diharapkan, lalu periksa satu tahun lebih muda dan satu tahun lebih tua.","Pilih gambar dengan gigi paling banyak yang cocok, lalu pilih di bawah.","Di bawah 1 tahun: atlas juga memiliki kategori dari 30 minggu dalam kandungan hingga 10,5 bulan; tulis di “Temuan lain”. Atlas gratis untuk pengajaran dan penggunaan pribadi (© AlQahtani, Queen Mary University of London); gambarnya tidak disalin ke aplikasi ini.","Lisensi dan kredit","Perangkat lunak pihak ketiga, font dan metode","Hak cipta dilindungi.","Perangkat lunak yang dipakai di aplikasi ini",null,"Masuk dan akun","Tampilkan teks Lisensi MIT","Font","Metode dan referensi (dikutip, tidak disalin)","dkk.","tahap mineralisasi gigi","tahap erupsi molar ketiga dan visibilitas ligamen periodontal","rekomendasi untuk estimasi usia forensik","hanya tautan eksternal; © Queen Mary University of London",null,"formulir dan panduan (2023)","kode temuan (2022)","Nilai referensi untuk estimasi usia berasal dari studi yang Anda masukkan sendiri. Metode dijelaskan dengan kata-kata aplikasi ini sendiri.","Subset IBM Plex Sans dan IBM Plex Mono, diganti nama sesuai syarat lisensi","Nama Font yang Dicadangkan","Font disimpan bersama aplikasi; tidak ada permintaan font ke Google. Lisensi lengkap: fonts-OFL.txt di samping aplikasi.","Nilai buku ajar yang khas untuk gigi permanen. Ukuran adalah nilai rata-rata menurut Wheeler’s Dental Anatomy. Variasi individu dan populasi sering terjadi.","Buka perbandingan, estimasi usia, log kasus, laporan PDF dan anatomi gigi.","Gambar dan citra saya","Anatomi gigi: ciri atas/bawah dan kanan/kiri","dimensi gigi rata-rata","Kasus","Bandingkan","Isi data kasus","Catat rekam AM","Catat temuan PM","Bandingkan AM dan PM","Tulis laporan","Buat laporan PDF","Odontologi forensik","Jenazah","Belum ada data kasus","Buka odontogram","gigi tercatat","Perbandingan","khas","Belum dimulai","entri rantai bukti","Kesimpulan ditulis","Belum ada kesimpulan","Panduan dan daftar periksa","Atas atau bawah, kanan atau kiri: ciri identifikasi setiap gigi","Hapus kasus ini","Pencocokan DVI: setiap jenazah dengan setiap orang hilang","Perbandingan rontgen: tumpangkan rontgen AM dan PM","Rekam gigi asing: sistem penomoran dan istilah","Alat","Pencocokan DVI","Urutkan orang hilang untuk setiap jenazah","Perbandingan rontgen","Tumpangkan rontgen AM dan PM","Rekam gigi asing","Nomor gigi dan istilah","Pemeriksa 1","Pemeriksa 2","INTERPOL menganjurkan dua odontolog. Pemeriksa 2 mencatat gigi yang sama secara mandiri; perbedaannya tercantum di bawah.","Sidik jari dokumen (SHA-256): ","Pencocokan","Identifikasi korban bencana","Tambahkan setiap jenazah (PM) dan setiap orang hilang (AM) sebagai rekam tersendiri lalu catat odontogramnya. Langkah berikutnya membandingkan setiap jenazah dengan semua orang hilang dan mengurutkan kandidat.","Tambah jenazah (PM)","Tambah orang hilang (AM)","Jenazah","Belum ada jenazah.","Orang hilang","Belum ada orang hilang.","Catat dulu minimal satu jenazah (PM) dan satu orang hilang (AM).","Pilih gambar","Tumpang tindih","Pilih dua gambar","Pilih rontgen post mortem sebagai dasar dan rontgen ante mortem untuk diletakkan di atasnya. Gambar berasal dari Log kasus → Foto & rontgen.","Belum ada gambar dalam kasus ini.","Tambah foto dan rontgen","Pilih dulu satu gambar PM dan satu AM di langkah 1.","Nomor gigi","Istilah kedokteran gigi","Konversi nomor gigi","Rekam asing sering memakai sistem penomoran lain. Ketik nomor seperti tertulis di rekam untuk menemukan nomor FDI.","Sistem dalam rekam","Universal (AS, 1–32 / A–T)","Palmer (Inggris, Persemakmuran)","Haderup (Skandinavia, rekam lama)","Gigi seperti tertulis","mis. 3, 6┘, 6+, 46","Gigi sulung","Simbol Palmer: ┘ kanan atas, └ kiri atas, ┐ kanan bawah, ┌ kiri bawah. Haderup: + atas, − bawah.","Istilah kedokteran gigi dalam bahasa lain","Pilih bahasa rekam AM untuk melihat arti istilah odontogram yang umum.","Bahasa rekam","Permukaan biasanya disingkat dengan huruf awalnya (M, O, D, B/V, L/P, I); hurufnya berubah menurut bahasa, misalnya V untuk vestibular dalam bahasa Prancis dan Spanyol.","Tanda peringatan","Frenulum labial atas robek pada bayi yang belum bisa berjalan.","Memar pada badan, telinga atau leher, frenulum, sudut rahang, pipi, kelopak mata atau subkonjungtiva pada anak di bawah 4 tahun, memar apa pun pada bayi di bawah 4,99 bulan, atau memar berpola (TEN-4-FACESp).","Cedera dengan usia berbeda, penjelasan yang tidak sesuai dengan cedera atau perkembangan anak, keterlambatan mencari pertolongan.","Penelantaran gigi: karies tidak dirawat, nyeri atau infeksi meskipun ada pengetahuan dan akses perawatan.","Pelaporan di Jerman","Dokumentasikan temuan dengan cermat menggunakan foto dan penjelasan yang diberikan (dengan kata-kata pengasuh sendiri).","§ 4 KKG: dokter gigi boleh membicarakan situasi dengan orang tua dan meminta saran dari tenaga ahli perlindungan anak yang berpengalaman (insoweit erfahrene Fachkraft) menggunakan data yang disamarkan.","Jika risiko bagi anak berlanjut, mereka boleh memberi tahu dinas kesejahteraan remaja (Jugendamt); dalam bahaya akut, hubungi polisi.","Layanan telepon medis perlindungan anak untuk profesional: 0800 19 210 00 (gratis, 24/7).","Anda tidak perlu membuktikan kekerasan. Kenali, dokumentasikan, dan teruskan kekhawatiran melalui jalur yang tepat.","Anak (gigi geligi sedang berkembang)","Periode paling akurat: banyak gigi berkembang bersamaan.","Metode: London Atlas, Demirjian, Willems (Demirjian modifikasi), apeks terbuka Cameriere, Ubelaker.","Kesalahan khas sekitar ±1 tahun, lebih besar pada akhir masa kanak-kanak.","Remaja dan dewasa muda","Molar ketiga sering menjadi satu-satunya gigi yang berkembang: mineralisasi (Demirjian), erupsi dan visibilitas PDL (Olze).","Gabungkan dengan rontgen tangan dan, bila perlu, CT klavikula (AGFAD). Laporkan usia minimum untuk ambang hukum.","Dewasa","Perubahan regresif: dentin sekunder (rasio pulpa/gigi, Kvaal; kaninus Cameriere), translusensi akar (Lamendin), resesi periodontal, atrisi.","Metode laboratorium: rasemisasi asam aspartat, anulasi sementum gigi.","Kesalahan sering ±5–10 tahun; berikan rentang usia, bukan satu angka.","Setiap metode memiliki sebaran; laporkan studi referensi, populasinya, jenis kelamin dan rentang statistik yang dipakai.","Data referensi dari satu populasi dapat melebih-lebihkan atau meremehkan usia pada populasi lain (etnis, gizi, status sosial ekonomi).","Molar ketiga sangat bervariasi dan bisa tidak ada atau impaksi; impaksi dapat memperlambat perkembangan.","Mimikri usia: estimasi titik cenderung bergeser ke usia rata-rata sampel referensi.","Untuk ambang usia hukum, gunakan konsep usia minimum (usia termuda tahap itu teramati) agar anak tidak dinyatakan dewasa.","Selalu gabungkan temuan gigi, rangka dan fisik (AGFAD).","Hasil gigi mendukung penilaian usia; tidak membuktikan tanggal lahir.","Bekas gigitan berubah cepat pada kulit orang hidup maupun mati. Dokumentasikan sejak dini dan berulang, sebelum pengambilan swab atau pembersihan mengganggu area.","Lokasi pada tubuh, posisi tubuh dan kelengkungan permukaan dideskripsikan","Foto keseluruhan yang menunjukkan lokasi anatomis","Close-up dengan skala ABFO No. 2 pada bidang yang sama dengan cedera","Kamera tegak lurus terhadap bekas; tanpa distorsi lensa lebar","Foto serial selama beberapa hari (hidup: setiap hari selama beberapa hari; meninggal: dalam 24–48 jam)","Cahaya alternatif: fotografi UV dan inframerah dipertimbangkan","Pengukuran: lebar lengkung, ukuran bekas, jarak antarbekas","Deskripsi tertulis: bentuk, warna, lecet, memar, laserasi, kemungkinan bekas gigi","Swab saliva sebelum pembersihan: teknik swab ganda (basah lalu kering)","Swab kontrol dari area kulit yang tidak tergigit","Swab dikeringkan di udara, dikemas dalam kertas, diberi label, rantai bukti dimulai","Cetakan kulit yang cedera (jika ada lekukan) dengan bahan viskositas rendah","Eksisi jaringan hanya oleh ahli patologi forensik dengan kewenangan hukum, difiksasi pada cincin penyangga","Gigi tersangka hanya dengan kewenangan hukum/persetujuan: foto, cetakan, registrasi gigitan","Perbandingan dilakukan tanpa mengetahui informasi kasus bila memungkinkan","DNA dari saliva adalah penghubung paling andal antara gigitan dan seseorang. Swab dulu, baru periksa.","Batas ilmiah","Tinjauan dasar ilmiah NIST (2023) menyimpulkan bahwa tiga premis utama analisis bekas gigitan tidak didukung data:","Gigi anterior manusia unik pada tingkat individu.","Keunikan ini dipindahkan secara akurat ke kulit manusia.","Ciri-cirinya dapat ditangkap dan ditafsirkan secara akurat dengan teknik analisis.","Kulit elastis dan melengkung; memar menyebar dan berubah; posisi saat menggigit tidak diketahui.","Pemeriksa sering tidak sepakat bahkan tentang apakah cedera merupakan gigitan manusia (PCAST 2016).","Beberapa vonis keliru dikaitkan dengan kesaksian bekas gigitan.","Gunakan bekas gigitan untuk dokumentasi, mengenali kemungkinan gigitan dan pengambilan sampel DNA. Jangan mengidentifikasi penggigit hanya dari polanya.","Laporan ahli","Tuliskan","Apa yang diperiksa, kapan, oleh siapa dan dengan metode apa.","Apakah cedera sesuai dengan gigitan manusia, gigitan hewan, atau bukan gigitan / tidak dapat ditentukan.","Keterbatasan: distorsi kulit, kualitas gambar, waktu sejak cedera, dasar ilmiah.","Rujuk hasil DNA untuk setiap kaitan dengan seseorang.","Hindari","“Cocok”, “penggigit teridentifikasi”, “kepastian dental yang wajar” atau probabilitas apa pun yang tidak berdasarkan data.","Membandingkan dengan satu tersangka saja tanpa deretan gigi geligi lain.","Membaca informasi kasus yang tidak diperlukan untuk pertanyaan gigi.","Pernyataan terkuat yang dapat diterima tentang seseorang: “tidak dapat dieksklusi” atau “dieksklusi” – dan hanya dengan alasan jelas dan keterbatasan yang dinyatakan.","Gigi melindungi DNA di pulpa dan dentin, bahkan setelah kebakaran, penguburan atau interval post mortem yang lama.","Utamakan molar atau premolar yang utuh dan tanpa restorasi; hindari gigi dengan tambalan besar atau perawatan saluran akar.","Catat, foto dan rontgen gigi sebelum pengambilan sampel – pencabutan bersifat merusak.","Pakai sarung tangan dan masker, gunakan alat bersih, hindari menyentuh akar, kemas kering dalam kertas atau tabung steril.","Swab saliva dari kulit, bekas gigitan atau benda: teknik swab ganda, keringkan di udara, kemasan kertas.","Beri label nomor kasus, nomor gigi, tanggal dan petugas; mulai rantai bukti.","DVI mengikuti standar INTERPOL agar tim dari berbagai negara bekerja dengan formulir dan aturan mutu yang sama.","Empat fase","TKP: evakuasi jenazah dan fragmen, penomoran dan dokumentasi lokasi.","Post mortem: pemeriksaan di kamar jenazah (formulir PM merah muda; bagian gigi F1/F2).","Ante mortem: pengumpulan rekam orang hilang (formulir AM kuning).","Rekonsiliasi: perbandingan dan konfirmasi oleh dewan identifikasi.","Tugas tim gigi","Bekerja berpasangan: satu pemeriksa, satu pencatat; tim kedua memeriksa setiap odontogram.","Catat dengan penomoran FDI dan kode INTERPOL; rontgen dan foto setiap kasus.","Masukkan data ke perangkat lunak DVI (mis. DVI System International / Plass Data) untuk pencarian.","Jangan pernah mengubah odontogram PM setelah data AM diketahui; catat koreksi sebagai entri baru.","Perangkat lunak menyarankan kandidat; identifikasi diputuskan oleh para ahli, biasanya dengan identifikator primer kedua bila tersedia.","Gigi sulung – erupsi (bulan)","Atas","Bawah","Gigi permanen – erupsi (tahun)","Akar terbentuk lengkap sekitar 2–3 tahun setelah erupsi (kaninus dan molar lebih lama).","Anak perempuan biasanya sedikit lebih cepat daripada anak laki-laki; populasi berbeda.","Erupsi lebih bervariasi daripada mineralisasi; untuk estimasi usia utamakan tahap perkembangan radiografis.","Ekstraoral: wajah, bibir, cedera perioral difoto","Akses ke mulut (rigor, pembusukan); reseksi rahang hanya dengan kewenangan hukum","Jaringan lunak: mukosa, frenulum, lidah, palatum, tindik, tato","Rahang: fraktur, area tak bergigi, penyembuhan soket, patologi","Setiap gigi dicatat (FDI), termasuk permukaan, bahan dan anomali","Oklusi, keausan, pewarnaan, rotasi, diastema","Protesa dilepas, difoto dan diperiksa adanya nama atau nomor","Rontgen dan foto diambil; pemeriksa kedua memeriksa odontogram","Identifikasi gigi membandingkan temuan post mortem (PM) dengan rekam ante mortem (AM) orang hilang. Ini salah satu identifikator primer yang diakui INTERPOL, bersama sidik jari dan DNA.","Sumber AM","Odontogram dan catatan perawatan, termasuk catatan tagihan (yang menunjukkan tanggal dan gigi yang dirawat).","Rontgen: OPG, periapikal, bitewing, CBCT. Selalu minta yang asli atau ekspor digital resolusi penuh.","Foto, pemindaian intraoral, model studi, rekam ortodonti.","Foto senyum dari keluarga atau media sosial (berguna untuk gigi depan).","Prosedur","Catat gigi geligi PM selengkapnya sebelum membandingkan (hindari bias).","Ambil rontgen PM yang sesuai dengan proyeksi AM (sudut, area, jenis film).","Bandingkan restorasi, pengisian saluran akar, morfologi akar, kontur sinus, pola trabekular dan anomali.","Klasifikasikan setiap perbedaan sebagai dapat dijelaskan (perawatan setelah rekam AM) atau tak terjelaskan.","Skala kesimpulan (INTERPOL/ABFO): pasti/positif · kemungkinan besar · mungkin · tidak cukup · dieksklusi. Satu ketidaksesuaian tak terjelaskan dapat mengeksklusi; tidak ada jumlah minimum titik kesesuaian yang tetap.","Dokumentasikan setiap cedera dengan lokasi, ukuran, bentuk, warna dan skala ABFO No. 2.","Bibir dan frenulum: laserasi akibat gigi di belakangnya menunjukkan kekerasan tumpul pada mulut.","Fraktur rahang: mandibula (kondilus, angulus, simfisis) dan wajah tengah (Le Fort I–III, zigoma).","Aturan pinggir topi: cedera di atas garis pinggir topi lebih menunjukkan pukulan daripada jatuh biasa.","Catat cedera lama dan baru secara terpisah; minta rekam gigi sebelumnya.","Laporan forensik harus memungkinkan pembaca melihat apa yang ditemukan dan, secara terpisah, apa yang disimpulkan ahli darinya.","Observasi","Interpretasi","Gigi 21 tidak ada, soket terbuka dengan tepi tajam, tanpa penyembuhan tulang.","Sesuai dengan kehilangan gigi post mortem.","Molar ketiga 38 pada tahap H Demirjian.","Usia minimum 18,2 tahun (studi referensi X).","Pola memar melengkung, lebar 35 mm, pada lengan bawah.","Sesuai dengan gigitan manusia; tidak layak untuk mengidentifikasi seseorang.","Gunakan kata netral dan terukur untuk temuan (ukuran, warna, lokasi).","Gunakan istilah bertingkat untuk interpretasi: “sesuai dengan”, “khas untuk”, “mengeksklusi”.","Sebutkan penjelasan alternatif dan batas metode.","Tetap dalam bidang Anda; serahkan penyebab kematian dan penilaian hukum kepada pihak lain.","Tahap pembusukan: segar, kembung, pembusukan aktif, pembusukan lanjut, kerangka; kecepatannya bergantung pada suhu, kelembapan, serangga dan penguburan.","Gigi berakar tunggal sering lepas post mortem; cari soket kosong bertepi tajam (tanpa penyembuhan).","“Gigi merah muda” adalah fenomena post mortem (hemoglobin dalam dentin) dan tidak menunjukkan penyebab kematian.","Sisa terbakar: gigi menjadi rapuh dan berubah warna; foto in situ, stabilkan sebelum dipindahkan, simpan fragmen bersama.","Periksa apakah gigi berasal dari manusia, dan pisahkan sisa yang tercampur dengan mencocokkan oklusi, keausan dan perkembangan.","Deskripsikan cedera dengan tepat: fraktur mahkota atau akar, luksasi, avulsi, fraktur alveolar, cedera jaringan lunak.","Reaksi vital (perdarahan, pembengkakan, peradangan) menunjukkan cedera semasa hidup.","Fraktur perimortem pada tulang segar memiliki tepi tajam berwarna sama; patahan post mortem pada tulang kering lebih pucat dan tidak beraturan.","Kekerasan tumpul pada wajah sering menyebabkan fraktur insisivus atas bersama laserasi bibir.","Pertimbangkan jatuh, penyerangan, kecelakaan, kejang dan tindakan medis (mis. intubasi) sebagai penyebab.","Laporkan apa yang terlihat; nyatakan apakah temuan sesuai dengan mekanisme yang diajukan, dan sebutkan penyebab lain yang mungkin.","Pemeriksaan dua pemeriksa","Nama pemeriksa 2","Kesepakatan","{1} gigi berbeda. Periksa bersama dan pilih temuan yang benar.","Pe четайте несколько признаков.",null,"Добавить изображение","Загрузите скриншоты 3D-моделей зубов, рисунки или свои фото. Они показываются для зуба {1} и {2} (тот же зуб с другой стороны) и сохраняются на этом устройстве для всех дел.","Для этого зуба изображений пока нет.","Вид, напр. медиальный, щёчный, 3D","Сравнить с текущим делом","Изображения дела появятся здесь, если указать зуб {1} в поле «Изображённые зубы» в разделе Журнал дела › Фото и рентгенограммы.","Режущий край с 3 бугорками в молодом возрасте","1, конический","Самый широкий резец. Медиально-режущий угол острый (около 90°), дистально-режущий закруглён. Бугорок слегка дистально.","Широкая коронка (около 8,5 мм), выраженный бугорок и краевые валики; корень на срезе округлый. Нижний центральный резец шириной около 5 мм и уплощён.","Медиально-режущий угол острый, дистально-режущий закруглён; дистальный контур коронки выпуклее; верхушка корня отклонена дистально.","Режущий край, углы более закруглены, чем у центрального","1, верхушка часто изогнута дистально","Меньше и округлее центрального резца. Часто вариант: шиловидный или врождённо отсутствует.","Закруглённые режущие углы, возможна нёбная ямка; корень округлый. Нижние боковые узкие, с уплощёнными корнями.","Дистальный угол заметно круглее медиального; верхушка корня обычно изогнута дистально.","1 острый бугор; медиальный скат короче дистального","1, самый длинный корень в зубном ряду","Самый длинный зуб. Выраженный губной валик. Дистальный контур выпуклее.","Широкая коронка с вершиной бугра близко к центру; медиальный и дистальный контуры выступают за корень. Нижние клыки уже, их медиальный контур прямо переходит в корень.","Медиальный скат бугра короче дистального; дистальная контактная точка расположена ближе к шейке; верхушка корня изогнута дистально.","2: щёчный больше нёбного","Обычно 2 (щёчный и нёбный)","Медиальная вогнутость коронки и корня. Вершина щёчного бугра слегка дистально.","Два хорошо развитых бугра и обычно два корня. Нижний первый премоляр имеет один доминирующий щёчный бугор, крошечный язычный бугор и один корень.","Медиальная вогнутость коронки и корня (со стороны клыковой ямки); вершина щёчного бугра слегка дистально.","2 почти одинаковых","Обычно 1","1 или 2","Симметричнее первого премоляра; без выраженной медиальной вогнутости.","Два бугра почти одинаковой высоты, овальный окклюзионный контур. Нижние вторые премоляры округлее или квадратнее, коронка наклонена язычно.","Вершина щёчного бугра слегка медиально; вершина нёбного бугра смещена медиально.","4 (медиально-нёбный наибольший), часто бугорок Карабелли","3 (медиально-щёчный, дистально-щёчный, нёбный)","3–4 (второй медиально-щёчный канал встречается часто)","Самый крупный верхний зуб. Косой валик от медиально-нёбного к дистально-щёчному бугру. Ромбовидный окклюзионный контур.","Три корня (два щёчных, один нёбный), ромбовидная коронка, косой валик. Нижние первые моляры имеют два корня (медиальный и дистальный) и прямоугольную коронку.","Медиально-нёбный бугор наибольший; бугорок Карабелли медиально-нёбно; медиально-щёчный корень шире дистально-щёчного.","4, дистально-нёбный бугор меньше или отсутствует","3, часто сближены или сращены","Меньше первого моляра и более сердцевидный; без бугорка Карабелли.","Три корня (часто сближены), сердцевидная коронка. Нижние вторые моляры имеют два корня и крестообразный рисунок фиссур.","Дистально-нёбный бугор уменьшен; корни наклонены дистально.","Вариабельно, часто 3","Вариабельно, часто сращены","Вариабельно","17–21 (часто ретинирован)","Форма и положение очень вариабельны. Стадии развития используются для оценки возраста.","Маленькая, часто треугольная коронка; корни обычно сращены в один конус.","Часто ненадёжно; используйте оставшиеся нёбные и медиальные признаки и наклон корня (дистально).","Режущий край, коронка симметрична","1, уплощён в медиально-дистальном направлении","1, иногда 2 (губной и язычный)","Самый маленький зуб в ряду. Медиальная и дистальная половины почти зеркальны.","Узкая симм нтактен","Источник: перечень KZBV допустимых кодов находок (электронный план лечения, 2022). * Распространённые практические коды, которых нет в перечне KZBV. Клиники могут использовать свои варианты; при сомнении уточните у лечащего стоматолога.","Чтение немецких записей AM (коды находок)","Имплантат (старые записи; сейчас sk, sb, st …)","Зуб присутствует в обоих","в одной записи детали не отмечены","Имплантат AM","детали PM не отмечены","Поворот","Аномалия положения","Диастема","Изменить","Состояние PM; нажмите на зуб, чтобы посмотреть или изменить AM и PM","Основано на рекомендациях Рабочей группы по судебной диагностике возраста (AGFAD). Проверьте актуальную версию на сайте AGFAD.","В уголовных делах необходимо постановление суда по § 81a УПК Германии, поскольку у рентгенограмм нет медицинских показаний.","Австрия: в уголовных делах исследование назначает прокуратура на основании разрешения суда (§ 123 УПК Австрии). Проверьте, охватывает ли постановление рентгенограммы без медицинских показаний.","Швейцария: в уголовном процессе исследование назначает прокуратура или суд по делам несовершеннолетних (ст. 251 УПК Швейцарии); дела об убежище регулируются Законом об убежище. Убедитесь, что письменное постановление охватывает рентгенограммы.","Перед рентгенограммами без медицинских показаний проверьте, какое правовое основание требуется в вашей стране (например, постановление суда или письменное информированное согласие), и укажите его в Настройки → Страна суда.","Страна суда","Германия","Австрия","Швейцария","Другая страна","Ваше правовое основание (необязательно, заменяет текст выше)","напр. постановление суда по … из …","Используется в чек-листе оценки возраста и в заключении. Законы меняются: всегда проверяйте актуальную правовую ситуацию.","Пакистан","Пакистан: согласно разделу 8 Juvenile Justice System Act 2018, возраст устанавливается по свидетельству о рождении или школьным документам; при их отсутствии — по заключению медицинского освидетельствования медицинского работника. Суд фиксирует своё решение о возрасте. Проверьте, охватывает ли постановление рентгенограммы.","Индия","Индия: согласно разделу 94 Juvenile Justice (Care and Protection of Children) Act 2015, приоритет имеют школьный аттестат или свидетельство о рождении; только при их отсутствии по постановлению Juvenile Justice Board или Child Welfare Committee может проводиться тест оссификации или иная медицинская оценка возраста. Медицинское освидетельствование обвиняемого: раздел 51 Bharatiya Nagarik Suraksha Sanhita 2023.","США","США: правила различаются по штатам. Принудительное освидетельствование, как правило, требует ордера или постановления суда либо информированного согласия (Четвёртая поправка). Для несопровождаемых несовершеннолетних под иммиграционной опекой возраст устанавливается по 8 U.S.C. § 1232(b)(4) и 45 CFR § 410.1702: учитываются все доказательства, и рентгенограммы не могут быть единственным основанием.","Австралия","Австралия (федеральные преступления): согласно части IAA Crimes Act 1914 (s 3ZQA и далее), процедура определения возраста (сейчас рентгенограмма кисти и запястья) требует необходимых согласий или постановления магистрата. У штатов и территорий свои правила.","Саудовская Аравия","Саудовская Аравия: согласно ст. 3 Закона о несовершеннолетних (Королевский указ M/113, 1439 г. х.), возраст рассчитывается по официальному документу; суд может направить несовершеннолетнего в компетентный медицинский орган для оценки возраста.","ОАЭ","ОАЭ: дела несовершеннолетних регулируются федеральным законом о несовершеннолетних правонарушителях (Федеральный закон № 6 от 2022 г.). При отсутствии официального документа суд или прокуратура могут назначить медицинского эксперта для оценки возраста. Проверьте точную статью для вашего дела.","Катар","Катар: медицинские освидетельствования по уголовным делам назначают прокуратура или суд (УПК, Закон № 23 от 2004 г.); дела несовершеннолетних регулируются Законом о несовершеннолетних (Закон № 1 от 1994 г.). Проверьте точную статью для вашего дела.","Китай","Китай: согласно ст. 132 Уголовно-процессуального закона (2018), освидетельствование подозреваемого при необходимости может быть принудительным; ст. 146 предусматривает экспертизу. Прокуроры обязаны проверять возраст несовершеннолетних подозреваемых (правила 2026 г. Верховной народной прокуратуры и Министерства общественной безопасности).","Япония","Япония: освидетельствование подозреваемого требует ордера на освидетельствование, выданного судьёй (ст. 218 УПК); экспертиза, затрагивающая тело, требует разрешения судьи на экспертные действия (ст. 225 во взаимосвязи со ст. 168).","London Atlas (AlQahtani и соавт. 2010): наиболее подходящая категория {1} лет, т. е. оценочный возраст {2}–{3} лет. Методы атласа дают оценку, а не минимальный возраст.","London Atlas (весь зубной ряд)","Сравните все развивающиеся зубы на ОПТГ с London Atlas of Human Tooth Development and Eruption (AlQahtani и соавт. 2010) и выберите наиболее подходящую возрастную категорию. Наиболее полезно, пока зубы ещё развиваются (дети и подростки). Даёт оценочный, а не минимальный возраст; для порога 18 лет используйте методы по третьим молярам выше.","Наиболее подходящая категория атласа (лет)","не используется",null,"14, 18 и 21 год — распространённые правовые возрастные границы (в Германии: уголовная ответственность, совершеннолетие, молодой взрослый); проверьте границы, действующие в вашей стране. «Не доказано» не означает, что лицо младше.","Открыть London Atlas (бесплатный PDF)","Интерактивная программа атласа","Откройте атлас рядом с ОПТГ (разделённый экран или атлас на втором устройстве).","Для каждого развивающегося зуба оцените, насколько сформированы коронка и корень и где зуб находится относительно альвеолярной кости.","Начните со схемы, ближайшей к ожидаемому возрасту, затем проверьте на год младше и на год старше.","Выберите схему, с которой совпадает больше всего зубов, и отметьте её ниже.","До 1 года: в атласе есть также категории от 30 недель внутриутробно до 10,5 месяцев; запишите их в «Другие находки». Атлас бесплатен для обучения и индивидуального использования (© AlQahtani, Queen Mary University of London); его изображения не копируются в приложение.","Лицензии и благодарности","Стороннее ПО, шрифты и методы","Все права защищены.","ПО, используемое в приложении",null,"Вход и аккаунт","Показать текст лицензии MIT","Шрифты","Методы и источники (цитируются, не копируются)","и соавт.","стадии минерализации зубов","стадии прорезывания третьих моляров и видимость периодонтальной щели","рекомендации по судебной оценке возраста","только внешняя ссылка; © Queen Mary University of London",null,"формы и руководство (2023)","коды находок (2022)","Референсные значения для оценки возраста берутся из исследования, которое вы вводите сами. Методы описаны собственными словами приложения.","Подмножества IBM Plex Sans и IBM Plex Mono, переименованные согласно лицензии","Зарезервированное имя шрифта","Шрифты хранятся вместе с приложением; запросы шрифтов к Google не отправляются. Полная лицензия: fonts-OFL.txt рядом с приложением.","Типичные учебные значения для постоянных зубов. Размеры — средние значения по Wheeler’s Dental Anatomy. Индивидуальные и популяционные различия обычны.","Откройте сравнение, оценку возраста, журнал дела, PDF-заключение и анатомию зубов.","Мои изображения","Анатомия зубов: признаки верхний/нижний и правый/левый","средние размеры зубов","Дело","Сравнить","Введите данные дела","Отметьте запись AM","Отметьте находки PM","Сравните AM и PM","Напишите заключение","Создайте PDF-заключение","Судебная стоматология","Труп","Данных дела пока нет","Открыть зубную формулу","зубов отмечено","Сравнение","отличительных","Не начато","записей цепи хранения","Вывод написан","Вывода пока нет","Руководства и чек-листы","Верхний или нижний, правый или левый: идентификационные признаки каждого зуба","Удалить это дело","Сопоставление DVI: каждый труп с каждым пропавшим","Сравнение рентгенограмм: наложение снимков AM и PM","Иностранные стоматологические записи: системы нумерации и термины","Инструменты","Сопоставление DVI","Ранжировать пропавших для каждого трупа","Сравнение рентгенограмм","Наложение снимков AM и PM","Иностранные стоматологические записи","Номера зубов и термины","Эксперт 1","Эксперт 2","ИНТЕРПОЛ рекомендует двух одонтологов. Эксперт 2 независимо отмечает те же зубы; различия перечислены ниже.","Цифровой отпечаток документа (SHA-256): ","Сопоставление","Идентификация жертв катастроф","Добавьте каждый труп (PM) и каждого пропавшего (AM) отдельной записью и заполните формулу. Следующий шаг сравнивает каждый труп со всеми пропавшими и ранжирует кандидатов.","Добавить труп (PM)","Добавить пропавшего (AM)","Трупы","Трупов пока нет.","Пропавшие","Пропавших пока нет.","Сначала заполните формулу хотя бы одного трупа (PM) и одного пропавшего (AM).","Выбрать изображения","Наложение","Выберите два изображения","Выберите посмертную рентгенограмму как основу и прижизненную — для наложения сверху. Изображения берутся из Журнал дела → Фото и рентгенограммы.","В этом деле пока нет изображений.","Добавить фото и рентгенограммы","Сначала выберите изображение PM и AM на шаге 1.","Номера зубов","Стоматологические термины","Преобразовать номера зубов","В иностранных записях часто используется другая система нумерации. Введите номер так, как он записан, чтобы найти номер FDI.","Система в записи","Universal (США, 1–32 / A–T)","Palmer (Великобритания, Содружество)","Haderup (Скандинавия, старые записи)","Зуб, как записан","напр. 3, 6┘, 6+, 46","Молочные зубы","Символы Палмера: ┘ верхний правый, └ верхний левый, ┐ нижний правый, ┌ нижний левый. Haderup: + верх, − низ.","Стоматологические термины на других языках","Выберите язык записи AM, чтобы увидеть значение распространённых терминов.","Язык записи","Поверхности обычно сокращают по первой букве (M, O, D, B/V, L/P, I); буквы зависят от языка, например V — вестибулярная во французском и испанском.","Тревожные признаки","Разрыв уздечки верхней губы у младенца, который ещё не ходит.","Кровоподтёки на туловище, ушах или шее, уздечке, углу челюсти, щеках, веках или под конъюнктивой у детей младше 4 лет, любой кровоподтёк у младенцев младше 4,99 месяца или узорчатые кровоподтёки (TEN-4-FACESp).","Повреждения разной давности, объяснения, не соответствующие травме или развитию ребёнка, задержка обращения за помощью.","Стоматологическое пренебрежение: нелеченный кариес, боль или инфекция при наличии знаний и доступа к помощи.","Сообщение в Германии","Тщательно документируйте находки фото и данным объяснением (словами опекуна).","§ 4 KKG: стоматологи могут обсудить ситуацию с родителями и получить консультацию опытного специалиста по защите детей (insoweit erfahrene Fachkraft), используя псевдонимизированные данные.","Если риск для ребёнка сохраняется, они могут сообщить в службу по делам молодёжи (Jugendamt); при острой опасности — в полицию.","Медицинская горячая линия по защите детей для специалистов: 0800 19 210 00 (бесплатно, круглосуточно).","Вам не нужно доказывать насилие. Распознайте, задокументируйте и передайте опасения по надлежащим каналам.","Дети (развивающийся зубной ряд)","Самый точный период: одновременно развивается много зубов.","Методы: London Atlas, Demirjian, Willems (модифицированный Demirjian), открытые верхушки по Cameriere, Ubelaker.","Типичная ошибка около ±1 года, больше в позднем детстве.","Подростки и молодые взрослые","Третьи моляры часто единственные развивающиеся зубы: минерализация (Demirjian), прорезывание и видимость периодонтальной щели (Olze).","Сочетайте с рентгенограммой кисти и при необходимости КТ ключиц (AGFAD). Для правовых порогов указывайте минимальный возраст.","Взрослые","Регрессивные изменения: вторичный дентин (соотношение пульпа/зуб, Kvaal; клык по Cameriere), прозрачность корня (Lamendin), рецессия пародонта, стираемость.","Лабораторные методы: рацемизация аспарагиновой кислоты, кольца зубного цемента.","Ошибки часто ±5–10 лет; указывайте возрастной диапазон, а не одно число.","У каждого метода есть разброс; указывайте референсное исследование, его популяцию, пол и используемый статистический интервал.","Референсные данные одной популяции могут завышать или занижать возраст в другой (этническая принадлежность, питание, социально-экономический статус).","Третьи моляры очень вариабельны, могут отсутствовать или быть ретинированы; ретенция может задерживать развитие.","Возрастная мимикрия: точечные оценки смещаются к среднему возрасту референсной выборки.","Для правовых возрастных порогов используйте концепцию минимального возраста (наименьший возраст, при котором стадия наблюдалась), чтобы не признать несовершеннолетнего взрослым.","Всегда сочетайте стоматологические, скелетные и физикальные данные (AGFAD).","Стоматологический результат подкрепляет оценку возраста; он не доказывает дату рождения.","Следы укуса быстро меняются на коже живых и умерших. Документируйте рано и повторно, до того как взятие мазков или очистка нарушат участок.","Описаны локализация на теле, положение тела и кривизна поверхности","Обзорный снимок с анатомической локализацией","Крупные планы с масштабом ABFO № 2 в одной плоскости с повреждением","Камера перпендикулярна следу; без искажений широкоугольного объектива","Серийные снимки в течение дней (живые: ежедневно несколько дней; умершие: в течение 24–48 ч)","Альтернативный свет: рассмотрена УФ- и ИК-съёмка","Измерения: ширина дуги, размеры следа, расстояния между следами","Письменное описание: форма, цвет, ссадины, кровоподтёки, раны, возможные отпечатки зубов","Мазок слюны до очистки: метод двойного мазка (влажный, затем сухой)","Контрольный мазок с неукушенного участка кожи","Мазки высушены на воздухе, упакованы в бумагу, промаркированы, начата цепь хранения","Оттиск повреждённой кожи (при наличии вдавлений) материалом низкой вязкости","Иссечение ткани только судебно-медицинским экспертом с правовыми полномочиями, фиксация на опорном кольце","Зубы подозреваемого только при правовых полномочиях/согласии: фото, оттиски, регистрация прикуса","Сравнения по возможности проводятся без знания обстоятельств дела","ДНК из слюны — самая надёжная связь между укусом и человеком. Сначала мазок, затем исследование.","Научные ограничения","Обзор научных основ NIST (2023) показал, что три ключевых допущения анализа следов укуса не подтверждаются данными:","Передние зубы человека уникальны на индивидуальном уровне.","Эта уникальность точно переносится на кожу человека.","Признаки можно точно зафиксировать и интерпретировать методами анализа.","Кожа эластична и изогнута; кровоподтёки расплываются и меняются; положение в момент укуса неизвестно.","Эксперты часто расходятся даже в том, является ли повреждение укусом человека (PCAST 2016).","Ряд ошибочных обвинительных приговоров был связан с показаниями о следах укуса.","Используйте следы укуса для документирования, распознавания возможного укуса и взятия ДНК. Не идентифицируйте укусившего только по рисунку.","Экспертное заключение","Укажите","Что исследовано, когда, кем и каким методом.","Соответствует ли повреждение укусу человека, укусу животного или не является укусом / не определено.","Ограничения: деформация кожи, качество изображений, давность повреждения, научная основа.","Для любой связи с человеком ссылайтесь на результаты ДНК.","Избегайте","«Совпадение», «укусивший установлен», «разумная стоматологическая уверенность» или любой вероятности, не основанной на данных.","Сравнения с одним подозреваемым без ряда других зубных рядов.","Чтения сведений по делу, не нужных для стоматологического вопроса.","Самое сильное допустимое утверждение о человеке: «не может быть исключён» или «исключён» — и только с ясным обоснованием и указанием ограничений.","Зубы защищают ДНК в пульпе и дентине даже после огня, захоронения или длительного посмертного интервала.","Предпочтительны целые моляры или премоляры без реставраций; избегайте зубов с большими пломбами или запломбированными каналами.","Перед взятием образца отметьте, сфотографируйте и сделайте рентгенограмму зуба — удаление разрушительно.","Перчатки и маска, чистые инструменты, не касайтесь корня, упаковывайте сухим в бумагу или стерильную пробирку.","Мазки слюны с кожи, следов укуса или предметов: метод двойного мазка, сушка на воздухе, бумажная упаковка.","Маркируйте номером дела, номером зуба, датой и исполнителем; начните цепь хранения.","DVI следует стандарту ИНТЕРПОЛа, чтобы команды разных стран работали с одними формами и правилами качества.","Четыре фазы","Место происшествия: извлечение тел и фрагментов, нумерация и документирование местоположения.","Посмертная: исследование в морге (розовые формы PM; стоматологический раздел F1/F2).","Прижизненная: сбор записей пропавших (жёлтые формы AM).","Сверка: сравнение и подтверждение комиссией по идентификации.","Задачи стоматологической группы","Работайте парами: один исследует, другой записывает; вторая группа проверяет каждую формулу.","Используйте нумерацию FDI и коды ИНТЕРПОЛа; каждое дело рентгенографируйте и фотографируйте.","Вносите данные в ПО DVI (напр. DVI System International / Plass Data) для поиска.","Никогда не меняйте формулу PM после получения данных AM; исправления вносите новыми записями.","ПО предлагает кандидатов; идентификацию определяют эксперты, обычно со вторым первичным идентификатором, если он доступен.","Молочные зубы – прорезывание (месяцы)","Верхние","Нижние","Постоянные зубы – прорезывание (годы)","Формирование корня завершается примерно через 2–3 года после прорезывания (у клыков и моляров дольше).","Девочки обычно немного опережают мальчиков; популяции различаются.","Прорезывание вариабельнее минерализации; для оценки возраста предпочтительны рентгенологические стадии развития.","Внеротово: лицо, губы, околоротовые повреждения сфотографированы","Доступ к полости рта (окоченение, разложение); резекция челюсти только при правовых полномочиях","Мягкие ткани: слизистая, уздечки, язык, нёбо, пирсинг, татуировки","Челюсти: переломы, беззубые участки, заживление лунок, патология","Каждый зуб отмечен (FDI), включая поверхности, материалы и аномалии","Окклюзия, стираемость, окрашивание, повороты, диастемы","Протезы сняты, сфотографированы и проверены на имена или номера","Сделаны рентгенограммы и фото; второй эксперт проверил формулу","Стоматологическая идентификация сравнивает посмертные (PM) данные с прижизненными (AM) записями пропавшего. Это один из первичных идентификаторов, признанных ИНТЕРПОЛом, наряду с отпечатками пальцев и ДНК.","Источники AM","Зубная карта и записи о лечении, включая счета (показывают даты и леченные зубы).","Рентгенограммы: ОПТГ, прицельные, интерпроксимальные, КЛКТ. Всегда запрашивайте оригинал или цифровой экспорт в полном разрешении.","Фотографии, внутриротовые сканы, диагностические модели, ортодонтические записи.","Фото с улыбкой от родственников или из соцсетей (полезны для передних зубов).","Порядок действий","Полностью отметьте посмертный зубной ряд до сравнения (избегайте предвзятости).","Делайте посмертные снимки, соответствующие проекциям AM (угол, область, тип плёнки).","Сравнивайте реставрации, пломбировку каналов, морфологию корней, контур пазухи, трабекулярный рисунок и аномалии.","Классифицируйте каждое различие как объяснимое (лечение после записей AM) или необъяснимое.","Шкала выводов (ИНТЕРПОЛ/ABFO): установлена/положительная · вероятная · возможная · недостаточно · исключена. Одно необъяснимое расхождение может исключить; фиксированного минимума совпадающих точек нет.","Документируйте каждое повреждение с локализацией, размером, формой, цветом и масштабом ABFO № 2.","Губы и уздечки: раны от прилегающих зубов указывают на тупое воздействие на рот.","Переломы челюстей: нижняя челюсть (мыщелок, угол, симфиз) и средняя зона лица (Le Fort I–III, скуловая кость).","Правило полей шляпы: повреждения выше линии полей шляпы указывают скорее на удары, чем на простое падение.","Отмечайте старые и новые повреждения раздельно; запросите прежние стоматологические записи.","Судебное заключение должно позволять читателю видеть, что обнаружено, и отдельно — какой вывод из этого делает эксперт.","Наблюдение","Интерпретация","Зуб 21 отсутствует, лунка открыта с острыми краями, без заживления кости.","Соответствует посмертной утрате зуба.","Третий моляр 38 на стадии H по Demirjian.","Минимальный возраст 18,2 года (референсное исследование X).","Дугообразный рисунок кровоподтёков шириной 35 мм на предплечье.","Соответствует укусу человека; не пригодно для идентификации личности.","Для находок используйте нейтральные измеримые слова (размер, цвет, локализация).","Для интерпретаций используйте градуированные термины: «соответствует», «типично для», «исключает».","Называйте альтернативные объяснения и ограничения метода.","Оставайтесь в своей области; причину смерти и правовую оценку оставьте другим.","Стадии разложения: свежая, вздутие, активное разложение, позднее разложение, скелетирование; скорость зависит от температуры, влажности, насекомых и захоронения.","Однокорневые зубы часто выпадают посмертно; ищите пустые лунки с острыми краями (без заживления).","«Розовые зубы» — посмертное явление (гемоглобин в дентине) и не указывают на причину смерти.","Обгоревшие останки: зубы становятся хрупкими и меняют цвет; фотографируйте на месте, стабилизируйте перед перемещением, храните фрагменты вместе.","Проверьте, принадлежат ли зубы человеку, и разделяйте смешанные останки по окклюзии, стираемости и развитию.","Точно опишите повреждение: перелом коронки или корня, вывих, полный вывих, перелом альвеолы, повреждение мягких тканей.","Прижизненная реакция (кровотечение, отёк, воспаление) указывает на повреждение при жизни.","Перимортальные переломы свежей кости имеют острые края того же цвета; посмертные переломы сухой кости бледнее и неровнее.","Тупое воздействие на лицо часто вызывает переломы верхних резцов вместе с ранами губ.","Рассматривайте как причины падения, нападение, несчастные случаи, судороги и медицинские вмешательства (напр. интубацию).","Сообщайте увиденное; указывайте, соответствуют ли находки предполагаемому механизму, и называйте другие возможные причины.","Проверка двумя экспертами","Имя эксперта 2","Совпадение","Различаются зубы: {1}. Проверьте их вместе и выберите правильную находку.","Оставить эксперта 1","Принять эксперта 2","P(≥18) — вероятность того, что лицу с данной стадией не менее 18 лет; рассчитывается по среднему и стандартному отклонению (SD) вашего референсного исследования при нормальном распределении. Введите значения SD на шаге 4, чтобы её увидеть.","Наложение рентгенограмм AM/PM","Проверка на изменения","Цепь хранения: записей {1}, каждая запечатана отпечатком SHA-256; ни одна запись не изменена.","Независимо проверено: {1}; совпадение по {2} из {3} зубов; открытые различия: {4}.","Вероятность возраста не менее 18 лет (по референсному среднему и SD): ","Пропавший без имени","Лучший кандидат для каждого трупа","Лучший кандидат","Кандидаты для","Ранжирование: сначала без необъяснимых расхождений, затем по числу совпадающих отличительных признаков. Ранжирование — это зацепка, а не идентификация: подтвердите по рентгенограммам.","Подробное сравнение","Нажмите ещё раз: скопировать эту запись AM в дело трупа","Перетаскивайте изображение, чтобы сдвинуть снимок AM. Ползунками подберите размер и угол.","Прозрачность AM","Размер AM","Поворот AM","Отразить AM","Режим разницы","Добавить метки","Удалить метки","Сбросить","Режим разницы: совпадающие участки темнеют, различия остаются яркими.","Сохранить наложение в дело","Отпечаток меняется при любом изменении содержания заключения.","Независимо проверено: {1}; совпадение по всем {2} зубам, отмеченным обоими.","Внимание: запись цепи хранения {1} была изменена после внесения.","Прозрачность","Размер","AM отражён","Метки","Сохранение…","Сохранено. Находится в Журнал дела → Фото и рентгенограммы и появится в PDF-заключении.","Не удалось сохранить наложение. Попробуйте снова.","Нажмите на изображение, чтобы поставить пронумерованную метку на со const LEGAL_TXT={pk:{en:'Pakistan: under Section 8 of the Juvenile Justice System Act 2018, age is taken from birth or school certificates; if none exist, it may be determined from a medical examination report by a medical officer. The court records its finding on age. Check whether the order covers X-rays.',de:'Pakistan: Nach Section 8 des Juvenile Justice System Act 2018 wird das Alter aus Geburts- oder Schulurkunden bestimmt; fehlen diese, kann es anhand eines ärztlichen Untersuchungsberichts festgestellt werden. Das Gericht hält seine Feststellung zum Alter fest. Prüfen, ob die Anordnung Röntgenaufnahmen umfasst.'},in:{en:'India: under Section 94 of the Juvenile Justice (Care and Protection of Children) Act 2015, a school certificate or birth certificate comes first; only if neither exists may an ossification test or other medical age test be done, on the order of the Juvenile Justice Board or Child Welfare Committee. Medical examination of an accused: Section 51 of the Bharatiya Nagarik Suraksha Sanhita 2023.',de:'Indien: Nach Section 94 des Juvenile Justice (Care and Protection of Children) Act 2015 gehen Schul- oder Geburtsurkunde vor; nur wenn keine vorliegt, darf auf Anordnung des Juvenile Justice Board oder Child Welfare Committee ein Ossifikationstest oder eine andere medizinische Altersbestimmung erfolgen. Ärztliche Untersuchung eines Beschuldigten: Section 51 der Bharatiya Nagarik Suraksha Sanhita 2023.'},us:{en:'USA: rules differ by state. A compelled bodily examination generally needs a search warrant or court order, or informed consent (Fourth Amendment). For unaccompanied minors in immigration custody, age is decided under 8 U.S.C. § 1232(b)(4) and 45 CFR § 410.1702: all evidence is considered and radiographs may not be the only basis.',de:'USA: Die Regeln unterscheiden sich je nach Bundesstaat. Eine erzwungene körperliche Untersuchung erfordert in der Regel einen Durchsuchungsbeschluss oder eine richterliche Anordnung oder eine informierte Einwilligung (Vierter Verfassungszusatz). Bei unbegleiteten Minderjährigen im Einwanderungsgewahrsam gilt 8 U.S.C. § 1232(b)(4) mit 45 CFR § 410.1702: alle Beweise sind zu berücksichtigen, Röntgenbilder dürfen nicht die einzige Grundlage sein.'},au:{en:'Australia (Commonwealth offences): under Part IAA of the Crimes Act 1914 (s 3ZQA and following), an age-determination procedure (currently a hand-wrist X-ray) needs the required consents or a magistrate’s order. States and territories have their own rules.',de:'Australien (Bundesdelikte): Nach Part IAA des Crimes Act 1914 (s 3ZQA ff.) erfordert ein Verfahren zur Altersbestimmung (derzeit Handröntgen) die erforderlichen Einwilligungen oder die Anordnung eines Magistrate. Bundesstaaten und Territorien haben eigene Regeln.'},sa:{en:'Saudi Arabia: under Article 3 of the Juveniles Law (Royal Decree M/113, 1439 H), age is calculated from an official document; the court may refer the juvenile to the competent medical authority to estimate the age.',de:'Saudi-Arabien: Nach Artikel 3 des Jugendgesetzes (Königliches Dekret M/113, 1439 H) wird das Alter aus einer amtlichen Urkunde berechnet; das Gericht kann den Jugendlichen zur Altersschätzung an die zuständige medizinische Stelle verweisen.'},ae:{en:'UAE: juvenile cases follow the federal law on juvenile delinquents (Federal Law No. 6 of 2022). If there is no official document, the court or public prosecution can appoint a medical expert to estimate the age. Check the exact article for your case.',de:'VAE: Jugendsachen richten sich nach dem Bundesgesetz über jugendliche Straftäter (Bundesgesetz Nr. 6 von 2022). Fehlt eine amtliche Urkunde, kann das Gericht oder die Staatsanwaltschaft einen medizinischen Sachverständigen mit der Altersschätzung beauftragen. Den genauen Artikel für den Fall prüfen.'},qa:{en:'Qatar: medical examinations in criminal cases are ordered by the Public Prosecution or the court (Criminal Procedure Code, Law No. 23 of 2004); juvenile cases follow the Juveniles Law (Law No. 1 of 1994). Check the exact article for your case.',de:'Katar: Ärztliche Untersuchungen im Strafverfahren ordnet die Staatsanwaltschaft oder das Gericht an (Strafprozessordnung, Gesetz Nr. 23 von 2004); Jugendsachen richten sich nach dem Jugendgesetz (Gesetz Nr. 1 von 1994). Den genauen Artikel für den Fall prüfen.'},cn:{en:'China: under Article 132 of the Criminal Procedure Law (2018), a physical inspection of a suspect may be compelled if necessary; Article 146 provides for expert evaluation. Prosecutors must verify the age of minor suspects (2026 rules of the Supreme People’s Procuratorate and Ministry of Public Security).',de:'China: Nach Artikel 132 der Strafprozessordnung (2018) kann eine körperliche Untersuchung eines Verdächtigen bei Bedarf erzwungen werden; Artikel 146 regelt die Sachverständigenbegutachtung. Die Staatsanwaltschaft muss das Alter minderjähriger Verdächtiger prüfen (Regeln 2026 der Obersten Volksstaatsanwaltschaft und des Ministeriums für öffentliche Sicherheit).'},jp:{en:'Japan: a physical examination of a suspect needs a physical examination warrant issued by a judge (Article 218 of the Code of Criminal Procedure); an expert examination that involves the body needs a judge’s permit for expert measures (Article 225 with Article 168).',de:'Japan: Eine körperliche Untersuchung eines Verdächtigen erfordert einen richterlichen Untersuchungsbefehl (Artikel 218 der Strafprozessordnung); eine Sachverständigenuntersuchung am Körper erfordert eine richterliche Erlaubnis für Begutachtungsmaßnahmen (Artikel 225 mit Artikel 168).'},de:{en:'In criminal cases a court order under Section 81a of the German Code of Criminal Procedure is needed, because the X-rays have no medical indication.',de:'Im Strafverfahren ist eine richterliche Anordnung nach § 81a StPO erforderlich, da für die Röntgenaufnahmen keine medizinische Indikation besteht.'},at:{en:'Austria: in criminal cases the examination is ordered by the public prosecutor on the basis of court approval (Section 123 of the Austrian Code of Criminal Procedure). Check that X-rays without medical indication are covered by the order.',de:'Österreich: Im Strafverfahren ordnet die Staatsanwaltschaft die Untersuchung auf Grund einer gerichtlichen Bewilligung an (§ 123 StPO). Prüfen, ob Röntgenaufnahmen ohne medizinische Indikation von der Anordnung umfasst sind.'},ch:{en:'Switzerland: in criminal proceedings the examination is ordered by the public prosecutor or the juvenile court (Art. 251 of the Swiss Criminal Procedure Code); asylum cases follow the Asylum Act. Make sure the written order covers the X-rays.',de:'Schweiz: Im Strafverfahren ordnet die Staatsanwaltschaft oder das Jugendgericht die Untersuchung an (Art. 251 StPO); Asylverfahren richten sich nach dem Asylgesetz. Darauf achten, dass die schriftliche Anordnung die Röntgenaufnahmen umfasst.'},other:{en:'Check which legal basis your country requires before X-rays without medical indication (for example a court order or written informed consent), and enter it under Settings → Country of the court.',de:'Vor Röntgenaufnahmen ohne medizinische Indikation prüfen, welche Rechtsgrundlage im jeweiligen Land erforderlich ist (z. B. richterliche Anordnung oder schriftliche Einwilligung), und unter Einstellungen → Land des Gerichts eintragen.'}};

const SURF='MODBL';

function migrate(t){
  if(!t||typeof t!=='object')return t;
  if(!t.fill||typeof t.fill!=='object')t.fill={};
  if(!t.feat||typeof t.feat!=='object')t.feat={};
  if(t.surf){for(const s of String(t.surf).toUpperCase())if(SURF.includes(s)&&!t.fill[s])t.fill[s]=t.mat||'composite'}
  if(t.caries){const free=[...'ODMBL'].find(s=>!t.fill[s]);if(free)t.fill[free]='caries'}
  delete t.surf;delete t.mat;delete t.caries;
  return t;
}
const fillSurfs=(t,pred)=>SURF.split('').filter(s=>t.fill&&t.fill[s]&&pred(t.fill[s])).join('');
const restSurfs=t=>fillSurfs(t,m=>m!=='caries');
const cariesSurfs=t=>fillSurfs(t,m=>m==='caries');
function fillGroups(t){const g={};SURF.split('').forEach(s=>{const m=t.fill&&t.fill[s];if(m&&m!=='caries')(g[m]=g[m]||[]).push(s)});return Object.entries(g).map(([mat,ss])=>({mat,surf:ss.join('')}))}
function describe(t,lg){
  t=get(t);const W=(en,de)=>lg==='de'?de:(!lg||lg==='en')?en:tx(en,lg);
  const ab=t.abut?', '+W('bridge abutment','Brückenpfeiler'):'';
  switch(t.s){
    case 'unk':return W('Not recorded','nicht erhoben');
    case 'missing':return W('Missing (lost before death, healed)','fehlend (intravital verloren, verheilt)');
    case 'lostpm':return W('Lost post-mortem (open socket)','postmortal verloren (offene Alveole)');
    case 'implant':return W('Implant','Implantat')+(t.cmat?` – ${W('crown','Krone')} (${dm(t.cmat,lg)})`:'')+ab;
    case 'pontic':return W('Bridge pontic (tooth missing)','Brückenglied (Zahn fehlt)');
    case 'denture':return W('Missing, replaced by removable denture','fehlend, durch herausnehmbaren Zahnersatz ersetzt');
    case 'root':return W('Root remnant','Wurzelrest')+(t.rct?', '+W('root filled','wurzelgefüllt'):'');
    case 'unerupted':return W('Unerupted','nicht durchgebrochen');
  }
  const p=[],g=fillGroups(t),fe=t.feat||{};
  if(fe.prim)p.push(W('Primary tooth','Milchzahn'));
  if(t.s==='pre')p.push(W('Present (details not recorded)','vorhanden (Details nicht erfasst)'));
  if(g.length)p.push(W('Filling','Füllung')+' '+g.map(x=>`${x.surf} (${dm(x.mat,lg)})`).join(', '));
  const cs=cariesSurfs(t);if(cs)p.push(W('Caries','Karies')+' '+cs);
  if(t.crown){const ct=CTYPES.find(x=>x[0]===(t.ctype||''))||CTYPES[0];p.push((t.ctype?W(ct[1],ct[2]):W('Crown','Krone'))+(t.cmat?` (${dm(t.cmat,lg)})`:'')+ab)}

  const steps=[
   {k:'case',t:L('Case','Fall'),done:!!(c.meta.caseNo||c.meta.pmNo),go:['chart',0]},
   {k:'am',t:'AM',done:am>0,go:['chart',1],v:am+'/32'},

   {k:'cmp',t:L('Compare','Vergleich'),done:!!c.rep.idCat,go:['cmp',0],pro:1},
   {k:'rep',t:L('Report','Gutachten'),done:!!(c.rep.conclusion&&c.rep.conclusion.trim()),go:['rep',2],pro:1}];
  const next=steps.find(x=>!x.done)||steps[4];

}

function applyQuick(chart,n,k){
  const c=cur(),x=migrate(Object.assign(TT({s:'unk'}),c[chart][n]||{}));x.fill=Object.assign({},x.fill);
  if(k==='sound'){if(isSound(x))x.s='unk';else Object.assign(x,TT({note:x.note}))}
  else if(k==='crown'){x.s='present';x.crown=!x.crown;if(!x.crown){x.cmat='';x.abut=false}}
  else if(k==='rct'){if(x.s!=='root')x.s='present';x.rct=!x.rct}
  else x.s=x.s===k?'unk':k;
  c[chart][n]=x;save();
}
