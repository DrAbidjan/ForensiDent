<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ForensiDent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0d6468">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="ForensiDent – forensic odontology toolkit: dental chart, AM/PM comparison, age estimation, case log and report.">
<title>ForensiDent</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
@font-face{font-family:"FD Sans";src:url("fd-sans.woff") format("woff");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"FD Mono";src:url("fd-mono-500.woff") format("woff");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"FD Mono";src:url("fd-mono-600.woff") format("woff");font-weight:600 700;font-style:normal;font-display:swap}
@font-face{font-family:"Noto Sans Arabic";src:url("noto-sans-arabic.woff") format("woff");font-weight:400 600;font-style:normal;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}

/* Layout: home = case bar + five tool tiles; each tool = header, numbered stepper, step panel, fixed Back/Next bar; tooth exam = bottom sheet */
:root{
  --bg:#eef2f2; --surface:#ffffff; --ink:#15242a; --muted:#566a71; --line:#d3dcdd; --line2:#b4c1c3;
  --accent:#0d6468; --accent-ink:#ffffff; --accent-soft:#dcecec;
  --am:#34508f; --pm:#7b3d7f;
  --enamel:#f7f9f9; --tline:#7d8e93; --resto:#3e86c6; --amalgam:#55606a; --gold:#c69a2b; --crown:#0d6468; --rct:#c2410c; --caries:#c0262d; --gic:#2a9d8f; --cer:#d6cbef; --temp:#f0b27a;
  --match:#2e7d4c; --expl:#a86b0c; --incon:#b3261e; --nodata:#8a979b;
  --match-bg:#e3f1e8; --expl-bg:#f8eedb; --incon-bg:#f9e2e0; --nodata-bg:#eceff0;
  --sans:"FD Sans","Noto Sans Arabic",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"FD Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#172225; --ink:#e3ecee; --muted:#93a6ab; --line:#2a3a3e; --line2:#3d5156;
  --accent:#4fb3b1; --accent-ink:#06191a; --accent-soft:#16393a;
  --am:#8aa3e6; --pm:#d39ad6;
  --enamel:#22302f; --tline:#7f959a; --resto:#5fa7e6; --amalgam:#a3adb6; --gold:#e0b84d; --crown:#4fb3b1; --rct:#f08a4b; --caries:#ff6b6b; --gic:#4cc3b2; --cer:#b3a5e0; --temp:#d99a5e;
  --match:#5cc287; --expl:#e7a83e; --incon:#ff7a70; --nodata:#7d8d91;
  --match-bg:#16301f; --expl-bg:#33270f; --incon-bg:#3a1714; --nodata-bg:#1f2a2c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#172225; --ink:#e3ecee; --muted:#93a6ab; --line:#2a3a3e; --line2:#3d5156;
  --accent:#4fb3b1; --accent-ink:#06191a; --accent-soft:#16393a;
  --am:#8aa3e6; --pm:#d39ad6;
  --enamel:#22302f; --tline:#7f959a; --resto:#5fa7e6; --amalgam:#a3adb6; --gold:#e0b84d; --crown:#4fb3b1; --rct:#f08a4b; --caries:#ff6b6b; --gic:#4cc3b2; --cer:#b3a5e0; --temp:#d99a5e;
  --match:#5cc287; --expl:#e7a83e; --incon:#ff7a70; --nodata:#7d8d91;
  --match-bg:#16301f; --expl-bg:#33270f; --incon-bg:#3a1714; --nodata-bg:#1f2a2c;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:14px 130px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:0}
p{margin:0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand .t{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand small{color:var(--muted);font-size:13px}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:8px 12px;font-size:14px;font-weight:500;min-height:38px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--incon);border-color:var(--incon)}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px}
.btn.icon{display:inline-flex;align-items:center;gap:6px}
.btn.icon svg{width:18px;height:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.fine{font-size:12px;color:var(--muted)}
select.case{flex:1 1 180px;min-width:0;border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:8px 10px;min-height:38px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field textarea,.field select{border:1px solid var(--line2);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-height:38px}
details>summary{cursor:pointer;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:150px;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.tile .ico{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.tile .ico svg{width:24px;height:24px}
.tile b{font-size:16px;line-height:1.25}
.tile .sub{font-size:13px;color:var(--muted)}
.tile .st{margin-top:auto;font-family:var(--mono);font-size:12px;color:var(--ink);border-top:1px solid var(--line);padding-top:7px;font-variant-numeric:tabular-nums}
.tile.wide .body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.tile.wide .st{border:0;padding:0;margin:0;color:var(--muted)}
.modhead{display:flex;align-items:center;gap:10px}
.modhead h1{font-size:19px;flex:1;min-width:0}
.modhead .casechip{font-family:var(--mono);font-size:12px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.steps button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px;font-size:13px;white-space:nowrap;color:var(--muted)}
.steps button i{font-style:normal;font-family:var(--mono);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:600}
.steps button[aria-current="step"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.steps button[aria-current="step"] i{background:var(--ink);color:var(--bg)}
.steps button.done i{background:var(--accent);color:var(--accent-ink)}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.navbar .in{max-width:828px;margin:0 auto;display:flex;gap:8px;justify-content:space-between;align-items:center}
.navbar .in span{font-size:12px;color:var(--muted);font-family:var(--mono)}
.chip-am{color:var(--am)} .chip-pm{color:var(--pm)}
.tag{font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 7px;border-radius:5px;border:1px solid currentColor}
.jaw-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.jaw{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.jaw .tooth:nth-child(8){margin-right:5px}
.jaw .tooth:nth-child(9){margin-left:5px}
@media (max-width:640px){
  .jaw{grid-template-columns:repeat(8,minmax(0,1fr));row-gap:10px}
  .jaw .tooth:nth-child(8),.jaw .tooth:nth-child(9){margin:0}
}
.occl{height:1px;background:var(--line2);margin-block:4px}
.tooth{border:1px solid transparent;background:transparent;border-radius:8px;padding:3px 0;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.tooth:hover{background:var(--accent-soft)}
.tooth .num{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tooth .code{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--ink);height:13px;line-height:13px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tooth svg{width:100%;max-width:40px;height:auto;display:block}
.tooth.lower{flex-direction:column-reverse}
.tooth.r-match{background:var(--match-bg)} .tooth.r-expl{background:var(--expl-bg)} .tooth.r-incon{background:var(--incon-bg);border-color:var(--incon)}
.tooth.r-match .num{color:var(--match)} .tooth.r-expl .num{color:var(--expl)} .tooth.r-incon .num{color:var(--incon)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{font-family:var(--mono);color:var(--ink)}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line2)}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{border-radius:9px;padding:8px 4px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat small{font-size:11px}
.s-match{background:var(--match-bg);color:var(--match)} .s-expl{background:var(--expl-bg);color:var(--expl)} .s-incon{background:var(--incon-bg);color:var(--incon)} .s-nodata{background:var(--nodata-bg);color:var(--muted)}
.verdict{border-radius:10px;padding:12px 14px;border-left:5px solid;display:flex;flex-direction:column;gap:4px}
.verdict b{font-size:17px}
.v-match{border-color:var(--match);background:var(--match-bg)} .v-expl{border-color:var(--expl);background:var(--expl-bg)} .v-incon{border-color:var(--incon);background:var(--incon-bg)} .v-nodata{border-color:var(--nodata);background:var(--nodata-bg)}
.cmp-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.cmp{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.cmp .n{font-family:var(--mono);font-weight:600;font-size:15px;grid-row:span 3}
.cmp .ln{font-size:13px;min-width:0}
.cmp .ln b{font-family:var(--mono);font-size:11px;margin-right:6px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px}
.p-match{background:var(--match-bg);color:var(--match)} .p-expl{background:var(--expl-bg);color:var(--expl)} .p-incon{background:var(--incon-bg);color:var(--incon)} .p-nodata{background:var(--nodata-bg);color:var(--muted)}
.why{font-size:13px;color:var(--muted)}
textarea.report{width:100%;min-height:420px;font-family:var(--mono);font-size:12px;line-height:1.5;border:1px solid var(--line2);border-radius:8px;padding:10px;background:var(--bg)}
.status{font-size:13px;color:var(--match);min-height:1em}
.err{color:var(--incon)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line2);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px}
.seg button small{display:block;font-size:10.5px;opacity:.75}
.seg button b{font-family:var(--mono)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg.quick button{font-size:13px;padding:6px 10px}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--bg);font-size:14px}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--accent)}
.check small{display:block;color:var(--muted);font-size:12px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.molars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.molar{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.molar h3{font-family:var(--mono);font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.molar .field select{background:var(--surface)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td input{width:64px;border:1px solid var(--line2);background:var(--bg);border-radius:6px;padding:5px 6px;font-family:var(--mono);text-align:right}
.big{font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.thr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thr div{border-radius:9px;padding:9px;text-align:center;font-size:13px}
.thr b{display:block;font-family:var(--mono);font-size:17px}
.events{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.ev time{font-family:var(--mono);font-size:12px;color:var(--muted);grid-row:span 2;font-variant-numeric:tabular-nums}
.ev b{font-size:14px}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.langs button{border:1px solid var(--line2);background:var(--bg);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.langs button b{font-size:16px}
.langs button small{color:var(--muted);font-size:12px}
.langs button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--accent-soft)}
/* tooth exam sheet */
.scrim{position:fixed;inset:0;background:rgba(8,16,18,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:16px 16px 0 0;border-top:1px solid var(--line);max-height:90vh;overflow:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-width:860px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.sheet-head{display:flex;align-items:flex-start;gap:8px}
.sheet-head h2{flex:1;font-size:18px;min-width:0}
.sheet-head h2 span{font-family:var(--mono)}
.sheet-head small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.mats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mats button{border:1px solid var(--line2);background:var(--bg);border-radius:9px;padding:6px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:500;min-width:0;line-height:1.2}
.mats button small{font-size:10.5px;color:var(--muted);font-weight:400}
.mats button i{width:24px;height:12px;border-radius:3px;border:1px solid var(--line2);display:block}
.mats button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset;background:var(--surface)}
.bt-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.bigtooth{width:min(230px,66vw);height:auto;display:block}
.xf summary,.abbr summary{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;cursor:pointer;list-style:none}
.xf summary::-webkit-details-marker,.abbr summary::-webkit-details-marker{display:none}
.xf summary h2::before,.abbr summary h2::before{content:'▸ ';color:var(--muted)}
.xf[open] summary h2::before,.abbr[open] summary h2::before{content:'▾ '}
.xf[open]>.grid2,.abbr[open]>*:not(summary){margin-top:12px}
.abbr td,.abbr th{vertical-align:top}
.tooth .num.prim{color:var(--crown)}
.editln{display:flex;align-items:baseline;gap:6px;width:100%;text-align:start;background:none;border:0;border-radius:8px;padding:5px 6px;margin:1px -6px;color:inherit;font:inherit;cursor:pointer}
.editln span{flex:1;min-width:0}
.editln i{font-style:normal;font-size:12px;color:var(--accent);white-space:nowrap;font-weight:600}
.editln:hover,.editln:active{background:var(--bg)}
.cmp.hl{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.lic-list{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px}
.lic p{margin:0}
.lic>*:not(summary){margin-top:10px}
.mit summary{cursor:pointer}
.atlas-steps a,a.btn{text-decoration:none}
a.btn:not(.primary){color:var(--ink)}
.atlas-steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}

/* ---------- dashboard home ---------- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.db-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px}
.db-brand{display:flex;align-items:center;gap:10px}
.db-mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.db-mark svg{width:24px;height:24px}
.db-brand b{display:block;font-size:20px;letter-spacing:-.015em;line-height:1.1}
.db-brand small{display:block;color:var(--muted);font-size:13px}
.db-case{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 var(--line),0 12px 32px -18px rgba(13,60,64,.35)}
.db-case-top{display:flex;gap:10px;align-items:center}
.db-casesel{flex:1;min-width:0;position:relative}
.db-casesel select{width:100%;appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--ink);font-family:var(--sans);font-weight:700;font-size:22px;letter-spacing:-.015em;padding:2px 0;padding-inline-end:26px;text-overflow:ellipsis}
.db-casesel::after{content:'';position:absolute;inset-inline-end:6px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.db-meta{margin:-6px 0 0;color:var(--muted);font-size:14px}
.db-jaw{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 8px 12px;color:inherit;font:inherit;cursor:pointer;text-align:start}
.db-jaw-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding-inline:4px}
.mj{display:flex;flex-direction:column;gap:4px}
.mj-r{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:2px}
.mj-r>.mj-t:nth-child(8){margin-inline-end:4px}
.mj-r.lo{border-top:1px dashed var(--line2);padding-top:4px}
.mj-t svg{width:100%;height:auto;display:block}
.db-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;counter-reset:st}

thodontic appliance added","tooth jewellery removed","tooth jewellery added","sealant lost","{} recorded only AM","{} recorded only PM","rotation","malposition","diastema","shape anomaly","Identical findings (incl. {})","rotated","malposition / tilted","diastema (gap)","orthodontic bracket / retainer","tooth jewellery","Present (details not recorded)","sound","Source: KZBV list of permitted finding codes (electronic treatment plan, 2022). * Common practice codes that are not in the KZBV list. Practices may use their own variants; check with the treating dentist if unsure.","Reading German AM records (finding codes)","Implant (older records; now sk, sb, st …)","Tooth present in both","details not recorded in one record","Implant AM","PM details not recorded","Rotation","Malposition","Diastema","Edit","PM state; tap a tooth to see or edit AM and PM","Based on the recommendations of the Study Group on Forensic Age Diagnostics (AGFAD). Check the current version on the AGFAD website.","In criminal cases a court order under Section 81a of the German Code of Criminal Procedure is needed, because the X-rays have no medical indication.","Austria: in criminal cases the examination is ordered by the public prosecutor on the basis of court approval (Section 123 of the Austrian Code of Criminal Procedure). Check that X-rays without medical indication are covered by the order.","Switzerland: in criminal proceedings the examination is ordered by the public prosecutor or the juvenile court (Art. 251 of the Swiss Criminal Procedure Code); asylum cases follow the Asylum Act. Make sure the written order covers the X-rays.","Check which legal basis your country requires before X-rays without medical indication (for example a court order or written informed consent), and enter it under Settings → Country of the court.","Country of the court","Germany","Austria","Switzerland","Other country","Your own legal basis (optional, replaces the text above)","e.g. court order under … of …","Used in the age estimation checklist and in the report. Laws change: always check the current legal situation.","Pakistan","Pakistan: under Section 8 of the Juvenile Justice System Act 2018, age is taken from birth or school certificates; if none exist, it may be determined from a medical examination report by a medical officer. The court records its finding on age. Check whether the order covers X-rays.","India","India: under Section 94 of the Juvenile Justice (Care and Protection of Children) Act 2015, a school certificate or birth certificate comes first; only if neither exists may an ossification test or other medical age test be done, on the order of the Juvenile Justice Board or Child Welfare Committee. Medical examination of an accused: Section 51 of the Bharatiya Nagarik Suraksha Sanhita 2023.","USA","USA: rules differ by state. A compelled bodily examination generally needs a search warrant or court order, or informed consent (Fourth Amendment). For unaccompanied minors in immigration custody, age is decided under 8 U.S.C. § 1232(b)(4) and 45 CFR § 410.1702: all evidence is considered and radiographs may not be the only basis.","Australia","Australia (Commonwealth offences): under Part IAA of the Crimes Act 1914 (s 3ZQA and following), an age-determination procedure (currently a hand-wrist X-ray) needs the required consents or a magistrate’s order. States and territories have their own rules.","Saudi Arabia","Saudi Arabia: under Article 3 of the Juveniles Law (Royal Decree M/113, 1439 H), age is calculated from an official document; the court may refer the juvenile to the competent medical authority to estimate the age.","UAE","UAE: juvenile cases follow the federal law on juvenile delinquents (Federal Law No. 6 of 2022). If there is no official document, the court or public prosecution can appoint a medical expert to estimate the age. Check the exact article for your case.","Qatar","Qatar: medical examinations in criminal cases are ordered by the Public Prosecution or the court (Criminal Procedure Code, Law No. 23 of 2004); juvenile cases follow the Juveniles Law (Law No. 1 of 1994). Check the exact article for your case.","China","China: under Article 132 of the Criminal Procedure Law (2018), a physical inspection of a suspect may be compelled if necessary; Article 146 provides for expert evaluation. Prosecutors must verify the age of minor suspects (2026 rules of the Supreme People’s Procuratorate and Ministry of Public Security).","Japan","Japan: a physical examination of a suspect needs a physical examination warrant issued by a judge (Article 218 of the Code of Criminal Procedure); an expert examination that involves the body needs a judge’s permit for expert measures (Article 225 with Article 168).","London Atlas (AlQahtani et al. 2010): best-matching category {} years, i.e. an estimated age of {}–{} years. Atlas methods give an estimate, not a minimum age.","London Atlas (whole dentition)","Compare all developing teeth on the OPG with the London Atlas of Human Tooth Development and Eruption (AlQahtani et al. 2010) and choose the age category that matches best. Most useful while teeth are still developing (children and adolescents). It gives an estimated age, not a minimum age, so use the third-molar methods above for the 18-year threshold.","Best-matching atlas category (years)","not used","Under 1 year: the atlas also has categories from 30 weeks in utero to 10.5 months; write them under “Other findings”. Atlas: atlas.dentistry.qmul.ac.uk","14, 18 and 21 are common legal age limits (in Germany: criminal responsibility, adult, young adult); check the limits that apply in your country. “Not proven” does not mean the person is younger.","Open the London Atlas (free PDF)","Interactive atlas software","Open the atlas next to the OPG (split screen, or atlas on a second device).","For each developing tooth, look at how far the crown and root have formed and where the tooth sits in relation to the alveolar bone.","Start at the diagram closest to the expected age, then check one year younger and one year older.","Choose the diagram where most teeth match, and select it below.","Under 1 year: the atlas also has categories from 30 weeks in utero to 10.5 months; write them under “Other findings”. The atlas is free for teaching and individual use (© AlQahtani, Queen Mary University of London); its images are not copied into this app.","Licences and credits","Third-party software, fonts and methods","All rights reserved.","Software used in this app","3D tooth viewer, incl. STL, OBJ, PLY and glTF loaders and OrbitControls","Sign-in and account","Show MIT License text","Fonts","Methods and references (cited, not copied)","et al.","stages of tooth mineralisation","third-molar eruption stages and periodontal ligament visibility","recommendations for forensic age estimation","external link only; © Queen Mary University of London","mean tooth dimensions for the schematic 3D models","forms and guide (2023)","finding codes (2022)","The reference values for age estimation come from the study you enter yourself. Methods are described in this app’s own words.","Subsets of IBM Plex Sans and IBM Plex Mono, renamed as the licence requires","Reserved Font Name","The fonts are stored with the app; no font requests go to Google. Full licence: fonts-OFL.txt next to the app.","Typical textbook values for permanent teeth. Measurements are mean values after Wheeler’s Dental Anatomy. Individual and population variation is common.","Unlock comparison, age estimation, case log, PDF report and tooth anatomy.","My pictures and images","Tooth anatomy: upper/lower and right/left features","mean tooth dimensions","Case","Compare","Enter case details","Chart the AM record","Chart the PM findings","Compare AM and PM","Write the report","Create the PDF report","Forensic odontology","Body","No case details yet","Open dental chart","teeth charted","Comparison","distinctive","Not started","custody entries","Conclusion written","No conclusion yet","Guides and checklists","Upper or lower, right or left: identification features for every tooth","Delete this case","DVI matching: every body against every missing person","X-ray comparison: overlay AM and PM radiographs","Foreign dental records: numbering systems and terms","Tools","DVI matching","Rank missing persons for every body","X-ray comparison","Overlay AM and PM radiographs","Foreign dental records","Tooth numbers and terms","Examiner 1","Examiner 2","INTERPOL recommends two odontologists. Examiner 2 charts the same teeth independently; differences are listed below.","Document fingerprint (SHA-256): ","Matching","Disaster victim identification","Add every body (PM) and every missing person (AM) as its own record and chart it. Then the next step compares each body with all missing persons and ranks the candidates.","Add body (PM)","Add missing person (AM)","Bodies","No bodies yet.","Missing persons","No missing persons yet.","Chart at least one body (PM) and one missing person (AM) first.","Choose images","Overlay","Choose the two images","Pick the post-mortem radiograph as the base and the ante-mortem radiograph to lay on top. Images come from Case log → Photos & X-rays.","No images in this case yet.","Add photos and X-rays","Choose a PM and an AM image in step 1 first.","Tooth numbers","Dental terms","Convert tooth numbers","Foreign records often use another numbering system. Type the number as written in the record to find the FDI number.","System in the record","Universal (USA, 1–32 / A–T)","Palmer (UK, Commonwealth)","Haderup (Scandinavia, older records)","Tooth as written","e.g. 3, 6┘, 6+, 46","Primary teeth","Palmer symbols: ┘ upper right, └ upper left, ┐ lower right, ┌ lower left. Haderup: + upper, − lower.","Dental terms in other languages","Choose the language of the AM record to see what common chart terms mean.","Language of the record","Surfaces are usually abbreviated with their initials (M, O, D, B/V, L/P, I); the letters change with the language, for example V for vestibular in French and Spanish.","Warning signs","Torn upper labial frenulum in an infant who is not yet walking.","Bruises on torso, ears or neck, frenulum, angle of jaw, cheeks, eyelids or subconjunctivae in children under 4, any bruise in infants under 4.99 months, or patterned bruises (TEN-4-FACESp).","Injuries of different ages, explanations that do not fit the injury or the child’s development, delay in seeking care.","Dental neglect: untreated caries, pain or infection despite knowledge and access to care.","Reporting in Germany","Document findings carefully with photos and the explanation given (in the carer’s own words).","§ 4 KKG: dentists may discuss the situation with the parents and get advice from an experienced child-protection professional (insoweit erfahrene Fachkraft) using pseudonymised data.","If the risk to the child persists, they may inform the youth welfare office (Jugendamt); in acute danger, contact the police.","Medical child-protection hotline for professionals: 0800 19 210 00 (free, 24/7).","You do not need to prove abuse. Recognise, document and pass on concerns through the proper channels.","Children (developing dentition)","Most accurate period: many teeth are developing at the same time.","Methods: London Atlas, Demirjian, Willems (modified Demirjian), Cameriere open apices, Ubelaker.","Typical error about ±1 year, larger in late childhood.","Adolescents and young adults","Third molars are often the only developing teeth: mineralisation (Demirjian), eruption and PDL visibility (Olze).","Combine with hand X-ray and, if needed, clavicle CT (AGFAD). Report a minimum age for legal thresholds.","Adults","Regressive changes: secondary dentine (pulp/tooth ratio, Kvaal; Cameriere canine), root translucency (Lamendin), periodontal recession, attrition.","Laboratory methods: aspartic acid racemisation, tooth cementum annulation.","Errors often ±5–10 years; give an age range, not a single number.","Every method has a spread; report the reference study, its population, sex and the statistical range used.","Reference data from one population may over- or underestimate age in another (ethnicity, nutrition, socio-economic status).","Third molars vary widely and may be missing or impacted; impaction can delay development.","Age mimicry: point estimates drift towards the mean age of the reference sample.","For legal age thresholds, use the minimum-age concept (youngest age at which the stage was observed) to avoid declaring a minor as adult.","Always combine dental, skeletal and physical findings (AGFAD).","A dental result supports an age assessment; it does not prove a date of birth.","Bite marks change quickly on living and deceased skin. Document early and repeatedly, before any swabbing or cleaning disturbs the area.","Location on the body, body position and surface curvature described","Overview photo showing the anatomical location","Close-ups with ABFO No. 2 scale in the same plane as the injury","Camera perpendicular to the mark; no wide-angle distortion","Serial photos over days (living: daily for several days; deceased: over 24–48 h)","Alternative light: UV and infrared photography considered","Measurements: arch width, mark dimensions, distances between marks","Written description: shape, colour, abrasions, contusions, lacerations, possible tooth marks","Saliva swabbing before cleaning: double-swab technique (moist then dry swab)","Control swab from an unbitten skin area","Swabs air-dried, packed in paper, labelled, chain of custody started","Impression of the injured skin (if indentations present) with low-viscosity material","Tissue excision only by forensic pathologist with legal authority, fixed on a support ring","Suspect dentition only with legal authority/consent: photos, impressions, bite registration","Comparisons done blind to case information where possible","DNA from saliva is the most reliable link between a bite and a person. Swab first, then examine.","Scientific limitations","The NIST scientific foundation review (2023) found that the three key premises of bite mark analysis are not supported by the data:","Human anterior dentition is unique at the individual level.","This uniqueness is accurately transferred to human skin.","The characteristics can be accurately captured and interpreted by analysis techniques.","Skin is elastic and curved; bruising spreads and changes; posture at the time of biting is unknown.","Examiners often disagree even on whether an injury is a human bite (PCAST 2016).","Several wrongful convictions have been linked to bite mark testimony.","Use bite marks for documentation, for recognising a possible bite and for DNA sampling. Do not identify a biter from the pattern alone.","Expert reporting","Write","What was examined, when, by whom and with which method.","Whether the injury is consistent with a human bite, an animal bite, or is not a bite / undetermined.","Limitations: skin distortion, image quality, time since injury, scientific foundation.","Refer to DNA results for any association with a person.","Avoid","“Match”, “identified the biter”, “reasonable dental certainty” or any probability not based on data.","Comparing against a single suspect without a lineup of other dentitions.","Reading case information that is not needed for the dental question.","Strongest acceptable statement on a person: “cannot be excluded” or “excluded” – and only with clear reasoning and stated limitations.","Teeth protect DNA in the pulp and dentine, even after fire, burial or long post-mortem intervals.","Prefer intact, unrestored molars or premolars; avoid teeth with large fillings or root fillings.","Chart, photograph and radiograph the tooth before sampling – extraction is destructive.","Wear gloves and mask, use clean instruments, avoid touching the root, pack dry in paper or a sterile tube.","Saliva swabs from skin, bite marks or objects: double-swab technique, air-dry, paper packaging.","Label with case number, tooth number, date and person; start the chain of custody.","DVI follows the INTERPOL standard so that teams from different countries work with the same forms and quality rules.","Four phases","Scene: recovery of bodies and fragments, numbering and documentation of the location.","Post-mortem: examination in the mortuary (pink PM forms; dental section F1/F2).","Ante-mortem: collection of records of missing persons (yellow AM forms).","Reconciliation: comparison and confirmation by an identification board.","Dental team tasks","Work in pairs: one examiner, one recorder; a second team checks each chart.","Chart with FDI numbering and INTERPOL codes; radiograph and photograph every case.","Enter data into the DVI software (e.g. DVI System International / Plass Data) for searching.","Never change a PM chart after AM data are known; record corrections as new entries.","Software suggests candidates; the identification is decided by the experts, usually with a second primary identifier when available.","Primary teeth – eruption (months)","Upper","Lower","Permanent teeth – eruption (years)","Root completion follows eruption by about 2–3 years (canines and molars longer).","Girls are usually slightly ahead of boys; populations differ.","Eruption is more variable than mineralisation; for age estimation prefer radiographic development stages.","Extra-oral: face, lips, perioral injuries photographed","Access to the mouth (rigor, decomposition); jaw resection only with legal authority","Soft tissues: mucosa, frenula, tongue, palate, piercings, tattoos","Jaws: fractures, edentulous areas, healing of sockets, pathology","Each tooth charted (FDI), including surfaces, materials and anomalies","Occlusion, wear, staining, rotations, diastemas","Prostheses removed, photographed and checked for names or numbers","Radiographs and photographs taken; second examiner checked the chart","Dental identification compares post-mortem (PM) findings with ante-mortem (AM) records of a missing person. It is one of the primary identifiers recognised by INTERPOL, together with fingerprints and DNA.","AM sources","Dental chart and treatment notes, including billing records (which show dates and teeth treated).","Radiographs: OPG, periapicals, bitewings, CBCT. Always ask for the original or a full-resolution digital export.","Photographs, intra-oral scans, study models, orthodontic records.","Smile photos from family or social media (useful for anterior teeth).","Procedure","Chart the PM dentition completely before comparing (avoid bias).","Take PM radiographs that match the AM projections (angle, area, film type).","Compare restorations, root fillings, root morphology, sinus outline, trabecular pattern and anomalies.","Classify each difference as explainable (treatment after AM records) or unexplainable.","Conclusion scale (INTERPOL/ABFO): established/positive · probable · possible · insufficient · excluded. A single unexplainable discrepancy can exclude; no fixed minimum number of concordant points exists.","Document each injury with location, size, shape, colour and an ABFO No. 2 scale.","Lips and frenula: lacerations from the teeth behind them indicate blunt force to the mouth.","Jaw fractures: mandible (condyle, angle, symphysis) and midface (Le Fort I–III, zygoma).","Hat-brim rule: injuries above the hat-brim line suggest blows rather than a simple fall.","Note old and new injuries separately; ask for previous dental records.","A forensic report must let the reader see what was found and, separately, what the expert concludes from it.","Observation","Interpretation","Tooth 21 absent, socket open with sharp margins, no bone healing.","Consistent with post-mortem tooth loss.","Third molar 38 at Demirjian stage H.","Minimum age 18.2 years (reference study X).","Curved pattern of bruises, 35 mm wide, on the forearm.","Consistent with a human bite; not suitable to identify a person.","Use neutral, measurable words for findings (size, colour, location).","Use graded terms for interpretations: “consistent with”, “typical of”, “excludes”.","Name alternative explanations and the limits of the method.","Stay within your field; leave cause of death and legal judgement to others.","Decomposition stages: fresh, bloat, active decay, advanced decay, skeletonisation; speed depends on temperature, humidity, insects and burial.","Single-rooted teeth are often lost post-mortem; look for empty sockets with sharp edges (no healing).","“Pink teeth” are a post-mortem phenomenon (haemoglobin in dentine) and do not show a cause of death.","Burned remains: teeth become brittle and change colour; photograph in situ, stabilise before moving, keep fragments together.","Check whether teeth are human, and separate commingled remains by matching occlusion, wear and development.","Describe the injury precisely: crown or root fracture, luxation, avulsion, alveolar fracture, soft-tissue injury.","Vital reaction (bleeding, swelling, inflammation) suggests injury during life.","Perimortem fractures in fresh bone have sharp, same-coloured edges; post-mortem breaks in dry bone are paler and more irregular.","Blunt force to the face often causes upper incisor fractures together with lip lacerations.","Consider falls, assault, accidents, seizures and medical procedures (e.g. intubation) as causes.","Report what is seen; state whether findings are consistent with a proposed mechanism, and name other possible causes.","Two-examiner check","Name of examiner 2","Agreement","{} teeth differ. Check them together and choose the correct finding.","Keep examiner 1","Use examiner 2","P(≥18) is the probability that a person with this stage is at least 18, from the mean and standard deviation (SD) of your reference study, assuming a normal distribution. Enter SD values in step 4 to see it.","AM/PM X-ray overlay","Tamper check","Chain of custody: {} entries, each sealed with a SHA-256 fingerprint; no entry has been changed.","Checked indepen Une incisive centrale mandibulaire mesure environ 5 mm et est aplatie.","Angle mésio-incisif vif, angle disto-incisif arrondi ; contour distal plus convexe ; apex incliné en distal.","Bord incisif, angles plus arrondis que la centrale","1, apex souvent courbé en distal","Plus petite et plus arrondie que la centrale. Variantes fréquentes : riziforme ou agénésie.","Angles incisifs arrondis, puits palatin possible ; racine ronde. Les latérales mandibulaires sont étroites à racines aplaties.","Angle distal nettement plus arrondi que le mésial ; apex généralement courbé en distal.","1 cuspide pointue ; arête mésiale plus courte que la distale","1, la racine la plus longue de la denture","Dent la plus longue. Crête vestibulaire marquée. Contour distal plus convexe.","Couronne large, pointe cuspidienne centrée ; contours mésial et distal débordant la racine. Les canines mandibulaires sont plus étroites, leur contour mésial prolonge la racine en ligne droite.","Arête mésiale plus courte que la distale ; point de contact distal plus cervical ; apex courbé en distal.","2 : vestibulaire plus grande que palatine","Généralement 2 (vestibulaire et palatine)","Concavité mésiale sur la couronne et la racine. Pointe vestibulaire légèrement distale.","Deux cuspides bien développées et généralement deux racines. Une première prémolaire mandibulaire a une cuspide vestibulaire dominante, une minuscule cuspide linguale et une racine.","Concavité mésiale de la couronne et de la racine (côté fosse canine) ; pointe vestibulaire légèrement distale.","2 de taille presque égale","Généralement 1","1 ou 2","Plus symétrique que la première prémolaire ; pas de concavité mésiale marquée.","Deux cuspides de hauteur presque égale, contour occlusal ovale. Les deuxièmes prémolaires mandibulaires sont plus rondes ou carrées, couronne inclinée en lingual.","Pointe vestibulaire légèrement mésiale ; pointe palatine décalée en mésial.","4 (mésio-palatine la plus grande), souvent tubercule de Carabelli","3 (mésio-vestibulaire, disto-vestibulaire, palatine)","3–4 (deuxième canal mésio-vestibulaire fréquent)","Plus grande dent maxillaire. Crête oblique de la cuspide mésio-palatine à la disto-vestibulaire. Contour occlusal rhomboïde.","Trois racines (deux vestibulaires, une palatine), couronne rhomboïde, crête oblique. Les premières molaires mandibulaires ont deux racines (mésiale et distale) et une couronne rectangulaire.","La cuspide mésio-palatine est la plus grande ; le tubercule de Carabelli est mésio-palatin ; racine mésio-vestibulaire plus large que la disto-vestibulaire.","4, cuspide disto-palatine plus petite ou absente","3, souvent rapprochées ou fusionnées","Plus petite et plus cordiforme que la première molaire ; pas de tubercule de Carabelli.","Trois racines (souvent rapprochées), couronne cordiforme. Les deuxièmes molaires mandibulaires ont deux racines et un sillon en croix.","Cuspide disto-palatine réduite ; racines inclinées en distal.","Variable, souvent 3","Variable, souvent fusionnées","Variable","17–21 (souvent incluse)","Forme et position très variables. Les stades de développement servent à l’estimation de l’âge.","Couronne petite, souvent triangulaire ; racines généralement fusionnées en un cône.","Souvent peu fiable ; utilisez les critères palatins et mésiaux restants et l’inclinaison radiculaire (distale).","Bord incisif, couronne symétrique","1, aplatie mésio-distalement","1, parfois 2 (vestibulaire et lingual)","Plus petite dent de la denture. Moitiés mésiale et distale presque symétriques.","Couronne étroite et symétrique (environ 5 mm) ; racine très aplatie mésio-distalement avec sillons des deux côtés.","Difficile. Le sillon radiculaire distal est souvent plus profond ; le bord incisif peut s’user vers distal. Le côté n’est souvent pas déterminable avec certitude.","Bord incisif, angle distal plus arrondi","1, parfois 2","Un peu plus grande que la centrale ; couronne semblant tournée en distal.","Couronne étroite, racine aplatie ; un peu plus grande que la centrale mandibulaire.","La couronne semble tournée en distal : l’angle disto-incisif est plus arrondi et plus lingual.","1 cuspide, pointe souvent légèrement mésiale","1, parfois bifide","Plus étroite que la canine maxillaire ; contour mésial presque dans l’axe de la racine.","Couronne plus étroite, contour mésial prolongeant la racine en ligne droite, face linguale lisse.","Pointe cuspidienne mésiale ; arête mésiale plus courte ; contour mésial rectiligne, distal convexe.","Grande cuspide vestibulaire, petite cuspide linguale","Aspect caniniforme en vue vestibulaire. Cuspide linguale très petite.","Cuspide vestibulaire dominante, minuscule cuspide linguale, couronne inclinée en lingual, une racine.","Sillon mésio-lingual souvent présent ; crête marginale mésiale plus basse que la distale ; arête vestibulaire mésiale plus courte.","2 ou 3 (sillons en Y, H ou U)","Cuspides linguales plus développées que sur la première prémolaire.","Deux ou trois cuspides, contour occlusal rond ou carré, une racine, couronne inclinée en lingual.","Dans la forme tricuspidée, la cuspide mésio-linguale est plus grande que la disto-linguale.","5 (3 vestibulaires, 2 linguales)","2 (mésiale et distale)","3 (2 mésiaux, 1 distal), parfois 4","Plus grande dent mandibulaire. Sillons en Y. Cuspide distale du côté vestibulaire.","Deux racines (mésiale et distale), cinq cuspides, couronne rectangulaire plus large mésio-distalement.","La petite cuspide distale est disto-vestibulaire ; racine mésiale plus large et courbée en distal ; deux sillons vestibulaires.","4, sillons en croix (+)","2, plus rapprochées","3 ; canal en C possible","Couronne rectangulaire à 4 cuspides presque égales.","Deux racines rapprochées, quatre cuspides avec sillon en croix (+).","Racines inclinées en distal ; cuspides mésiales un peu plus grandes que les distales.","Variable, 4–5","2, souvent fusionnées","Très variable ; souvent incluse. Les stades de développement servent à l’estimation de l’âge.","Deux racines (souvent fusionnées et courbées en distal), couronne à quatre ou cinq cuspides.","Utilisez l’inclinaison radiculaire (distale) et les cuspides mésiales plus grandes.","Modèle 3D","Importer un modèle 3D","Schéma intégré","Chargement de la visionneuse 3D…","Chargement du modèle…","Rotation automatique","Avant","Gauche","Droite","Haut","Bas","Apical","Faites glisser un doigt pour tourner, pincez pour zoomer. Le modèle intégré est un modèle pédagogique simplifié : forme typique de la couronne, cuspides, nombre et position des racines. M = mésial, D = distal.","Faites glisser un doigt pour tourner, pincez pour zoomer. Les modèles sont communs aux dents {1} et {2} ; l’autre côté est affiché en miroir.","importé pour","Formats : STL (scanners dentaires), GLB, OBJ, PLY. Les fichiers restent sur cet appareil. Les gros fichiers (plus de 50 Mo) peuvent être lents.","Impossible d’ouvrir ce fichier 3D. Utilisez STL, GLB, OBJ ou PLY.","Impossible de charger la visionneuse 3D. Vérifiez la connexion Internet et réessayez.","Choisissez un fichier STL, GLB, OBJ ou PLY.","Le modèle n’a pas pu être enregistré. La navigation privée ou un stockage plein peuvent en être la cause.","Hauteur coronaire / longueur radiculaire (mm)","Largeur coronaire mésio-distale / vestibulo-linguale (mm)","Valeurs classiques des manuels pour les dents permanentes. Les mesures sont des moyennes d’après Wheeler’s Dental Anatomy ; le modèle 3D en est calculé. Les variations individuelles et populationnelles sont fréquentes.","Faites glisser un doigt pour tourner, pincez pour zoomer. Le modèle intégré est un modèle pédagogique calculé d’après les dimensions moyennes de Wheeler : taille de la couronne et de la racine, cuspides, nombre, position et inclinaison des racines. Les dents du côté gauche sont l’image miroir du côté droit. M = mésial, D = distal.","Gratuit","Odontogramme : AM et PM, chaque face et matériau, saisie rapide","Comparaison AM/PM avec résultat proposé","Estimation de l’âge avec liste z la comparaison, l’estimation de l’âge, le journal, le rapport PDF et l’anatomie 3D.","Touchez « Créer le PDF ». L’app crée le fichier sur votre iPhone (quelques secondes). Touchez ensuite « Partager ou enregistrer le PDF » pour l’enregistrer dans Fichiers ou l’envoyer par Mail ou WhatsApp. La langue du rapport se règle à l’étape 1.","Partager ou enregistrer le PDF","Ouvrir le PDF","Aperçu","Création du PDF…","PDF prêt ({1} Ko).","Impossible de créer le PDF. Réessayez ; si l’échec persiste, retirez les très grandes images du rapport.","Odontologie médico-légale","Accueil","Tous les outils et listes utilisent le dossier sélectionné ici.","Outil","Guide","Liste","Point clé","Liste pour ce dossier","Sources","Ce guide est disponible en anglais et en allemand.","Localisation","Taille (mm)","Forme et motif","Remarques","Identification humaine","Dossiers dentaires, comparaison AM/PM, odontogramme et DVI","Identification par dossiers dentaires et radiographies","Comparaison ante-mortem / post-mortem","Odontogramme : restaurations, couronnes, implants et dents absentes","Identification des victimes de catastrophes (DVI)","Rédiger le rapport (PDF)","Estimation de l’âge dentaire","Enfants, adolescents et adultes ; développement, radiographies, limites","Estimer l’âge des enfants, adolescents et adultes","Développement et éruption dentaires","Méthodes radiographiques et évaluation des troisièmes molaires","Limites, incertitude et différences de population","Anatomie dentaire et modèles 3D","Analyse des traces de morsure","Documentation, preuves, limites scientifiques, rapport","Documentation et photographie","Collecte et conservation des preuves","Limites scientifiques de l’attribution d’une morsure à une personne","Rapport d’expertise et conclusions non étayées à éviter","Preuves dentaires et examen","Examen, traumatisme, ADN dentaire, chaîne de traçabilité","Examen des dents, des mâchoires et des tissus buccaux","Traumatisme dentaire et causes possibles","Extraction d’ADN des dents et prélèvements buccaux","Chaîne de traçabilité et conservation des preuves","Médecine légale et maltraitance","Blessures, maltraitance et négligence, restes humains, constat et interprétation","Lésions dentaires et faciales","Maltraitance et négligence envers l’enfant : repérer et signaler","Restes humains et décomposition","Distinguer constatations et interprétations","Les constatations dentaires post-mortem{1} concordent dans toutes les caractéristiques comparables avec les données ante-mortem{2}. Il n’existe aucune divergence inexplicable ; {3} caractéristiques distinctives (notamment restaurations et dents absentes) concordent. Du point de vue odontologique médico-légal, l’identité est établie.","Les constatations dentaires post-mortem{1} concordent avec les données ante-mortem{2} sans divergence inexplicable. Toutefois, les caractéristiques concordantes sont peu spécifiques ou les données sont incomplètes. Du point de vue odontologique médico-légal, l’identité est probable.","Il n’existe aucune divergence inexplicable entre les constatations dentaires post-mortem{1} et les données ante-mortem{2}, mais seulement peu de caractéristiques distinctives. Du point de vue odontologique médico-légal, l’identité est possible mais non établie. Une confirmation par d’autres méthodes (p. ex. analyse ADN) est recommandée.","Les données ante-mortem disponibles{1} et/ou les constatations post-mortem{2} ne suffisent pas pour une conclusion odontologique médico-légale sur l’identité.","Il existe des divergences inexplicables entre les constatations dentaires post-mortem{1} et les données ante-mortem{2}. {3}Du point de vue odontologique médico-légal, l’identité est exclue.","Dents concernées : {1}. ","D’après les constatations dentaires (développement des troisièmes molaires), l’âge minimum est de {1} ans. L’âge de 18 ans révolus est donc {2}.","Aucun âge minimum ne peut être indiqué d’après les constatations dentaires.","Le corps inconnu{1} peut-il être identifié par comparaison dentaire comme {2} ?","la personne disparue","Quel âge minimum ressort des constatations dentaires ? La personne a-t-elle atteint l’âge de 18 ans ?","RAPPORT D’ODONTOLOGIE MÉDICO-LÉGALE","Rapport d’odontologie médico-légale","Demandé par :","Numéro de procédure :","Date de la demande :","Numéro de dossier :","Numéro du corps :","Expert :","Examiné le :","Examiné le","Matériel examiné","Reçu le {1} à {2} de {3} ; état : {4} ; n° de scellé : {5} ; conservation : {6}.","Données ante-mortem : {1}.","Documentation réalisée :","Documentation réalisée","Chaîne de traçabilité :","Constatations","Données dentaires ante-mortem (FDI) :","Constatations dentaires post-mortem (FDI) :","  Autres dents : {1} saines, {2} non renseignées.","  aucune restauration ni dent absente saisie","Comparées : {1} dents sur 32. Concordantes : {2} (distinctives : {3}). Divergences explicables : {4}. Divergences inexplicables : {5}. Non comparables : {6}.","concordant","explicable","inexplicable","non comparable","Évaluation calculée : {1}. {2}","Évaluation calculée","Résultat de l’identification : ","ANNEXES","Fig.","Lieu","Signature","Remarque : projet établi avec ForensiDent (aide à la décision, pas un logiciel médico-légal validé). Toutes les constatations doivent être vérifiées sur les radiographies et photographies originales.","Établi avec ForensiDent (aide à la décision, pas un logiciel médico-légal validé). Toutes les constatations doivent être vérifiées sur les radiographies et photographies originales.","[Rédigez ici votre conclusion]","[Conclusion manquante]","Référence AM","N° de scellé","Conservation","Données ante-mortem","Date","Par / à","Données ante-mortem (AM)","Constatations post-mortem (PM)","Résultat par dent (état PM)","Annexes : photographies et radiographies","Personne : {1}, {2}. Âge / date de naissance déclarés : {3}.","vivante","décédée","Étapes d’examen réalisées :","Étapes d’examen","absente ou non évaluable","Étude de référence : ","Étude de référence","Âg
