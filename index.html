<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ForensiDent">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="ForensiDent – forensic odontology toolkit: dental chart, AM/PM comparison, age estimation, case log and report.">
<title>ForensiDent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: home = case bar + five tool tiles; each tool = header, numbered stepper, step panel, fixed Back/Next bar; tooth exam = bottom sheet */
:root{
  --bg:#eef2f2; --surface:#ffffff; --ink:#15242a; --muted:#566a71; --line:#d3dcdd; --line2:#b4c1c3;
  --accent:#0d6468; --accent-ink:#ffffff; --accent-soft:#dcecec;
  --am:#34508f; --pm:#7b3d7f;
  --enamel:#f7f9f9; --tline:#7d8e93; --resto:#3e86c6; --amalgam:#55606a; --gold:#c69a2b; --crown:#0d6468; --rct:#c2410c; --caries:#c0262d; --gic:#2a9d8f; --cer:#d6cbef; --temp:#f0b27a;
  --match:#2e7d4c; --expl:#a86b0c; --incon:#b3261e; --nodata:#8a979b;
  --match-bg:#e3f1e8; --expl-bg:#f8eedb; --incon-bg:#f9e2e0; --nodata-bg:#eceff0;
  --sans:"IBM Plex Sans","Noto Sans Arabic",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#172225; --ink:#e3ecee; --muted:#93a6ab; --line:#2a3a3e; --line2:#3d5156;
  --accent:#4fb3b1; --accent-ink:#06191a; --accent-soft:#16393a;
  --am:#8aa3e6; --pm:#d39ad6;
  --enamel:#22302f; --tline:#7f959a; --resto:#5fa7e6; --amalgam:#a3adb6; --gold:#e0b84d; --crown:#4fb3b1; --rct:#f08a4b; --caries:#ff6b6b; --gic:#4cc3b2; --cer:#b3a5e0; --temp:#d99a5e;
  --match:#5cc287; --expl:#e7a83e; --incon:#ff7a70; --nodata:#7d8d91;
  --match-bg:#16301f; --expl-bg:#33270f; --incon-bg:#3a1714; --nodata-bg:#1f2a2c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#172225; --ink:#e3ecee; --muted:#93a6ab; --line:#2a3a3e; --line2:#3d5156;
  --accent:#4fb3b1; --accent-ink:#06191a; --accent-soft:#16393a;
  --am:#8aa3e6; --pm:#d39ad6;
  --enamel:#22302f; --tline:#7f959a; --resto:#5fa7e6; --amalgam:#a3adb6; --gold:#e0b84d; --crown:#4fb3b1; --rct:#f08a4b; --caries:#ff6b6b; --gic:#4cc3b2; --cer:#b3a5e0; --temp:#d99a5e;
  --match:#5cc287; --expl:#e7a83e; --incon:#ff7a70; --nodata:#7d8d91;
  --match-bg:#16301f; --expl-bg:#33270f; --incon-bg:#3a1714; --nodata-bg:#1f2a2c;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:14px 130px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:0}
p{margin:0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand .t{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand small{color:var(--muted);font-size:13px}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:8px 12px;font-size:14px;font-weight:500;min-height:38px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--incon);border-color:var(--incon)}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px}
.btn.icon{display:inline-flex;align-items:center;gap:6px}
.btn.icon svg{width:18px;height:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.fine{font-size:12px;color:var(--muted)}
select.case{flex:1 1 180px;min-width:0;border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:8px 10px;min-height:38px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field textarea,.field select{border:1px solid var(--line2);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-height:38px}
details>summary{cursor:pointer;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:150px;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.tile .ico{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.tile .ico svg{width:24px;height:24px}
.tile b{font-size:16px;line-height:1.25}
.tile .sub{font-size:13px;color:var(--muted)}
.tile .st{margin-top:auto;font-family:var(--mono);font-size:12px;color:var(--ink);border-top:1px solid var(--line);padding-top:7px;font-variant-numeric:tabular-nums}
.tile.wide .body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.tile.wide .st{border:0;padding:0;margin:0;color:var(--muted)}
.modhead{display:flex;align-items:center;gap:10px}
.modhead h1{font-size:19px;flex:1;min-width:0}
.modhead .casechip{font-family:var(--mono);font-size:12px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.steps button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px;font-size:13px;white-space:nowrap;color:var(--muted)}
.steps button i{font-style:normal;font-family:var(--mono);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:600}
.steps button[aria-current="step"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.steps button[aria-current="step"] i{background:var(--ink);color:var(--bg)}
.steps button.done i{background:var(--accent);color:var(--accent-ink)}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.navbar .in{max-width:828px;margin:0 auto;display:flex;gap:8px;justify-content:space-between;align-items:center}
.navbar .in span{font-size:12px;color:var(--muted);font-family:var(--mono)}
.chip-am{color:var(--am)} .chip-pm{color:var(--pm)}
.tag{font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 7px;border-radius:5px;border:1px solid currentColor}
.jaw-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.jaw{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.jaw .tooth:nth-child(8){margin-right:5px}
.jaw .tooth:nth-child(9){margin-left:5px}
@media (max-width:640px){
  .jaw{grid-template-columns:repeat(8,minmax(0,1fr));row-gap:10px}
  .jaw .tooth:nth-child(8),.jaw .tooth:nth-child(9){margin:0}
}
.occl{height:1px;background:var(--line2);margin-block:4px}
.tooth{border:1px solid transparent;background:transparent;border-radius:8px;padding:3px 0;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.tooth:hover{background:var(--accent-soft)}
.tooth .num{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tooth .code{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--ink);height:13px;line-height:13px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tooth svg{width:100%;max-width:40px;height:auto;display:block}
.tooth.lower{flex-direction:column-reverse}
.tooth.r-match{background:var(--match-bg)} .tooth.r-expl{background:var(--expl-bg)} .tooth.r-incon{background:var(--incon-bg);border-color:var(--incon)}
.tooth.r-match .num{color:var(--match)} .tooth.r-expl .num{color:var(--expl)} .tooth.r-incon .num{color:var(--incon)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{font-family:var(--mono);color:var(--ink)}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line2)}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{border-radius:9px;padding:8px 4px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat small{font-size:11px}
.s-match{background:var(--match-bg);color:var(--match)} .s-expl{background:var(--expl-bg);color:var(--expl)} .s-incon{background:var(--incon-bg);color:var(--incon)} .s-nodata{background:var(--nodata-bg);color:var(--muted)}
.verdict{border-radius:10px;padding:12px 14px;border-left:5px solid;display:flex;flex-direction:column;gap:4px}
.verdict b{font-size:17px}
.v-match{border-color:var(--match);background:var(--match-bg)} .v-expl{border-color:var(--expl);background:var(--expl-bg)} .v-incon{border-color:var(--incon);background:var(--incon-bg)} .v-nodata{border-color:var(--nodata);background:var(--nodata-bg)}
.cmp-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.cmp{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.cmp .n{font-family:var(--mono);font-weight:600;font-size:15px;grid-row:span 3}
.cmp .ln{font-size:13px;min-width:0}
.cmp .ln b{font-family:var(--mono);font-size:11px;margin-right:6px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px}
.p-match{background:var(--match-bg);color:var(--match)} .p-expl{background:var(--expl-bg);color:var(--expl)} .p-incon{background:var(--incon-bg);color:var(--incon)} .p-nodata{background:var(--nodata-bg);color:var(--muted)}
.why{font-size:13px;color:var(--muted)}
textarea.report{width:100%;min-height:420px;font-family:var(--mono);font-size:12px;line-height:1.5;border:1px solid var(--line2);border-radius:8px;padding:10px;background:var(--bg)}
.status{font-size:13px;color:var(--match);min-height:1em}
.err{color:var(--incon)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line2);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px}
.seg button small{display:block;font-size:10.5px;opacity:.75}
.seg button b{font-family:var(--mono)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg.quick button{font-size:13px;padding:6px 10px}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--bg);font-size:14px}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--accent)}
.check small{display:block;color:var(--muted);font-size:12px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.molars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.molar{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.molar h3{font-family:var(--mono);font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.molar .field select{background:var(--surface)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td input{width:64px;border:1px solid var(--line2);background:var(--bg);border-radius:6px;padding:5px 6px;font-family:var(--mono);text-align:right}
.big{font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.thr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thr div{border-radius:9px;padding:9px;text-align:center;font-size:13px}
.thr b{display:block;font-family:var(--mono);font-size:17px}
.events{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.ev time{font-family:var(--mono);font-size:12px;color:var(--muted);grid-row:span 2;font-variant-numeric:tabular-nums}
.ev b{font-size:14px}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.langs button{border:1px solid var(--line2);background:var(--bg);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.langs button b{font-size:16px}
.langs button small{color:var(--muted);font-size:12px}
.langs button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--accent-soft)}
/* tooth exam sheet */
.scrim{position:fixed;inset:0;background:rgba(8,16,18,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:16px 16px 0 0;border-top:1px solid var(--line);max-height:90vh;overflow:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-width:860px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.sheet-head{display:flex;align-items:flex-start;gap:8px}
.sheet-head h2{flex:1;font-size:18px;min-width:0}
.sheet-head h2 span{font-family:var(--mono)}
.sheet-head small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.mats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mats button{border:1px solid var(--line2);background:var(--bg);border-radius:9px;padding:6px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:500;min-width:0;line-height:1.2}
.mats button small{font-size:10.5px;color:var(--muted);font-weight:400}
.mats button i{width:24px;height:12px;border-radius:3px;border:1px solid var(--line2);display:block}
.mats button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset;background:var(--surface)}
.bt-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.bigtooth{width:min(230px,66vw);height:auto;display:block}
.bigtooth .surf{cursor:pointer}
.bigtooth .surf:focus{outline:none}
.bigtooth .surf:focus-visible{outline:none;stroke:var(--accent);stroke-width:5}
.bigtooth text{pointer-events:none;font-family:var(--mono)}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.toggle{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;background:var(--bg);font-size:14px;line-height:1.25}
.toggle small{display:block;font-size:11px;color:var(--muted)}
.toggle input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.sheet-foot{position:sticky;bottom:0;margin:0 -16px calc(-16px - env(safe-area-inset-bottom,0px));padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr 1fr;gap:8px}
#printroot{display:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{display:inline-flex;align-items:center;cursor:pointer}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--bg);min-width:0;font-size:13px}
.thumb b{font-size:13px;line-height:1.3}
.thumb select,.thumb input:not([type]){border:1px solid var(--line2);background:var(--surface);border-radius:7px;padding:5px 7px;width:100%;font-size:13px}
.thumb .toggle{padding:5px 8px;font-size:12px}
.timg{border:0;padding:0;background:var(--line);border-radius:7px;overflow:hidden;aspect-ratio:4/3;width:100%;max-width:100%}
.timg img{width:100%;height:100%;object-fit:cover;display:block}
.pend-img{max-height:260px;width:auto;max-width:100%;border-radius:8px;align-self:flex-start;background:var(--line)}
.viewer{position:fixed;inset:0;z-index:40;background:rgba(5,10,12,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.viewer img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:6px}
.viewer p{color:#e3ecee;margin:0;font-size:14px;text-align:center}
.anat-pick{display:flex;flex-direction:column;gap:6px}
.anat-row{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
@media (max-width:640px){.anat-row{grid-template-columns:repeat(8,minmax(0,1fr))}}
.anat-row button{border:1px solid var(--line2);background:var(--bg);border-radius:7px;padding:7px 0;font-family:var(--mono);font-size:12px;font-weight:600;min-width:0}
.anat-row button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.v3d-wrap{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 40%,var(--surface),var(--bg))}
.v3d{width:100%;min-height:280px;display:flex;align-items:center;justify-content:center;touch-action:none}
.v3d canvas{display:block;width:100%!important;height:auto!important}
.v3d-views button{font-size:13px;padding:6px 10px}
.m3-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.m3-item{padding:8px 0;border-bottom:1px solid var(--line)}

longe la racine en ligne droite.", "Mesial cusp ridge shorter than distal; distal contact area lies more cervically; root tip curves distally.": "Arête mésiale plus courte que la distale ; point de contact distal plus cervical ; apex courbé en distal.", "2: buccal larger than palatal": "2 : vestibulaire plus grande que palatine", "Usually 2 (buccal and palatal)": "Généralement 2 (vestibulaire et palatine)", "Mesial concavity on crown and root. Buccal cusp tip slightly distal.": "Concavité mésiale sur la couronne et la racine. Pointe vestibulaire légèrement distale.", "Two well-developed cusps and usually two roots. A lower first premolar has one dominant buccal cusp, a tiny lingual cusp and one root.": "Deux cuspides bien développées et généralement deux racines. Une première prémolaire mandibulaire a une cuspide vestibulaire dominante, une minuscule cuspide linguale et une racine.", "Mesial concavity of crown and root (canine fossa side); buccal cusp tip slightly distal.": "Concavité mésiale de la couronne et de la racine (côté fosse canine) ; pointe vestibulaire légèrement distale.", "2 of almost equal size": "2 de taille presque égale", "Usually 1": "Généralement 1", "1 or 2": "1 ou 2", "More symmetrical than the first premolar; no marked mesial concavity.": "Plus symétrique que la première prémolaire ; pas de concavité mésiale marquée.", "Two cusps of nearly equal height, oval occlusal outline. Lower second premolars are rounder or square and the crown tilts lingually.": "Deux cuspides de hauteur presque égale, contour occlusal ovale. Les deuxièmes prémolaires mandibulaires sont plus rondes ou carrées, couronne inclinée en lingual.", "Buccal cusp tip slightly mesial; palatal cusp tip shifted mesially.": "Pointe vestibulaire légèrement mésiale ; pointe palatine décalée en mésial.", "4 (mesiopalatal largest), often cusp of Carabelli": "4 (mésio-palatine la plus grande), souvent tubercule de Carabelli", "3 (mesiobuccal, distobuccal, palatal)": "3 (mésio-vestibulaire, disto-vestibulaire, palatine)", "3–4 (second mesiobuccal canal is common)": "3–4 (deuxième canal mésio-vestibulaire fréquent)", "Largest upper tooth. Oblique ridge from mesiopalatal to distobuccal cusp. Rhomboid occlusal outline.": "Plus grande dent maxillaire. Crête oblique de la cuspide mésio-palatine à la disto-vestibulaire. Contour occlusal rhomboïde.", "Three roots (two buccal, one palatal), rhomboid crown, oblique ridge. Lower first molars have two roots (mesial and distal) and a rectangular crown.": "Trois racines (deux vestibulaires, une palatine), couronne rhomboïde, crête oblique. Les premières molaires mandibulaires ont deux racines (mésiale et distale) et une couronne rectangulaire.", "Mesiopalatal cusp is the largest; cusp of Carabelli lies mesiopalatal; mesiobuccal root broader than distobuccal.": "La cuspide mésio-palatine est la plus grande ; le tubercule de Carabelli est mésio-palatin ; racine mésio-vestibulaire plus large que la disto-vestibulaire.", "4, distopalatal cusp smaller or absent": "4, cuspide disto-palatine plus petite ou absente", "3, often closer together or fused": "3, souvent rapprochées ou fusionnées", "Smaller and more heart-shaped than the first molar; no cusp of Carabelli.": "Plus petite et plus cordiforme que la première molaire ; pas de tubercule de Carabelli.", "Three roots (often close together), heart-shaped crown. Lower second molars have two roots and a cross-shaped groove pattern.": "Trois racines (souvent rapprochées), couronne cordiforme. Les deuxièmes molaires mandibulaires ont deux racines et un sillon en croix.", "Distopalatal cusp reduced; roots incline distally.": "Cuspide disto-palatine réduite ; racines inclinées en distal.", "Variable, often 3": "Variable, souvent 3", "Variable, often fused": "Variable, souvent fusionnées", "Variable": "Variable", "17–21 (often impacted)": "17–21 (souvent incluse)", "Highly variable shape and position. Development stages are used for age estimation.": "Forme et position très variables. Les stades de développement servent à l’estimation de l’âge.", "Small, often triangular crown; roots usually fused into one cone.": "Couronne petite, souvent triangulaire ; racines généralement fusionnées en un cône.", "Often unreliable; use the remaining palatal and mesial features and the root inclination (distal).": "Souvent peu fiable ; utilisez les critères palatins et mésiaux restants et l’inclinaison radiculaire (distale).", "Incisal edge, crown symmetrical": "Bord incisif, couronne symétrique", "1, flattened mesiodistally": "1, aplatie mésio-distalement", "1, sometimes 2 (labial and lingual)": "1, parfois 2 (vestibulaire et lingual)", "Smallest tooth in the dentition. Mesial and distal halves almost mirror images.": "Plus petite dent de la denture. Moitiés mésiale et distale presque symétriques.", "Narrow, symmetrical crown (about 5 mm); root strongly flattened mesiodistally with grooves on both sides.": "Couronne étroite et symétrique (environ 5 mm) ; racine très aplatie mésio-distalement avec sillons des deux côtés.", "Difficult. Distal root groove is often deeper; the incisal edge may wear towards distal. Side is often not reliably determinable.": "Difficile. Le sillon radiculaire distal est souvent plus profond ; le bord incisif peut s’user vers distal. Le côté n’est souvent pas déterminable avec certitude.", "Incisal edge, distal angle more rounded": "Bord incisif, angle distal plus arrondi", "1, sometimes 2": "1, parfois 2", "Slightly larger than the central; crown appears twisted distally.": "Un peu plus grande que la centrale ; couronne semblant tournée en distal.", "Narrow crown, flattened root; slightly larger than the lower central.": "Couronne étroite, racine aplatie ; un peu plus grande que la centrale mandibulaire.", "Crown appears twisted distally: the disto-incisal angle is rounder and lies more lingually.": "La couronne semble tournée en distal : l’angle disto-incisif est plus arrondi et plus lingual.", "1 cusp, tip often slightly mesial": "1 cuspide, pointe souvent légèrement mésiale", "1, occasionally bifurcated": "1, parfois bifide", "Narrower than the upper canine; mesial crown outline almost straight with the root.": "Plus étroite que la canine maxillaire ; contour mésial presque dans l’axe de la racine.", "Narrower crown, mesial outline continues straight into the root, smooth lingual surface.": "Couronne plus étroite, contour mésial prolongeant la racine en ligne droite, face linguale lisse.", "Cusp tip lies mesially; mesial cusp ridge shorter; mesial outline straight, distal outline convex.": "Pointe cuspidienne mésiale ; arête mésiale plus courte ; contour mésial rectiligne, distal convexe.", "Large buccal cusp, small lingual cusp": "Grande cuspide vestibulaire, petite cuspide linguale", "Looks canine-like from the buccal side. Lingual cusp very small.": "Aspect caniniforme en vue vestibulaire. Cuspide linguale très petite.", "Dominant buccal cusp, tiny lingual cusp, crown tilted lingually, one root.": "Cuspide vestibulaire dominante, minuscule cuspide linguale, couronne inclinée en lingual, une racine.", "Mesiolingual groove often present; mesial marginal ridge lower than distal; mesial buccal cusp ridge shorter.": "Sillon mésio-lingual souvent présent ; crête marginale mésiale plus basse que la distale ; arête vestibulaire mésiale plus courte.", "2 or 3 (Y-, H- or U-shaped groove pattern)": "2 ou 3 (sillons en Y, H ou U)", "Lingual cusps better developed than in the first premolar.": "Cuspides linguales plus développées que sur la première prémolaire.", "Two or three cusps, round or square occlusal outline, one root, crown tilted lingually.": "Deux ou trois cuspides, contour occlusal rond ou carré, une racine, couronne inclinée en lingual.", "In the three-cusp form the mesiolingual cusp is larger than the distolingual cusp.": "Dans la forme tricuspidée, la cuspide mésio-linguale est plus grande que la disto-linguale.", "5 (3 buccal, 2 lingual)": "5 (3 vestibulaires, 2 linguales)", "2 (mesial and distal)": "2 (mésiale et distale)", "3 (2 mesial, 1 distal), sometimes 4": "3 (2 mésiaux, 1 distal), parfois 4", "Largest lower tooth. Y-shaped groove pattern. Distal cusp on the buccal side.": "Plus grande dent mandibulaire. Sillons en Y. Cuspide distale du côté vestibulaire.", "Two roots (mesial and distal), five cusps, rectangular crown wider mesiodistally.": "Deux racines (mésiale et distale), cinq cuspides, couronne rectangulaire plus large mésio-distalement.", "The small distal cusp sits distobuccally; mesial root broader and curved distally; two buccal grooves.": "La petite cuspide distale est disto-vestibulaire ; racine mésiale plus large et courbée en distal ; deux sillons vestibulaires.", "4, cross-shaped (+) groove pattern": "4, sillons en croix (+)", "2, closer together": "2, plus rapprochées", "3; C-shaped canal possible": "3 ; canal en C possible", "Rectangular crown with 4 almost equal cusps.": "Couronne rectangulaire à 4 cuspides presque égales.", "Two roots close together, four cusps with a cross-shaped (+) groove.": "Deux racines rapprochées, quatre cuspides avec sillon en croix (+).", "Roots incline distally; mesial cusps slightly larger than distal.": "Racines inclinées en distal ; cuspides mésiales un peu plus grandes que les distales.", "Variable, 4–5": "Variable, 4–5", "2, often fused": "2, souvent fusionnées", "Highly variable; often impacted. Development stages are used for age estimation.": "Très variable ; souvent incluse. Les stades de développement servent à l’estimation de l’âge.", "Two roots (often fused and curved distally), crown with four or five cusps.": "Deux racines (souvent fusionnées et courbées en distal), couronne à quatre ou cinq cuspides.", "Use root inclination (distal) and the larger mesial cusps.": "Utilisez l’inclinaison radiculaire (distale) et les cuspides mésiales plus grandes.", "3D model": "Modèle 3D", "Upload 3D model": "Importer un modèle 3D", "Built-in schematic": "Schéma intégré", "Loading 3D viewer…": "Chargement de la visionneuse 3D…", "Loading model…": "Chargement du modèle…", "Auto-rotate": "Rotation automatique", "Front": "Avant", "Left": "Gauche", "Right": "Droite", "Top": "Haut", "Bottom": "Bas", "Apical": "Apical", "Drag with one finger to rotate, pinch to zoom. The built-in model is a simplified teaching model: it shows the typical crown form, cusps and the number and position of roots. M = mesial, D = distal.": "Faites glisser un doigt pour tourner, pincez pour zoomer. Le modèle intégré est un modèle pédagogique simplifié : forme typique de la couronne, cuspides, nombre et position des racines. M = mésial, D = distal.", "Drag with one finger to rotate, pinch to zoom. Models are shared by tooth {} and {}; the other side is shown mirrored.": "Faites glisser un doigt pour tourner, pincez pour zoomer. Les modèles sont communs aux dents {1} et {2} ; l’autre côté est affiché en miroir.", "uploaded for": "importé pour", "Supported: STL (dental scanners), GLB, OBJ, PLY. Files stay on this device. Large files (over 50 MB) can be slow.": "Formats : STL (scanners dentaires), GLB, OBJ, PLY. Les fichiers restent sur cet appareil. Les gros fichiers (plus de 50 Mo) peuvent être lents.", "This 3D file could not be opened. Use STL, GLB, OBJ or PLY.": "Impossible d’ouvrir ce fichier 3D. Utilisez STL, GLB, OBJ ou PLY.", "The 3D viewer could not be loaded. Check the internet connection and try again.": "Impossible de charger la visionneuse 3D. Vérifiez la connexion Internet et réessayez.", "Choose an STL, GLB, OBJ or PLY file.": "Choisissez un fichier STL, GLB, OBJ ou PLY.", "The model could not be saved. Private browsing or full storage can cause this.": "Le modèle n’a pas pu être enregistré. La navigation privée ou un stockage plein peuvent en être la cause.", "Crown height / root length (mm)": "Hauteur coronaire / longueur radiculaire (mm)", "Crown width mesiodistal / buccolingual (mm)": "Largeur coronaire mésio-distale / vestibulo-linguale (mm)", "Typical textbook values for permanent teeth. Measurements are mean values after Wheeler’s Dental Anatomy; the 3D model is built from them. Individual and population variation is common.": "Valeurs classiques des manuels pour les dents permanentes. Les mesures sont des moyennes d’après Wheeler’s Dental Anatomy ; le modèle 3D en est calculé. Les variations individuelles et populationnelles sont fréquentes.", "Drag with one finger to rotate, pinch to zoom. The built-in model is a teaching model calculated from Wheeler mean dimensions: crown and root size, cusps, and number, position and inclination of the roots. Teeth of the left side are mirror images of the right side. M = mesial, D = distal.": "Faites glisser un doigt pour tourner, pincez pour zoomer. Le modèle intégré est un modèle pédagogique calculé d’après les dimensions moyennes de Wheeler : taille de la couronne et de la racine, cuspides, nombre, position et inclinaison des racines. Les dents du côté gauche sont l’image miroir du côté droit. M = mésial, D = distal.", "Free": "Gratuit", "Dental chart: AM and PM, every surface and material, quick charting": "Odontogramme : AM et PM, chaque face et matériau, saisie rapide", "AM/PM comparison with suggested result": "Comparaison AM/PM avec résultat proposé", "Age estimation with AGFAD checklist and minimum age": "Estimation de l’âge avec liste AGFAD et âge minimum", "Case log: photos, X-rays and chain of custody": "Journal du dossier : photos, radiographies et chaîne de traçabilité", "PDF report with suggested conclusion": "Rapport PDF avec conclusion proposée", "Tooth anatomy with 3D models": "Anatomie dentaire avec modèles 3D", "Forensic odontology toolkit for dental identification, age estimation and expert reports.": "Outils d’odontologie médico-légale pour l’identification dentaire, l’estimation de l’âge et les rapports d’expertise.", "Developed by": "Développé par", "Forensic odontologist": "Odontologiste médico-légal", "Sign in": "Se connecter", "Create free account": "Créer un compte gratuit", "Email": "E-mail", "Password": "Mot de passe", "At least 8 characters. You will get an email to confirm your address.": "Au moins 8 caractères. Vous recevrez un e-mail pour confirmer votre adresse.", "Create account": "Créer le compte", "Forgot password?": "Mot de passe oublié ?", "Accounts are not connected yet": "Les comptes ne sont pas encore connectés", "The owner must add the Supabase and Lemon Squeezy details first (see setup guide).": "Le propriétaire doit d’abord saisir les données Supabase et Lemon Squeezy (voir le guide d’installation).", "Open in owner test mode": "Ouvrir en mode test du propriétaire", "The sign-in service could not be reached. Check the internet connection.": "Le service de connexion est inaccessible. Vérifiez la connexion Internet.", "Free and Pro": "Gratuit et Pro", "one-time payment, no subscription": "paiement unique, sans abonnement", "Support": "Assistance", "Enter a valid email address.": "Saisissez une adresse e-mail valide.", "The password needs at least 8 characters.": "Le mot de passe doit comporter au moins 8 caractères.", "Please wait…": "Veuillez patienter…", "Account created. Open the email we sent you and tap the confirmation link, then sign in.": "Compte créé. Ouvrez l’e-mail envoyé, touchez le lien de confirmation, puis connectez-vous.", "Please confirm your email address first (check your inbox).": "Confirmez d’abord votre adresse e-mail (vérifiez votre boîte de réception).", "Email or password is wrong.": "E-mail ou mot de passe incorrect.", "Enter your email address first.": "Saisissez d’abord votre adresse e-mail.", "We sent you an email with a link to set a new password.": "Nous vous avons envoyé un e-mail avec un lien pour définir un nouveau mot de passe.", "is part of ForensiDent Pro.": "fait partie de ForensiDent Pro.", "Buy Pro": "Acheter Pro", "Payment is not connected yet.": "Le paiement n’est pas encore connecté.", "Payment is handled securely by Lemon Squeezy. Use the same email address as your ForensiDent account. After paying, come back and tap the button below.": "Le paiement est traité de façon sécurisée par Lemon Squeezy. Utilisez la même adresse e-mail que votre compte ForensiDent. Après le paiement, revenez et touchez le bouton ci-dessous.", "I have paid – check again": "J’ai payé – vérifier à nouveau", "Checking…": "Vérification…", "No payment found yet. It can take a minute; try again shortly.": "Aucun paiement trouvé pour l’instant. Cela peut prendre une minute ; réessayez bientôt.", "Account": "Compte", "Owner test mode: all tools unlocked on this device.": "Mode test du propriétaire : tous les outils sont débloqués sur cet appareil.", "Leave test mode": "Quitter le mode test", "Plan": "Formule", "Upgrade to Pro": "Passer à Pro", "Sign out": "Se déconnecter", "Your cases stay on this device; they are not stored in your account. To delete your account, write to": "Vos dossiers restent sur cet appareil et ne sont pas enregistrés dans votre compte. Pour supprimer votre compte, écrivez à", "Unlock comparison, age estimation, case log, PDF report and 3D anatomy.": "Débloquez la comparaison, l’estimation de l’âge, le journal, le rapport PDF et l’anatomie 3D.", "Tap “Create PDF”. The app builds the file on your iPhone (a few seconds). Then tap “Share or save PDF” to save it to Files or send it by Mail or WhatsApp. The report language is set in step 1.": "Touchez « Créer le PDF ». L’app crée le fichier sur votre iPhone (quelques secondes). Touchez ensuite « Partager ou enregistrer le PDF » pour l’enregistrer dans Fichiers ou l’envoyer par Mail ou WhatsApp. La langue du rapport se règle à l’étape 1.", "Share or save PDF": "Partager ou enregistrer le PDF", "Open PDF": "Ouvrir le PDF", "Preview": "Aperçu", "Creating PDF…": "Création du PDF…", "PDF ready ({} KB).": "PDF prêt ({1} Ko).", "The PDF could not be created. Try again; if it keeps failing, remove very large pictures from the report.": "Impossible de créer le PDF. Réessayez ; si l’échec a copia de seguridad de texto.", "No pictures yet.": "Aún no hay imágenes.", "This file could not be read as a picture.": "Este archivo no se pudo leer como imagen.", "Choose what the picture shows.": "Elija qué muestra la imagen.", "The picture could not be saved. Private browsing or full storage can cause this.": "No se pudo guardar la imagen. La navegación privada o el almacenamiento lleno pueden causarlo.", "The picture could not be saved.": "No se pudo guardar la imagen.", "Picture not found on this device": "Imagen no encontrada en este dispositivo", "Close": "Cerrar", "Choose a tooth": "Elegir un diente", "Cusps / incisal edge": "Cúspides / borde incisal", "Roots": "Raíces", "Root canals": "Conductos radiculares", "Eruption (years)": "Erupción (años)", "Root completed (years)": "Raíz completa (años)", "Identification features": "Rasgos de identificación", "Upper or lower?": "¿Superior o inferior?", "Right or left?": "¿Derecha o izquierda?", "Typical textbook values for permanent teeth. Individual and population variation is common.": "Valores típicos de manual para dientes permanentes. La variación individual y poblacional es frecuente.", "Determining the side: Mühlreiter signs": "Determinación del lado: signos de Mühlreiter", "Angle sign: the mesial incisal or occlusal angle is sharper than the distal angle.": "Signo del ángulo: el ángulo incisal u oclusal mesial es más agudo que el distal.", "Crown curvature sign: viewed from incisal or occlusal, the mesial part of the labial or buccal surface is more strongly curved.": "Signo de curvatura: visto desde incisal u oclusal, la parte mesial de la cara vestibular es más convexa.", "Root sign: the root axis inclines distally relative to the crown axis.": "Signo radicular: el eje de la raíz se inclina hacia distal respecto al eje de la corona.", "The three signs are clearest on incisors and canines and less reliable on molars and worn teeth. Always combine several features.": "Los tres signos son más claros en incisivos y caninos y menos fiables en molares y dientes desgastados. Combine siempre varios rasgos.", "My 3D pictures and images": "Mis imágenes 3D e ilustraciones", "Add picture": "Añadir imagen", "Upload screenshots of 3D tooth models, drawings or your own photos. They are shown for tooth {} and {} (same tooth on the other side) and are saved on this device for all cases.": "Suba capturas de modelos dentales 3D, dibujos o sus fotos. Se muestran para el diente {1} y {2} (mismo diente del otro lado) y se guardan en este dispositivo para todos los casos.", "No pictures for this tooth yet.": "Aún no hay imágenes de este diente.", "View, e.g. mesial, buccal, 3D": "Vista, p. ej. mesial, vestibular, 3D", "Compare with the current case": "Comparar con el caso actual", "Case pictures appear here when you enter tooth {} under “Teeth shown” in Case log › Photos & X-rays.": "Las imágenes del caso aparecen aquí si indica el diente {1} en «Dientes mostrados» en Registro del caso › Fotos y radiografías.", "Incisal edge with 3 mamelons when young": "Borde incisal con 3 mamelones en jóvenes", "1, conical": "1, cónica", "Widest incisor. Mesio-incisal angle sharp (about 90°), disto-incisal angle rounded. Cingulum slightly distal.": "Incisivo más ancho. Ángulo mesioincisal agudo (unos 90°), ángulo distoincisal redondeado. Cíngulo algo distal.", "Wide crown (about 8.5 mm), clear cingulum and marginal ridges; root round in cross-section. A lower central is about 5 mm wide and flattened.": "Corona ancha (unos 8,5 mm), cíngulo y crestas marginales marcados; raíz redonda en sección. Un central inferior mide unos 5 mm y es aplanado.", "Mesio-incisal angle sharp, disto-incisal angle rounded; distal crown outline more convex; root apex tilts distally.": "Ángulo mesioincisal agudo, distoincisal redondeado; contorno distal más convexo; ápice inclinado hacia distal.", "Incisal edge, angles more rounded than the central": "Borde incisal, ángulos más redondeados que el central", "1, apex often curved distally": "1, ápice a menudo curvado hacia distal", "Smaller and rounder than the central incisor. Often variant: peg-shaped or congenitally missing.": "Más pequeño y redondeado que el central. Variantes frecuentes: conoide o agenesia.", "Rounded incisal angles, palatal pit possible; root round. Lower laterals are narrow with flattened roots.": "Ángulos incisales redondeados, posible fosa palatina; raíz redonda. Los laterales inferiores son estrechos con raíces aplanadas.", "Distal angle clearly more rounded than mesial; root apex usually curves distally.": "Ángulo distal claramente más redondeado que el mesial; ápice normalmente curvado a distal.", "1 pointed cusp; mesial cusp ridge shorter than distal": "1 cúspide puntiaguda; vertiente mesial más corta que la distal", "1, the longest root in the dentition": "1, la raíz más larga de la dentición", "Longest tooth. Strong labial ridge. Distal contour more convex.": "Diente más largo. Cresta vestibular marcada. Contorno distal más convexo.", "Broad crown with cusp tip near the centre; mesial and distal outlines bulge beyond the root. Lower canines are narrower and their mesial outline runs straight into the root.": "Corona ancha con la punta cerca del centro; contornos mesial y distal sobresalen de la raíz. Los caninos inferiores son más estrechos y su contorno mesial continúa recto en la raíz.", "Mesial cusp ridge shorter than distal; distal contact area lies more cervically; root tip curves distally.": "Vertiente mesial más corta que la distal; contacto distal más cervical; ápice curvado a distal.", "2: buccal larger than palatal": "2: vestibular mayor que palatina", "Usually 2 (buccal and palatal)": "Normalmente 2 (vestibular y palatina)", "Mesial concavity on crown and root. Buccal cusp tip slightly distal.": "Concavidad mesial en corona y raíz. Punta vestibular algo distal.", "Two well-developed cusps and usually two roots. A lower first premolar has one dominant buccal cusp, a tiny lingual cusp and one root.": "Dos cúspides bien desarrolladas y normalmente dos raíces. Un primer premolar inferior tiene una cúspide vestibular dominante, una lingual diminuta y una raíz.", "Mesial concavity of crown and root (canine fossa side); buccal cusp tip slightly distal.": "Concavidad mesial de corona y raíz (lado de la fosa canina); punta vestibular algo distal.", "2 of almost equal size": "2 de tamaño casi igual", "Usually 1": "Normalmente 1", "1 or 2": "1 o 2", "More symmetrical than the first premolar; no marked mesial concavity.": "Más simétrico que el primer premolar; sin concavidad mesial marcada.", "Two cusps of nearly equal height, oval occlusal outline. Lower second premolars are rounder or square and the crown tilts lingually.": "Dos cúspides de altura casi igual, contorno oclusal ovalado. Los segundos premolares inferiores son más redondos o cuadrados y la corona se inclina a lingual.", "Buccal cusp tip slightly mesial; palatal cusp tip shifted mesially.": "Punta vestibular algo mesial; punta palatina desplazada a mesial.", "4 (mesiopalatal largest), often cusp of Carabelli": "4 (mesiopalatina la mayor), a menudo tubérculo de Carabelli", "3 (mesiobuccal, distobuccal, palatal)": "3 (mesiovestibular, distovestibular, palatina)", "3–4 (second mesiobuccal canal is common)": "3–4 (segundo conducto mesiovestibular frecuente)", "Largest upper tooth. Oblique ridge from mesiopalatal to distobuccal cusp. Rhomboid occlusal outline.": "Diente superior más grande. Cresta oblicua de la cúspide mesiopalatina a la distovestibular. Contorno oclusal romboidal.", "Three roots (two buccal, one palatal), rhomboid crown, oblique ridge. Lower first molars have two roots (mesial and distal) and a rectangular crown.": "Tres raíces (dos vestibulares, una palatina), corona romboidal, cresta oblicua. Los primeros molares inferiores tienen dos raíces (mesial y distal) y corona rectangular.", "Mesiopalatal cusp is the largest; cusp of Carabelli lies mesiopalatal; mesiobuccal root broader than distobuccal.": "La cúspide mesiopalatina es la mayor; el tubérculo de Carabelli es mesiopalatino; raíz mesiovestibular más ancha que la distovestibular.", "4, distopalatal cusp smaller or absent": "4, cúspide distopalatina menor o ausente", "3, often closer together or fused": "3, a menudo juntas o fusionadas", "Smaller and more heart-shaped than the first molar; no cusp of Carabelli.": "Más pequeño y acorazonado que el primer molar; sin tubérculo de Carabelli.", "Three roots (often close together), heart-shaped crown. Lower second molars have two roots and a cross-shaped groove pattern.": "Tres raíces (a menudo juntas), corona acorazonada. Los segundos molares inferiores tienen dos raíces y surcos en cruz.", "Distopalatal cusp reduced; roots incline distally.": "Cúspide distopalatina reducida; raíces inclinadas a distal.", "Variable, often 3": "Variable, a menudo 3", "Variable, often fused": "Variable, a menudo fusionadas", "Variable": "Variable", "17–21 (often impacted)": "17–21 (a menudo incluido)", "Highly variable shape and position. Development stages are used for age estimation.": "Forma y posición muy variables. Los estadios de desarrollo se usan para estimar la edad.", "Small, often triangular crown; roots usually fused into one cone.": "Corona pequeña, a menudo triangular; raíces normalmente fusionadas en un cono.", "Often unreliable; use the remaining palatal and mesial features and the root inclination (distal).": "A menudo poco fiable; use los rasgos palatinos y mesiales restantes y la inclinación radicular (distal).", "Incisal edge, crown symmetrical": "Borde incisal, corona simétrica", "1, flattened mesiodistally": "1, aplanada mesiodistalmente", "1, sometimes 2 (labial and lingual)": "1, a veces 2 (vestibular y lingual)", "Smallest tooth in the dentition. Mesial and distal halves almost mirror images.": "Diente más pequeño de la dentición. Mitades mesial y distal casi simétricas.", "Narrow, symmetrical crown (about 5 mm); root strongly flattened mesiodistally with grooves on both sides.": "Corona estrecha y simétrica (unos 5 mm); raíz muy aplanada mesiodistalmente con surcos a ambos lados.", "Difficult. Distal root groove is often deeper; the incisal edge may wear towards distal. Side is often not reliably determinable.": "Difícil. El surco radicular distal suele ser más profundo; el borde incisal puede desgastarse hacia distal. El lado a menudo no puede determinarse con fiabilidad.", "Incisal edge, distal angle more rounded": "Borde incisal, ángulo distal más redondeado", "1, sometimes 2": "1, a veces 2", "Slightly larger than the central; crown appears twisted distally.": "Algo mayor que el central; la corona parece girada a distal.", "Narrow crown, flattened root; slightly larger than the lower central.": "Corona estrecha, raíz aplanada; algo mayor que el central inferior.", "Crown appears twisted distally: the disto-incisal angle is rounder and lies more lingually.": "La corona parece girada a distal: el ángulo distoincisal es más redondeado y más lingual.", "1 cusp, tip often slightly mesial": "1 cúspide, punta a menudo algo mesial", "1, occasionally bifurcated": "1, ocasionalmente bífida", "Narrower than the upper canine; mesial crown outline almost straight with the root.": "Más estrecho que el canino superior; contorno mesial casi recto con la raíz.", "Narrower crown, mesial outline continues straight into the root, smooth lingual surface.": "Corona más estrecha, contorno mesial que continúa recto en la raíz, cara lingual lisa.", "Cusp tip lies mesially; mesial cusp ridge shorter; mesial outline straight, distal outline convex.": "Punta cuspídea mesial; vertiente mesial más corta; contorno mesial recto, distal convexo.", "Large buccal cusp, small lingual cusp": "Cúspide vestibular grande, cúspide lingual pequeña", "Looks canine-like from the buccal side. Lingual cusp very small.": "Parece un canino visto desde vestibular. Cúspide lingual muy pequeña.", "Dominant buccal cusp, tiny lingual cusp, crown tilted lingually, one root.": "Cúspide vestibular dominante, lingual diminuta, corona inclinada a lingual, una raíz.", "Mesiolingual groove often present; mesial marginal ridge lower than distal; mesial buccal cusp ridge shorter.": "Surco mesiolingual frecuente; cresta marginal mesial más baja que la distal; vertiente vestibular mesial más corta.", "2 or 3 (Y-, H- or U-shaped groove pattern)": "2 o 3 (surcos en Y, H o U)", "Lingual cusps better developed than in the first premolar.": "Cúspides linguales más desarrolladas que en el primer premolar.", "Two or three cusps, round or square occlusal outline, one root, crown tilted lingually.": "Dos o tres cúspides, contorno oclusal redondo o cuadrado, una raíz, corona inclinada a lingual.", "In the three-cusp form the mesiolingual cusp is larger than the distolingual cusp.": "En la forma tricuspídea, la cúspide mesiolingual es mayor que la distolingual.", "5 (3 buccal, 2 lingual)": "5 (3 vestibulares, 2 linguales)", "2 (mesial and distal)": "2 (mesial y distal)", "3 (2 mesial, 1 distal), sometimes 4": "3 (2 mesiales, 1 distal), a veces 4", "Largest lower tooth. Y-shaped groove pattern. Distal cusp on the buccal side.": "Diente inferior más grande. Surcos en Y. Cúspide distal en el lado vestibular.", "Two roots (mesial and distal), five cusps, rectangular crown wider mesiodistally.": "Dos raíces (mesial y distal), cinco cúspides, corona rectangular más ancha mesiodistalmente.", "The small distal cusp sits distobuccally; mesial root broader and curved distally; two buccal grooves.": "La pequeña cúspide distal es distovestibular; raíz mesial más ancha y curvada a distal; dos surcos vestibulares.", "4, cross-shaped (+) groove pattern": "4, surcos en cruz (+)", "2, closer together": "2, más juntas", "3; C-shaped canal possible": "3; conducto en C posible", "Rectangular crown with 4 almost equal cusps.": "Corona rectangular con 4 cúspides casi iguales.", "Two roots close together, four cusps with a cross-shaped (+) groove.": "Dos raíces juntas, cuatro cúspides con surco en cruz (+).", "Roots incline distally; mesial cusps slightly larger than distal.": "Raíces inclinadas a distal; cúspides mesiales algo mayores que las distales.", "Variable, 4–5": "Variable, 4–5", "2, often fused": "2, a menudo fusionadas", "Highly variable; often impacted. Development stages are used for age estimation.": "Muy variable; a menudo incluido. Los estadios de desarrollo se usan para estimar la edad.", "Two roots (often fused and curved distally), crown with four or five cusps.": "Dos raíces (a menudo fusionadas y curvadas a distal), corona con cuatro o cinco cúspides.", "Use root inclination (distal) and the larger mesial cusps.": "Use la inclinación radicular (distal) y las cúspides mesiales mayores.", "3D model": "Modelo 3D", "Upload 3D model": "Subir modelo 3D", "Built-in schematic": "Esquema integrado", "Loading 3D viewer…": "Cargando visor 3D…", "Loading model…": "Cargando modelo…", "Auto-rotate": "Giro automático", "Front": "Frente", "Left": "Izquierda", "Right": "Derecha", "Top": "Arriba", "Bottom": "Abajo", "Apical": "Apical", "Drag with one finger to rotate, pinch to zoom. The built-in model is a simplified teaching model: it shows the typical crown form, cusps and the number and position of roots. M = mesial, D = distal.": "Arrastre con un dedo para girar y pellizque para ampliar. El modelo integrado es un modelo didáctico simplificado: forma típica de la corona, cúspides y número y posición de las raíces. M = mesial, D = distal.", "Drag with one finger to rotate, pinch to zoom. Models are shared by tooth {} and {}; the other side is shown mirrored.": "Arrastre con un dedo para girar y pellizque para ampliar. Los modelos se comparten entre los dientes {1} y {2}; el otro lado se muestra en espejo.", "uploaded for": "subido para", "Supported: STL (dental scanners), GLB, OBJ, PLY. Files stay on this device. Large files (over 50 MB) can be slow.": "Formatos: STL (escáneres dentales), GLB, OBJ, PLY. Los archivos  from your library. You then choose what it shows; that becomes its heading in the case and in the PDF report. Pictures stay on this device and are not part of the text backup.": "Scattare una foto o sceglierne una dalla libreria. Poi indicare che cosa mostra; diventa il titolo nel caso e nella perizia PDF. Le immagini restano su questo dispositivo e non fanno parte del backup di testo.", "No pictures yet.": "Ancora nessuna immagine.", "This file could not be read as a picture.": "Questo file non può essere letto come immagine.", "Choose what the picture shows.": "Scegliere che cosa mostra l’immagine.", "The picture could not be saved. Private browsing or full storage can cause this.": "Impossibile salvare l’immagine. Può dipendere dalla navigazione privata o dalla memoria piena.", "The picture could not be saved.": "Impossibile salvare l’immagine.", "Picture not found on this device": "Immagine non trovata su questo dispositivo", "Close": "Chiudi", "Choose a tooth": "Scegli un dente", "Cusps / incisal edge": "Cuspidi / margine incisale", "Roots": "Radici", "Root canals": "Canali radicolari", "Eruption (years)": "Eruzione (anni)", "Root completed (years)": "Radice completa (anni)", "Identification features": "Caratteri di riconoscimento", "Upper or lower?": "Superiore o inferiore?", "Right or left?": "Destra o sinistra?", "Typical textbook values for permanent teeth. Individual and population variation is common.": "Valori tipici da manuale per i denti permanenti. Le variazioni individuali e di popolazione sono frequenti.", "Determining the side: Mühlreiter signs": "Determinazione del lato: segni di Mühlreiter", "Angle sign: the mesial incisal or occlusal angle is sharper than the distal angle.": "Segno dell’angolo: l’angolo incisale od occlusale mesiale è più acuto di quello distale.", "Crown curvature sign: viewed from incisal or occlusal, the mesial part of the labial or buccal surface is more strongly curved.": "Segno della curvatura: vista incisale od occlusale, la parte mesiale della faccia vestibolare è più convessa.", "Root sign: the root axis inclines distally relative to the crown axis.": "Segno radicolare: l’asse della radice è inclinato in senso distale rispetto all’asse della corona.", "The three signs are clearest on incisors and canines and less reliable on molars and worn teeth. Always combine several features.": "I tre segni sono più evidenti su incisivi e canini e meno affidabili su molari e denti usurati. Combinare sempre più caratteri.", "My 3D pictures and images": "Le mie immagini 3D e illustrazioni", "Add picture": "Aggiungi immagine", "Upload screenshots of 3D tooth models, drawings or your own photos. They are shown for tooth {} and {} (same tooth on the other side) and are saved on this device for all cases.": "Caricare screenshot di modelli dentali 3D, disegni o foto proprie. Vengono mostrati per il dente {1} e {2} (stesso dente dell’altro lato) e restano su questo dispositivo per tutti i casi.", "No pictures for this tooth yet.": "Ancora nessuna immagine per questo dente.", "View, e.g. mesial, buccal, 3D": "Vista, ad es. mesiale, vestibolare, 3D", "Compare with the current case": "Confronta con il caso attuale", "Case pictures appear here when you enter tooth {} under “Teeth shown” in Case log › Photos & X-rays.": "Le immagini del caso compaiono qui se si indica il dente {1} in «Denti visibili» in Registro del caso › Foto e radiografie.", "Incisal edge with 3 mamelons when young": "Margine incisale con 3 mammelloni nei giovani", "1, conical": "1, conica", "Widest incisor. Mesio-incisal angle sharp (about 90°), disto-incisal angle rounded. Cingulum slightly distal.": "Incisivo più largo. Angolo mesio-incisale netto (circa 90°), angolo disto-incisale arrotondato. Cingolo leggermente distale.", "Wide crown (about 8.5 mm), clear cingulum and marginal ridges; root round in cross-section. A lower central is about 5 mm wide and flattened.": "Corona larga (circa 8,5 mm), cingolo e creste marginali evidenti; radice rotonda in sezione. Un centrale inferiore è largo circa 5 mm e appiattito.", "Mesio-incisal angle sharp, disto-incisal angle rounded; distal crown outline more convex; root apex tilts distally.": "Angolo mesio-incisale netto, disto-incisale arrotondato; contorno distale più convesso; apice inclinato distalmente.", "Incisal edge, angles more rounded than the central": "Margine incisale, angoli più arrotondati del centrale", "1, apex often curved distally": "1, apice spesso curvo distalmente", "Smaller and rounder than the central incisor. Often variant: peg-shaped or congenitally missing.": "Più piccolo e arrotondato del centrale. Varianti frequenti: conoide o agenesia.", "Rounded incisal angles, palatal pit possible; root round. Lower laterals are narrow with flattened roots.": "Angoli incisali arrotondati, possibile fossetta palatale; radice rotonda. I laterali inferiori sono stretti con radici appiattite.", "Distal angle clearly more rounded than mesial; root apex usually curves distally.": "Angolo distale nettamente più arrotondato del mesiale; apice di solito curvo distalmente.", "1 pointed cusp; mesial cusp ridge shorter than distal": "1 cuspide appuntita; cresta mesiale più corta della distale", "1, the longest root in the dentition": "1, la radice più lunga della dentatura", "Longest tooth. Strong labial ridge. Distal contour more convex.": "Dente più lungo. Cresta vestibolare marcata. Contorno distale più convesso.", "Broad crown with cusp tip near the centre; mesial and distal outlines bulge beyond the root. Lower canines are narrower and their mesial outline runs straight into the root.": "Corona larga con punta cuspidale centrale; contorni mesiale e distale sporgenti oltre la radice. I canini inferiori sono più stretti e il contorno mesiale prosegue dritto nella radice.", "Mesial cusp ridge shorter than distal; distal contact area lies more cervically; root tip curves distally.": "Cresta mesiale più corta della distale; contatto distale più cervicale; apice curvo distalmente.", "2: buccal larger than palatal": "2: vestibolare più grande della palatale", "Usually 2 (buccal and palatal)": "Di solito 2 (vestibolare e palatale)", "Mesial concavity on crown and root. Buccal cusp tip slightly distal.": "Concavità mesiale su corona e radice. Punta vestibolare leggermente distale.", "Two well-developed cusps and usually two roots. A lower first premolar has one dominant buccal cusp, a tiny lingual cusp and one root.": "Due cuspidi ben sviluppate e di solito due radici. Un primo premolare inferiore ha una cuspide vestibolare dominante, una linguale minima e una radice.", "Mesial concavity of crown and root (canine fossa side); buccal cusp tip slightly distal.": "Concavità mesiale di corona e radice (lato fossa canina); punta vestibolare leggermente distale.", "2 of almost equal size": "2 di dimensioni quasi uguali", "Usually 1": "Di solito 1", "1 or 2": "1 o 2", "More symmetrical than the first premolar; no marked mesial concavity.": "Più simmetrico del primo premolare; nessuna concavità mesiale marcata.", "Two cusps of nearly equal height, oval occlusal outline. Lower second premolars are rounder or square and the crown tilts lingually.": "Due cuspidi di altezza quasi uguale, contorno occlusale ovale. I secondi premolari inferiori sono più rotondi o quadrati e la corona è inclinata lingualmente.", "Buccal cusp tip slightly mesial; palatal cusp tip shifted mesially.": "Punta vestibolare leggermente mesiale; punta palatale spostata mesialmente.", "4 (mesiopalatal largest), often cusp of Carabelli": "4 (mesio-palatale la più grande), spesso tubercolo di Carabelli", "3 (mesiobuccal, distobuccal, palatal)": "3 (mesio-vestibolare, disto-vestibolare, palatale)", "3–4 (second mesiobuccal canal is common)": "3–4 (secondo canale mesio-vestibolare frequente)", "Largest upper tooth. Oblique ridge from mesiopalatal to distobuccal cusp. Rhomboid occlusal outline.": "Dente superiore più grande. Cresta obliqua dalla cuspide mesio-palatale alla disto-vestibolare. Contorno occlusale romboidale.", "Three roots (two buccal, one palatal), rhomboid crown, oblique ridge. Lower first molars have two roots (mesial and distal) and a rectangular crown.": "Tre radici (due vestibolari, una palatale), corona romboidale, cresta obliqua. I primi molari inferiori hanno due radici (mesiale e distale) e corona rettangolare.", "Mesiopalatal cusp is the largest; cusp of Carabelli lies mesiopalatal; mesiobuccal root broader than distobuccal.": "La cuspide mesio-palatale è la più grande; il tubercolo di Carabelli è mesio-palatale; radice mesio-vestibolare più larga della disto-vestibolare.", "4, distopalatal cusp smaller or absent": "4, cuspide disto-palatale più piccola o assente", "3, often closer together or fused": "3, spesso ravvicinate o fuse", "Smaller and more heart-shaped than the first molar; no cusp of Carabelli.": "Più piccolo e cuoriforme del primo molare; nessun tubercolo di Carabelli.", "Three roots (often close together), heart-shaped crown. Lower second molars have two roots and a cross-shaped groove pattern.": "Tre radici (spesso ravvicinate), corona cuoriforme. I secondi molari inferiori hanno due radici e solchi a croce.", "Distopalatal cusp reduced; roots incline distally.": "Cuspide disto-palatale ridotta; radici inclinate distalmente.", "Variable, often 3": "Variabile, spesso 3", "Variable, often fused": "Variabile, spesso fuse", "Variable": "Variabile", "17–21 (often impacted)": "17–21 (spesso incluso)", "Highly variable shape and position. Development stages are used for age estimation.": "Forma e posizione molto variabili. Gli stadi di sviluppo servono alla stima dell’età.", "Small, often triangular crown; roots usually fused into one cone.": "Corona piccola, spesso triangolare; radici di solito fuse in un cono.", "Often unreliable; use the remaining palatal and mesial features and the root inclination (distal).": "Spesso poco affidabile; usare i caratteri palatali e mesiali residui e l’inclinazione radicolare (distale).", "Incisal edge, crown symmetrical": "Margine incisale, corona simmetrica", "1, flattened mesiodistally": "1, appiattita in senso mesio-distale", "1, sometimes 2 (labial and lingual)": "1, talvolta 2 (vestibolare e linguale)", "Smallest tooth in the dentition. Mesial and distal halves almost mirror images.": "Dente più piccolo della dentatura. Metà mesiale e distale quasi speculari.", "Narrow, symmetrical crown (about 5 mm); root strongly flattened mesiodistally with grooves on both sides.": "Corona stretta e simmetrica (circa 5 mm); radice molto appiattita in senso mesio-distale con solchi su entrambi i lati.", "Difficult. Distal root groove is often deeper; the incisal edge may wear towards distal. Side is often not reliably determinable.": "Difficile. Il solco radicolare distale è spesso più profondo; il margine incisale può usurarsi verso distale. Il lato spesso non è determinabile con certezza.", "Incisal edge, distal angle more rounded": "Margine incisale, angolo distale più arrotondato", "1, sometimes 2": "1, talvolta 2", "Slightly larger than the central; crown appears twisted distally.": "Leggermente più grande del centrale; la corona appare ruotata distalmente.", "Narrow crown, flattened root; slightly larger than the lower central.": "Corona stretta, radice appiattita; leggermente più grande del centrale inferiore.", "Crown appears twisted distally: the disto-incisal angle is rounder and lies more lingually.": "La corona appare ruotata distalmente: l’angolo disto-incisale è più arrotondato e più linguale.", "1 cusp, tip often slightly mesial": "1 cuspide, punta spesso leggermente mesiale", "1, occasionally bifurcated": "1, occasionalmente biforcata", "Narrower than the upper canine; mesial crown outline almost straight with the root.": "Più stretto del canino superiore; contorno mesiale quasi in linea con la radice.", "Narrower crown, mesial outline continues straight into the root, smooth lingual surface.": "Corona più stretta, contorno mesiale che prosegue dritto nella radice, faccia linguale liscia.", "Cusp tip lies mesially; mesial cusp ridge shorter; mesial outline straight, distal outline convex.": "Punta cuspidale mesiale; cresta mesiale più corta; contorno mesiale dritto, distale convesso.", "Large buccal cusp, small lingual cusp": "Cuspide vestibolare grande, cuspide linguale piccola", "Looks canine-like from the buccal side. Lingual cusp very small.": "Aspetto caniniforme dal lato vestibolare. Cuspide linguale molto piccola.", "Dominant buccal cusp, tiny lingual cusp, crown tilted lingually, one root.": "Cuspide vestibolare dominante, linguale minima, corona inclinata lingualmente, una radice.", "Mesiolingual groove often present; mesial marginal ridge lower than distal; mesial buccal cusp ridge shorter.": "Solco mesio-linguale spesso presente; cresta marginale mesiale più bassa della distale; cresta vestibolare mesiale più corta.", "2 or 3 (Y-, H- or U-shaped groove pattern)": "2 o 3 (solchi a Y, H o U)", "Lingual cusps better developed than in the first premolar.": "Cuspidi linguali più sviluppate che nel primo premolare.", "Two or three cusps, round or square occlusal outline, one root, crown tilted lingually.": "Due o tre cuspidi, contorno occlusale rotondo o quadrato, una radice, corona inclinata lingualmente.", "In the three-cusp form the mesiolingual cusp is larger than the distolingual cusp.": "Nella forma tricuspidata la cuspide mesio-linguale è più grande della disto-linguale.", "5 (3 buccal, 2 lingual)": "5 (3 vestibolari, 2 linguali)", "2 (mesial and distal)": "2 (mesiale e distale)", "3 (2 mesial, 1 distal), sometimes 4": "3 (2 mesiali, 1 distale), talvolta 4", "Largest lower tooth. Y-shaped groove pattern. Distal cusp on the buccal side.": "Dente inferiore più grande. Solchi a Y. Cuspide distale sul lato vestibolare.", "Two roots (mesial and distal), five cusps, rectangular crown wider mesiodistally.": "Due radici (mesiale e distale), cinque cuspidi, corona re n dimensions: crown and root size, cusps, and number, position and inclination of the roots. Teeth of the left side are mirror images of the right side. M = mesial, D = distal.": "Trascinare con un dito per ruotare, pizzicare per ingrandire. Il modello integrato è un modello didattico calcolato dalle dimensioni medie di Wheeler: dimensioni di corona e radice, cuspidi, numero, posizione e inclinazione delle radici. I denti del lato sinistro sono speculari a quelli del destro. M = mesiale, D = distale.", "Free": "Gratis", "Dental chart: AM and PM, every surface and material, quick charting": "Odontogramma: AM e PM, ogni superficie e materiale, registrazione rapida", "AM/PM comparison with suggested result": "Confronto AM/PM con risultato proposto", "Age estimation with AGFAD checklist and minimum age": "Stima dell’età con lista AGFAD ed età minima", "Case log: photos, X-rays and chain of custody": "Registro del caso: foto, radiografie e catena di custodia", "PDF report with suggested conclusion": "Perizia PDF con conclusione proposta", "Tooth anatomy with 3D models": "Anatomia dentale con modelli 3D", "Forensic odontology toolkit for dental identification, age estimation and expert reports.": "Strumenti di odontologia forense per identificazione dentale, stima dell’età e perizie.", "Developed by": "Sviluppato da", "Forensic odontologist": "Odontologo forense", "Sign in": "Accedi", "Create free account": "Crea account gratuito", "Email": "E-mail", "Password": "Password", "At least 8 characters. You will get an email to confirm your address.": "Almeno 8 caratteri. Riceverà un’e-mail per confermare l’indirizzo.", "Create account": "Crea account", "Forgot password?": "Password dimenticata?", "Accounts are not connected yet": "Gli account non sono ancora collegati", "The owner must add the Supabase and Lemon Squeezy details first (see setup guide).": "Il proprietario deve prima inserire i dati di Supabase e Lemon Squeezy (vedi guida).", "Open in owner test mode": "Apri in pictures for this tooth yet.": "لا توجد صور لهذا السن بعد.", "View, e.g. mesial, buccal, 3D": "المنظر، مثل إنسي، دهليزي، ثلاثي الأبعاد", "Compare with the current case": "المقارنة مع الحالة الحالية", "Case pictures appear here when you enter tooth {} under “Teeth shown” in Case log › Photos & X-rays.": "تظهر صور الحالة هنا عند إدخال السن {1} في «الأسنان الظاهرة» ضمن سجل الحالة › الصور والأشعة.", "Incisal edge with 3 mamelons when young": "حافة قاطعة بثلاث حلمات عند صغار السن", "1, conical": "1، مخروطي", "Widest incisor. Mesio-incisal angle sharp (about 90°), disto-incisal angle rounded. Cingulum slightly distal.": "أعرض القواطع. الزاوية الإنسية القاطعة حادة (نحو 90°)، والوحشية مستديرة. الحزام مائل قليلًا وحشيًا.", "Wide crown (about 8.5 mm), clear cingulum and marginal ridges; root round in cross-section. A lower central is about 5 mm wide and flattened.": "تاج عريض (نحو 8.5 مم) مع حزام وحواف حدية واضحة؛ الجذر دائري المقطع. القاطع المركزي السفلي عرضه نحو 5 مم ومسطح.", "Mesio-incisal angle sharp, disto-incisal angle rounded; distal crown outline more convex; root apex tilts distally.": "الزاوية الإنسية القاطعة حادة والوحشية مستديرة؛ المحيط الوحشي للتاج أكثر تحدبًا؛ ذروة الجذر مائلة وحشيًا.", "Incisal edge, angles more rounded than the central": "حافة قاطعة بزوايا أكثر استدارة من المركزي", "1, apex often curved distally": "1، الذروة غالبًا منحنية وحشيًا", "Smaller and rounder than the central incisor. Often variant: peg-shaped or congenitally missing.": "أصغر وأكثر استدارة من القاطع المركزي. اختلافات شائعة: وتدي الشكل أو غياب خلقي.", "Rounded incisal angles, palatal pit possible; root round. Lower laterals are narrow with flattened roots.": "زوايا قاطعة مستديرة مع حفرة حنكية محتملة؛ الجذر دائري. القواطع الجانبية السفلية ضيقة بجذور مسطحة.", "Distal angle clearly more rounded than mesial; root apex usually curves distally.": "الزاوية الوحشية أكثر استدارة بوضوح من الإنسية؛ ذروة الجذر تنحني عادة وحشيًا.", "1 pointed cusp; mesial cusp ridge shorter than distal": "حدبة مدببة واحدة؛ الحافة الإنسية أقصر من الوحشية", "1, the longest root in the dentition": "1، أطول جذر في الأسنان", "Longest tooth. Strong labial ridge. Distal contour more convex.": "أطول سن. حافة شفوية قوية. المحيط الوحشي أكثر تحدبًا.", "Broad crown with cusp tip near the centre; mesial and distal outlines bulge beyond the root. Lower canines are narrower and their mesial outline runs straight into the root.": "تاج عريض ورأس الحدبة قرب المنتصف؛ المحيطان الإنسي والوحشي يبرزان عن الجذر. الأنياب السفلية أضيق ومحيطها الإنسي يمتد مستقيمًا في الجذر.", "Mesial cusp ridge shorter than distal; distal contact area lies more cervically; root tip curves distally.": "الحافة الإنسية أقصر من الوحشية؛ نقطة التماس الوحشية أقرب إلى العنق؛ ذروة الجذر منحنية وحشيًا.", "2: buccal larger than palatal": "2: الدهليزية أكبر من الحنكية", "Usually 2 (buccal and palatal)": "عادة 2 (دهليزي وحنكي)", "Mesial concavity on crown and root. Buccal cusp tip slightly distal.": "تقعر إنسي في التاج والجذر. رأس الحدبة الدهليزية مائل قليلًا وحشيًا.", "Two well-developed cusps and usually two roots. A lower first premolar has one dominant buccal cusp, a tiny lingual cusp and one root.": "حدبتان متطورتان وعادة جذران. الضاحك الأول السفلي له حدبة دهليزية سائدة وحدبة لسانية صغيرة جدًا وجذر واحد.", "Mesial concavity of crown and root (canine fossa side); buccal cusp tip slightly distal.": "تقعر إنسي في التاج والجذر (جهة الحفرة النابية)؛ رأس الحدبة الدهليزية مائل قليلًا وحشيًا.", "2 of almost equal size": "2 بحجم متقارب", "Usually 1": "عادة 1", "1 or 2": "1 أو 2", "More symmetrical than the first premolar; no marked mesial concavity.": "أكثر تناظرًا من الضاحك الأول؛ لا يوجد تقعر إنسي واضح.", "Two cusps of nearly equal height, oval occlusal outline. Lower second premolars are rounder or square and the crown tilts lingually.": "حدبتان بارتفاع متقارب ومحيط إطباقي بيضوي. الضواحك الثانية السفلية أكثر استدارة أو مربعة والتاج مائل لسانيًا.", "Buccal cusp tip slightly mesial; palatal cusp tip shifted mesially.": "رأس الحدبة الدهليزية مائل قليلًا إنسيًا؛ رأس الحدبة الحنكية منزاح إنسيًا.", "4 (mesiopalatal largest), often cusp of Carabelli": "4 (الإنسية الحنكية أكبرها)، غالبًا حدبة كارابيلي", "3 (mesiobuccal, distobuccal, palatal)": "3 (إنسي دهليزي، وحشي دهليزي، حنكي)", "3–4 (second mesiobuccal canal is common)": "3–4 (القناة الإنسية الدهليزية الثانية شائعة)", "Largest upper tooth. Oblique ridge from mesiopalatal to distobuccal cusp. Rhomboid occlusal outline.": "أكبر سن علوي. حافة مائلة من الحدبة الإنسية الحنكية إلى الوحشية الدهليزية. محيط إطباقي معيني.", "Three roots (two buccal, one palatal), rhomboid crown, oblique ridge. Lower first molars have two roots (mesial and distal) and a rectangular crown.": "ثلاثة جذور (اثنان دهليزيان وواحد حنكي)، تاج معيني، حافة مائلة. الأرحاء الأولى السفلية لها جذران (إنسي ووحشي) وتاج مستطيل.", "Mesiopalatal cusp is the largest; cusp of Carabelli lies mesiopalatal; mesiobuccal root broader than distobuccal.": "الحدبة الإنسية الحنكية هي الأكبر؛ حدبة كارابيلي إنسية حنكية؛ الجذر الإنسي الدهليزي أعرض من الوحشي الدهليزي.", "4, distopalatal cusp smaller or absent": "4، الحدبة الوحشية الحنكية أصغر أو غائبة", "3, often closer together or fused": "3، غالبًا متقاربة أو ملتحمة", "Smaller and more heart-shaped than the first molar; no cusp of Carabelli.": "أصغر وأقرب لشكل القلب من الرحى الأولى؛ لا توجد حدبة كارابيلي.", "Three roots (often close together), heart-shaped crown. Lower second molars have two roots and a cross-shaped groove pattern.": "ثلاثة جذور (غالبًا متقاربة)، تاج بشكل القلب. الأرحاء الثانية السفلية لها جذران وأخاديد بشكل صليب.", "Distopalatal cusp reduced; roots incline distally.": "الحدبة الوحشية الحنكية صغيرة؛ الجذور مائلة وحشيًا.", "Variable, often 3": "متغير، غالبًا 3", "Variable, often fused": "متغير، غالبًا ملتحمة", "Variable": "متغير", "17–21 (often impacted)": "17–21 (غالبًا منطمر)", "Highly variable shape and position. Development stages are used for age estimation.": "الشكل والموضع متغيران جدًا. تُستخدم مراحل النمو لتقدير العمر.", "Small, often triangular crown; roots usually fused into one cone.": "تاج صغير غالبًا مثلثي؛ الجذور عادة ملتحمة في مخروط واحد.", "Often unreliable; use the remaining palatal and mesial features and the root inclination (distal).": "غالبًا غير موثوق؛ استخدم العلامات الحنكية والإنسية المتبقية وميل الجذر (وحشيًا).", "Incisal edge, crown symmetrical": "حافة قاطعة، تاج متناظر", "1, flattened mesiodistally": "1، مسطح إنسيًا وحشيًا", "1, sometimes 2 (labial and lingual)": "1، أحيانًا 2 (شفوي ولساني)", "Smallest tooth in the dentition. Mesial and distal halves almost mirror images.": "أصغر سن في الأسنان. النصفان الإنسي والوحشي متماثلان تقريبًا.", "Narrow, symmetrical crown (about 5 mm); root strongly flattened mesiodistally with grooves on both sides.": "تاج ضيق متناظر (نحو 5 مم)؛ جذر مسطح بشدة إنسيًا وحشيًا مع أخاديد على الجانبين.", "Difficult. Distal root groove is often deeper; the incisal edge may wear towards distal. Side is often not reliably determinable.": "صعب. الأخدود الجذري الوحشي غالبًا أعمق؛ وقد تتآكل الحافة القاطعة وحشيًا. غالبًا لا يمكن تحديد الجهة بثقة.", "Incisal edge, distal angle more rounded": "حافة قاطعة، الزاوية الوحشية أكثر استدارة", "1, sometimes 2": "1، أحيانًا 2", "Slightly larger than the central; crown appears twisted distally.": "أكبر قليلًا من المركزي؛ يبدو التاج ملتويًا وحشيًا.", "Narrow crown, flattened root; slightly larger than the lower central.": "تاج ضيق وجذر مسطح؛ أكبر قليلًا من القاطع المركزي السفلي.", "Crown appears twisted distally: the disto-incisal angle is rounder and lies more lingually.": "يبدو التاج ملتويًا وحشيًا: الزاوية الوحشية القاطعة أكثر استدارة وأكثر لسانية.", "1 cusp, tip often slightly mesial": "حدبة واحدة، رأسها غالبًا مائل قليلًا إنسيًا", "1, occasionally bifurcated": "1، أحيانًا متشعب", "Narrower than the upper canine; mesial crown outline almost straight with the root.": "أضيق من الناب العلوي؛ المحيط الإنسي للتاج شبه مستقيم مع الجذر.", "Narrower crown, mesial outline continues straight into the root, smooth lingual surface.": "تاج أضيق، والمحيط الإنسي يمتد مستقيمًا في الجذر، والسطح اللساني أملس.", "Cusp tip lies mesially; mesial cusp ridge shorter; mesial outline straight, distal outline convex.": "رأس الحدبة إنسي؛ الحافة الإنسية أقصر؛ المحيط الإنسي مستقيم والوحشي محدب.", "Large buccal cusp, small lingual cusp": "حدبة دهليزية كبيرة وحدبة لسانية صغيرة", "Looks canine-like from the buccal side. Lingual cusp very small.": "يشبه الناب من الجهة الدهليزية. الحدبة اللسانية صغيرة جدًا.", "Dominant buccal cusp, tiny lingual cusp, crown tilted lingually, one root.": "حدبة دهليزية سائدة، حدبة لسانية صغيرة جدًا، تاج مائل لسانيًا، جذر واحد.", "Mesiolingual groove often present; mesial marginal ridge lower than distal; mesial buccal cusp ridge shorter.": "غالبًا أخدود إنسي لساني؛ الحافة الحدية الإنسية أخفض من الوحشية؛ حافة الحدبة الدهليزية الإنسية أقصر.", "2 or 3 (Y-, H- or U-shaped groove pattern)": "2 أو 3 (نمط أخاديد على شكل Y أو H أو U)", "Lingual cusps better developed than in the first premolar.": "الحدبات اللسانية أكثر تطورًا من الضاحك الأول.", "Two or three cusps, round or square occlusal outline, one root, crown tilted lingually.": "حدبتان أو ثلاث، محيط إطباقي دائري أو مربع، جذر واحد، تاج مائل لسانيًا.", "In the three-cusp form the mesiolingual cusp is larger than the distolingual cusp.": "في الشكل ثلاثي الحدبات تكون الحدبة الإنسية اللسانية أكبر من الوحشية اللسانية.", "5 (3 buccal, 2 lingual)": "5 (3 دهليزية، 2 لسانية)", "2 (mesial and distal)": "2 (إنسي ووحشي)", "3 (2 mesial, 1 distal), sometimes 4": "3 (2 إنسيتان، 1 وحشية)، أحيانًا 4", "Largest lower tooth. Y-shaped groove pattern. Distal cusp on the buccal side.": "أكبر سن سفلي. نمط أخاديد على شكل Y. الحدبة الوحشية في الجهة الدهليزية.", "Two roots (mesial and distal), five cusps, rectangular crown wider mesiodistally.": "جذران (إنسي ووحشي)، خمس حدبات، تاج مستطيل أعرض إنسيًا وحشيًا.", "The small distal cusp sits distobuccally; mesial root broader and curved distally; two buccal grooves.": "الحدبة الوحشية الصغيرة في الموضع الوحشي الدهليزي؛ const distinctive=t=>{t=get(t);return ['missing','implant','pontic','denture','root'].includes(t.s)||(t.s==='present'&&!!(restSurfs(t)||t.crown||t.rct||t.post||t.veneer))};

function compare(a,p){

  if(a.crown&&!p.crown)I('crown AM not present PM','Krone AM, postmortal nicht vorhanden');

function tileStatus(id,c){

  if(id==='age'){const s=M3.filter(n=>{const t=c.age.teeth[n]||{};return t.absent||t.dem}).length;const r=ageResult(c);return r.top?`${L('Min. age','Mindestalter')} ${fmt(r.top.min)} ${L('y','J.')}`:`${s}/4 ${L('third molars staged','Weisheitszähne bestimmt')}`}
  if(id==='log'){const tot=CHECKS.reduce((a,g)=>a+g[1].length,0),d=CHECKS.reduce((a,g)=>a+g[1].filter(([k])=>c.log.checks[k]).length,0);return `${(c.photos||[]).length} ${L('pictures','Bilder')} · ${c.log.events.length} ${L('entries','Einträge')} · ${d}/${tot} ${L('checklist','Checkliste')}`}
