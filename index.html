function suggestConclusion(c){
  const lg=repLg(),de=lg==='de',m=c.meta,a=analyse(c),out=[];
  if(c.rep.type!=='age'){
    const pmT=m.pmNo?` (${m.pmNo})`:'',amT=m.amRef?(RT(` zu ${m.amRef}`,` (${m.amRef})`,lg)):'';
    const inc=a.rows.filter(r=>r.r==='incon').map(r=>r.n).join(', ');
    const T=de?{
      positive:`Die postmortal erhobenen Zahnbefunde${pmT} stimmen in allen vergleichbaren Merkmalen mit den antemortalen Unterlagen${amT} überein. Es bestehen keine nicht erklärbaren Abweichungen; ${a.dist} charakteristische Merkmale (u. a. Restaurationen, fehlende Zähne) stimmen überein. Aus zahnärztlich-forensischer Sicht ist die Identität damit gesichert.`,
      probable:`Die postmortal erhobenen Zahnbefunde${pmT} stimmen mit den antemortalen Unterlagen${amT} überein, ohne dass nicht erklärbare Abweichungen bestehen. Die übereinstimmenden Merkmale sind jedoch nur eingeschränkt charakteristisch bzw. die Unterlagen unvollständig. Aus zahnärztlich-forensischer Sicht ist die Identität wahrscheinlich.`,
      possible:`Zwischen den postmortalen Zahnbefunden${pmT} und den antemortalen Unterlagen${amT} bestehen keine nicht erklärbaren Abweichungen, jedoch nur wenige charakteristische Merkmale. Die Identität ist aus zahnärztlich-forensischer Sicht möglich, aber nicht gesichert. Eine Bestätigung durch weitere Methoden (z. B. DNA-Analyse) wird empfohlen.`,
      insufficient:`Die vorliegenden antemortalen Unterlagen${amT} bzw. die postmortalen Befunde${pmT} reichen für eine zahnärztlich-forensische Aussage zur Identität nicht aus.`,
      exclusion:`Zwischen den postmortalen Zahnbefunden${pmT} und den antemortalen Unterlagen${amT} bestehen nicht erklärbare Abweichungen${inc?` (Zahn ${inc})`:''}. Aus zahnärztlich-forensischer Sicht ist die Identität ausgeschlossen.`
    }:{
      positive:`The post-mortem dental findings${pmT} agree in all comparable features with the ante-mortem records${amT}. There are no unexplainable discrepancies; ${a.dist} distinctive features (including restorations and missing teeth) are concordant. From a forensic odontological point of view, the identity is established.`,
      probable:`The post-mortem dental findings${pmT} agree with the ante-mortem records${amT} without unexplainable discrepancies. However, the concordant features are of limited specificity or the records are incomplete. From a forensic odontological point of view, the identity is probable.`,
      possible:`There are no unexplainable discrepancies between the post-mortem dental findings${pmT} and the ante-mortem records${amT}, but only few distinctive features. From a forensic odontological point of view, the identity is possible but not established. Confirmation by other methods (e.g. DNA analysis) is recommended.`,
      insufficient:`The available ante-mortem records${amT} and/or post-mortem findings${pmT} are not sufficient for a forensic odontological statement on identity.`,
      exclusion:`There are unexplainable discrepancies between the post-mortem dental findings${pmT} and the ante-mortem records${amT}. ${inc?`Teeth concerned: ${inc}. `:''}From a forensic odontological point of view, the identity is excluded.`
    };
    if(!c.rep.idCat)return null;
    out.push(de||lg==='en'?T[c.rep.idCat]:tx(T[c.rep.idCat],lg));
  }
  if(c.rep.type!=='id'){
    const top=ageResult(c).top;
    if(top)out.push(RT(`Nach den zahnärztlichen Befunden (Weisheitszahnentwicklung) beträgt das Mindestalter ${fmt(top.min,'de')} Jahre. Die Vollendung des 18. Lebensjahres ist damit ${top.min>=18?'nachgewiesen':'nicht nachgewiesen'}.`,`Based on the dental findings (third molar development), the minimum age is ${fmt(top.min,'en')} years. Completion of the 18th year of life is therefore ${top.min>=18?'proven':'not proven'}.`,lg));
    else out.push(RT('Ein Mindestalter kann aus den zahnärztlichen Befunden nicht angegeben werden.','No minimum age can be stated from the dental findings.',lg));
  }
  return out.join('\n\n');
}

 up:{
  1:{ul:['Wide crown (about 8.5 mm), clear cingulum and marginal ridges; root round in cross-section. A lower central is about 5 mm wide and flattened.','Breite Krone (etwa 8,5 mm), deutliches Tuberculum und Randleisten; Wurzel im Querschnitt rund. Ein unterer mittlerer ist etwa 5 mm breit und abgeflacht.'],rl:['Mesio-incisal angle sharp, disto-incisal angle rounded; distal crown outline more convex; root apex tilts distally.','Mesio-inzisaler Winkel scharf, disto-inzisaler Winkel abgerundet; distale Kronenkontur stärker gewölbt; Wurzelspitze nach distal geneigt.']},
  2:{ul:['Rounded incisal angles, palatal pit possible; root round. Lower laterals are narrow with flattened roots.','Abgerundete Inzisalwinkel, Foramen caecum möglich; Wurzel rund. Untere seitliche sind schmal mit abgeflachter Wurzel.'],rl:['Distal angle clearly more rounded than mesial; root apex usually curves distally.','Distaler Winkel deutlich runder als mesial; Wurzelspitze meist nach distal gekrümmt.']},
  3:{ul:['Broad crown with cusp tip near the centre; mesial and distal outlines bulge beyond the root. Lower canines are narrower and their mesial outline runs straight into the root.','Breite Krone, Höckerspitze etwa mittig; mesiale und distale Kontur ragen über die Wurzel hinaus. Untere Eckzähne sind schmaler, ihre mesiale Kontur geht gerade in die Wurzel über.'],rl:['Mesial cusp ridge shorter than distal; distal contact area lies more cervically; root tip curves distally.','Mesiale Höckerkante kürzer als distale; distaler Kontaktpunkt liegt weiter zervikal; Wurzelspitze nach distal gekrümmt.']},

  5:{ul:['Two cusps of nearly equal height, oval occlusal outline. Lower second premolars are rounder or square and the crown tilts lingually.','Zwei fast gleich hohe Höcker, ovale Okklusalfläche. Untere zweite Prämolaren sind runder oder quadratisch, die Krone ist nach lingual geneigt.'],rl:['Buccal cusp tip slightly mesial; palatal cusp tip shifted mesially.','Bukkale Höckerspitze leicht mesial; palatinale Höckerspitze nach mesial versetzt.']},
  6:{ul:['Three roots (two buccal, one palatal), rhomboid crown, oblique ridge. Lower first molars have two roots (mesial and distal) and a rectangular crown.','Drei Wurzeln (zwei bukkal, eine palatinal), rhombische Krone, Crista obliqua. Untere erste Molaren haben zwei Wurzeln (mesial und distal) und eine rechteckige Krone.'],rl:['Mesiopalatal cusp is the largest; cusp of Carabelli lies mesiopalatal; mesiobuccal root broader than distobuccal.','Mesiopalatinaler Höcker am größten; Tuberculum Carabelli mesiopalatinal; mesiobukkale Wurzel breiter als distobukkale.']},
  7:{ul:['Three roots (often close together), heart-shaped crown. Lower second molars have two roots and a cross-shaped groove pattern.','Drei (oft eng stehende) Wurzeln, herzförmige Krone. Untere zweite Molaren haben zwei Wurzeln und ein kreuzförmiges Fissurenmuster.'],rl:['Distopalatal cusp reduced; roots incline distally.','Distopalatinaler Höcker reduziert; Wurzeln nach distal geneigt.']},
  8:{ul:['Small, often triangular crown; roots usually fused into one cone.','Kleine, oft dreieckige Krone; Wurzeln meist zu einem Konus verschmolzen.'],rl:['Often unreliable; use the remaining palatal and mesial features and the root inclination (distal).','Oft unsicher; verbleibende palatinale und mesiale Merkmale sowie die Wurzelneigung (distal) nutzen.']}
 },

/* ---------- DVI: compare every body with every missing person ---------- */
const amCount=c=>ALL.filter(n=>get(c.am[n]).s!=='unk').length,pmCount=c=>ALL.filter(n=>get(c.pm[n]).s!=='unk').length;
const pmName=c=>c.meta.pmNo||c.meta.caseNo||L('Untitled body','Unbenannter Leichnam');
const amName=c=>c.meta.amRef||c.meta.caseNo||L('Untitled missing person','Unbenannte vermisste Person');
function dviRank(body){
  return store.cases.filter(x=>amCount(x)>0).map(x=>{const a=analyse({am:x.am,pm:body.pm});return {c:x,a}})
   .sort((p,q)=>(p.a.k.incon>0)-(q.a.k.incon>0)||q.a.dist-p.a.dist||q.a.k.match-p.a.k.match||p.a.k.incon-q.a.k.incon);
}

  el.querySelectorAll('[data-dviuse]').forEach(b=>{const [bid,cid]=b.dataset.dviuse.split(',');const go2=()=>{const B=store.cases.find(x=>x.id===bid),C=store.cases.find(x=>x.id===cid);if(B!==C){B.am=JSON.parse(JSON.stringify(C.am));B.meta.amRef=amName(C);B.meta.amSource=C.meta.amSource||B.meta.amSource;}store.cur=B.id;save();go('cmp',0)};
    if(bid===cid)b.onclick=go2;else twoTap(b,L('Tap again: copy this AM record into the body’s case','Erneut tippen: diesen AM-Befund in den Fall des Leichnams kopieren'),go2)});

const PAL={1:n=>n+'┘',2:n=>'└'+n,3:n=>'┌'+n,4:n=>n+'┐'};

  const had={1:hd+'+',2:'+'+hd,3:'−'+hd,4:hd+'−'}[qq];

function showLegal(k){
  const lg=lang()==='de'?'de':'en';
  let ov=document.getElementById('legalOv');if(!ov){ov=document.createElement('div');ov.id='legalOv';ov.className='legal-ov';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');document.body.appendChild(ov)}
  const other=lg==='de'?'en':'de';
  ov.innerHTML=`<div class="legal-box" dir="ltr" lang="${lg}"><div class="legal-head"><b>${esc(L(...LEGAL_TITLES[k]))}</b><button type="button" class="btn small" id="legalClose">${esc(L('Close','Schließen'))}</button></div>
   <div class="legal-body">${lang()!=='de'&&lang()!=='en'?`<p class="fine" dir="${isRTL(lang())?'rtl':'ltr'}">${esc(L('This text is available in German and English. The German version applies.','Dieser Text ist auf Deutsch und Englisch verfügbar. Maßgeblich ist die deutsche Fassung.'))}</p>`:''}
   ${LEGAL[k][lg]()}<p class="fine">${LEGAL_DATE[lg]}${lg==='en'?' · The German version applies.':''}</p>
   <p><button type="button" class="btn small" id="legalOther">${other==='de'?'Deutsche Fassung':'English version'}</button></p></div></div>`;
  ov.hidden=false;document.body.classList.add('legal-open');
  const close=()=>{ov.hidden=true;document.body.classList.remove('legal-open')};
  ov.querySelector('#legalClose').onclick=close;ov.onclick=e=>{if(e.target===ov)close()};
  ov.querySelector('#legalOther').onclick=()=>{const b=ov.querySelector('.legal-body');b.parentElement.setAttribute('lang',other);b.innerHTML=LEGAL[k][other]()+`<p class="fine">${LEGAL_DATE[other]}</p>`;b.scrollTop=0};
  ov.querySelector('#legalClose').focus();
}

/* ---------- accounts and Pro access ---------- */
const PRO_MODS=['cmp','age','log','rep','anat','guide','dvi','xray','intl'];
const AUTH={client:null,user:null,pro:false,test:false,ready:false};
const configured=()=>!!(CONFIG.supabaseUrl&&CONFIG.supabaseAnonKey);
const hasPro=()=>AUTH.test||AUTH.pro;
let authTab='in',upgradeWant=null;
function proCacheKey(){return 'forensident.pro.'+(AUTH.user?AUTH.user.id:'')}
async function refreshPro(){
  if(!AUTH.client||!AUTH.user){AUTH.pro=false;return}
  try{const {data,error}=await AUTH.client.from('profiles').select('is_pro').eq('id',AUTH.user.id).maybeSingle();if(error)throw error;
    AUTH.pro=!!(data&&data.is_pro);try{localStorage.setItem(proCacheKey(),AUTH.pro?'1':'0')}catch(e){}}
  catch(e){try{AUTH.pro=localStorage.getItem(proCacheKey())==='1'}catch(x){}}
}
async function initAuth(){
  try{if(localStorage.getItem('forensident.test')==='1'&&!configured())AUTH.test=true}catch(e){}
  if(!configured()){AUTH.ready=true;return}
  try{
    if(!window.supabase)await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js');
    AUTH.client=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const {data}=await AUTH.client.auth.getSession();AUTH.user=data.session?data.session.user:null;
    if(AUTH.user)await refreshPro();
    AUTH.client.auth.onAuthStateChange(async(ev,session)=>{const u=session?session.user:null;if((u&&u.id)!==(AUTH.user&&AUTH.user.id)){AUTH.user=u;await refreshPro();route={mod:null,step:0};render()}});
  }catch(e){AUTH.loadError=true}
  AUTH.ready=true;
}

function abfoScale(){

  let seg='';for(let i=0;i<10;i++)seg+=`<rect x="${20+i*26}" y="40" width="26" height="6" fill="${i%2?'var(--surface)':'var(--ink)'}" stroke="var(--ink)" stroke-width=".6"/>`;
  return `<svg class="abfo" viewBox="0 0 300 64" aria-hidden="true"><rect x="12" y="8" width="276" height="48" rx="3" fill="var(--surface)" stroke="var(--line2)"/>${t}${seg}<text x="282" y="23" font-size="7" text-anchor="end" fill="var(--muted)" font-family="FD Mono,monospace">cm</text></svg>`;
}

const PDF_TOK={'--bg':'#ffffff','--surface':'#ffffff','--ink':'#14191b','--muted':'#555555','--line':'#d0d6d7','--line2':'#9aa5a8','--enamel':'#ffffff','--tline':'#6d7c80','--resto':'#3e86c6','--amalgam':'#55606a','--gold':'#c69a2b','--crown':'#0d6468','--rct':'#c2410c','--caries':'#c0262d','--gic':'#2a9d8f','--cer':'#d6cbef','--temp':'#f0b27a','--match':'#2e7d4c','--expl':'#a86b0c','--incon':'#b3261e','--nodata':'#8a979b','--match-bg':'#e3f1e8','--expl-bg':'#f8eedb','--incon-bg':'#f9e2e0','--nodata-bg':'#eceff0','--am':'#34508f','--pm':'#7b3d7f','--accent':'#0d6468'};

function odontoSVG(c,chart,res,lg){

    const g=resolveVars(glyph(t,n)).replace('<svg ',`<svg x="${x+3}" y="${lower?y0+2:y0+30}" width="38" height="48" `);
    const numY=lower?y0+64:y0+28,codeY=lower?y0+78:y0+12,nc=r?PDF_TOK['--'+(r.r==='nodata'?'muted':r.r)]:PDF_TOK['--muted'];

  return {svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${W*2}" height="${H*2}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#fff"/>${s}</svg>`,ratio:H/W};
}
class PDFPages{
  constructor(caseNo,lg){this.W=1240;this.H=1754;this.M=96;this.CW=this.W-2*this.M;this.pages=[];this.lg=lg;this.rtl=isRTL(lg);this.caseNo=caseNo;this.newPage()}

  fr(x,y,w,h){this.g.fillRect(this.rtl?this.W-x-w:x,y,w,h)}

  font(size,bold,mono){this.g.font=`${bold?'700 ':''}${size}px ${mono?'Menlo, "Courier New", monospace':'"Helvetica Neue", Helvetica, Arial, sans-serif'}`}

  wrap(str,maxW){const out=[],RX=/[\u2E80-\u9FFF\uAC00-\uD7AF\uF900-\uFAFF\uFF00-\uFFEF]|[^\s\u2E80-\u9FFF\uAC00-\uD7AF\uF900-\uFAFF\uFF00-\uFFEF]+|\s+/g;
    for(const para of String(str??'').split('\n')){let line='';for(const tk of para.match(RX)||[]){if(/^\s+$/.test(tk)){if(line)line+=' ';continue}const t=line+tk;if(this.g.measureText(t).width>maxW&&line.trim()){out.push(line.trimEnd());line=tk}else line=t}out.push(line.trimEnd())}return out}
  text(str,o={}){const size=o.size||21,lh=Math.round(size*(o.lh||1.42)),x=this.M+(o.indent||0),w=o.width||this.CW-(o.indent||0);this.font(size,o.bold,o.mono);
    for(const ln of this.wrap(str,w)){this.ensure(lh);this.font(size,o.bold,o.mono);this.g.fillStyle=o.color||'#14191b';this.ft(ln,x,this.y+size);this.y+=lh}this.y+=o.gap??8}
  rule(color='#0d6468',w=3){this.g.fillStyle=color;this.fr(this.M,this.y,this.CW,w);this.y+=w+10}

  table(cols,rows,o={}){
    const size=o.size||18,lh=Math.round(size*1.38),pad=8,X=[this.M];cols.forEach((c,i)=>X.push(X[i]+c.w*this.CW));
    const drawHead=()=>{if(!cols.some(c=>c.t))return;this.font(15,true);this.g.fillStyle='#555';cols.forEach((c,i)=>this.ft(String(c.t||'').toUpperCase(),X[i]+pad,this.y+16));this.y+=26;this.g.fillStyle='#9aa5a8';this.fr(this.M,this.y,this.CW,1.5);this.y+=4};
    this.ensure(60);drawHead();
    for(const r of rows){
      const cells=r.map((cell,i)=>{const cc=typeof cell==='object'&&cell!==null?cell:{t:cell};this.font(cc.size||size,cc.bold);return {...cc,lines:this.wrap(cc.t??'',(X[i+1]-X[i])-2*pad)}});

      const hgt=Math.max(...cells.map((cc,i)=>cc.lines.length*lh+sub[i].length*(lh-4)))+2*pad;
      if(this.ensure(Math.min(hgt,this.H-2*this.M-60)))drawHead();
      cells.forEach((cc,i)=>{let yy=this.y+pad;if(cc.bg){this.g.fillStyle=cc.bg;this.fr(X[i]+2,this.y+3,X[i+1]-X[i]-4,hgt-6)}
        this.font(cc.size||size,cc.bold);this.g.fillStyle=cc.color||'#14191b';for(const ln of cc.lines){this.ft(ln,X[i]+pad,yy+size);yy+=lh}
        if(sub[i].length){this.font(size-3);this.g.fillStyle='#555';for(const ln of sub[i]){this.ft(ln,X[i]+pad,yy+size-3);yy+=lh-4}}});
      this.y+=hgt;this.g.fillStyle='#e1e6e7';this.fr(this.M,this.y-1,this.CW,1.2)}

  async image(src,ratio,maxH){const img=await loadImg(src);const r=ratio||img.height/img.width;let w=this.CW,h=w*r;if(maxH&&h>maxH){h=maxH;w=h/r}this.ensure(h+10);this.g.drawImage(img,this.rtl?this.W-this.M-w:this.M,this.y,w,h);this.y+=h+12}
  box(str,o={}){const size=o.size||20,lh=Math.round(size*1.45);this.font(size,o.bold);const lines=this.wrap(str,this.CW-36);let i=0;
    while(i<lines.length){this.ensure(lh+30);const room=Math.max(1,Math.floor((this.H-this.M-20-this.y-24)/lh)),chunk=lines.slice(i,i+room),h=chunk.length*lh+24;
      this.g.strokeStyle='#9aa5a8';this.g.lineWidth=1.5;this.sr(this.M,this.y,this.CW,h);this.font(size,o.bold);this.g.fillStyle='#14191b';chunk.forEach((ln,k)=>this.ft(ln,this.M+18,this.y+12+size+k*lh));this.y+=h+10;i+=chunk.length;if(i<lines.length)this.newPage()}}
  finish(){const n=this.pages.length,P=(d,e)=>RT(d,e,this.lg);this.pages.forEach((c,i)=>{this.g=c.getContext('2d');this.g.font='15px "Helvetica Neue", Helvetica, Arial, sans-serif';this.g.fillStyle='#777';this.ft(`ForensiDent · ${this.caseNo||''}`,this.M,this.H-this.M/2);this.ft(`${P('Seite','Page')} ${i+1} / ${n}`,this.W-this.M,this.H-this.M/2,'right')})}
}
async function pagesToPDF(canvases){
  const enc=new TextEncoder(),parts=[];let len=0;const offs=[];
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(id,body)=>{offs[id]=len;push(`${id} 0 obj\n${body}\nendobj\n`)};
  push('%PDF-1.4\n%ÿÿ\n');
  const n=canvases.length,kids=canvases.map((_,i)=>`${3+3*i} 0 R`).join(' ');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`);
  for(let i=0;i<n;i++){
    const c=canvases[i],blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9)),jpg=new Uint8Array(await blob.arrayBuffer());
    const pid=3+3*i,cid=pid+1,iid=pid+2,cs=`q 595.28 0 0 841.89 0 0 cm /Im${i} Do Q`;
    obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im${i} ${iid} 0 R >> >> /Contents ${cid} 0 R >>`);
    obj(cid,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[iid]=len;push(`${iid} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push('\nendstream\nendobj\n');
  }
  const max=2+3*n,xo=len;let x=`xref\n0 ${max+1}\n0000000000 65535 f \n`;for(let id=1;id<=max;id++)x+=String(offs[id]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<< /Size ${max+1} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}

  {src:'American Dental Association eruption charts; Nelson, Wheeler’s Dental Anatomy.'}]},
 agelimits:{t:['Limitations, uncertainty and population differences','Grenzen, Unsicherheit und Populationsunterschiede'],b:[
  {ul:[['Every method has a spread; report the reference study, its population, sex and the statistical range used.','Jede Methode hat eine Streuung; Referenzstudie, Population, Geschlecht und statistische Spanne angeben.'],['Reference data from one population may over- or underestimate age in another (ethnicity, nutrition, socio-economic status).','Referenzdaten einer Population können das Alter in einer anderen über- oder unterschätzen (Herkunft, Ernährung, sozioökonomischer Status).'],['Third molars vary widely and may be missing or impacted; impaction can delay development.','Weisheitszähne variieren stark, können fehlen oder retiniert sein; Retention kann die Entwicklung verzögern.'],['Age mimicry: point estimates drift towards the mean age of the reference sample.','Age mimicry: Punktschätzungen nähern sich dem Mittelwert der Referenzstichprobe.'],['For legal age thresholds, use the minimum-age concept (youngest age at which the stage was observed) to avoid declaring a minor as adult.','Für rechtliche Altersgrenzen das Mindestalterkonzept nutzen (jüngstes beobachtetes Alter des Stadiums), damit kein Minderjähriger als volljährig eingestuft wird.'],['Always combine dental, skeletal and physical findings (AGFAD).','Zahnärztliche, skelettale und körperliche Befunde immer kombinieren (AGFAD).']]},
  {key:['A dental result supports an age assessment; it does not prove a date of birth.','Ein zahnärztlicher Befund stützt eine Altersbeurteilung; er beweist kein Geburtsdatum.']},
  {tools:['age']},
  {src:'AGFAD recommendations; Schmeling et al.; Liversidge & Marsden.'}]},
 bitedoc:{t:['Documentation and photography','Dokumentation und Fotografie'],check:'bitedoc',b:[
  {p:['Bite marks change quickly on living and deceased skin. Document early and repeatedly, before any swabbing or cleaning disturbs the area.','Bissspuren verändern sich auf lebender und toter Haut schnell. Früh und wiederholt dokumentieren, bevor Abstriche oder Reinigung die Region verändern.']},
  {items:[['loc','Location on the body, body position and surface curvature described','Lokalisation am Körper, Körperhaltung und Oberflächenkrümmung beschrieben'],['ov','Overview photo showing the anatomical location','Übersichtsfoto mit anatomischer Lage'],['scale','Close-ups with ABFO No. 2 scale in the same plane as the injury','Nahaufnahmen mit ABFO-Nr.-2-Maßstab in derselben Ebene wie die Verletzung'],['perp','Camera perpendicular to the mark; no wide-angle distortion','Kamera senkrecht zur Spur; keine Weitwinkelverzerrung'],['ser','Serial photos over days (living: daily for several days; deceased: over 24–48 h)','Serienfotos über Tage (Lebende: mehrere Tage täglich; Verstorbene: über 24–48 h)'],['uv','Alternative light: UV and infrared photography considered','Alternative Lichtquellen: UV- und Infrarotfotografie erwogen'],['meas','Measurements: arch width, mark dimensions, distances between marks','Messungen: Bogenbreite, Maße der Spur, Abstände zwischen Einzelmarken'],['desc','Written description: shape, colour, abrasions, contusions, lacerations, possible tooth marks','Schriftliche Beschreibung: Form, Farbe, Abschürfungen, Hämatome, Risse, mögliche Zahnabdrücke']]},
  {fields:[['site','Location','Lokalisation'],['size','Size (mm)','Größe (mm)'],['shape','Shape and pattern','Form und Muster'],['note','Notes','Bemerkungen']]},
  {tools:['log']},
  {src:'ABFO Bitemark Methodology Standards and Guidelines; ABFO Reference Manual.'}]},
 biteev:{t:['Evidence collection and preservation','Spurensicherung und Asservierung'],check:'biteev',b:[
  {items:[['swab','Saliva swabbing before cleaning: double-swab technique (moist then dry swab)','Speichelabstrich vor Reinigung: Doppeltupfer-Technik (erst feucht, dann trocken)'],['ctrl','Control swab from an unbitten skin area','Kontrollabstrich von unverletzter Haut'],['dry','Swabs air-dried, packed in paper, labelled, chain of custody started','Abstriche luftgetrocknet, in Papier verpackt, beschriftet, Asservatenkette begonnen'],['imp','Impression of the injured skin (if indentations present) with low-viscosity material','Abformung der Haut (bei Eindrücken) mit dünnfließendem Material'],['tis','Tissue excision only by forensic pathologist with legal authority, fixed on a support ring','Gewebeentnahme nur durch Rechtsmedizin mit rechtlicher Grundlage, auf Stützring fixiert'],['susp','Suspect dentition only with legal authority/consent: photos, impressions, bite registration','Gebiss Tatverdächtiger nur mit rechtlicher Grundlage/Einwilligung: Fotos, Abformungen, Bissregistrat'],['blind','Comparisons done blind to case information where possible','Vergleiche möglichst ohne Kenntnis der Fallinformationen (verblindet)']]},
  {key:['DNA from saliva is the most reliable link between a bite and a person. Swab first, then examine.','DNA aus Speichel ist die zuverlässigste Verbindung zwischen Biss und Person. Erst Abstrich, dann Untersuchung.']},
  {tools:['log']},
  {src:'ABFO guidelines; Sweet et al. double-swab technique (1997).'}]},
 bitelim:{t:['Scientific limitations','Wissenschaftliche Grenzen'],b:[
  {p:['The NIST scientific foundation review (2023) found that the three key premises of bite mark analysis are not supported by the data:','Die wissenschaftliche Grundlagenprüfung des NIST (2023) kam zu dem Ergebnis, dass die drei zentralen Annahmen der Bissspurenanalyse durch Daten nicht gestützt werden:']},
  {ol:[['Human anterior dentition is unique at the individual level.','Die menschliche Frontzahnreihe ist individuell einzigartig.'],['This uniqueness is accurately transferred to human skin.','Diese Einzigartigkeit wird genau auf die Haut übertragen.'],['The characteristics can be accurately captured and interpreted by analysis techniques.','Die Merkmale können mit Analyseverfahren genau erfasst und interpretiert werden.']]},
  {ul:[['Skin is elastic and curved; bruising spreads and changes; posture at the time of biting is unknown.','Haut ist elastisch und gekrümmt; Hämatome breiten sich aus und verändern sich; die Körperhaltung beim Biss ist unbekannt.'],['Examiners often disagree even on whether an injury is a human bite (PCAST 2016).','Untersucher sind sich oft nicht einmal einig, ob eine Verletzung ein menschlicher Biss ist (PCAST 2016).'],['Several wrongful convictions have been linked to bite mark testimony.','Mehrere Fehlurteile wurden mit Bissspurengutachten in Verbindung gebracht.']]},
  {key:['Use bite marks for documentation, for recognising a possible bite and for DNA sampling. Do not identify a biter from the pattern alone.','Bissspuren zur Dokumentation, zum Erkennen eines möglichen Bisses und zur DNA-Gewinnung nutzen. Keinen Verursacher allein anhand des Musters identifizieren.']},
  {src:'NIST IR 8352, Bitemark Analysis: A NIST Scientific Foundation Review (2023); PCAST report (2016).'}]},
 biterep:{t:['Expert reporting','Gutachten'],b:[
  {h:['Write','Schreiben']},
  {ul:[['What was examined, when, by whom and with which method.','Was, wann, durch wen und mit welcher Methode untersucht wurde.'],['Whether the injury is consistent with a human bite, an animal bite, or is not a bite / undetermined.','Ob die Verletzung mit einem menschlichen Biss, einem Tierbiss vereinbar ist oder kein Biss / unklar ist.'],['Limitations: skin distortion, image quality, time since injury, scientific foundation.','Grenzen: Hautverzerrung, Bildqualität, Zeit seit der Verletzung, wissenschaftliche Grundlage.'],['Refer to DNA results for any association with a person.','Für jede Zuordnung zu einer Person auf DNA-Ergebnisse verweisen.']]},
  {h:['Avoid','Vermeiden']},
  {ul:[['“Match”, “identified the biter”, “reasonable dental certainty” or any probability not based on data.','„Übereinstimmung“, „Verursacher identifiziert“, „mit an Sicherheit grenzender Wahrscheinlichkeit“ oder Wahrscheinlichkeiten ohne Datenbasis.'],['Comparing against a single suspect without a lineup of other dentitions.','Vergleich mit nur einem Verdächtigen ohne weitere Vergleichsgebisse.'],['Reading case information that is not needed for the dental question.','Fallinformationen lesen, die für die zahnärztliche Frage nicht nötig sind.']]},
  {key:['Strongest acceptable statement on a person: “cannot be excluded” or “excluded” – and only with clear reasoning and stated limitations.','Stärkste vertretbare Aussage zu einer Person: „kann nicht ausgeschlossen werden“ oder „ausgeschlossen“ – nur mit klarer Begründung und genannten Grenzen.']},
  {tools:['rep']},
  {src:'ABFO Standards and Guidelines (revised terminology); NIST IR 8352 (2023).'}]},
 exam:{t:['Examination of teeth, jaws and oral tissues','Untersuchung von Zähnen, Kiefern und oralen Geweben'],check:'exam',b:[
  {items:[['ext','Extra-oral: face, lips, perioral injuries photographed','Extraoral: Gesicht, Lippen, periorale Verletzungen fotografiert'],['acc','Access to the mouth (rigor, decomposition); jaw resection only with legal authority','Zugang zur Mundhöhle (Totenstarre, Fäulnis); Kieferresektion nur mit rechtlicher Grundlage'],['soft','Soft tissues: mucosa, frenula, tongue, palate, piercings, tattoos','Weichgewebe: Schleimhaut, Bändchen, Zunge, Gaumen, Piercings, Tätowierungen'],['bone','Jaws: fractures, edentulous areas, healing of sockets, pathology','Kiefer: Frakturen, zahnlose Abschnitte, Alveolenheilung, Pathologie'],['chart','Each tooth charted (FDI), including surfaces, materials and anomalies','Jeder Zahn erfasst (FDI), mit Flächen, Materialien und Anomalien'],['occ','Occlusion, wear, staining, rotations, diastemas','Okklusion, Abrasion, Verfärbungen, Rotationen, Lücken'],['pros','Prostheses removed, photographed and checked for names or numbers','Zahnersatz entnommen, fotografiert und auf Namen oder Nummern geprüft'],['rx','Radiographs and photographs taken; second examiner checked the chart','Röntgenbilder und Fotos angefertigt; zweiter Untersucher hat das Schema kontrolliert']]},
  {tools:['chart','anat']},
  {src:'INTERPOL DVI Guide; ABFO Reference Manual.'}]},
 trauma:{t:['Dental trauma and possible causes of injury','Zahntrauma und mögliche Verletzungsursachen'],b:[
  {ul:[['Describe the injury precisely: crown or root fracture, luxation, avulsion, alveolar fracture, soft-tissue injury.','Verletzung genau beschreiben: Kronen- oder Wurzelfraktur, Luxation, Avulsion, Alveolarfortsatzfraktur, Weichgewebsverletzung.'],['Vital reaction (bleeding, swelling, inflammation) suggests injury during life.','Vitale Reaktion (Blutung, Schwellung, Entzündung) spricht für eine Verletzung zu Lebzeiten.'],['Perimortem fractures in fresh bone have sharp, same-coloured edges; post-mortem breaks in dry bone are paler and more irregular.','Perimortale Frakturen im frischen Knochen haben scharfe, gleichfarbige Ränder; postmortale Brüche im trockenen Knochen sind heller und unregelmäßiger.'],['Blunt force to the face often causes upper incisor fractures together with lip lacerations.','Stumpfe Gewalt gegen das Gesicht verursacht oft Frakturen oberer Schneidezähne mit Lippenrissen.'],['Consider falls, assault, accidents, seizures and medical procedures (e.g. intubation) as causes.','Stürze, Gewalt, Unfälle, Krampfanfälle und medizinische Eingriffe (z. B. Intubation) als Ursachen bedenken.']]},
  {key:['Report what is seen; state whether findings are consistent with a proposed mechanism, and name other possible causes.','Berichten, was gesehen wird; angeben, ob Befunde mit einem angegebenen Mechanismus vereinbar sind, und andere mögliche Ursachen nennen.']},
  {tools:['chart']},
  {src:'Andreasen classification of dental trauma; forensic pathology textbooks.'}]},
 dna:{t:['DNA recovery from teeth and oral samples','DNA-Gewinnung aus Zähnen und oralen Proben'],b:[
  {ul:[['Teeth protect DNA in the pulp and dentine, even after fire, burial or long post-mortem intervals.','Zähne schützen DNA in Pulpa und Dentin, auch nach Brand, Erdlagerung oder langer Liegezeit.'],['Prefer intact, unrestored molars or premolars; avoid teeth with large fillings or root fillings.','Intakte, unversorgte Molaren oder Prämolaren bevorzugen; Zähne mit großen Füllungen oder Wurzelfüllungen meiden.'],['Chart, photograph and radiograph the tooth before sampling – extraction is destructive.','Zahn vor der Probenahme erfassen, fotografieren und röntgen – die Entnahme ist zerstörend.'],['Wear gloves and mask, use clean instruments, avoid touching the root, pack dry in paper or a sterile tube.','Handschuhe und Maske tragen, saubere Instrumente nutzen, Wurzel nicht berühren, trocken in Papier oder sterilem Röhrchen verpacken.'],['Saliva swabs from skin, bite marks or objects: double-swab technique, air-dry, paper packaging.','Speichelabstriche von Haut, Bissspuren oder Gegenständen: Doppeltupfer-Technik, lufttrocknen, Papierverpackung.'],['Label with case number, tooth number, date and person; start the chain of custody.','Mit Fallnummer, Zahnnummer, Datum und Person beschriften; Asservatenkette beginnen.']]},
  {tools:['log']},
  {src:'INTERPOL DVI Guide; ISFG recommendations.'}]},
 injury:{t:['Dental and facial injuries','Zahn- und Gesichtsverletzungen'],b:[
  {ul:[['Document each injury with location, size, shape, colour and an ABFO No. 2 scale.','Jede Verletzung mit Lokalisation, Größe, Form, Farbe und ABFO-Nr.-2-Maßstab dokumentieren.'],['Lips and frenula: lacerations from the teeth behind them indicate blunt force to the mouth.','Lippen und Bändchen: Risse durch dahinterliegende Zähne sprechen für stumpfe Gewalt gegen den Mund.'],['Jaw fractures: mandible (condyle, angle, symphysis) and midface (Le Fort I–III, zygoma).','Kieferfrakturen: Unterkiefer (Kondylus, Kieferwinkel, Symphyse) und Mittelgesicht (Le Fort I–III, Jochbein).'],['Hat-brim rule: injuries above the hat-brim line suggest blows rather than a simple fall.','Hutkrempenregel: Verletzungen oberhalb der Hutkrempenlinie sprechen eher für Schläge als für einen einfachen Sturz.'],['Note old and new injuries separately; ask for previous dental records.','Alte und frische Verletzungen getrennt notieren; frühere zahnärztliche Unterlagen anfordern.']]},
  {tools:['chart','log']},
  {src:'Forensic pathology and maxillofacial trauma literature.'}]},
 abuse:{t:['Child abuse and neglect: recognition and reporting','Kindesmisshandlung und Vernachlässigung: Erkennen und Melden'],b:[
  {h:['Warning signs','Warnzeichen']},
  {ul:[['Torn upper labial frenulum in an infant who is not yet walking.','Eingerissenes Oberlippenbändchen bei einem Säugling, der noch nicht läuft.'],['Bruises on torso, ears or neck, frenulum, angle of jaw, cheeks, eyelids or subconjunctivae in children under 4, any bruise in infants under 4.99 months, or patterned bruises (TEN-4-FACESp).','Hämatome an Rumpf, Ohren oder Hals, Bändchen, Kieferwinkel, Wangen, Augenlidern oder Bindehaut bei Kindern unter 4 Jahren, jedes Hämatom bei Säuglingen unter 4,99 Monaten oder geformte Hämatome (TEN-4-FACESp).'],['Injuries of different ages, explanations that do not fit the injury or the child’s development, delay in seeking care.','Verletzungen unterschiedlichen Alters, Erklärungen, die nicht zur Verletzung oder Entwicklung passen, verzögerte Vorstellung.'],['Dental neglect: untreated caries, pain or infection despite knowledge and access to care.','Zahnärztliche Vernachlässigung: unbehandelte Karies, Schmerzen oder Infektion trotz Kenntnis und Zugang zur Versorgung.']]},
  {h:['Reporting in Germany','Meldung in Deutschland']},
  {ol:[['Document findings carefully with photos and the explanation given (in the carer’s own words).','Befunde sorgfältig mit Fotos und der gegebenen Erklärung (im Wortlaut der Bezugsperson) dokumentieren.'],['§ 4 KKG: dentists may discuss the situation with the parents and get advice from an experienced child-protection professional (insoweit erfahrene Fachkraft) using pseudonymised data.','§ 4 KKG: Zahnärztinnen und Zahnärzte können die Situation mit den Eltern besprechen und sich pseudonymisiert von einer insoweit erfahrenen Fachkraft beraten lassen.'],['If the risk to the child persists, they may inform the youth welfare office (Jugendamt); in acute danger, contact the police.','Besteht die Gefährdung fort, dürfen sie das Jugendamt informieren; bei akuter Gefahr die Polizei.'],['Medical child-protection hotline for professionals: 0800 19 210 00 (free, 24/7).','Medizinische Kinderschutzhotline für Fachkräfte: 0800 19 210 00 (kostenlos, rund um die Uhr).']]},
  {key:['You do not need to prove abuse. Recognise, document and pass on concerns through the proper channels.','Sie müssen keine Misshandlung beweisen. Erkennen, dokumentieren und Bedenken über die vorgesehenen Wege weitergeben.']},
  {src:'Gesetz zur Kooperation und Information im Kinderschutz (KKG) § 4; Pierce et al. TEN-4-FACESp (2021); AAPD/BSPD definitions of dental neglect.'}]},
 remains:{t:['Human remains and decomposition','Menschliche Überreste und Leichenveränderungen'],b:[
  {ul:[['Decomposition stages: fresh, bloat, active decay, advanced decay, skeletonisation; speed depends on temperature, humidity, insects and burial.','Zersetzungsstadien: frisch, Aufgasung, aktive Zersetzung, fortgeschrittene Zersetzung, Skelettierung; Tempo abhängig von Temperatur, Feuchtigkeit, Insekten und Lagerung.'],['Single-rooted teeth are often lost post-mortem; look for empty sockets with sharp edges (no healing).','Einwurzelige Zähne gehen postmortal oft verloren; auf leere Alveolen mit scharfen Rändern achten (keine Heilung).'],['“Pink teeth” are a post-mortem phenomenon (haemoglobin in dentine) and do not show a cause of death.','„Rosa Zähne“ sind ein postmortales Phänomen (Hämoglobin im Dentin) und zeigen keine Todesursache.'],['Burned remains: teeth become brittle and change colour; photograph in situ, stabilise before moving, keep fragments together.','Verbrannte Überreste: Zähne werden brüchig und verfärben sich; in situ fotografieren, vor dem Bewegen stabilisieren, Fragmente zusammenhalten.'],['Check whether teeth are human, and separate commingled remains by matching occlusion, wear and development.','Prüfen, ob Zähne menschlich sind; vermischte Überreste anhand von Okklusion, Abrasion und Entwicklung zuordnen.']]},
  {tools:['chart','log']},
  {src:'Forensic taphonomy and forensic odontology textbooks; INTERPOL DVI Guide.'}]},
 obsint:{t:['Distinguishing observations from interpretations','Befund und Interpretation unterscheiden'],b:[
  {p:['A forensic report must let the reader see what was found and, separately, what the expert concludes from it.','Ein forensisches Gutachten muss erkennen lassen, was gefunden wurde, und getrennt davon, was der Sachverständige daraus schließt.']},
  {table:{head:[['Observation','Befund'],['Interpretation','Interpretation']],rows:[[['Tooth 21 absent, socket open with sharp margins, no bone healing.','Zahn 21 fehlt, Alveole offen mit scharfen Rändern, keine Knochenheilung.'],['Consistent with post-mortem tooth loss.','Vereinbar mit postmortalem Zahnverlust.']],[['Third molar 38 at Demirjian stage H.','Weisheitszahn 38 im Demirjian-Stadium H.'],['Minimum age 18.2 years (reference study X).','Mindestalter 18,2 Jahre (Referenzstudie X).']],[['Curved pattern of bruises, 35 mm wide, on the forearm.','Bogenförmiges Hämatommuster, 35 mm breit, am Unterarm.'],['Consistent with a human bite; not suitable to identify a person.','Vereinbar mit einem menschlichen Biss; nicht geeignet, eine Person zu identifizieren.']]]}},
  {ul:[['Use neutral, measurable words for findings (size, colour, location).','Für Befunde neutrale, messbare Begriffe verwenden (Größe, Farbe, Lage).'],['Use graded terms for interpretations: “consistent with”, “typical of”, “excludes”.','Für Interpretationen abgestufte Begriffe verwenden: „vereinbar mit“, „typisch für“, „schließt aus“.'],['Name alternative explanations and the limits of the method.','Alternative Erklärungen und die Grenzen der Methode nennen.'],['Stay within your field; leave cause of death and legal judgement to others.','Im eigenen Fachgebiet bleiben; Todesursache und rechtliche Würdigung anderen überlassen.']]},
  {tools:['rep']},
  {src:'ENFSI guideline for evaluative reporting; forensic report-writing standards.'}]}
};
const TOOLNAME={chart:['Dental chart','Zahnschema'],cmp:['AM/PM comparison','AM/PM-Vergleich'],age:['Age estimation','Altersschätzung'],log:['Case log','Fallprotokoll'],rep:['Report','Gutachten'],anat:['Tooth anatomy','Zahnanatomie']};
let openSec=null;try{openSec=localStorage.getItem('forensident.sec')}catch(e){}
let guideId=null;
function renderGuide(){
  navbar.hidden=true;
  const G=GUIDES[guideId],c=cur(),T=a=>L(a[0],a[1]);
  if(!G){go(null);return}
  const ck=G.check?((c.guide=c.guide||{})[G.check]=c.guide[G.check]||{}):null;
  let h=`<div class="modhead"><button class="btn small" data-home>‹ ${L('Home','Start')}</button><h1>${esc(T(G.t))}</h1>${G.check?`<span class="casechip">${esc(c.meta.caseNo||L('Untitled case','Unbenannter Fall'))}</span>`:''}</div><section class="panel guide">`;
  for(const b of G.b){
    if(b.p)h+=`<p>${esc(T(b.p))}</p>`;
    if(b.h)h+=`<h2>${esc(T(b.h))}</h2>`;
    if(b.ul)h+=`<ul>${b.ul.map(x=>`<li>${esc(T(x))}</li>`).join('')}</ul>`;
    if(b.ol)h+=`<ol>${b.ol.map(x=>`<li>${esc(T(x))}</li>`).join('')}</ol>`;
    if(b.key)h+=`<div class="verdict v-match"><span class="label">${L('Key point','Kernaussage')}</span><span>${esc(T(b.key))}</span></div>`;
    if(b.table)h+=`<div class="tbl-wrap"><table><thead><tr>${b.table.head.map(x=>`<th>${esc(T(x))}</th>`).join('')}</tr></thead><tbody>${b.table.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(Array.isArray(x)?T(x):x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if(b.items){const done=b.items.filter(([k])=>ck[k]).length;h+=`<div class="row spread"><span class="label">${L('Checklist for this case','Checkliste für diesen Fall')}</span><span class="fine">${done}/${b.items.length}</span></div><div class="progress"><i style="width:${done/b.items.length*100}%"></i></div><div class="checks">${b.items.map(([k,en,de])=>`<label class="check"><input type="checkbox" data-bind="guide.${G.check}.${k}" data-rerender ${ck[k]?'checked':''}><span>${esc(L(en,de))}</span></label>`).join('')}</div>`}
    if(b.fields)h+=`<div class="grid2">${b.fields.map(([k,en,de])=>fld(L(en,de),`guide.${G.check}.f_${k}`,k==='note'?{area:true,rows:3}:{})).join('')}</div>`;
    if(b.tools)h+=`<div class="row guide-tools">${b.tools.map(t=>`<button class="btn" data-open="${t}">${ICONS[t]||''}<span>${esc(T(TOOLNAME[t]))}</span></button>`).join('')}</div>`;
    if(b.src)h+=`<p class="fine">${L('Sources','Quellen')}: ${esc(b.src)}</p>`;
  }
  h+=`</section>`;
  app.innerHTML=h;
}
function sectionsHTML(c){
  return SECTIONS.map((s,i)=>`<details class="sec" data-sec="${s.id}" ${openSec===s.id?'open':''}><summary><span class="sec-n">${i+1}</span><span class="ico">${ICONS[s.icon]||ICONS.chart}</span><span class="sec-t"><b>${esc(L(...s.t))}</b><span class="fine">${esc(L(...s.d))}</span></span><span class="chev" aria-hidden="true"></span></summary>
   <div class="sec-items">${s.items.map(it=>{const target=it.tool||'guide';const locked=!hasPro()&&(it.tool?PRO_MODS.includes(it.tool):true);
     const kind={tool:L('Tool','Werkzeug'),guide:L('Guide','Leitfaden'),check:L('Checklist','Checkliste')}[it.k];
     const st=it.tool&&MODS[it.tool]?tileStatus(it.tool,c):'';
     return `<button class="sec-item" ${it.tool?`data-open="${it.tool}"`:`data-guide="${it.g}"`}><span class="si-t">${esc(L(...it.t))}${st?`<span class="fine">${esc(st)}</span>`:''}</span><span class="si-k ${it.k}">${locked?'🔒 ':''}${esc(kind)}</span></button>`}).join('')}</div></details>`).join('');
}

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.open){go(b.dataset.open);return}
  if(b.dataset.ex){EX2[b.dataset.ex]=b.dataset.v==='2';rerenderKeep();return}
  if(b.dataset.exres){const [ch,n,w]=b.dataset.exres.split(',');const c=cur();const src=w==='1'?c[ch][n]:c[ch+'2'][n];const cp=src?JSON.parse(JSON.stringify(src)):undefined;if(w==='1')c[ch+'2'][n]=cp;else c[ch][n]=cp;save();rerenderKeep();return}
  if(b.dataset.dviopen){const [id,ch]=b.dataset.dviopen.split(',');store.cur=id;save();go('chart',ch==='pm'?2:1);return}
  if(b.dataset.dvisel){dviSel=b.dataset.dvisel;rerenderKeep();return}
  if(b.dataset.stepGo){const [m,st]=b.dataset.stepGo.split(',');go(m,+st);return}
  if(b.hasAttribute('data-home')){go(null);return}
  if(b.dataset.step!==undefined){go(route.mod,+b.dataset.step);return}
  if(b.dataset.set){setPath(cur(),b.dataset.set,b.dataset.val);save();rerenderKeep();return}
  if(b.dataset.gset){setPath(store,b.dataset.gset,b.dataset.val);save();rerenderKeep();return}
  if(b.dataset.reftab){refTab=b.dataset.reftab;rerenderKeep();return}

const sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim');let ed=null;
function openSheet(chart,n){ed={chart,n};drawSheet();sheet.hidden=false;scrim.hidden=false;sheet.scrollTop=0;document.body.classList.add('sheet-open')}
function closeSheet(){sheet.hidden=true;scrim.hidden=true;ed=null;document.body.classList.remove('sheet-open');rerenderKeep()}
scrim.onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ed)closeSheet()});
/* keyboard: move between cells of the reference table like a spreadsheet; arrows switch teeth in the tooth window */
document.addEventListener('keydown',e=>{
  const el=e.target;
  if(el&&el.tagName==='INPUT'&&el.closest('.refgrid')){
    const td=el.closest('td'),tr=td.parentElement,col=[...tr.children].indexOf(td),rows=[...tr.parentElement.children],ri=rows.indexOf(tr);
    const cell=(r,c)=>{const row=rows[r];const x=row&&row.children[c];return x&&x.querySelector('input')};
    let t=null;const v=el.value||'',a=el.selectionStart,b=el.selectionEnd;
    if(e.key==='ArrowUp')t=cell(ri-1,col);
    else if(e.key==='ArrowDown'||e.key==='Enter')t=cell(ri+1,col);
    else if(e.key==='ArrowLeft'&&a===0&&b===0)t=cell(ri,col-1)||cell(ri-1,tr.children.length-1);
    else if(e.key==='ArrowRight'&&a===v.length&&b===v.length)t=cell(ri,col+1)||cell(ri+1,1);
    if(t){e.preventDefault();t.focus();try{t.select()}catch(_){}}
    return;
  }
  if(ed&&!e.metaKey&&!e.ctrlKey&&!(el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))){
    const idx=ORDER.indexOf(ed.n);
    if(e.key==='ArrowRight'&&idx<31){e.preventDefault();ed.n=ORDER[idx+1];drawSheet();sheet.scrollTop=0}
    else if(e.key==='ArrowLeft'&&idx>0){e.preventDefault();ed.n=ORDER[idx-1];drawSheet();sheet.scrollTop=0}
  }
});
document.addEventListener('input',e=>{const el=e.target;if(el&&el.tagName==='INPUT'&&el.closest('.refgrid')){const c=el.value.replace(/[^0-9.,]/g,'');if(c!==el.value)el.value=c}},true);
function surfInfo(n){
  const ant=n%10<=3,up=Math.floor(n/10)<=2;
  return {M:['M','mesial','mesial'],O:ant?['I','incisal','inzisal']:['O','occlusal','okklusal'],D:['D','distal','distal'],B:ant?['V','labial','labial']:['B','buccal','bukkal'],L:up?['P','palatal','palatinal']:['L','lingual','lingual']};
}
function bigTooth(t,n){
  const q=Math.floor(n/10),lower=q>=3,mesRight=(q===1||q===4);
  const R={top:'10,10 190,10 135,65 65,65',right:'190,10 190,190 135,135 135,65',bottom:'10,190 190,190 135,135 65,135',left:'10,10 10,190 65,135 65,65'};
  const C={top:[100,38],right:[163,100],bottom:[100,162],left:[37,100]};
  const pos={B:lower?'bottom':'top',L:lower?'top':'bottom',M:mesRight?'right':'left',D:mesRight?'left':'right'};
  const si=surfInfo(n),f=t.fill||{};
  const fc=s=>f[s]?MCOL[f[s]]:'var(--enamel)';
  const mat=s=>f[s]?L(...FMATS.find(x=>x[0]===f[s]).slice(1,3)):'';
  const lab=(s,x,y)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="24" font-weight="600" fill="var(--ink)" stroke="var(--surface)" stroke-width="4" paint-order="stroke">${si[s][0]}</text><text x="${x}" y="${y+16}" text-anchor="middle" font-size="11" fill="var(--ink)" stroke="var(--surface)" stroke-width="3" paint-order="stroke">${esc(mat(s)||L(si[s][1],si[s][2]))}</text>`;
  let g='',tx='';
  ['B','L','M','D'].forEach(s=>{const p=pos[s];g+=`<polygon class="surf" data-bs="${s}" tabindex="0" role="button" aria-label="${L(si[s][1],si[s][2])}${f[s]?': '+mat(s):''}" points="${R[p]}" fill="${fc(s)}" stroke="var(--tline)" stroke-width="2"/>`;tx+=lab(s,C[p][0],C[p][1])});
  g+=`<rect class="surf" data-bs="O" tabindex="0" role="button" aria-label="${L(si.O[1],si.O[2])}${f.O?': '+mat('O'):''}" x="65" y="65" width="70" height="70" fill="${fc('O')}" stroke="var(--tline)" stroke-width="2"/>`;tx+=lab('O',100,98);
  return `<svg viewBox="0 0 200 200" class="bigtooth" role="group" aria-label="${L('Tooth surfaces','Zahnflächen')}">${g}${tx}</svg>`;
}
function drawSheet(){
  const c=cur(),{chart,n}=ed,t=migrate(Object.assign(TT({s:'unk'}),c[chart][n]||{}));
  const idx=ORDER.indexOf(n),q=Math.floor(n/10),d=n%10,lg=lang();
  const states=STATES.filter(([k])=>chart.startsWith('pm')||k!=='lostpm');
  const sel=(id,v)=>`<select id="${id}">${CMATS.map(x=>`<option value="${x}" ${v===x?'selected':''}>${x?esc(dm(x,lg)):L('unknown','unbekannt')}</option>`).join('')}</select>`;
  const tg=(id,en,de,on)=>`<label class="toggle"><input type="checkbox" id="${id}" ${on?'checked':''}><span>${L(en,de)}</span></label>`;
  const second=L('German','English');
  sheet.innerHTML=`<div class="sheet-head"><span class="tag ${chart.startsWith('am')?'chip-am':'chip-pm'}">${chart.toUpperCase()}</span><h2 id="sheetTitle">${L('Tooth','Zahn')} <span>${pn(t,n)}</span><small>${esc(L(TN.en[d],TN.de[d]))}, ${esc(L(QN.en[q],QN.de[q]))} · ${idx+1}/32</small></h2><button class="btn small primary" id="doneT">${L('Done','Fertig')}</button></div>
  <div class="seg" role="group" aria-label="${L('Tooth status','Zahnstatus')}">${states.map(([k,en,de])=>`<button data-s="${k}" aria-pressed="${t.s===k}">${k!=='present'&&k!=='unk'?`<b>${esc(CD(k))}</b> `:''}${L(en,de)}</button>`).join('')}</div>
  ${(t.s==='present'||t.s==='unk')?`
   <div class="paint"><div><span class="label">${L('1 · Choose filling material or caries','1 · Füllungsmaterial oder Karies wählen')}</span>
   <div class="mats">${FMATS.map(([k,en,de])=>`<button data-mat="${k}" aria-pressed="${curMat===k}"><i style="background:${MCOL[k]}"></i>${L(en,de)}</button>`).join('')}<button data-mat="erase" aria-pressed="${curMat==='erase'}"><i style="background:var(--enamel)"></i>${L('Clear','Löschen')}</button></div>
   </div><div><span class="label">${L('2 · Tap the surfaces','2 · Flächen antippen')}</span>
   <div class="bt-wrap" dir="ltr">${bigTooth(t,n)}<span class="fine">${L('Mesial faces the midline. View as on the chart.','Mesial zeigt zur Mitte. Ansicht wie im Zahnschema.')}</span></div></div></div>
   <span class="label">${L('Other findings','Weitere Befunde')}</span>
   <div class="opt-grid">${tg('crownT','Crown','Krone',t.crown)}${t.crown?`<label class="field"><span class="label">${L('Crown type','Kronenart')}</span><select id="ctypeT">${CTYPES.map(([k,en,de])=>`<option value="${k}" ${(t.ctype||'')===k?'selected':''}>${L(en,de)}</option>`).join('')}</select></label><label class="field"><span class="label">${L('Crown material','Kronenmaterial')}</span>${sel('cmatT',t.cmat)}</label>`+tg('abutT','Bridge abutment','Brückenpfeiler',t.abut):''}${tg('venT','Veneer','Veneer',t.veneer)}${tg('rctT','Root filling','Wurzelfüllung',t.rct)}${tg('postT','Post','Stiftaufbau',t.post)}${tg('fracT','Fracture','Fraktur',t.fracture)}</div>`:''}
  ${(t.s==='present'||t.s==='pre'||t.s==='unk')?`<span class="label">${L('Individual features','Individuelle Merkmale')}</span>
   <div class="opt-grid">${FEATS.filter(([k])=>k!=='prim'||n%10<=5).map(([k,en,de])=>`<label class="toggle"><input type="checkbox" data-feat="${k}" ${t.feat&&t.feat[k]?'checked':''}><span>${k==='prim'?L(en,de)+' ('+(n+40)+')':L(en,de)}</span></label>`).join('')}</div>`:''}
  ${t.s==='implant'?`<div class="opt-grid"><label class="field"><span class="label">${L('Implant crown material','Material der Implantatkrone')}</span>${sel('cmatT',t.cmat)}</label>${tg('abutT','Bridge abutment','Brückenpfeiler',t.abut)}</div>`:''}
  ${t.s==='root'?`<div class="opt-grid">${tg('rctT','Root filling','Wurzelfüllung',t.rct)}</div>`:''}
  <div class="verdict v-nodata" style="padding:10px 12px"><span class="label">${L('Finding','Befund')}</span><span>${esc(describe(t,lg))}</span>${lg==='en'?'':''}</div>
  <label class="field"><span class="label">${L('Note (shape, rotation, position, wear…)','Bemerkung (Form, Drehung, Stellung, Abrasion …)')}</span><textarea id="noteT" rows="2">${esc(t.note||'')}</textarea></label>
  <div class="sheet-foot"><button class="btn" id="prevT" ${idx===0?'disabled':''} aria-label="${L('Previous tooth','Vorheriger Zahn')}">‹</button><button class="btn" id="soundNext">${L('Sound','o. B.')}${idx<31?L(', next',', weiter'):''}</button><button class="btn primary" id="nextT">${idx<31?`${L('Next','Weiter')}: ${ORDER[idx+1]} ›`:L('Finish','Abschließen')}</button></div>`;
  const upd=(fn,mk)=>{const x=migrate(Object.assign(TT({s:'unk'}),c[chart][n]||{}));x.fill=Object.assign({},x.fill);if(mk&&x.s==='unk')x.s='present';fn(x);c[chart][n]=x;save()};
  const on=(id,ev,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener(ev,fn)};
  sheet.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{upd(x=>x.s=b.dataset.s);drawSheet()});
  sheet.querySelectorAll('[data-mat]').forEach(b=>b.onclick=()=>{curMat=b.dataset.mat;drawSheet()});
  sheet.querySelectorAll('[data-bs]').forEach(p=>{
    const act=()=>{const s=p.dataset.bs;upd(x=>{if(curMat==='erase'||x.fill[s]===curMat)delete x.fill[s];else x.fill[s]=curMat},1);drawSheet();const f=sheet.querySelector(`[data-bs="${s}"]`);if(f&&document.activeElement===document.body)f.focus({preventScroll:true})};
    p.addEventListener('click',act);p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}});
  });
  on('cmatT','change',e=>{upd(x=>x.cmat=e.target.value);drawSheet()});
  on('ctypeT','change',e=>{upd(x=>x.ctype=e.target.value,1);drawSheet()});
  sheet.querySelectorAll('[data-feat]').forEach(i=>i.addEventListener('change',()=>{upd(x=>{x.feat=Object.assign({},x.feat);if(i.checked)x.feat[i.dataset.feat]=true;else delete x.feat[i.dataset.feat]},1);drawSheet()}));
  on('crownT','change',e=>{upd(x=>{x.crown=e.target.checked;if(!x.crown){x.cmat='';x.ctype='';x.abut=false}},1);drawSheet()});
  on('abutT','change',e=>{upd(x=>x.abut=e.target.checked,1);drawSheet()});
  on('venT','change',e=>{upd(x=>x.veneer=e.target.checked,1);drawSheet()});
  on('rctT','change',e=>{upd(x=>x.rct=e.target.checked,1);drawSheet()});
  on('postT','change',e=>{upd(x=>x.post=e.target.checked,1);drawSheet()});
  on('fracT','change',e=>{upd(x=>x.fracture=e.target.checked,1);drawSheet()});

  on('doneT','click',closeSheet);

  on('prevT','click',()=>goTo(idx-1));

  on('nextT','click',next);
  on('soundNext','click',()=>{upd(x=>{const note=x.note;Object.assign(x,TT({note}))});next()});
}
